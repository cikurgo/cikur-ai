<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cikur Go - Panel Driver Profesional</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="../bcgo-engine.js"></script>
    <script type="module" src="../cikur-config.js"></script>
    <style>
        :root {
            --primary: #ff4757;
            --primary-gradient: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            --surface: #ffffff;
            --background: #f4f7f6;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-sm: 12px;
            --radius-md: 20px;
            --shadow-soft: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Figtree', system-ui, sans-serif; }
        body { background: var(--background); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }

        .app-container {
            width: 100%; max-width: 440px; min-height: 100vh; background: var(--surface);
            display: flex; flex-direction: column; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
        }

        .header {
            padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;
            background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
        }
        .app-title { font-size: 15px; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .content-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; flex: 1; padding-bottom: 40px; }

        .card-box { background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-soft); display: flex; flex-direction: column; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 11px; font-weight: 700; color: var(--text-muted); }
        .form-input, .form-select {
            padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 12px; outline: none; background: #fafafa; transition: var(--transition);
        }
        .form-input:focus, .form-select:focus { border-color: var(--primary); background: #fff; }

        .note-text { font-size: 10px; color: #64748b; font-weight: 600; margin-top: -2px; }

        .btn-primary {
            background: var(--primary-gradient); color: #fff; border: none; padding: 12px;
            border-radius: var(--radius-sm); font-weight: 800; font-size: 12px; cursor: pointer; transition: var(--transition); text-align: center;
        }

        .driver-status-card {
            background: #1e293b; color: #fff; border-radius: var(--radius-md); padding: 18px;
            display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-soft);
        }
        .status-toggle-btn {
            background: #10b981; color: #fff; border: none; padding: 10px; border-radius: var(--radius-sm);
            font-weight: 800; font-size: 11px; cursor: pointer; transition: var(--transition);
        }
        .status-toggle-btn.offline { background: #dc2626; }

        .driver-tabs { display: flex; background: var(--background); padding: 4px; border-radius: var(--radius-md); gap: 4px; border: 1px solid var(--border); }
        .driver-tab { flex: 1; padding: 10px; border: none; background: transparent; font-size: 11px; font-weight: 700; color: var(--text-muted); border-radius: 10px; cursor: pointer; text-align: center; }
        .driver-tab.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-soft); }

        .order-card {
            background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius-md);
            padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-soft);
        }
        .badge-type { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 6px; width: fit-content; }
        .badge-food { background: #fee2e2; color: var(--primary); }
        .badge-ride { background: #e0f2fe; color: #0284c7; }

        #map { width: 100%; height: 180px; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-top: 6px; }

        .chat-container { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .chat-box { max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .chat-msg { font-size: 11px; padding: 6px 10px; border-radius: 8px; max-width: 85%; }
        .chat-msg.driver { background: #e0f2fe; color: #0369a1; align-self: flex-end; }
        .chat-msg.sys { background: #f1f5f9; color: #64748b; align-self: center; font-size: 10px; border-radius: 999px; }
        .chat-msg.other { background: #e2e8f0; color: var(--text-main); align-self: flex-start; }
        .chat-input-group { display: flex; gap: 6px; margin-top: 4px; }

        .ic { width: 15px; height: 15px; display: inline-block; vertical-align: -3px; flex: 0 0 auto; }
        .driver-tab .ic { width: 16px; height: 16px; margin-right: 2px; }
        .dot-g { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #16a34a; margin-right: 6px; box-shadow: 0 0 0 3px #dcfce7; vertical-align: 0; }

        /* ===== UI v4 driver ===== */
        .driver-tabs { background: #f1f5f9; border: 0; border-radius: 16px; padding: 4px; }
        .driver-tab { border-radius: 12px; font-size: 12px; font-weight: 700; padding: 11px 6px; }
        .driver-tab.active { box-shadow: 0 2px 8px rgba(15,23,42,.1); }
        .btn-primary { border-radius: 14px; font-weight: 800; }
        .form-input { border-radius: 12px; }
        .chat-msg { border-radius: 14px; }
        .leaflet-container { font-family: 'Figtree', system-ui, sans-serif; }

        .split-box { margin-top: 8px; border: 1px solid #dbeafe; background: #fff; border-radius: 14px; padding: 10px 12px; }
        .split-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; padding: 3px 0; color: #475569; font-weight: 600; }
        .split-row b { color: #0f172a; font-variant-numeric: tabular-nums; }
        .split-app b { color: #dc2626; }
        .split-me { border-top: 1px dashed #cbd5e1; margin-top: 4px; padding-top: 8px; font-size: 14px; }
        .split-me span { color: #166534; font-weight: 800; }
        .split-me b { color: #16a34a; font-size: 17px; }
        .split-note { font-size: 10px; color: #64748b; margin-top: 4px; font-weight: 600; }

        .saldo-card { display: flex; flex-direction: column; gap: 4px; background: #0f172a; color: #fff; border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
        .saldo-card small { font-size: 10px; color: #94a3b8; font-weight: 600; }
        .saldo-card b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }

        /* ===== Ikon 3D & peta ===== */
        .i3d{width:18px;height:18px;object-fit:contain;vertical-align:-4px;display:inline-block}
        .i3d-fb{display:inline-flex;vertical-align:middle}
        .leaflet-container{background:#f3f5f7}
        .leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.78)!important;border-radius:8px 0 0 0}
        
        .driver-tab .i3d { width: 20px; height: 20px; vertical-align: -5px; }
        .form-input .i3d { width: 20px; height: 20px; }
        #driverPhoto, .driver-photo { background: #334155; color: transparent; }
    </style>
</head>

<div class="app-container">
    <div class="header">
        <h1 class="app-title">CIKUR GO - DRIVER</h1>
        <span id="navStatusBadge" style="font-size: 10px; font-weight: 700; color: var(--text-muted);">Panel Driver</span>
    </div>

    <div class="content-body">
        
        <!-- 1. REGISTRASI & REKENING -->
        <div id="registrationSection" class="card-box" style="display: none;">
            <h3 style="font-size: 13px; font-weight: 800;"><img class="i3d" data-3d="memo" alt=""> Pendaftaran Driver</h3>
            
            <div class="form-group">
                <label class="form-label">Foto Profil Driver</label>
                <input type="file" id="regPhoto" class="form-input" accept="image/*">
            </div>
            <div class="form-group">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" id="regName" class="form-input" placeholder="Nama Lengkap KTP">
            </div>
            <div class="form-group">
                <label class="form-label">Nomor WhatsApp / HP</label>
                <input type="text" id="regPhone" class="form-input" placeholder="08xxxxxxxxxx">
            </div>
            <div class="form-group">
                <label class="form-label">Plat Nomor Kendaraan</label>
                <input type="text" id="regVehicle" class="form-input" placeholder="Contoh: A 1234 XX">
            </div>
            <div class="form-group">
                <label class="form-label">Jenis Kendaraan</label>
                <div class="form-input" style="display:flex;align-items:center;gap:8px;background:#f8fafc;font-weight:700;"><img class="i3d" data-3d="motor" alt=""> Sepeda motor (khusus CIKUR GO RIDE)</div>
                <input type="hidden" id="regVehicleType" value="Motor">
            </div>
            <div class="form-group">
                <label class="form-label">Merek &amp; Tipe Kendaraan</label>
                <input type="text" id="regVehicleModel" class="form-input" placeholder="Contoh: Honda Beat Hitam">
            </div>
            <div class="form-group">
                <label class="form-label">Alamat Domisili</label>
                <input type="text" id="regAddress" class="form-input" placeholder="Alamat tempat tinggal saat ini">
            </div>
            <div class="form-group">
                <label class="form-label">Nomor KTP</label>
                <input type="text" id="regKtp" class="form-input" placeholder="16 digit NIK" inputmode="numeric" maxlength="16">
            </div>
            <div class="form-group">
                <label class="form-label">Nomor SIM</label>
                <input type="text" id="regSim" class="form-input" placeholder="Nomor SIM sesuai kendaraan">
            </div>
            <div class="form-group">
                <label class="form-label">Foto KTP</label>
                <input type="file" id="regFotoKtp" class="form-input" accept="image/*">
            </div>
            <div class="form-group">
                <label class="form-label">Foto SIM</label>
                <input type="file" id="regFotoSim" class="form-input" accept="image/*">
            </div>
            <div class="form-group">
                <label class="form-label">Foto STNK</label>
                <input type="file" id="regFotoStnk" class="form-input" accept="image/*">
            </div>
            <div class="form-group">
                <label class="form-label">Pilih Bank / E-Wallet Pencairan</label>
                <select id="regBank" class="form-select">
                    <option value="BCA">Bank BCA</option>
                    <option value="BRI">Bank BRI</option>
                    <option value="BNI">Bank BNI</option>
                    <option value="Mandiri">Bank Mandiri</option>
                    <option value="DANA">DANA</option>
                    <option value="OVO">OVO</option>
                    <option value="GoPay">GoPay</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Atas Nama Pemilik Rekening</label>
                <input type="text" id="regAccountName" class="form-input" placeholder="Nama Pemilik Rekening">
                <span class="note-text">ℹ️ Bebas diisi sesuai akun e-wallet / rekening Anda.</span>
            </div>
            <div class="form-group">
                <label class="form-label">Nomor Rekening / Akun Tujuan</label>
                <input type="text" id="regAccountNo" class="form-input" placeholder="Nomor Rekening / No HP Akun">
            </div>
            
            <button type="button" class="btn-primary" onclick="saveDriverRegistration()">Simpan & Masuk Panel</button>
        </div>

        <!-- 2. DASHBOARD UTAMA -->
        <div id="dashboardSection" style="display: flex; flex-direction: column; gap: 16px;">

            <div id="mitraStatusBanner" style="background: #fef3c7; border: 1px solid #fde68a; border-radius: 12px; padding: 10px 12px; font-size: 11px; font-weight: 700; color: #92400e;">
                Memeriksa status pendaftaran Mitra...
            </div>
            
            <div class="driver-status-card">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <img id="profilePhotoDisplay" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2060%2060%22%3E%3Crect%20width%3D%2260%22%20height%3D%2260%22%20fill%3D%22%23334155%22/%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%2223%22%20r%3D%2210%22%20fill%3D%22%2394a3b8%22/%3E%3Cpath%20d%3D%22M10%2054c2-12%2010-18%2020-18s18%206%2020%2018z%22%20fill%3D%22%2394a3b8%22/%3E%3C/svg%3E" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #fff;" alt="">
                    <div style="flex: 1;">
                        <h3 id="profileNameDisplay" style="font-size: 13px; font-weight: 800;">-</h3>
                        <p id="profileMetaDisplay" style="font-size: 10px; opacity: 0.8; margin-top: 2px;">-</p>
                        <p id="profileBankNote" style="font-size: 9px; color: #38bdf8; margin-top: 2px;">Rekening: -</p>
                    </div>
                    <button type="button" onclick="toggleDriverStatus()" id="statusBtn" class="status-toggle-btn offline">OFFLINE</button>
                </div>
                <button type="button" onclick="openEditProfile()" style="background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 10px; padding: 6px; border-radius: 6px; cursor: pointer;"><img class="i3d" data-3d="gear" alt=""> Ubah Profil / Data Rekening</button>
            </div>

            <!-- TAB NAVIGASI -->
            <div class="driver-tabs">
                <div class="driver-tab active" id="tabFoodBtn" onclick="switchDriverTab('food')"><img class="i3d" data-3d="food" alt=""> Cikur Food (Resto)</div>
                <div class="driver-tab" id="tabRideBtn" onclick="switchDriverTab('ride')"><img class="i3d" data-3d="motor" alt=""> CIKUR GO RIDE</div>
            </div>

            <!-- PETA REAL-TIME GPS -->
            <div class="card-box">
                <div style="display: flex; justify-content: space-between; align-items: center;">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>
<script>
// ===== Ikon 3D: Microsoft Fluent Emoji (lisensi MIT), dimuat dari GitHub =====
// Supaya lebih stabil: unduh PNG-nya ke folder assets/3d/ (nama file = kunci + ".png", mis. motor.png)
// lalu isi ICON3D_LOCAL = "../assets/3d/". Kalau gambar gagal dimuat, otomatis diganti ikon garis.
const ICON3D_BASE = "https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/";
const ICON3D_LOCAL = "";
const ICON3D = { motor: "Motor scooter/3D/motor_scooter_3d.png", pin: "Round pushpin/3D/round_pushpin_3d.png", flag: "Chequered flag/3D/chequered_flag_3d.png", chat: "Speech balloon/3D/speech_balloon_3d.png", cart: "Shopping cart/3D/shopping_cart_3d.png", food: "Pot of food/3D/pot_of_food_3d.png", memo: "Memo/3D/memo_3d.png", gear: "Gear/3D/gear_3d.png", compass: "Compass/3D/compass_3d.png", worldmap: "World map/3D/world_map_3d.png", warning: "Warning/3D/warning_3d.png", coin: "Coin/3D/coin_3d.png", card: "Credit card/3D/credit_card_3d.png", star: "Star/3D/star_3d.png", receipt: "Receipt/3D/receipt_3d.png", party: "Party popper/3D/party_popper_3d.png" };
const ICON3D_FB = { motor: "bike", pin: "pin", flag: "flag", chat: "chat", cart: "cart", food: "food", memo: "doc", gear: "gear", compass: "nav", worldmap: "map", warning: "warn", coin: "cash", card: "wallet", star: "star", receipt: "receipt", party: "check" };
function icon3dSrc(k) { return ICON3D_LOCAL ? ICON3D_LOCAL + k + ".png" : ICON3D_BASE + encodeURI(ICON3D[k]); }
function ic3Fail(img) {
  const s = document.createElement("span");
  s.className = "i3d-fb";
  s.innerHTML = '<svg class="ic"><use href="#i-' + (img.dataset.fb || "pin") + '"/></svg>';
  img.replaceWith(s);
}
function ic3(k, cls) {
  return '<img class="i3d ' + (cls || "") + '" alt="" decoding="async" src="' + icon3dSrc(k) + '" data-fb="' + (ICON3D_FB[k] || "pin") + '" onerror="ic3Fail(this)">';
}
function hydrate3d(root) {
  (root || document).querySelectorAll("img[data-3d]").forEach((img) => {
    const k = img.dataset["3d"];
    if (!ICON3D[k]) return;
    img.dataset.fb = ICON3D_FB[k] || "pin";
    img.onerror = () => ic3Fail(img);
    img.src = icon3dSrc(k);
    img.removeAttribute("data-3d");
  });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", () => hydrate3d()); else hydrate3d();

// ===== Peta dasar gratis tanpa API key: OpenFreeMap (Positron) lewat MapLibre; cadangan: OpenStreetMap =====
function addBaseMap(map) {
  try { map.setMaxZoom(19); map.setMinZoom(3); } catch (_) {}
  let gl = null, ok = false, fell = false;
  const fallback = () => {
    if (fell || ok) return;
    fell = true;
    try { if (gl) map.removeLayer(gl); } catch (_) {}
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(map);
  };
  try {
    if (window.maplibregl && L.maplibreGL) {
      gl = L.maplibreGL({
        style: "https://tiles.openfreemap.org/styles/positron",
        attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
      }).addTo(map);
      const m = gl.getMaplibreMap && gl.getMaplibreMap();
      if (m) { m.on("load", () => { ok = true; }); m.on("error", () => { if (!ok) fallback(); }); }
      setTimeout(fallback, 9000);
      return;
    }
  } catch (e) { console.warn("[CIKUR] MapLibre gagal, pakai OSM:", e && e.message); }
  fallback();
}

let isOnline = false;
let currentTab = 'food';
let map, driverMarker;

function initMap(lat = -6.3245, lon = 106.1524) {
    if(!map) {
        map = L.map('map').setView([lat, lon], 15);
        addBaseMap(map);
        driverMarker = L.marker([lat, lon]).addTo(map).bindPopup("<b>Posisi Live Anda</b>").openPopup();
    } else {
        map.setView([lat, lon], 15);
        driverMarker.setLatLng([lat, lon]);
    }
}

let lastLocationPushMs = 0;
function trackGPS() {
    if (!navigator.geolocation) return;
    navigator.geolocation.watchPosition((pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        if (map && driverMarker) {
            driverMarker.setLatLng([lat, lon]);
            map.panTo([lat, lon]);
        }
        const now = Date.now();
        if (isOnline && userProfile && userProfile.uid && window.CikurCloud && (now - lastLocationPushMs > 8000)) {
            lastLocationPushMs = now;
            window.CikurCloud.updateDriverLiveLocation(userProfile.uid, lat, lon).catch(function () {});
        }
    }, function () {}, { enableHighAccuracy: true, maximumAge: 5000 });
}

let userProfile = { uid: null, name: "", phone: "", isLoggedIn: false };
let currentMitraApplication = null;

document.addEventListener("DOMContentLoaded", () => {
    loadCurrentDriverAuthGate();
    initMap();
    trackGPS();
});

async function loadCurrentDriverAuthGate() {
    let retries = 0;
    while (!window.CikurCloud && retries < 30) {
        await new Promise(resolve => setTimeout(resolve, 200));
        retries++;
    }

    if (!window.CikurCloud) {
        alert("CIKUR Cloud belum tersedia. Silakan refresh halaman.");
        window.location.href = "../index.html";
        return;
    }

    let firebaseUser = null;
    try {
        firebaseUser = await window.CikurCloud.waitForAuth();
    } catch (e) {
        firebaseUser = null;
    }

    if (!firebaseUser) {
        alert("Silakan login terlebih dahulu untuk mengakses Panel Driver.");
        window.location.href = "../index.html";
        return;
    }

    let profile = null;
    try {
        profile = await window.CikurCloud.getProfile(firebaseUser.uid);
    } catch (e) {
        profile = null;
    }

    userProfile = {
        uid: firebaseUser.uid,
        name: profile?.name || "",
        phone: profile?.phone || "",
        isLoggedIn: true
    };

    if (document.getElementById("regPhone") && !document.getElementById("regPhone").value) {
        document.getElementById("regPhone").value = userProfile.phone || "";
    }
    if (document.getElementById("regName") && !document.getElementById("regName").value) {
        document.getElementById("regName").value = userProfile.name || "";
    }

    window.CikurCloud.listenMitraApplication(firebaseUser.uid, "driver", (application) => {
        currentMitraApplication = application;
        renderByMitraStatus(application);
    });
}

function renderByMitraStatus(application) {
    const registrationSection = document.getElementById("registrationSection");
    const dashboardSection = document.getElementById("dashboardSection");
    const banner = document.getElementById("mitraStatusBanner");
    const navBadge = document.getElementById("navStatusBadge");

    if (application && application._error) {
        // permission-denied saat dokumen belum ada = anggap belum terdaftar
        const msg = String(application.message || application.code || "");
        const isPerm = /permission|insufficient|Missing or insufficient/i.test(msg);
        if (isPerm) {
            application = null;
        } else {
            registrationSection.style.display = "flex";
            dashboardSection.style.display = "none";
            banner.style.display = "block";
            banner.style.background = "#fef2f2";
            banner.style.color = "#991b1b";
            banner.innerHTML = "<svg class='ic'><use href='#i-warn'/></svg> Gagal memuat status: " + (application.message || "error") + ". Coba refresh. Pastikan Firestore rules mengizinkan baca path mitra milik sendiri.";
            return;
        }
    }

    if (!application) {
        registrationSection.style.display = "flex";
        dashboardSection.style.display = "none";
        navBadge.innerText = "Belum Terdaftar";
        return;
    }

    if (application.status === "pending") {
        registrationSection.style.display = "none";
        dashboardSection.style.display = "flex";
        banner.style.background = "#fef3c7";
        banner.style.color = "#92400e";
        banner.innerHTML = "⏳ Pendaftaran Anda sedang <strong>menunggu verifikasi</strong> tim CIKUR GO.";
        navBadge.innerText = "Menunggu Verifikasi";
        document.getElementById("driverOrderContainer").innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-muted); font-size: 11px;">Menunggu verifikasi Admin sebelum dapat menerima pesanan.</div>`;
        fillDriverProfileDisplay(application);
        return;
    }

    if (application.status === "rejected") {
        registrationSection.style.display = "flex";
        dashboardSection.style.display = "none";
        navBadge.innerText = "Ditolak";
        alert("Pendaftaran ditolak: " + (application.catatanAdmin || "Silakan lengkapi ulang data Anda."));
        return;
    }

    // approved
    registrationSection.style.display = "none";
    dashboardSection.style.display = "flex";
    banner.style.background = "#dcfce7";
    banner.style.color = "#16a34a";
    banner.innerHTML = "<svg class='ic'><use href='#i-check'/></svg> Mitra Driver <strong>Aktif</strong> - Siap menerima pesanan.";
    navBadge.innerText = "Aktif";
    fillDriverProfileDisplay(application);

    // Sinkronkan status operasional dari Firestore agar tidak kembali OFFLINE
    // setiap kali halaman di-refresh. Field ini hanya tambahan; data lama tetap utuh.
    isOnline = application.isOnline === true;
    updateDriverStatusButton();
}

function updateDriverStatusButton() {
    const btn = document.getElementById("statusBtn");
    if (!btn) return;
    if (isOnline) {
        btn.innerText = "ONLINE (Siap Order)";
        btn.className = "status-toggle-btn";
    } else {
        btn.innerText = "OFFLINE";
        btn.className = "status-toggle-btn offline";
    }
}

async function saveDriverOperationalStatus(nextStatus) {
    if (!window.CikurCloud || !userProfile?.uid) {
        throw new Error("Koneksi CIKUR Cloud belum siap.");
    }
    if (typeof window.CikurCloud.updateMitraProfile !== "function") {
        throw new Error("Fungsi pembaruan profil mitra belum tersedia.");
    }

    await window.CikurCloud.updateMitraProfile(userProfile.uid, {
        isOnline: nextStatus,
        operationalStatus: nextStatus ? "online" : "offline",
        operationalStatusUpdatedAt: new Date().toISOString()
    });
}


function fillDriverProfileDisplay(application) {
    document.getElementById("profileNameDisplay").innerText = application.name || userProfile.name || '-';
    document.getElementById("profileMetaDisplay").innerText = `${application.vehicle || '-'} | WA: ${application.phone || userProfile.phone || '-'}`;
    document.getElementById("profileBankNote").innerText = `Rek: ${application.bank || '-'} - ${application.accountNo || '-'} (${application.accountName || '-'})`;
    if (application.photo) {
        document.getElementById("profilePhotoDisplay").src = application.photo;
    }
}

async function saveDriverRegistration() {
    if (!userProfile.uid) {
        alert("Sesi Anda belum siap. Silakan refresh halaman.");
        return;
    }

    let name = document.getElementById("regName").value.trim();
    let phone = document.getElementById("regPhone").value.trim();
    let vehicle = document.getElementById("regVehicle").value.trim();
    let vehicleType = "Motor"; // CIKUR GO RIDE khusus motor
    let address = document.getElementById("regAddress").value.trim();
    let ktp = document.getElementById("regKtp").value.trim();
    let sim = document.getElementById("regSim").value.trim();
    let bank = document.getElementById("regBank").value;
    let accountName = document.getElementById("regAccountName").value.trim();
    let accountNo = document.getElementById("regAccountNo").value.trim();

    if(!name || !phone || !vehicle || !address || !accountName || !accountNo) {
        alert("Harap isi semua kolom registrasi dan data rekening dengan lengkap!");
        return;
    }
    if (!/^\d{16}$/.test(ktp)) {
        alert("Nomor KTP harus tepat 16 digit angka.");
        return;
    }
    if (!sim) {
        alert("Mohon isi nomor SIM.");
        return;
    }

    const fotoKtpFile = document.getElementById("regFotoKtp").files[0];
    const fotoSimFile = document.getElementById("regFotoSim").files[0];
    const fotoStnkFile = document.getElementById("regFotoStnk").files[0];
    const fotoProfilFile = document.getElementById("regPhoto").files[0];

    if (!fotoKtpFile || !fotoSimFile || !fotoStnkFile) {
        alert("Mohon upload foto KTP, SIM, dan STNK.");
        return;
    }

    const btnSubmit = document.querySelector('#registrationSection .btn-primary');
    if (btnSubmit) {
        btnSubmit.disabled = true;
        btnSubmit.textContent = "Mengirim Pendaftaran...";
    }

    function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) { resolve(""); return; }
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    try {
        const [fotoKtpBase64, fotoSimBase64, fotoStnkBase64, fotoProfilBase64] = await Promise.all([
            readFileAsBase64(fotoKtpFile),
            readFileAsBase64(fotoSimFile),
            readFileAsBase64(fotoStnkFile),
            readFileAsBase64(fotoProfilFile)
        ]);

        let bcgoResult = null;
        if (window.BCGO) {
            try {
                bcgoResult = window.BCGO.evaluatePartner({
                    partnerType: "driver",
                    name,
                    phone,
                    address,
                    vehicleType
                });
            } catch (bcgoError) {
                console.error("[BCGO] Gagal menjalankan evaluasi:", bcgoError);
            }
        }

        await window.CikurCloud.submitMitraApplication(userProfile.uid, "driver", {
            name,
            phone,
            vehicle,
            vehicleType,
            vehicleModel: (document.getElementById("regVehicleModel") ? document.getElementById("regVehicleModel").value.trim() : ""),
            address,
            ktp,
            sim,
            bank,
            accountName,
            accountNo,
            fotoKtp: fotoKtpBase64,
            fotoSim: fotoSimBase64,
            fotoStnk: fotoStnkBase64,
            photo: fotoProfilBase64 || "",
            bcgoScore: bcgoResult?.score ?? null,
            bcgoRisk: bcgoResult?.risk ?? null,
            bcgoRecommendation: bcgoResult?.status ?? null,
            bcgoReasons: bcgoResult?.reasons ?? []
        });

        alert("Pendaftaran Driver berhasil dikirim! Menunggu verifikasi Admin.");
        // renderByMitraStatus akan otomatis dipanggil ulang oleh listener realtime

    } catch (error) {
        alert("Gagal mengirim pendaftaran: " + (error?.message || error));
    } finally {
        if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.textContent = "Simpan & Masuk Panel";
        }
    }
}

function openEditProfile() {
    // Tampilkan ulang form registrasi untuk edit data,
    // data lama tetap tersimpan di Firestore sampai disubmit ulang.
    document.getElementById("registrationSection").style.display = "flex";
    document.getElementById("dashboardSection").style.display = "none";
    if (currentMitraApplication) {
        document.getElementById("regName").value = currentMitraApplication.name || "";
        document.getElementById("regPhone").value = currentMitraApplication.phone || "";
        document.getElementById("regVehicle").value = currentMitraApplication.vehicle || "";
        document.getElementById("regVehicleModel").value = currentMitraApplication.vehicleModel || "";
        document.getElementById("regAddress").value = currentMitraApplication.address || "";
        document.getElementById("regKtp").value = currentMitraApplication.ktp || "";
        document.getElementById("regSim").value = currentMitraApplication.sim || "";
        document.getElementById("regBank").value = currentMitraApplication.bank || "BCA";
        document.getElementById("regAccountName").value = currentMitraApplication.accountName || "";
        document.getElementById("regAccountNo").value = currentMitraApplication.accountNo || "";
    }
}

async function toggleDriverStatus() {
    const previousStatus = isOnline;
    const nextStatus = !previousStatus;
    const btn = document.getElementById("statusBtn");

    if (btn) {
        btn.disabled = true;
        btn.innerText = nextStatus ? "MENYALAKAN..." : "MEMATIKAN...";
    }

    try {
        await saveDriverOperationalStatus(nextStatus);
        isOnline = nextStatus;
        updateDriverStatusButton();
        loadDriverOrders();
    } catch (error) {
        isOnline = previousStatus;
        updateDriverStatusButton();
        alert("Gagal memperbarui status operasional: " + (error?.message || error));
    } finally {
        if (btn) btn.disabled = false;
    }
}

function switchDriverTab(tab) {
    currentTab = tab;
    document.getElementById("tabFoodBtn").className = tab === 'food' ? "driver-tab active" : "driver-tab";
    document.getElementById("tabRideBtn").className = tab === 'ride' ? "driver-tab active" : "driver-tab";
    loadDriverOrders();
}

let unsubscribeAvailableFood = null;
let unsubscribeMyActiveFood = null;
let availableFoodOrdersCache = [];
let myActiveFoodOrdersCache = [];
let driverFoodMessageUnsubscribers = {};
let driverFoodMessagesCache = {};

function loadDriverOrders() {
    let container = document.getElementById("driverOrderContainer");
    container.innerHTML = "";

    if (!isOnline) {
        container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-muted); font-size: 11px;">Status Anda <b>OFFLINE</b>. Aktifkan status untuk memindai orderan asli yang masuk.</div>`;
        stopFoodOrderListeners();
        stopRideOrderListeners();
        return;
    }

    if (currentTab === 'food') {
        stopRideOrderListeners();
        startFoodOrderListeners();
        renderFoodOrderList();
    } else {
        stopFoodOrderListeners();
        startRideOrderListeners();
        renderRideOrderList();
    }
}

function stopFoodOrderListeners() {
    if (typeof unsubscribeAvailableFood === "function") unsubscribeAvailableFood();
    if (typeof unsubscribeMyActiveFood === "function") unsubscribeMyActiveFood();
    unsubscribeAvailableFood = null;
    unsubscribeMyActiveFood = null;
}

function startFoodOrderListeners() {
    if (!window.CikurCloud || !userProfile.uid) return;

    if (!unsubscribeAvailableFood) {
        unsubscribeAvailableFood = window.CikurCloud.listenAvailableFoodOrders((orders) => {
            availableFoodOrdersCache = orders;
            renderFoodOrderList();
        });
    }

    if (!unsubscribeMyActiveFood) {
        unsubscribeMyActiveFood = window.CikurCloud.listenDriverActiveFoodOrders(userProfile.uid, (orders) => {
            myActiveFoodOrdersCache = orders;
            renderFoodOrderList();
        });
    }
}

function renderFoodOrderList() {
    let container = document.getElementById("driverOrderContainer");
    if (!container || currentTab !== 'food') return;

    if (availableFoodOrdersCache.length === 0 && myActiveFoodOrdersCache.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-muted); font-size: 11px;">Belum ada pesanan Cikur Food yang tersedia saat ini.</div>`;
        return;
    }

    let html = "";

    myActiveFoodOrdersCache.forEach((ord) => {
        html += renderMyActiveFoodOrderCard(ord);
        if (!driverFoodMessageUnsubscribers[ord.id]) {
            driverFoodMessageUnsubscribers[ord.id] = window.CikurCloud.listenOrderMessages(ord.id, (messages) => {
                driverFoodMessagesCache[ord.id] = messages;
                renderFoodOrderList();
            });
        }
    });

    availableFoodOrdersCache.forEach((ord) => {
        html += renderAvailableFoodOrderCard(ord);
    });

    container.innerHTML = html;
}

function renderAvailableFoodOrderCard(ord) {

            </div>
            <div style="font-size: 11px; font-weight: 700;">${ic3('pin')} Tujuan Customer: ${ord.address?.text || '-'}</div>

function renderMyActiveFoodOrderCard(ord) {
    let itemsText = (ord.items || []).map(i => `${i.quantity}x ${i.name}`).join(', ') || 'Menu tidak tersedia';
    let messages = driverFoodMessagesCache[ord.id] || [];
    let chatHtml = messages.map(m =>
        `<div class="chat-msg ${m.sender === 'driver' ? 'driver' : 'other'}">${m.sender === 'driver' ? 'Anda' : (m.sender === 'customer' ? 'Customer' : (m.sender === 'resto' ? 'Resto' : 'Sistem'))}: "${m.text}"</div>`
    ).join('') || '<div class="chat-msg other">Belum ada pesan.</div>';

    let statusLabel = ord.status === "DIAMBIL_DRIVER" ? "Menuju Resto/Customer" : "Sedang Diantar";

    return `
        <div class="order-card" style="border-color: #16a34a;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="badge-type badge-food">CIKUR FOOD - Resto: ${ord.restoName || 'Mitra Resto'}</span>
                <span style="font-size: 10px; color: #16a34a; font-weight:700;"><svg class='ic'><use href='#i-check'/></svg> ${statusLabel}</span>
            </div>
            <div style="font-size: 11px; font-weight: 700;">${ic3('pin')} Tujuan Customer: ${ord.address?.text || '-'}</div>
            <div style="font-size: 11px; color: var(--text-muted); background: var(--background); padding: 8px; border-radius: 8px;">
                ${ic3('cart')} <b>Menu:</b> ${itemsText}
            </div>
            <div style="font-size: 12px; font-weight: 800; color: var(--primary);">
                Total Pembayaran: Rp ${Number(ord.total || 0).toLocaleString('id-ID')} (${ord.paymentMethod || '-'})
            </div>

            <div style="font-size: 11px; font-weight: 700; margin-top: 4px;">${ic3('chat')} Chat Koordinasi:</div>
            <div class="chat-container">
                <div class="chat-box" id="chatFoodBox_${ord.id}">${chatHtml}</div>
                <div class="chat-input-group">
                    <input type="text" id="inputFoodChat_${ord.id}" class="form-input" style="flex:1;" placeholder="Balas chat...">
                    <button type="button" class="btn-primary" style="padding: 6px 12px; font-size: 10px;" onclick="sendFoodChat('${ord.id}')">Kirim</button>
                </div>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 4px;">
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ord.address?.text || '')}" target="_blank" class="form-input" style="background:#0284c7; color:#fff; text-align:center; text-decoration:none; font-weight:700; display:flex; align-items:center; justify-content:center;">${ic3('worldmap')} Peta Navigasi</a>
                <button type="button" class="btn-primary" style="flex:1;" onclick="completeFoodOrder('${ord.id}')">Selesaikan Antaran <svg class='ic'><use href='#i-check'/></svg> </button>
            </div>
        </div>
    `;
}

async function claimThisFoodOrder(orderId) {
    try {
        await window.CikurCloud.claimFoodOrder(orderId, userProfile.uid, userProfile.name);
        await window.CikurCloud.sendOrderMessage(orderId, "system", "Driver telah mengambil pesanan Anda dan sedang menuju lokasi.");
    } catch (error) {
        alert("Gagal mengambil pesanan (mungkin sudah diambil driver lain): " + (error?.message || error));
    }
}


/* =========================================================
   RIDE ORDERS — Firestore (sinkron dengan ride.html)
========================================================= */
let availableRideOrdersCache = [];
let myActiveRideOrdersCache = [];
let unsubscribeAvailableRide = null;
let unsubscribeMyActiveRide = null;
let driverRideMessageUnsubscribers = {};
let driverRideMessagesCache = {};

function stopRideOrderListeners() {
    if (typeof unsubscribeAvailableRide === "function") unsubscribeAvailableRide();
    if (typeof unsubscribeMyActiveRide === "function") unsubscribeMyActiveRide();
    unsubscribeAvailableRide = null;
    unsubscribeMyActiveRide = null;
    Object.keys(driverRideMessageUnsubscribers).forEach((id) => {
        try { driverRideMessageUnsubscribers[id](); } catch (_) {}
    });
    driverRideMessageUnsubscribers = {};
}



const REQUIRE_SALDO_FOR_CASH = false; // true: order tunai hanya bisa diterima jika saldo >= komisi. false (default): saldo boleh minus, komisi dicatat sebagai utang ke aplikator.
let driverSaldo = null;

async function refreshDriverSaldo() {
    try {
        if (!window.CikurCloud || !userProfile.uid) return;
        const p = await window.CikurCloud.getProfile(userProfile.uid);
        driverSaldo = Number((p && p.saldo) || 0);
        renderRideOrderList();
    } catch (e) { console.warn("[CIKUR DRIVER] Saldo gagal dimuat:", e && e.message); }
}

function saldoCardHtml() {
    if (driverSaldo == null) return "";
    return `<div class="saldo-card"><div><small>Saldo driver</small><b>Rp ${Number(driverSaldo).toLocaleString("id-ID")}</b></div><small>Komisi order tunai dipotong dari saldo. Pendapatan order CikurPay masuk ke saldo.</small></div>`;
}

function startRideOrderListeners() {
    if (!window.CikurCloud || !userProfile.uid) return;
    refreshDriverSaldo();

    if (!unsubscribeAvailableRide) {
        unsubscribeAvailableRide = window.CikurCloud.listenAvailableRideOrders((orders) => {
            availableRideOrdersCache = orders || [];
            renderRideOrderList();
        });
    }
    if (!unsubscribeMyActiveRide) {
        unsubscribeMyActiveRide = window.CikurCloud.listenDriverActiveRideOrders(userProfile.uid, (orders) => {
            myActiveRideOrdersCache = orders || [];
            renderRideOrderList();
        });
    }
}

function escText(s) {
    return String(s || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderRideOrderList() {
    const container = document.getElementById("driverOrderContainer");
    if (!container || currentTab !== "ride") return;

    if (!availableRideOrdersCache.length && !myActiveRideOrdersCache.length) {
        container.innerHTML = saldoCardHtml() + `<div style="text-align:center; padding: 25px; color: var(--text-muted); font-size: 11px;">Belum ada pesanan <b>CIKUR GO RIDE</b> masuk. Pastikan status ONLINE.</div>`;
        return;
    }

    let html = saldoCardHtml();
    myActiveRideOrdersCache.forEach((ord) => {
        html += renderMyActiveRideCard(ord);
        if (!driverRideMessageUnsubscribers[ord.id] && window.CikurCloud) {
            driverRideMessageUnsubscribers[ord.id] = window.CikurCloud.listenOrderMessages(ord.id, (messages) => {
                driverRideMessagesCache[ord.id] = messages;
                renderRideOrderList();
            });
        }
    });
    availableRideOrdersCache.forEach((ord) => {
        html += renderAvailableRideCard(ord);
    });
    const saved = {};
    const focusId = document.activeElement && document.activeElement.id;
    container.querySelectorAll('input[id^="inputRideChat_"]').forEach((i) => { saved[i.id] = i.value; });
    container.innerHTML = html;
    Object.keys(saved).forEach((id) => { const el = document.getElementById(id); if (el) el.value = saved[id]; });
    if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
    container.querySelectorAll(".chat-box").forEach((b) => { b.scrollTop = b.scrollHeight; });
}

function rideSplitHtml(ord) {
    if (ord.driverEarning == null || ord.platformFee == null) return "";
    const rp = (n) => "Rp " + Number(n || 0).toLocaleString("id-ID");
    const pct = ord.fare ? Math.round((ord.platformFee / ord.fare) * 100) : 0;
    const cash = /tunai|cod/i.test(String(ord.paymentMethod || ""));
    return `<div class="split-box">
      <div class="split-row"><span>Total dibayar penumpang</span><b>${rp(ord.fare)}</b></div>
      <div class="split-row split-app"><span>Komisi aplikator (${pct}%)</span><b>− ${rp(ord.platformFee)}</b></div>
      <div class="split-row split-me"><span>Pendapatanmu</span><b>${rp(ord.driverEarning)}</b></div>
      <div class="split-note">${cash ? "Bayar tunai: terima " + rp(ord.fare) + " dari penumpang" : "Dibayar lewat " + escText(ord.paymentMethod || "-")}</div>
    </div>`;
}

function renderAvailableRideCard(ord) {
    const fare = Number(ord.fare || 0).toLocaleString("id-ID");
    const dist = ord.distanceKm != null ? ` · ± ${ord.distanceKm} km` : "";
    const mapsQ = encodeURIComponent(ord.pickup || "");
    return `
      <div class="order-card" style="border-color:#bae6fd;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="badge-type badge-ride">CIKUR GO RIDE · ${escText(ord.vehicleName || ord.vehicleType || "Motor")}</span>
          <span style="font-size:10px;color:#0284c7;font-weight:800;">BARU</span>
        </div>
        <div style="font-size:12px;font-weight:800;margin-top:4px;"><span class='dot-g'></span> ${escText(ord.pickup || "-")}</div>
        <div style="font-size:12px;font-weight:700;">${ic3('flag')} ${escText(ord.destination || "-")}</div>
        <div style="font-size:11px;color:var(--text-muted);">Penumpang: <b>${escText(ord.customerName || "Customer")}</b>${dist}</div>
        ${rideSplitHtml(ord) || `<div style="font-size:13px;font-weight:800;color:#0284c7;">Tarif: Rp ${fare}</div>`}
        <div style="display:flex;gap:8px;margin-top:8px;">
          <a href="https://www.google.com/maps/search/?api=1&query=${mapsQ}" target="_blank" class="form-input" style="background:#0ea5e9;color:#fff;text-align:center;text-decoration:none;font-weight:700;display:flex;align-items:center;justify-content:center;">${ic3('worldmap')} Jemput</a>
          <button type="button" class="btn-primary" style="flex:1;background:#0284c7;" onclick="claimThisRideOrder('${ord.id}')">Terima Order</button>
        </div>
      </div>`;
}

function renderMyActiveRideCard(ord) {
    const fare = Number(ord.fare || 0).toLocaleString("id-ID");
    const status = ord.status === "DIANTAR" ? "Sedang mengantar" : (ord.driverArrived ? "Menunggu penumpang" : "Menuju penumpang");
    const msgs = driverRideMessagesCache[ord.id] || [];
    const chatHtml = msgs.map((m) => {
        const isMe = m.sender === "driver";
        const label = isMe ? "Anda" : (m.sender === "customer" ? "Penumpang" : "Sistem");
        return `<div class="chat-msg ${isMe ? "driver" : (m.sender === "system" ? "sys" : "other")}">${escText(m.text)}</div>`;
    }).join("") || `<div style="color:var(--text-muted);font-size:10px;">Belum ada chat.</div>`;
    const destQ = encodeURIComponent((ord.status === "DIANTAR" ? ord.destination : ord.pickup) || "");
    const actionBtn = ord.status === "DIANTAR"
        ? `<button type="button" class="btn-primary" style="flex:1;background:#16a34a;" onclick="completeRideOrder('${ord.id}')">Selesai <svg class='ic'><use href='#i-check'/></svg> </button>`
        : (ord.driverArrived
            ? `<button type="button" class="btn-primary" style="flex:1;background:#7c3aed;" onclick="rideStart('${ord.id}')">Mulai Perjalanan</button>`
            : `<button type="button" class="btn-primary" style="flex:1;background:#f59e0b;" onclick="rideArrived('${ord.id}')">Sudah Sampai di Titik Jemput</button>`);
    return `
      <div class="order-card" style="border-color:#86efac;background:#f0fdf4;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="badge-type badge-ride">CIKUR GO RIDE · AKTIF</span>
          <span style="font-size:10px;color:#16a34a;font-weight:800;">${status}</span>
        </div>
        <div style="font-size:12px;font-weight:800;"><span class='dot-g'></span> ${escText(ord.pickup || "-")}</div>
        <div style="font-size:12px;font-weight:700;">${ic3('flag')} ${escText(ord.destination || "-")}</div>
        ${rideSplitHtml(ord) || `<div style="font-size:13px;font-weight:800;color:#0284c7;">Tarif: Rp ${fare} · ${escText(ord.paymentMethod || "-")}</div>`}
        <div style="font-size:11px;font-weight:700;margin-top:6px;">${ic3('chat')} Chat</div>
        <div class="chat-container">
          <div class="chat-box" id="chatRideBox_${ord.id}">${chatHtml}</div>
          <div class="chat-input-group">
            <input type="text" id="inputRideChat_${ord.id}" class="form-input" style="flex:1;" placeholder="Balas penumpang..." onkeydown="if(event.key==='Enter'){sendRideChat('${ord.id}')}">
            <button type="button" class="btn-primary" style="padding:6px 12px;font-size:10px;background:#0284c7;" onclick="sendRideChat('${ord.id}')">Kirim</button>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <a href="https://www.google.com/maps/dir/?api=1&destination=${destQ}" target="_blank" class="form-input" style="background:#0ea5e9;color:#fff;text-align:center;text-decoration:none;font-weight:700;display:flex;align-items:center;justify-content:center;">${ic3('worldmap')} Navigasi</a>
          ${actionBtn}
        </div>
      </div>`;
}

function makeDriverThumb(dataUrl, size) {
    return new Promise((resolve) => {
        if (!dataUrl) { resolve(""); return; }
        const img = new Image();
        img.onload = () => {
            const c = document.createElement("canvas");
            const s = Math.min(img.width, img.height);
            c.width = c.height = size;
            c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
            resolve(c.toDataURL("image/jpeg", 0.6));
        };
        img.onerror = () => resolve("");
        img.src = dataUrl;
    });
}

async function claimThisRideOrder(orderId) {
    try {
        const target = availableRideOrdersCache.find((x) => x.id === orderId) || {};
        const isCash = /tunai|cod/i.test(String(target.paymentMethod || "")) && target.paymentStatus !== "PAID";
        if (REQUIRE_SALDO_FOR_CASH && isCash && Number(target.platformFee) > 0) {
            await refreshDriverSaldo();
            if (Number(driverSaldo || 0) < Number(target.platformFee)) {
                alert("Saldo kamu Rp " + Number(driverSaldo || 0).toLocaleString("id-ID") + " belum cukup untuk komisi order tunai (Rp " + Number(target.platformFee).toLocaleString("id-ID") + "). Silakan isi saldo dulu atau pilih order CikurPay.");
                return;
            }
        }
        await window.CikurCloud.claimRideOrder(orderId, userProfile.uid, userProfile.name || "Driver CIKUR");
        await window.CikurCloud.sendOrderMessage(orderId, "system", "Driver menerima order dan sedang menuju titik jemput.");
        const app = currentMitraApplication || {};
        window.CikurCloud.updateOrderStatus(orderId, {
            driverPhoto: await makeDriverThumb(app.photo, 160),
            driverPlate: app.vehicle || "",
            driverVehicleType: app.vehicleType || "",
            driverVehicleModel: app.vehicleModel || "",
            driverPhone: app.phone || userProfile.phone || ""
        }).catch((e) => console.error("[CIKUR DRIVER] Gagal simpan info driver:", e));
        // Push lokasi segera agar marker customer bergerak
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                window.CikurCloud.updateDriverLiveLocation(userProfile.uid, pos.coords.latitude, pos.coords.longitude).catch(() => {});
            });
        }
    } catch (error) {
        alert("Gagal menerima ride (mungkin sudah diambil): " + (error && error.message || error));
    }
}

async function sendRideChat(orderId) {
    const input = document.getElementById("inputRideChat_" + orderId);
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    try {
        await window.CikurCloud.sendOrderMessage(orderId, "driver", text);
        input.value = "";
    } catch (error) {
        alert("Chat gagal: " + (error && error.message || error));
    }
}

async function rideArrived(orderId) {
    try {
        await window.CikurCloud.updateOrderStatus(orderId, { driverArrived: true });
        await window.CikurCloud.sendOrderMessage(orderId, "system", "Driver sudah tiba di titik jemput.");
    } catch (error) { alert("Gagal: " + (error && error.message || error)); }
}

async function rideStart(orderId) {
    try {
        await window.CikurCloud.updateOrderStatus(orderId, { status: "DIANTAR" });
        await window.CikurCloud.sendOrderMessage(orderId, "system", "Perjalanan dimulai.");
    } catch (error) { alert("Gagal: " + (error && error.message || error)); }
}

async function completeRideOrder(orderId) {
    const o = myActiveRideOrdersCache.find((x) => x.id === orderId) || {};
    const cash = /tunai|cod/i.test(String(o.paymentMethod || "")) && o.paymentStatus !== "PAID";
    if (!confirm(cash ? "Sudah terima tunai Rp " + Number(o.fare || 0).toLocaleString("id-ID") + " dari penumpang? Selesaikan ride?" : "Selesaikan perjalanan CIKUR GO RIDE ini?")) return;
    try {
        const settle = await window.CikurCloud.settleRideOrder(orderId, userProfile.uid);
        await window.CikurCloud.updateOrderStatus(orderId, { status: "SELESAI" });
        await window.CikurCloud.sendOrderMessage(orderId, "system", "Perjalanan selesai. Terima kasih telah memakai CIKUR GO RIDE!");
        const rp = (n) => "Rp " + Math.abs(Number(n || 0)).toLocaleString("id-ID");
        alert(!settle || settle.skipped ? "Ride selesai." : (settle.isCash ? "Ride selesai. Komisi " + rp(settle.delta) + " dipotong dari saldo." : "Ride selesai. Pendapatan " + rp(settle.delta) + " masuk ke saldo."));
        refreshDriverSaldo();
    } catch (error) {
        alert("Gagal menyelesaikan: " + (error && error.message || error));
    }
}

function sendFoodChat(orderId) {
    let input = document.getElementById(`inputFoodChat_${orderId}`);
    if(!input) return;
    let text = input.value.trim();
    if(!text) return;
    if (window.CikurCloud) {
        window.CikurCloud.sendOrderMessage(orderId, "driver", text).then(() => { input.value = ""; }).catch((e) => alert(e.message || e));
        return;
    }
    let box = document.getElementById(`chatFoodBox_${orderId}`);
    box.innerHTML += `<div class="chat-msg driver">Driver: "${text}"</div>`;
    input.value = "";
    box.scrollTop = box.scrollHeight;
}

async function completeFoodOrder(orderId) {
    if(!confirm("Selesaikan pesanan Cikur Food ini?")) return;
    try {
        await window.CikurCloud.updateOrderStatus(orderId, { status: "SELESAI" });
        await window.CikurCloud.sendOrderMessage(orderId, "system", "Pesanan telah selesai diantar. Terima kasih!");
        alert("Pesanan berhasil diselesaikan!");
    } catch (error) {
        alert("Gagal menyelesaikan pesanan: " + (error?.message || error));
    }
}

</script>
