<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIKUR GO - Advanced System</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body{
    background:radial-gradient(circle at center,#121824 0%,#070a0f 100%);
    color:#e2e8f0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    overflow-x:hidden;
}

/* ===========================
   CONTAINER UTAMA (GLASSMORPHISM)
=========================== */
.container{
    width:100%;
    max-width:440px;
    margin:0 auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    background:rgba(18, 24, 38, 0.75);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255, 193, 7, 0.2);
    border-radius:28px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
}

.hero-tag{
    display:inline-block;
    padding:6px 18px;
    margin:0 auto 12px;
    border-radius:999px;
    background:rgba(255,193,7,0.1);
    border:1px solid rgba(255,193,7,0.3);
    color:#FFC107;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
}

.hero-title{
    font-size:22px;
    font-weight:800;
    color:#fff;
    margin:0 0 8px;
    letter-spacing:-0.5px;
}

.hero-desc{
    font-size:14px;
    line-height:1.5;
    color:#94a3b8;
    margin:0 0 8px;
}

.hero-info{
    font-size:12px;
    line-height:1.5;
    color:#64748b;
    margin:0 0 14px;
}

/* ===== Tombol Utama ===== */
button{
    width:100%;
    height:50px;
    border:none;
    border-radius:14px;
    margin:8px 0 14px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(135deg,#FFC107,#F59E0B);
    color:#0f172a;
    transition:.3s;
    box-shadow:0 8px 20px rgba(255,193,7,0.25);
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(255,193,7,0.4);
}

/* ===== Footer ===== */
footer{
    text-align:center;
    margin-top:auto;
    padding:8px 0 4px;
    color:#64748b;
    font-size:11px;
    line-height:1.4;
}

footer p{
    margin:0;
}

@keyframes robotFloat{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
}

/* ===========================
   MENU GRID
=========================== */
.menu-grid{
    display:flex;
    justify-content:space-evenly;
    align-items:center;
    gap:12px;
    margin:10px 0 16px;
}

.menu-item{
    width:85px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
    cursor:pointer;
}

.menu-item img{
    width:80px;
    height:80px;
    object-fit:contain;
    display:block;
    animation:robotFloat 3.5s ease-in-out infinite;
    filter:drop-shadow(0 0 12px rgba(255,193,7,0.3));
    transition:.3s;
}

.menu-item:hover img{
    transform:translateY(-4px) scale(1.05);
}

/* ===========================
   HERO FRAME & BANNER
=========================== */
.hero-frame{
    position:relative;
    margin-bottom:16px;
    padding:8px;
    border:1px solid rgba(255,255,255,0.06);
    border-radius:24px;
    background:rgba(0,0,0,0.2);
}

.hero-big{
    width:100%;
    aspect-ratio:16/10;
    overflow:hidden;
    border-radius:16px;
    position:relative;
    margin-bottom:8px;
    background:#0b0f17;
}

.hero-big-track{
    display:flex;
    width:300%;
    height:100%;
    transition:transform 0.8s cubic-bezier(.22,.61,.36,1);
}

.hero-big-track img{
    width:33.3333%;
    height:100%;
    object-fit:contain;
    background-color:#0b0f17;
    flex-shrink:0;
    display:block;
}

.mini-slider{
    width:100%;
    aspect-ratio:16/5;
    margin:10px auto 4px;
    overflow:hidden;
    border-radius:14px;
}

.mini-slides{
    display:flex;
    width:300%;
    height:100%;
    transition:transform .95s cubic-bezier(.22,.61,.36,1);
}

.mini-slides img{
    width:33.3333%;
    height:100%;
    flex-shrink:0;
    object-fit:cover;
    display:block;
}

.mini-dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:6px;
}

.mini-dots span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#475569;
    transition:.3s;
}

.mini-dots span.active{
    background:#FFC107;
}

.hero-banner{
    width:100%;
    margin:10px auto 12px;
}

.slider{
    width:100%;
    aspect-ratio:16/7;
    overflow:hidden;
    position:relative;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.1);
    background:#0b0f17;
    cursor:pointer;
}

.slides{
    display:flex;
    transition:transform .7s ease-in-out;
    height:100%;
}

.slides img{
    width:100%;
    height:100%;
    min-width:100%;
    display:block;
    object-fit:cover;
}

.dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:6px;
}

.dots span{
    width:8px;
    height:8px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    transition:.35s;
}

.dots span.active{
    width:20px;
    height:8px;
    border-radius:10px;
    background:#FFC107;
}

/* ===========================
   ASSISTANT SCREEN / MODAL FUTURISTIK
=========================== */
.assistant-screen{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(2, 6, 23, 0.8);
    z-index:99999;
    backdrop-filter:blur(8px);
}

.assistant-page{
    position:absolute;
    top:60px;
    left:0;
    right:0;
    bottom:0;
    background:#0f172a;
    color:#f8fafc;
    border-radius:28px 28px 0 0;
    border-top:2px solid #FFC107;
    box-shadow:0 -10px 40px rgba(0,0,0,0.8);
    overflow-y:auto;
}

.assistant-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:60px;
    padding:15px 20px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    font-weight:800;
    font-size:15px;
    color:#FFC107;
    letter-spacing:0.5px;
}

.assistant-top button, #closeAssistant{
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    color:#fff;
    font-size:16px;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.2s;
    margin:0;
}

.assistant-top button:hover, #closeAssistant:hover{
    background:#FFC107;
    color:#0f172a;
}

.assistant-content{
    padding:20px 16px 30px 16px;
}

.paket-title{
    text-align:center;
    margin-bottom:14px;
    font-size:16px;
    font-weight:700;
    color:#cbd5e1;
}

.paket-grid{
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
    gap:10px;
    margin-bottom:18px;
}

.paket-btn{
    background:transparent;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:none;
    height:auto;
    width:auto;
    position:relative;
}

.paket-btn img{
    width:75px;
    display:block;
    transition:.3s;
    margin-bottom:6px;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));
}

.paket-btn img:hover{
    transform:scale(1.05);
}

.indicator-line {
    width:0%;
    height:3px;
    background:#FFC107;
    border-radius:3px;
    transition:width 0.3s ease;
}

.paket-btn.selected .indicator-line {
    width:100%;
}

/* ===========================
   FORM PEMESANAN KOMPUTERISASI (DARK TERMINAL LOOK)
=========================== */
#paketContent {
    border:1px solid rgba(255,193,7,0.3);
    border-radius:20px;
    padding:16px 14px;
    background:rgba(15, 23, 42, 0.95);
    margin-top:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    text-align:left;
}

.paket-kosong{
    text-align:center;
    color:#64748b;
    padding:30px 10px;
    font-size:13px;
}

.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.input-layanan {
    width: 100%;
    padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,193,7,0.4);
    border-radius: 10px;
    font-size: 16px;
    font-weight: 800;
    color: #FFC107;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
}

.row-grid {
    display: flex;
    gap: 10px;
}

.col-half {
    flex: 1;
}

.input-box {
    width: 100%;
    padding: 10px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    outline: none;
    transition: 0.2s;
}

.input-box:focus {
    border-color: #FFC107;
    box-shadow: 0 0 10px rgba(255,193,7,0.2);
}

.input-box.harga-text {
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
}

.extra-row {
    display: flex;
    gap: 6px;
}

.input-number {
    width: 50px;
    padding: 8px 4px;
    text-align: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
}

.form-hint {
    font-size: 9px;
    color: #64748b;
    margin-top: 2px;
    display: block;
}

textarea.input-box {
    resize: none;
    height: 60px;
}

textarea.textarea-besar {
    height: 80px;
}

.rincian-box {
    background: rgba(0,0,0,0.3);
    border: 1px dashed rgba(255,193,7,0.3);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 12px;
    margin-bottom: 10px;
}

.rincian-item {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 4px;
    font-family: 'JetBrains Mono', monospace;
}

.rincian-item.extra-detail {
    color: #FFC107;
    font-weight: 600;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 4px;
}

.total-box {
    background: #070a0f;
    border: 1px solid rgba(255,193,7,0.4);
    color: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.total-label {
    font-size: 12px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
}

.total-value {
    font-size: 16px;
    font-weight: 800;
    color: #FFC107;
    font-family: 'JetBrains Mono', monospace;
}

.payment-method-grid {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.pay-method-btn {
    flex: 1;
    padding: 9px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    font-size: 12px;
    font-weight: 700;
    color: #94a3b8;
    cursor: pointer;
    text-align: center;
    transition: 0.3s;
    height: auto;
    margin: 0;
    box-shadow: none;
}

.pay-method-btn.active-method {
    border-color: #FFC107;
    background: rgba(255,193,7,0.1);
    color: #FFC107;
}

.result-payment-box {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,193,7,0.3);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    margin-top: 12px;
}

.result-payment-box img {
    width: 150px;
    height: 150px;
    object-fit: contain;
    margin: 6px auto;
    display: block;
    border-radius: 8px;
    background: #fff;
    padding: 5px;
}

.btn-pesan-form {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 12px;
    background: #FFC107;
    color: #0f172a;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 4px;
    transition: 0.3s;
    box-shadow: 0 4px 15px rgba(255,193,7,0.3);
}

.btn-pesan-form:hover {
    background: #f59e0b;
}
</style>
</head>
    
<body>

<div class="container">
    <div class="hero-frame">
        <div class="hero-big">
            <div class="hero-big-track">
                <img src="hero-banner1.png" alt="Hero 1">
                <img src="hero-banner2.png" alt="Hero 2">
                <img src="hero-banner3.png" alt="Hero 3">
            </div>
        </div>

        <div class="mini-slider">
            <div class="mini-slides">
                <img src="banner-mini-assistant.png" alt="Mini Assistant">
                <img src="banner-mini-food.png" alt="Mini Food">
                <img src="banner-mini-ride.png" alt="Mini Ride">
            </div>
        </div>

        <div class="mini-dots">
            <span class="active"></span>
            <span></span>
            <span></span>
        </div>  
    </div>  

    <div class="menu-grid">
        <a id="btnAssistant" class="menu-item">
            <img src="tombol-assistant.png" class="assistant-icon" alt="ASSISTANT">
        </a>
        <a id="btnFood" class="menu-item">
            <img src="tombol-food.png" alt="FOOD">
        </a>
        <a id="btnRide" class="menu-item">
            <img src="tombol-ride.png" alt="RIDE">
        </a>
    </div>
    
    <div class="hero-banner">
        <div class="slider">
            <div class="slides">
                <img src="bannercgo1.png" alt="Banner 1">
                <img src="bannercgo2.png" alt="Banner 2">
                <img src="bannercgo3.png" alt="Banner 3">
            </div>
        </div>
        <div class="dots">
            <span class="active"></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="hero-tag">
        SYSTEM MODULE
    </div>

    <h2 class="hero-title">
        CIKUR GO ASSISTANT
    </h2>

    <p class="hero-desc">
        Pendamping profesional untuk aktivitas harian Anda.
    </p>

    <p class="hero-info">
        Didukung oleh <strong>CIKUR GO FOOD</strong> dan
        <strong>CIKUR GO RIDE</strong> dalam satu ekosistem.
    </p>  

    <button id="chatBtn">
        💬 Inisiasi Chat AI
    </button>

    <footer>
        <p>© 2026 CIKUR GO • Core v3.0</p>
        <p>Secured Transaction Engine</p>
    </footer>
</div>
    
<!-- ===== ASSISTANT SCREEN / MODAL ===== -->
<div id="assistantScreen" class="assistant-screen">
    <div class="assistant-page">
        <div class="assistant-top">
            <span>// CIKUR GO ASSISTANT</span>
            <button id="closeAssistant">✕</button>
        </div>
        <div class="assistant-content">
            <h3 class="paket-title">Pilih Layanan</h3>

            <div class="paket-grid">
                <button class="paket-btn" id="btnDine" data-paket="dine">
                    <img src="icon-dine-in.png" alt="DINE-IN">
                    <div class="indicator-line"></div>
                </button>
                <button class="paket-btn" id="btnVip" data-paket="vip">
                    <img src="icon-vip.png" alt="VIP">
                    <div class="indicator-line"></div>
                </button>
                <button class="paket-btn" id="btnPrivate" data-paket="private">
                    <img src="icon-private.png" alt="PRIVATE">
                    <div class="indicator-line"></div>
                </button>
            </div>
            
            <div id="paketContent">
                <p class="paket-kosong">
                    [!] Silakan pilih salah satu layanan di atas.
                </p>
            </div>
        </div>
    </div>
</div>
    
<!-- ===========================
   JAVASCRIPT SECTION
=========================== -->
<script>
// Slider Utama
const slides = document.querySelector(".slides");
const images = document.querySelectorAll(".slides img");
const dots = document.querySelectorAll(".dots span");
const slider = document.querySelector(".slider");
let current = 0;
const total = images.length;

function showSlide(index){
    slides.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach(dot => dot.classList.remove("active"));
    dots[index].classList.add("active");
}

function nextSlide(){
    current++;
    if(current >= total) current = 0;
    showSlide(current);
}
setInterval(nextSlide, 4000);

let startX = 0;
let endX = 0;
slider.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; });
slider.addEventListener("touchend", (e) => {
    endX = e.changedTouches[0].clientX;
    if(startX - endX > 50){ current++; if(current >= total) current = 0; showSlide(current); }
    if(endX - startX > 50){ current--; if(current < 0) current = total - 1; showSlide(current); }
});

slider.addEventListener("click", () => {
    if(current === 0) window.location.href = "assistant.html";
    else if(current === 1) window.location.href = "food.html";
    else window.location.href = "ride.html";
});

// Botpress Chat
const chatBtn = document.getElementById("chatBtn");
chatBtn.addEventListener("click", () => {
    chatBtn.disabled = true;
    chatBtn.innerHTML = "Menghubungkan AI...";
    setTimeout(() => {
        if(window.botpress) window.botpress.open();
        chatBtn.disabled = false;
        chatBtn.innerHTML = "💬 Inisiasi Chat AI";
    }, 500);
});

// Mini Banner
const miniSlides = document.querySelector(".mini-slides");
const miniDots = document.querySelectorAll(".mini-dots span");
let miniCurrent = 0;
const miniTotal = miniDots.length;

function miniShow(index){
    miniSlides.style.transform = `translateX(-${index * 33.333}%)`;
    miniDots.forEach(dot => dot.classList.remove("active"));
    miniDots[index].classList.add("active");
}
function miniNext(){
    miniCurrent++;
    if(miniCurrent >= miniTotal) miniCurrent = 0;
    miniShow(miniCurrent);
}
miniShow(0);
setInterval(miniNext, 7000);

// Hero Big
const heroTrack = document.querySelector(".hero-big-track");
let heroIndex = 0;
function heroSlide(){
    heroIndex++;
    if(heroIndex >= 3) heroIndex = 0;
    heroTrack.style.transform = `translateX(-${heroIndex * 33.3333}%)`;
}
setInterval(heroSlide, 9000);

// Modal Handler
const btnAssistant = document.getElementById("btnAssistant");
const assistantScreen = document.getElementById("assistantScreen");
const closeAssistant = document.getElementById("closeAssistant");

btnAssistant.addEventListener("click", function(e){
    e.preventDefault();
    assistantScreen.style.display = "block";
});
closeAssistant.addEventListener("click", function(){ assistantScreen.style.display = "none"; });
assistantScreen.addEventListener("click", function(e){ e.target === assistantScreen && (assistantScreen.style.display = "none"); });

// Data Paket
const paketButtons = document.querySelectorAll(".paket-btn");
const paketContent = document.getElementById("paketContent");

const dataPaket = {
    dine: { nama: "DINE-IN", hargaBase: 25000, hargaStr: "Rp 25.000,-" },
    vip: { nama: "VIP", hargaBase: 89000, hargaStr: "Rp 89.000,-" },
    private: { nama: "PRIVATE", hargaBase: 349000, hargaStr: "Rp 349.000,-" }
};

paketButtons.forEach(btn => {
    btn.addEventListener("click", function() {
        paketButtons.forEach(b => b.classList.remove("selected"));
        this.classList.add("selected");

        const jenis = this.getAttribute("data-paket");
        const info = dataPaket[jenis];

        paketContent.innerHTML = `
            <div class="form-group">
                <label>Modul Terpilih</label>
                <div class="input-layanan">${info.nama}</div>
            </div>

            <div class="row-grid form-group">
                <div class="col-half">
                    <label>Harga Dasar</label>
                    <div class="input-box harga-text">${info.hargaStr}</div>
                </div>
                <div class="col-half">
                    <label>Extra Waktu</label>
                    <div class="extra-row">
                        <input type="number" id="extraWaktu" class="input-number" value="0" min="0">
                        <div class="input-box harga-text" style="text-align:center; background:rgba(255,255,255,0.02); font-size:11px; display:flex; align-items:center; justify-content:center;">25rb/30m</div>
                    </div>
                    <span class="form-hint">*Kelipatan 30 menit</span>
                </div>
            </div>

            <div class="form-group">
                <label>Jadwal Tanggal</label>
                <input type="date" class="input-box">
            </div>

            <div class="form-group">
                <label>Lokasi Koordinat / Alamat</label>
                <textarea class="input-box" placeholder="Alamat lengkap & Link Google Maps"></textarea>
            </div>

            <div class="form-group">
                <label>Catatan Sistem</label>
                <textarea class="input-box textarea-besar" placeholder="Instruksi khusus untuk operasional..."></textarea>
            </div>

            <div class="rincian-box">
                <div class="rincian-item">
                    <span>Base ${info.nama}:</span>
                    <span>${info.hargaStr}</span>
                </div>
                <div id="rincianExtraRow" class="rincian-item extra-detail" style="display: none;">
                    <span id="labelExtraText">Extra (0x):</span>
                    <span id="nilaiExtraText">Rp 0,-</span>
                </div>
            </div>

            <div class="total-box">
                <span class="total-label">Total Tagihan :</span>
                <span id="totalHarga" class="total-value">${info.hargaStr}</span>
            </div>

            <button class="btn-pesan-form" id="btnProsesBayar">Lanjut Pembayaran ➔</button>
        `;

        const extraInput = document.getElementById("extraWaktu");
        const totalHargaEl = document.getElementById("totalHarga");
        const rincianExtraRow = document.getElementById("rincianExtraRow");
        const labelExtraText = document.getElementById("labelExtraText");
        const nilaiExtraText = document.getElementById("nilaiExtraText");

        let currentTotalValue = info.hargaBase;

        extraInput.addEventListener("input", function() {
            let qty = parseInt(this.value) || 0;
            if(qty < 0) { qty = 0; this.value = 0; }

            let biayaExtra = qty * 25000;
            currentTotalValue = info.hargaBase + biayaExtra;

            totalHargaEl.innerText = "Rp " + currentTotalValue.toLocaleString('id-ID') + ",-";

            if(qty > 0) {
                rincianExtraRow.style.display = "flex";
                labelExtraText.innerText = `Extra (${qty}x @25rb):`;
                nilaiExtraText.innerText = "Rp " + biayaExtra.toLocaleString('id-ID') + ",-";
            } else {
                rincianExtraRow.style.display = "none";
            }
        });

        // Tombol Lanjut Pembayaran diklik -> Muncul QRIS dengan proteksi Upload Bukti Terkunci
        document.getElementById("btnProsesBayar").addEventListener("click", function() {
            const tanggal = paketContent.querySelector("input[type='date']").value;
            const lokasi = paketContent.querySelector("textarea[placeholder*='Alamat']").value;
            const totalHargaText = totalHargaEl.innerText;

            if (!tanggal || !lokasi) {
                alert("[!] Mohon lengkapi Jadwal Tanggal dan Lokasi koordinat terlebih dahulu.");
                return;
            }

            paketContent.innerHTML = `
                <h3 class="paket-title" style="margin-bottom:6px;">Verifikasi Pembayaran</h3>
                <p style="font-size:11px; text-align:center; color:#94a3b8; margin-bottom:10px; font-family:'JetBrains Mono',monospace;">
                    Tagihan: <strong style="color:#FFC107;">${totalHargaText}</strong>
                </p>

                <div class="payment-method-grid">
                    <button type="button" class="pay-method-btn active-method" id="methodQris">QRIS</button>
                    <button type="button" class="pay-method-btn" id="methodTunai">TUNAI</button>
                </div>

                <div id="dynamicPaymentArea" class="result-payment-box">
                    <p style="font-weight:700; font-size:12px; color:#fff; margin-bottom:2px;">Scan QRIS CIKUR Rubidotcom</p>
                    <p style="font-size:10px; color:#FFC107; font-weight:600; margin-bottom:6px; font-family:'JetBrains Mono',monospace;">NMID: ID1020035825931 (A01)</p>
                    <img src="qris.png" alt="QRIS CIKUR Rubidotcom">
                    <p style="font-size:10px; color:#94a3b8; margin-top:4px;">Transfer nominal pas, lalu upload bukti screenshot di bawah.</p>
                    
                    <div id="uploadContainer" style="margin-top:10px; text-align:left; border-top:1px dashed rgba(255,255,255,0.15); padding-top:8px;">
                        <label style="font-size:11px; font-weight:700; color:#fff; display:block; margin-bottom:4px;">Upload Bukti Transfer:</label>
                        <input type="file" id="fileBuktiQR" accept="image/*" class="input-box" style="font-size:11px; padding:5px; background:rgba(255,255,255,0.04);">
                    </div>
                </div>

                <button class="btn-pesan-form" id="btnSelesaikan" style="margin-top:10px; background:#334155; color:#94a3b8; cursor:not-allowed;" disabled>Upload Bukti Bayar Dulu ➔</button>
            `;

            const methodQris = document.getElementById("methodQris");
            const methodTunai = document.getElementById("methodTunai");
            const dynamicPaymentArea = document.getElementById("dynamicPaymentArea");
            const btnSelesaikan = document.getElementById("btnSelesaikan");
            const fileBuktiQR = document.getElementById("fileBuktiQR");

            // Logika Kunci Tombol Upload QRIS
            fileBuktiQR.addEventListener("change", function() {
                if(this.files && this.files.length > 0) {
                    btnSelesaikan.disabled = false;
                    btnSelesaikan.style.background = "#FFC107";
                    btnSelesaikan.style.color = "#0f172a";
                    btnSelesaikan.style.cursor = "pointer";
                    btnSelesaikan.innerText = "Selesaikan Pesanan ✓";
                } else {
                    btnSelesaikan.disabled = true;
                    btnSelesaikan.style.background = "#334155";
                    btnSelesaikan.style.color = "#94a3b8";
                    btnSelesaikan.style.cursor = "not-allowed";
                    btnSelesaikan.innerText = "Upload Bukti Bayar Dulu ➔";
                }
            });

            methodQris.addEventListener("click", function() {
                methodQris.classList.add("active-method");
                methodTunai.classList.remove("active-method");
                dynamicPaymentArea.innerHTML = `
                    <p style="font-weight:700; font-size:12px; color:#fff; margin-bottom:2px;">Scan QRIS CIKUR Rubidotcom</p>
                    <p style="font-size:10px; color:#FFC107; font-weight:600; margin-bottom:6px; font-family:'JetBrains Mono',monospace;">NMID: ID1020035825931 (A01)</p>
                    <img src="KA_20260725_164929_0000.jpg" alt="QRIS CIKUR Rubidotcom">
                    <p style="font-size:10px; color:#94a3b8; margin-top:4px;">Transfer nominal pas, lalu upload bukti screenshot di bawah.</p>
                    
                    <div id="uploadContainer" style="margin-top:10px; text-align:left; border-top:1px dashed rgba(255,255,255,0.15); padding-top:8px;">
                        <label style="font-size:11px; font-weight:700; color:#fff; display:block; margin-bottom:4px;">Upload Bukti Transfer:</label>
                        <input type="file" id="fileBuktiQR2" accept="image/*" class="input-box" style="font-size:11px; padding:5px; background:rgba(255,255,255,0.04);">
                    </div>
                `;

                const currentBtnSelesai = document.getElementById("btnSelesaikan");
                const fileBuktiQR2 = document.getElementById("fileBuktiQR2");
                
                currentBtnSelesai.disabled = true;
                currentBtnSelesai.style.background = "#334155";
                currentBtnSelesai.style.color = "#94a3b8";
                currentBtnSelesai.style.cursor = "not-allowed";
                currentBtnSelesai.innerText = "Upload Bukti Bayar Dulu ➔";

                fileBuktiQR2.addEventListener("change", function() {
                    if(this.files && this.files.length > 0) {
                        currentBtnSelesai.disabled = false;
                        currentBtnSelesai.style.background = "#FFC107";
                        currentBtnSelesai.style.color = "#0f172a";
                        currentBtnSelesai.style.cursor = "pointer";
                        currentBtnSelesai.innerText = "Selesaikan Pesanan ✓";
                    }
                });
            });

            methodTunai.addEventListener("click", function() {
                methodTunai.classList.add("active-method");
                methodQris.classList.remove("active-method");
                
                dynamicPaymentArea.innerHTML = `
                    <div style="padding: 15px 5px; text-align:center;">
                        <h4 style="font-size:13px; color:#fff; margin-bottom:6px;">Pembayaran Tunai (COD)</h4>
                        <p style="font-size:11px; color:#94a3b8; line-height:1.4;">
                            Bayar tunai sebesar <b style="color:#FFC107;">${totalHargaText}</b> langsung kepada petugas di lokasi pada tanggal <b>${tanggal}</b>.
                        </p>
                        <p style="font-size:10px; font-weight:700; color:#10b981; margin-top:8px; font-family:'JetBrains Mono',monospace;">[STATUS: PAY AT LOCATION]</p>
                    </div>
                `;

                const currentBtnSelesai = document.getElementById("btnSelesaikan");
                currentBtnSelesai.disabled = false;
                currentBtnSelesai.style.background = "#FFC107";
                currentBtnSelesai.style.color = "#0f172a";
                currentBtnSelesai.style.cursor = "pointer";
                currentBtnSelesai.innerText = "Selesaikan Pesanan ✓";
            });

            // Tombol Final Selesaikan Pesanan
            document.addEventListener("click", function(e) {
                if(e.target && e.target.id === "btnSelesaikan") {
                    alert("[SUKSES] Transaksi modul " + info.nama + " tercatat di sistem!\nTerima kasih menggunakan CIKUR GO.");
                    assistantScreen.style.display = "none";
                    location.reload();
                }
            });
        });
    });
});
</script>
    
<script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
