<!-- ===========================
   JAVASCRIPT KODE MASTER v3.6
=========================== -->
<script>
let userProfile = JSON.parse(localStorage.getItem('cikur_user')) || {
    name: "CIKUR USER",
    phone: "08123456789",
    saldo: 125000,
    avatar: ""
};

function updateUIProfile() {
    document.getElementById("headerNamaUser").innerText = userProfile.name;
    document.getElementById("displaySaldo").innerText = "Rp " + userProfile.saldo.toLocaleString('id-ID');
    
    let avatarContainer = document.getElementById("headerAvatar");
    if(userProfile.avatar && userProfile.avatar.startsWith("data:image")) {
        avatarContainer.innerHTML = `<img src="${userProfile.avatar}" alt="Foto Profil">`;
    } else {
        let initials = userProfile.name.split(" ").map(n => n[0]).join("").substring(0,2).toUpperCase();
        avatarContainer.innerText = initials || "CK";
    }
}

window.addEventListener("DOMContentLoaded", () => {
    updateUIProfile();
    if(userProfile.name === "CIKUR USER") {
        setTimeout(bukaModalRegistrasi, 600);
    }
});

function bukaModalRegistrasi() {
    openModal("AKTIVASI AKUN CIKUR GO");
    modalMainContent.innerHTML = `
        <div style="text-align:center; margin-bottom:14px;">
            <div style="width:60px; height:60px; border-radius:50%; background:#fee2e2; border:2px solid #E50914; color:#E50914; font-size:20px; font-weight:800; display:flex; align-items:center; justify-content:center; margin:0 auto 8px;">GO</div>
            <h3 style="font-size:15px; font-weight:800; color:#0f172a;">Selamat Datang di CikurGo!</h3>
            <p style="font-size:11px; color:#64748b;">Masukkan identitas Anda untuk mengaktifkan seluruh layanan super-app.</p>
        </div>
        <div class="form-group">
            <label>Nama Lengkap / Panggilan</label>
            <input type="text" id="regName" class="input-box" placeholder="Contoh: Budi Santoso">
        </div>
        <div class="form-group">
            <label>Nomor WhatsApp / HP</label>
            <input type="text" id="regPhone" class="input-box" placeholder="Contoh: 08123456789">
        </div>
        <button class="btn-pesan-form" id="btnSimpanReg" style="margin-top:10px;">Mulai Sekarang ✓</button>
    `;

    document.getElementById("btnSimpanReg").addEventListener("click", () => {
        let nameVal = document.getElementById("regName").value.trim();
        let phoneVal = document.getElementById("regPhone").value.trim();
        if(!nameVal || !phoneVal) {
            alert("[!] Mohon isi nama dan nomor HP Anda.");
            return;
        }
        userProfile.name = nameVal;
        userProfile.phone = phoneVal;
        localStorage.setItem('cikur_user', JSON.stringify(userProfile));
        updateUIProfile();
        alert("[SUKSES] Akun Anda berhasil diaktifkan!");
        document.getElementById("assistantScreen").style.display = "none";
    });
}

// --- SLIDER UTAMA ---
const slides = document.querySelector(".slides");
const images = document.querySelectorAll(".slides img");
const dots = document.querySelectorAll(".dots span");
let current = 0;
function showSlide(index){
    slides.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach(dot => dot.classList.remove("active"));
    dots[index].classList.add("active");
}
setInterval(() => {
    current = (current + 1) % images.length;
    showSlide(current);
}, 4000);

// --- BOTPRESS CHAT ---
const chatBtn = document.getElementById("chatBtn");
chatBtn.addEventListener("click", () => {
    chatBtn.disabled = true;
    chatBtn.innerHTML = "Memuat...";
    setTimeout(() => {
        if(window.botpress) window.botpress.open();

const miniSlides = document.querySelector(".mini-slides");
const miniDots = document.querySelectorAll(".mini-dots span");
let miniCurrent = 0;
setInterval(() => {
    miniCurrent = (miniCurrent + 1) % miniDots.length;
    miniSlides.style.transform = `translateX(-${miniCurrent * 33.333}%)`;
    miniDots.forEach(d => d.classList.remove("active"));
    miniDots[miniCurrent].classList.add("active");
}, 7000);

const heroTrack = document.querySelector(".hero-big-track");
let heroIndex = 0;
setInterval(() => {

    heroTrack.style.transform = `translateX(-${heroIndex * 33.3333}%)`;
}, 9000);

// --- PENGATURAN PROFIL & FOTO ---
document.getElementById("btnOpenProfile").addEventListener("click", () => {
    openModal("PENGATURAN PROFIL & FOTO AKUN");
    let avatarPreviewHTML = userProfile.avatar ? `<img src="${userProfile.avatar}" style="width:100%; height:100%; object-fit:cover;">` : "CK";

    modalMainContent.innerHTML = `
        <div style="text-align:center; margin-bottom:16px;">
            <div style="width:75px; height:75px; border-radius:50%; background:#fee2e2; border:3px solid #E50914; color:#E50914; font-size:24px; font-weight:800; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; overflow:hidden;" id="modalAvatarPreviewBox">
                ${avatarPreviewHTML}
            </div>
            <h3 style="font-size:16px; color:#0f172a; font-weight:800;">${userProfile.name}</h3>
            <p style="font-size:12px; color:#64748b;">Member Aktif • CikurGo Core v3.6</p>
        </div>
        <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:16px; padding:14px; margin-bottom:14px;">
            <div class="form-group">
                <label>Ganti Foto Profil</label>
                <input type="file" id="inputFotoProfil" accept="image/*" class="input-box" style="font-size:11px; padding:6px; background:#fff;">
            </div>
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="inputNamaUser" class="input-box" value="${userProfile.name}">
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>Nomor WhatsApp / HP</label>
                <input type="text" id="inputPhoneUser" class="input-box" value="${userProfile.phone}">
            </div>
        </div>
        <button class="btn-pesan-form" id="btnSimpanProfil">Simpan Perubahan ✓</button>
    `;

    let temporaryAvatar = userProfile.avatar;
    document.getElementById("inputFotoProfil").addEventListener("change", function(e) {
        let file = e.target.files[0];
        if(file) {
            let reader = new FileReader();
            reader.onload = function(uploadEvent) {
                temporaryAvatar = uploadEvent.target.result;
                document.getElementById("modalAvatarPreviewBox").innerHTML = `<img src="${temporaryAvatar}" style="width:100%; height:100%; object-fit:cover;">`;
            };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById("btnSimpanProfil").addEventListener("click", () => {
        let newName = document.getElementById("inputNamaUser").value.trim();
        let newPhone = document.getElementById("inputPhoneUser").value.trim();
        if(!newName || !newPhone) {
            alert("[!] Nama dan No HP tidak boleh kosong.");
            return;
        }
        userProfile.name = newName;
        userProfile.phone = newPhone;
        userProfile.avatar = temporaryAvatar;
        localStorage.setItem('cikur_user', JSON.stringify(userProfile));
        updateUIProfile();
        alert("[SUKSES] Profil dan foto berhasil diperbarui!");
        assistantScreen.style.display = "none";
    });
});

// --- CIKURPAY & TOP-UP EKSTERNAL ---
document.getElementById("btnOpenWallet").addEventListener("click", () => {
    openModal("DOMPET CIKURPAY & TOP-UP");
    modalMainContent.innerHTML = `
        <div style="background:linear-gradient(135deg, #0f172a, #1e293b); border-radius:18px; padding:18px; color:#fff; text-align:center; margin-bottom:16px;">
            <p style="font-size:11px; color:#94a3b8; text-transform:uppercase; font-weight:700;">Saldo Aktif CikurPay</p>
            <h2 style="font-size:26px; font-weight:800; color:#FFD700; font-family:'JetBrains Mono', monospace; margin:6px 0;">Rp ${userProfile.saldo.toLocaleString('id-ID')}</h2>
            <p style="font-size:11px; color:#34d399; font-weight:600;">[Siap Integrasi DANA, GoPay, QRIS & Bank]</p>
        </div>
        <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:16px; padding:14px;">
            <p style="font-size:12px; font-weight:700; color:#0f172a; margin-bottom:10px;">Pilih Nominal Top-Up</p>
            <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:10px;">
                <button class="pay-method-option topup-gateway-btn active" data-val="50000">Rp 50rb</button>
                <button class="pay-method-option topup-gateway-btn" data-val="100000">Rp 100rb</button>
                <button class="pay-method-option topup-gateway-btn" data-val="200000">Rp 200rb</button>
            </div>
            <div class="form-group" style="margin-top:10px;">
                <label>Atau Masukkan Nominal Lain (Rp)</label>
                <input type="number" id="customTopupVal" class="input-box" placeholder="Contoh: 150000">
            </div>
            <button class="btn-pesan-form" id="btnProsesGateway" style="background:#E50914; margin-top:4px;">Top-Up via DANA / QRIS / Bank ⚡</button>
        </div>
    `;

    let selectedTopupAmount = 50000;
    document.querySelectorAll(".topup-gateway-btn").forEach(btn => {
        btn.addEventListener("click", function() {
            document.querySelectorAll(".topup-gateway-btn").forEach(b => b.classList.remove("active"));
            this.classList.add("active");
            selectedTopupAmount = parseInt(this.getAttribute("data-val"));
            document.getElementById("customTopupVal").value = "";
        });
    });

    document.getElementById("btnProsesGateway").addEventListener("click", () => {
        let customVal = document.getElementById("customTopupVal").value;
        let finalAmount = customVal ? parseInt(customVal) : selectedTopupAmount;

        if(!finalAmount || finalAmount < 10000) {
            alert("[!] Minimum top-up adalah Rp 10.000");
            return;
        }

        alert(`[SIMULASI GATEWAY API]\nMembuat transaksi top-up Rp ${finalAmount.toLocaleString('id-ID')} untuk ${userProfile.name}.`);

        setTimeout(() => {
            userProfile.saldo += finalAmount;
            localStorage.setItem('cikur_user', JSON.stringify(userProfile));
            updateUIProfile();
            alert(`[SUKSES] Top-up sebesar Rp ${finalAmount.toLocaleString('id-ID')} berhasil masuk ke CikurPay!`);
            assistantScreen.style.display = "none";
        }, 800);
    });
});

// --- MODUL LAYANAN ASSISTANT (CORE) ---
const btnAssistant = document.getElementById("btnAssistant");
btnAssistant.addEventListener("click", function(e){
    e.preventDefault();
    openModal("CIKUR GO ASSISTANT");
    modalMainContent.innerHTML = `
        <h3 class="paket-title">Silahkan pilih layanan</h3>
        <div class="paket-grid">
            <button class="paket-btn" data-paket="dine">
                <img src="icon-dine-in.png" alt="DINE">
                <span style="font-size:11px; font-weight:700; color:#334155; margin-bottom:4px;">Dine-In</span>
                <div class="indicator-line"></div>
            </button>
            <button class="paket-btn" data-paket="vip">
                <img src="icon-vip.png" alt="VIP">
                <span style="font-size:11px; font-weight:700; color:#334155; margin-bottom:4px;">VIP</span>
                <div class="indicator-line"></div>
            </button>
            <button class="paket-btn" data-paket="private">
                <img src="icon-private.png" alt="PRIVATE">
                <span style="font-size:11px; font-weight:700; color:#334155; margin-bottom:4px;">Private</span>
                <div class="indicator-line"></div>
            </button>
        </div>
        <div id="paketContent">
            <p style="text-align:center; color:#94a3b8; padding:20px; font-size:13px;">Silahkan pilih salah satu layanan di atas.</p>
        </div>
    `;

    const paketButtons = document.querySelectorAll(".paket-btn");
    const dynamicPaketContent = document.getElementById("paketContent");
    const dataPaket = {
        dine: { nama: "DINE-IN ASSISTANT", hargaBase: 25000, hargaStr: "Rp 25.000" },
        vip: { nama: "VIP ASSISTANT", hargaBase: 89000, hargaStr: "Rp 89.000" },
        private: { nama: "PRIVATE ASSISTANT", hargaBase: 349000, hargaStr: "Rp 349.000" }
    };

    paketButtons.forEach(btn => {
        btn.addEventListener("click", function() {
            paketButtons.forEach(b => b.classList.remove("selected"));
            this.classList.add("selected");
            const info = dataPaket[this.getAttribute("data-paket")];

            dynamicPaketContent.innerHTML = `
                <div class="form-group">
                    <label>Layanan Terpilih</label>
                    <div class="input-layanan">${info.nama}</div>
                </div>
                <div class="row-grid form-group">
                    <div class="col-half">
                        <label>Pemesan</label>
                        <input type="text" class="input-box" value="${userProfile.name}" disabled style="background:#f1f5f9; font-weight:700;">
                    </div>
                    <div class="col-half">
                        <label>No. WhatsApp</label>
                        <input type="text" class="input-box" value="${userProfile.phone}" disabled style="background:#f1f5f9; font-weight:700;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Jadwal Tanggal</label>
                    <input type="date" class="input-box" id="inputTanggal">
                </div>
                <div class="form-group">
                    <label>Lokasi / Alamat</label>
                    <textarea class="input-box" id="inputLokasi" placeholder="Alamat lengkap..."></textarea>
                </div>
                <div class="form-group">
                    <label>Catatan Khusus</label>
                    <textarea class="input-box" id="inputCatatanRequest" placeholder="Instruksi khusus..."></textarea>
                </div>
                <div class="total-box">
                    <span class="total-label">Total Tagihan :</span>
                    <span class="total-value">${info.hargaStr}</span>
                </div>
                <button class="btn-pesan-form" id="btnLanjutBayar">Lanjut Pembayaran ➔</button>
            `;

            document.getElementById("btnLanjutBayar").addEventListener("click", () => {
                const tanggal = document.getElementById("inputTanggal").value;
                const lokasi = document.getElementById("inputLokasi").value;

                if (!tanggal || !lokasi) {
                    alert("[!] Mohon lengkapi Tanggal dan Lokasi.");
                    return;
                }

                // Tampilan Opsi Pembayaran Lengkap: CikurPay, QRIS, & Tunai
                dynamicPaketContent.innerHTML = `
                    <h3 class="paket-title" style="margin-bottom:10px;">Metode Pembayaran</h3>
                    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:16px; padding:12px; margin-bottom:12px;">
                        <div style="display:flex; gap:6px; margin-bottom:12px;">
                            <button class="pay-method-option active" data-method="cikurpay">CikurPay</button>
                            <button class="pay-method-option" data-method="qris">QRIS</button>
                            <button class="pay-method-option" data-method="tunai">Tunai</button>
                        </div>

                        <!-- Panel Konten Pembayaran Dinamis -->
                        <div id="paymentDetailsContainer">
                            <div style="font-size:12px; color:#64748b; margin-bottom:8px;">Saldo CikurPay: <strong style="color:#0f172a;">Rp ${userProfile.saldo.toLocaleString('id-ID')}</strong></div>
                            <button class="btn-pesan-form" id="btnEksekusiBayar" style="background:#0f172a;">Bayar dengan CikurPay ⚡</button>
                        </div>
                    </div>
                `;

                let selectedPaymentMethod = "cikurpay";
                const methodButtons = document.querySelectorAll(".pay-method-option");
                const paymentDetailsContainer = document.getElementById("paymentDetailsContainer");

                methodButtons.forEach(mBtn => {
                    mBtn.addEventListener("click", function() {
                        methodButtons.forEach(b => b.classList.remove("active"));
                        this.classList.add("active");
                        selectedPaymentMethod = this.getAttribute("data-method");

                        if(selectedPaymentMethod === "cikurpay") {
                            paymentDetailsContainer.innerHTML = `
                                <div style="font-size:12px; color:#64748b; margin-bottom:8px;">Saldo CikurPay: <strong style="color:#0f172a;">Rp ${userProfile.saldo.toLocaleString('id-ID')}</strong></div>
                                <button class="btn-pesan-form" id="btnEksekusiBayar" style="background:#0f172a;">Bayar dengan CikurPay ⚡</button>
                            `;
                            bindBayarAction();
                        } else if(selectedPaymentMethod === "qris") {
                            paymentDetailsContainer.innerHTML = `
                                <div style="text-align:center; margin-bottom:8px;">
                                    <p style="font-size:11px; color:#64748b; margin-bottom:8px;">Scan QRIS di bawah untuk membayar ${info.hargaStr}</p>
                                    <img src="qris.png" alt="QRIS CikurGo" style="width:160px; height:160px; object-fit:contain; border:1px solid #cbd5e1; border-radius:12px; padding:6px; background:#fff; margin:0 auto; display:block;">
                                </div>
                                <button class="btn-pesan-form" id="btnEksekusiBayar" style="background:#E50914; margin-top:8px;">Konfirmasi Bayar QRIS ✓</button>
                            `;
                            bindBayarAction();
                        } else if(selectedPaymentMethod === "tunai") {
                            paymentDetailsContainer.innerHTML = `
                                <div style="font-size:12px; color:#64748b; margin-bottom:8px; text-align:center;">Pembayaran dilakukan secara <strong>Tunai</strong> langsung kepada petugas/asisten di lokasi.</div>
                                <button class="btn-pesan-form" id="btnEksekusiBayar" style="background:#E50914; margin-top:4px;">Pesan dengan Pembayaran Tunai ✓</button>
                            `;
                            bindBayarAction();
                        }
                    });
                });

                function bindBayarAction() {
                    document.getElementById("btnEksekusiBayar").addEventListener("click", () => {
                        if(selectedPaymentMethod === "cikurpay") {
                            if (userProfile.saldo < info.hargaBase) {
                                alert("[!] Saldo CikurPay kurang. Silakan lakukan Top-Up terlebih dahulu.");
                                return;
                            }
                            userProfile.saldo -= info.hargaBase;
                            localStorage.setItem('cikur_user', JSON.stringify(userProfile));
                            updateUIProfile();
                        }

                        let invoiceNo = "INV/CGO/" + Math.floor(100000 + Math.random() * 900000);
                        let statusBayarLabel = selectedPaymentMethod === "tunai" ? "MENUNGGU PEMBAYARAN TUNAI" : "LUNAS (" + selectedPaymentMethod.toUpperCase() + ")";

                        modalMainContent.innerHTML = `
                            <div class="invoice-card">
                                <div class="invoice-header">
                                    <h3>CIKUR GO INVOICE</h3>
                                    <p style="font-size:10px; color:#64748b;">Status: ${statusBayarLabel}</p>
                                </div>
                                <div class="invoice-row"><span>No. Invoice</span><span>${invoiceNo}</span></div>
                                <div class="invoice-row"><span>Nama</span><span>${userProfile.name}</span></div>
                                <div class="invoice-row"><span>Layanan</span><span>${info.nama}</span></div>
                                <div class="invoice-row"><span>Metode Bayar</span><span>${selectedPaymentMethod.toUpperCase()}</span></div>
                                <div class="invoice-row" style="border-top:1px dashed #cbd5e1; margin-top:8px; padding-top:6px;">
                                    <span style="font-weight:800; color:#0f172a;">Total Tagihan</span>
                                    <span style="font-weight:800; color:#E50914; font-size:14px;">${info.hargaStr}</span>
                                </div>
                            </div>
                            <button class="btn-pesan-form" id="btnTutupInvoice">Selesai ✓</button>
                        `;
                        document.getElementById("btnTutupInvoice").addEventListener("click", () => {
                            assistantScreen.style.display = "none";
                        });
                    });
                }

                // Initial bind untuk default method (CikurPay)
                bindBayarAction();
            });
        });
    });
});
