<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIKUR GO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:radial-gradient(circle at center,#2d2d2d 0%,#111 100%);
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    overflow-x:hidden;
    overflow-y:auto;
}

/* ===========================
   LAYOUT UTAMA
=========================== */
.container{
    width:100%;
    max-width:440px;
    margin:0 auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.hero-tag{
    display:inline-block;
    padding:8px 22px;
    margin:0 auto 14px;
    border-radius:999px;
    background:rgba(255,193,7,.15);
    border:1px solid rgba(255,193,7,.35);
    color:#FFC107;
    font-size:14px;
    font-weight:700;
}

.hero-title{
    font-size:24px;
    font-weight:800;
    color:#fff;
    margin:0 0 10px;
}

.hero-desc{
    font-size:15px;
    line-height:1.55;
    color:#ececec;
    margin:0 0 8px;
}

.hero-info{
    font-size:13px;
    line-height:1.5;
    color:#bdbdbd;
    margin:0 0 12px;
}

/* ===== Tombol Utama ===== */
button{
    width:100%;
    height:52px;
    border:none;
    border-radius:40px;
    margin:8px 0 18px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(90deg,#FFC107,#FFD95A);
    color:#111;
    transition:.3s;
    box-shadow:0 10px 25px rgba(255,193,7,.25);
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 30px rgba(255,193,7,.35);
}

/* ===== Footer ===== */
footer{
    text-align:center;
    margin-top:auto;
    padding:8px 0 4px;
    color:#bdbdbd;
    font-size:12px;
    line-height:1.4;
}

footer p{
    margin:0;
}

/* =========================
   ANIMATION
=========================== */
@keyframes robotFloat{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
}

/* ===========================
   MENU PREMIUM
=========================== */
.menu-grid{
    display:flex;
    justify-content:space-evenly;
    align-items:center;
    gap:15px;
    margin:10px 0 20px;
}

.menu-item{
    width:90px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
    transition:.35s;
    cursor:pointer;
}

.menu-item img{
    width:85px;
    height:85px;
    object-fit:contain;
    display:block;
    animation:robotFloat 3.5s ease-in-out infinite;
    filter:
        drop-shadow(0 0 10px rgba(255,215,120,.65))
        drop-shadow(0 0 22px rgba(255,193,7,.28));
    transition:.35s;
}

.menu-item:hover img{
    transform:translateY(-6px) scale(1.06);
    filter:
        drop-shadow(0 0 14px rgba(255,215,120,.8))
        drop-shadow(0 0 28px rgba(255,193,7,.45));
}

.menu-item:active img{
    transform:scale(.97);
}

/* ===========================
   HERO FRAME & BANNER BESAR
=========================== */
.hero-frame{
    position:relative;
    margin-bottom:20px;
    padding:10px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:30px;
    background:rgba(255,255,255,.02);
    box-shadow:0 10px 24px rgba(0,0,0,.30);
    overflow:hidden;
}

.hero-big{
    width:100%;
    aspect-ratio: 16 / 10;
    overflow:hidden;
    border-radius:20px;
    position:relative;
    margin-bottom:10px;
    z-index:1;
    background:#111;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
}

.hero-big-track{
    display:flex;
    width:300%;
    height:100%;
    transition:transform 0.8s cubic-bezier(.22,.61,.36,1);
}

.hero-big-track img{
    width:33.3333%;
    height:100%;
    object-fit:contain;
    background-color:#f0f4f8;
    object-position:center center;
    flex-shrink:0;
    display:block;
}

/* ================= MINI BANNER ================= */
.mini-slider{
    position:relative;
    z-index:2;
    width:100%;
    aspect-ratio:16 / 5;
    margin:14px auto 6px;
    overflow:hidden;
    border-radius:18px;
    box-shadow:0 4px 10px rgba(0,0,0,.16);
}

.mini-slides{
    display:flex;
    width:300%;
    height:100%;
    transition:transform .95s cubic-bezier(.22,.61,.36,1);
}

.mini-slides img{
    width:33.3333%;
    height:100%;
    flex-shrink:0;
    object-fit:cover;
    object-position:center center;
    display:block;
}

.mini-dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:6px;
}

.mini-dots span{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#666;
    transition:.3s;
}

.mini-dots span.active{
    background:#FFC107;
}

/* ================= SLIDER UTAMA ================= */
.hero-banner{
    width:100%;
    margin:12px auto 14px;
}

.slider{
    width:100%;
    aspect-ratio:16/7;
    overflow:hidden;
    position:relative;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.16);
    background:#1d1d1d;
    box-shadow:0 6px 16px rgba(0,0,0,.22);
    cursor:pointer;
}

.slides{
    display:flex;
    transition:transform .7s ease-in-out;
    height:100%;
}

.slides img{
    width:100%;
    height:100%;
    min-width:100%;
    display:block;
    object-fit:cover;
}

.dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:8px;
    margin-bottom:4px;
}

.dots span{
    width:10px;
    height:10px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    transition:.35s;
}

.dots span.active{
    width:24px;
    height:10px;
    border-radius:20px;
    background:#FFC107;
    box-shadow:0 0 10px rgba(255,193,7,.4);
}

/* ===========================
   ASSISTANT SCREEN / MODAL
=========================== */
.assistant-screen{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    z-index:99999;
    backdrop-filter:blur(5px);
}

.assistant-page{
    position:absolute;
    top:90px;
    left:0;
    right:0;
    bottom:0;
    background:#ffffff;
    color:#111;
    border-radius:28px 28px 0 0;
    border:2px solid #d8a400;
    box-shadow:0 -8px 30px rgba(0,0,0,.25);
    overflow-y:auto;
}

.assistant-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:65px;
    padding:15px 20px;
    border-bottom:3px solid #d4a514;
    font-weight:700;
    font-size:16px;
    color:#111;
}

.assistant-top button, #closeAssistant{
    width:38px;
    height:38px;
    border:none;
    border-radius:50%;
    background:#111;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    transition:transform 0.2s ease, background 0.2s ease;
    margin:0;
}

.assistant-top button:hover, #closeAssistant:hover{
    background:#333;
    transform:scale(1.05);
}

.assistant-content{
    padding:20px 15px 30px 15px;
}

.paket-title{
    text-align:center;
    margin-bottom:15px;
    font-size:18px;
    font-weight:700;
    color:#111;
}

.paket-grid{
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
    gap:10px;
    margin-bottom:20px;
}

.paket-btn{
    background:transparent;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:none;
    height:auto;
    width:auto;
    -webkit-tap-highlight-color:transparent;
    position:relative;
}

.paket-btn:focus, 
.paket-btn:active {
    outline:none;
    background:transparent;
    box-shadow:none;
}

.paket-btn img{
    width:85px;
    display:block;
    background:transparent;
    transition:.3s;
    margin-bottom:6px;
}

.paket-btn img:hover{
    transform:scale(1.05);
}

/* Garis Indikator Emas di Bawah Icon Aktif */
.indicator-line {
    width: 0%;
    height: 4px;
    background: #d8a400;
    border-radius: 4px;
    transition: width 0.3s ease;
}

.paket-btn.selected .indicator-line {
    width: 100%;
}

/* ===========================
   FORM PEMESANAN (Full Width / Luas)
=========================== */
#paketContent {
    border: 2px solid #d8a400;
    border-radius: 20px;
    padding: 18px 15px;
    background: #fffdf5;
    margin-top: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    text-align: left;
}

.paket-kosong{
    text-align:center;
    color:#777;
    padding:35px 10px;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #111;
    margin-bottom: 5px;
}

.input-layanan {
    width: 100%;
    padding: 12px;
    background: #ffffff;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 800;
    color: #d8a400;
    text-align: center;
    letter-spacing: 1px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
}

.row-grid {
    display: flex;
    gap: 10px;
}

.col-half {
    flex: 1;
}

.input-box {
    width: 100%;
    padding: 10px 12px;
    background: #ffffff;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    color: #111;
}

.input-box.harga-text {
    color: #111;
    font-weight: 700;
}

.extra-row {
    display: flex;
    gap: 6px;
}

.input-number {
    width: 60px;
    padding: 10px 5px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
}

.form-hint {
    font-size: 10px;
    color: #888;
    margin-top: 3px;
    display: block;
}

textarea.input-box {
    resize: none;
    height: 65px;
}

textarea.textarea-besar {
    height: 90px;
}

.rincian-box {
    background: #fff;
    border: 1px dashed #d8a400;
    border-radius: 12px;
    padding: 12px 15px;
    margin-top: 15px;
    margin-bottom: 12px;
}

.rincian-item {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
}

.rincian-item.extra-detail {
    color: #d8a400;
    font-weight: 600;
    border-top: 1px solid #eee;
    padding-top: 6px;
}

.total-box {
    background: #111;
    color: #fff;
    padding: 12px 15px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.total-label {
    font-size: 14px;
    font-weight: 600;
    color: #ddd;
}

.total-value {
    font-size: 18px;
    font-weight: 800;
    color: #FFC107;
}

.payment-method-grid {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.pay-method-btn {
    flex: 1;
    padding: 10px;
    border: 2px solid #ccc;
    border-radius: 10px;
    background: #fff;
    font-size: 13px;
    font-weight: 700;
    color: #333;
    cursor: pointer;
    text-align: center;
    transition: 0.3s;
    height: auto;
    margin: 0;
    box-shadow: none;
}

.pay-method-btn.active-method {
    border-color: #d8a400;
    background: #fffdf5;
    color: #d8a400;
}

.result-payment-box {
    background: #fff;
    border: 2px solid #d8a400;
    border-radius: 14px;
    padding: 15px;
    text-align: center;
    margin-top: 15px;
}

.result-payment-box img {
    width: 170px;
    height: 170px;
    object-fit: contain;
    margin: 8px auto;
    display: block;
    border-radius: 8px;
}

.btn-pesan-form {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 24px;
    background: #FFC107;
    color: #111;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 5px;
    transition: 0.3s;
    box-shadow: 0 4px 12px rgba(255,193,7,0.3);
}

.btn-pesan-form:hover {
    background: #e0a800;
}

/* ===========================
   MEDIA QUERY DESKTOP
=========================== */
@media screen and (min-width: 768px) {
    body {
        align-items: center;
        padding: 30px;
    }
    .container {
        max-width: 480px;
        padding: 25px;
        border-radius: 32px;
    }
    .menu-item img {
        width: 95px;
        height: 95px;
    }
}
</style>
</head>
    
<body>

<div class="container">
    <div class="hero-frame">
        <!-- ===== HERO BANNER BESAR ===== -->
        <div class="hero-big">
            <div class="hero-big-track">
                <img src="hero-banner1.png" alt="Hero 1">
                <img src="hero-banner2.png" alt="Hero 2">
                <img src="hero-banner3.png" alt="Hero 3">
            </div>
        </div>

        <!-- MINI BANNER -->
        <div class="mini-slider">

                <img src="banner-mini-assistant.png" alt="Mini Assistant">

            </div>
        </div>

        <div class="mini-dots">
            <span class="active"></span>
            <span></span>
            <span></span>
        </div>  
    </div>  

    <!-- MENU GRID -->
    <div class="menu-grid">
        <a id="btnAssistant" class="menu-item">
            <img src="tombol-assistant.png" class="assistant-icon" alt="ASSISTANT">
        </a>
        <a id="btnFood" class="menu-item">
            <img src="tombol-food.png" alt="FOOD">
        </a>
        <a id="btnRide" class="menu-item">
            <img src="tombol-ride.png" alt="RIDE">
        </a>
    </div>
    
    <!-- SLIDER UTAMA -->
    <div class="hero-banner">
        <div class="slider">
            <div class="slides">
                <img src="bannercgo1.png" alt="Banner 1">
                <img src="bannercgo2.png" alt="Banner 2">
                <img src="bannercgo3.png" alt="Banner 3">

        </div>
        <div class="dots">

            <span></span>
        </div>

    <div class="hero-tag">

    </div>

    <h2 class="hero-title">
        CIKUR GO ASSISTANT
    </h2>

    <p class="hero-desc">
        Pendamping profesional untuk aktivitas harian Anda.
    </p>

    <p class="hero-info">
        Didukung oleh <strong>CIKUR GO FOOD</strong> dan
        <strong>CIKUR GO RIDE</strong> dalam satu ekosistem.
    </p>  

    <button id="chatBtn">
        💬 Mulai Chat
    </button>

    <footer>
        <p>© 2026 CIKUR GO</p>
        <p>Pasti Mudah, Pasti Nyaman.</p>
    </footer>
</div>
    
<!-- ===== ASSISTANT SCREEN / MODAL ===== -->
<div id="assistantScreen" class="assistant-screen">
    <div class="assistant-page">
        <div class="assistant-top">
            <span>CIKUR GO ASSISTANT</span>
            <button id="closeAssistant">✕</button>
        </div>
        <div class="assistant-content">
            <h3 class="paket-title">Pilih Paket Layanan</h3>

            <div class="paket-grid">
                <button class="paket-btn" id="btnDine" data-paket="dine">
                    <img src="icon-dine-in.png" alt="DINE-IN">
                    <div class="indicator-line"></div>
                </button>
                <button class="paket-btn" id="btnVip" data-paket="vip">
                    <img src="icon-vip.png" alt="VIP">
                    <div class="indicator-line"></div>
                </button>
                <button class="paket-btn" id="btnPrivate" data-paket="private">
                    <img src="icon-private.png" alt="PRIVATE">
                    <div class="indicator-line"></div>
                </button>
            </div>
            
            <!-- FORM PEMESANAN DI BAWAH (FULL WIDTH / LUAS) -->
            <div id="paketContent">
                <p class="paket-kosong">
                    Silakan pilih salah satu paket di atas.
                </p>
            </div>
        </div>
    </div>
</div>
    
<!-- ===========================
   JAVASCRIPT SECTION
=========================== -->
<script>
// Slider Utama
const slides = document.querySelector(".slides");
const images = document.querySelectorAll(".slides img");
const dots = document.querySelectorAll(".dots span");
const slider = document.querySelector(".slider");
let current = 0;
const total = images.length;

function showSlide(index){
    slides.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach(dot => dot.classList.remove("active"));
    dots[index].classList.add("active");
}

function nextSlide(){
    current++;
    if(current >= total){
        current = 0;
    }
    showSlide(current);
}
let slideInterval = setInterval(nextSlide, 4000);

// Swipe Slider Utama
let startX = 0;
let endX = 0;

slider.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
});

slider.addEventListener("touchend", (e) => {
    endX = e.changedTouches[0].clientX;
    if(startX - endX > 50){
        current++;
        if(current >= total) current = 0;
        showSlide(current);
    }
    if(endX - startX > 50){
        current--;
        if(current < 0) current = total - 1;
        showSlide(current);
    }
});

// Klik Slider Utama
slider.addEventListener("click", () => {
    if(current === 0){
        window.location.href = "assistant.html";
    } else if(current === 1){
        window.location.href = "food.html";
    } else {
        window.location.href = "ride.html";
    }
});

// Botpress Chat Button
const chatBtn = document.getElementById("chatBtn");
chatBtn.addEventListener("click", () => {
    chatBtn.disabled = true;
    chatBtn.innerHTML = "Membuka CIKUR GO...";
    setTimeout(() => {
        if(window.botpress){
            window.botpress.open();
        }
        chatBtn.disabled = false;
        chatBtn.innerHTML = "💬 Mulai Chat";
    }, 500);
});

// Mini Banner Slider
const miniSlides = document.querySelector(".mini-slides");
const miniDots = document.querySelectorAll(".mini-dots span");
let miniCurrent = 0;
const miniTotal = miniDots.length;

function miniShow(index){
    miniSlides.style.transform = `translateX(-${index * 33.333}%)`;
    miniDots.forEach(dot => dot.classList.remove("active"));
    miniDots[index].classList.add("active");
}

function miniNext(){
    miniCurrent++;
    if(miniCurrent >= miniTotal){
        miniCurrent = 0;
    }
    miniShow(miniCurrent);
}
miniShow(0);
setInterval(miniNext, 7000);

// Hero Big Banner Slider
const heroTrack = document.querySelector(".hero-big-track");
let heroIndex = 0;

function heroSlide(){
    heroIndex++;
    if(heroIndex >= 3){
        heroIndex = 0;
    }
    heroTrack.style.transform = `translateX(-${heroIndex * 33.3333}%)`;
}
setInterval(heroSlide, 9000);

// Assistant Screen Modal Handler
const btnAssistant = document.getElementById("btnAssistant");
const assistantScreen = document.getElementById("assistantScreen");
const closeAssistant = document.getElementById("closeAssistant");

btnAssistant.addEventListener("click", function(e){
    e.preventDefault();
    assistantScreen.style.display = "block";
});

closeAssistant.addEventListener("click", function(){
    assistantScreen.style.display = "none";
});

assistantScreen.addEventListener("click", function(e){
    e.target === assistantScreen && (assistantScreen.style.display = "none");
});

// Interaktif Klik Icon Paket & Form Pemesanan
const paketButtons = document.querySelectorAll(".paket-btn");
const paketContent = document.getElementById("paketContent");

const dataPaket = {
    dine: {
        nama: "DINE-IN",
        hargaBase: 25000,
        hargaStr: "Rp 25.000,-"
    },
    vip: {
        nama: "VIP",
        hargaBase: 89000,
        hargaStr: "Rp 89.000,-"
    },
    private: {
        nama: "PRIVATE",
        hargaBase: 349000,
        hargaStr: "Rp 349.000,-"
    }
};

paketButtons.forEach(btn => {
    btn.addEventListener("click", function() {
        paketButtons.forEach(b => b.classList.remove("selected"));
        this.classList.add("selected");

        const jenis = this.getAttribute("data-paket");
        const info = dataPaket[jenis];

        paketContent.innerHTML = `
            <div class="form-group">
                <label>Layanan Assistant</label>
                <div class="input-layanan">${info.nama}</div>
            </div>

            <div class="row-grid form-group">
                <div class="col-half">
                    <label>Harga Utama</label>
                    <div class="input-box harga-text">${info.hargaStr}</div>
                </div>
                <div class="col-half">
                    <label>Extra Waktu</label>
                    <div class="extra-row">
                        <input type="number" id="extraWaktu" class="input-number" value="0" min="0">
                        <div class="input-box harga-text" style="text-align:center; background:#f5f5f5; font-size:13px;">Rp 25rb/30m</div>
                    </div>
                    <span class="form-hint">*Isi angka jika tambah waktu</span>
                </div>
            </div>

            <div class="form-group">
                <label>Tanggal</label>
                <input type="date" class="input-box">
            </div>

            <div class="form-group">
                <label>Lokasi</label>
                <textarea class="input-box" placeholder="Alamat lengkap & Link google maps"></textarea>
                <span class="form-hint">*Alamat lengkap & Link google maps</span>
            </div>

            <div class="form-group">
                <label>Catatan :</label>
                <textarea class="input-box textarea-besar" placeholder="Tambahkan catatan khusus..."></textarea>
            </div>

            <div class="rincian-box">
                <div class="rincian-item">
                    <span>Harga ${info.nama}:</span>
                    <span>${info.hargaStr}</span>
                </div>
                <div id="rincianExtraRow" class="rincian-item extra-detail" style="display: none;">
                    <span id="labelExtraText">Extra Waktu (0x):</span>
                    <span id="nilaiExtraText">Rp 0,-</span>
                </div>
            </div>

            <div class="total-box">
                <span class="total-label">Total Pembayaran :</span>
                <span id="totalHarga" class="total-value">${info.hargaStr}</span>
            </div>

            <button class="btn-pesan-form" id="btnProsesBayar">Lanjut Pembayaran ➔</button>
        `;

        // Logika Extra Waktu Realtime
        const extraInput = document.getElementById("extraWaktu");
        const totalHargaEl = document.getElementById("totalHarga");
        const rincianExtraRow = document.getElementById("rincianExtraRow");
        const labelExtraText = document.getElementById("labelExtraText");
        const nilaiExtraText = document.getElementById("nilaiExtraText");

        let currentTotalValue = info.hargaBase;

        extraInput.addEventListener("input", function() {
            let qty = parseInt(this.value) || 0;
            if(qty < 0) { qty = 0; this.value = 0; }

            let biayaExtra = qty * 25000;
            currentTotalValue = info.hargaBase + biayaExtra;

            totalHargaEl.innerText = "Rp " + currentTotalValue.toLocaleString('id-ID') + ",-";

            if(qty > 0) {
                rincianExtraRow.style.display = "flex";
                labelExtraText.innerText = `Extra Waktu (${qty}x @Rp 25rb):`;
                nilaiExtraText.innerText = "Rp " + biayaExtra.toLocaleString('id-ID') + ",-";
            } else {
                rincianExtraRow.style.display = "none";
            }
        });

        // Event Klik Tombol Lanjut Pembayaran (Muncul QRIS / Tunai)
        document.getElementById("btnProsesBayar").addEventListener("click", function() {
            const tanggal = paketContent.querySelector("input[type='date']").value;
            const lokasi = paketContent.querySelector("textarea[placeholder*='Alamat']").value;
            const totalHargaText = totalHargaEl.innerText;

            if (!tanggal || !lokasi) {
                alert("Mohon isi Tanggal dan Lokasi terlebih dahulu!");
                return;
            }

            // Ganti isi form menjadi pilihan metode pembayaran QRIS CIKUR Rubidotcom
            paketContent.innerHTML = `
                <h3 class="paket-title" style="margin-bottom:8px;">Pilih Metode Pembayaran</h3>
                <p style="font-size:12px; text-align:center; color:#555; margin-bottom:12px;">
                    Total Tagihan Anda: <strong style="color:#d8a400; font-size:16px;">${totalHargaText}</strong>
                </p>

                <div class="payment-method-grid">
                    <button type="button" class="pay-method-btn active-method" id="methodQris">📱 QRIS CIKUR</button>
                    <button type="button" class="pay-method-btn" id="methodTunai">💵 Bayar Tunai</button>
                </div>

                <div id="dynamicPaymentArea" class="result-payment-box">
                    <p style="font-weight:700; font-size:13px; color:#111; margin-bottom:3px;">Scan QRIS CIKUR Rubidotcom</p>
                    <p style="font-size:11px; color:#d8a400; font-weight:600; margin-bottom:8px;">NMID: ID1020035825931 (A01)</p>
                    <!-- Menampilkan Gambar QRIS Asli Anda -->
                    <img src="qr_ID1020035825931_05.07.26_1783225465_1783225465366.jpeg" alt="QRIS CIKUR Rubidotcom">
                    <p style="font-size:11px; color:#555; margin-top:6px;">Masukkan nominal sesuai total tagihan saat scan.</p>
                </div>

                <button class="btn-pesan-form" id="btnSelesaikan" style="margin-top:12px; background:#28a745; color:#fff;">Selesaikan Pesanan ✓</button>
            `;

            // Interaktif Ganti Metode Pembayaran di Dalam Form
            const methodQris = document.getElementById("methodQris");
            const methodTunai = document.getElementById("methodTunai");
            const dynamicPaymentArea = document.getElementById("dynamicPaymentArea");

            methodQris.addEventListener("click", function() {
                methodQris.classList.add("active-method");
                methodTunai.classList.remove("active-method");
                dynamicPaymentArea.innerHTML = `
                    <p style="font-weight:700; font-size:13px; color:#111; margin-bottom:3px;">Scan QRIS CIKUR Rubidotcom</p>
                    <p style="font-size:11px; color:#d8a400; font-weight:600; margin-bottom:8px;">NMID: ID1020035825931 (A01)</p>
                    <img src="qr_ID1020035825931_05.07.26_1783225465_1783225465366.jpeg" alt="QRIS CIKUR Rubidotcom">
                    <p style="font-size:11px; color:#555; margin-top:6px;">Masukkan nominal sesuai total tagihan saat scan.</p>
                `;
            });

            methodTunai.addEventListener("click", function() {
                methodTunai.classList.add("active-method");
                methodQris.classList.remove("active-method");
                dynamicPaymentArea.innerHTML = `
                    <div style="padding: 25px 5px; text-align:center;">
                        <h4 style="font-size:15px; color:#111; margin-bottom:8px;">Pembayaran Tunai (COD)</h4>
                        <p style="font-size:12px; color:#555; line-height:1.5;">
                            Silakan lakukan pembayaran tunai sebesar <b>${totalHargaText}</b> langsung kepada petugas di lokasi pada tanggal <b>${tanggal}</b>.
                        </p>
                        <p style="font-size:11px; font-weight:600; color:#d8a400; margin-top:12px;">Status: Bayar di Lokasi</p>
                    </div>
                `;
            });

            // Tombol Final Selesaikan Pesanan
            document.getElementById("btnSelesaikan").addEventListener("click", function() {
                alert("🎉 Pesanan layanan " + info.nama + " berhasil dibuat!\nTerima kasih telah memesan di CIKUR GO.");
                assistantScreen.style.display = "none";
                location.reload();
            });
        });
    });
});
</script>
