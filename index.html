<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIKUR GO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:radial-gradient(circle at center,#2d2d2d 0%,#111 100%);
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    overflow-x:hidden;
    overflow-y:auto;
}

/* ===========================
   LAYOUT UTAMA
=========================== */
.container{
    width:100%;
    max-width:440px;
    margin:0 auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.hero-tag{
    display:inline-block;
    padding:8px 22px;
    margin:0 auto 14px;
    border-radius:999px;
    background:rgba(255,193,7,.15);
    border:1px solid rgba(255,193,7,.35);
    color:#FFC107;
    font-size:14px;
    font-weight:700;
}

.hero-title{
    font-size:24px;
    font-weight:800;
    color:#fff;
    margin:0 0 10px;
}

.hero-desc{
    font-size:15px;
    line-height:1.55;
    color:#ececec;
    margin:0 0 8px;
}

.hero-info{
    font-size:13px;
    line-height:1.5;
    color:#bdbdbd;
    margin:0 0 12px;
}

/* ===== Tombol Utama ===== */
button{
    width:100%;
    height:52px;
    border:none;
    border-radius:40px;
    margin:8px 0 18px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(90deg,#FFC107,#FFD95A);
    color:#111;
    transition:.3s;
    box-shadow:0 10px 25px rgba(255,193,7,.25);
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 30px rgba(255,193,7,.35);
}

/* ===== Footer ===== */
footer{
    text-align:center;
    margin-top:auto;
    padding:8px 0 4px;
    color:#bdbdbd;
    font-size:12px;
    line-height:1.4;
}

footer p{
    margin:0;
}

/* =========================
   ANIMATION
=========================== */
@keyframes robotFloat{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
}

/* ===========================
   MENU PREMIUM
=========================== */
.menu-grid{
    display:flex;
    justify-content:space-evenly;
    align-items:center;
    gap:15px;
    margin:10px 0 20px;
}

.menu-item{
    width:90px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
    transition:.35s;
    cursor:pointer;
}

.menu-item img{
    width:85px;
    height:85px;
    object-fit:contain;
    display:block;
    animation:robotFloat 3.5s ease-in-out infinite;
    filter:
        drop-shadow(0 0 10px rgba(255,215,120,.65))
        drop-shadow(0 0 22px rgba(255,193,7,.28));
    transition:.35s;
}

.menu-item:hover img{
    transform:translateY(-6px) scale(1.06);
    filter:
        drop-shadow(0 0 14px rgba(255,215,120,.8))
        drop-shadow(0 0 28px rgba(255,193,7,.45));
}

.menu-item:active img{
    transform:scale(.97);
}

/* ===========================
   HERO FRAME & BANNER BESAR
=========================== */
.hero-frame{
    position:relative;
    margin-bottom:20px;
    padding:10px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:30px;
    background:rgba(255,255,255,.02);
    box-shadow:0 10px 24px rgba(0,0,0,.30);
    overflow:hidden;
}

.hero-big{
    width:100%;
    aspect-ratio: 16 / 10;
    overflow:hidden;
    border-radius:20px;
    position:relative;
    margin-bottom:10px;
    z-index:1;
    background:#111;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
}

.hero-big-track{
    display:flex;
    width:300%;
    height:100%;
    transition:transform 0.8s cubic-bezier(.22,.61,.36,1);
}

.hero-big-track img{
    width:33.3333%;
    height:100%;
    object-fit:contain;
    background-color:#f0f4f8;
    object-position:center center;
    flex-shrink:0;
    display:block;
}

/* ================= MINI BANNER ================= */
.mini-slider{
    position:relative;
    z-index:2;
    width:100%;
    aspect-ratio:16 / 5;
    margin:14px auto 6px;
    overflow:hidden;
    border-radius:18px;
    box-shadow:0 4px 10px rgba(0,0,0,.16);
}

.mini-slides{
    display:flex;
    width:300%;
    height:100%;
    transition:transform .95s cubic-bezier(.22,.61,.36,1);
}

.mini-slides img{
    width:33.3333%;
    height:100%;
    flex-shrink:0;
    object-fit:cover;
    object-position:center center;
    display:block;
}

.mini-dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:6px;
}

.mini-dots span{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#666;
    transition:.3s;
}

.mini-dots span.active{
    background:#FFC107;
}

/* ================= SLIDER UTAMA ================= */
.hero-banner{
    width:100%;
    margin:12px auto 14px;
}

.slider{
    width:100%;
    aspect-ratio:16/7;
    overflow:hidden;
    position:relative;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.16);
    background:#1d1d1d;
    box-shadow:0 6px 16px rgba(0,0,0,.22);
    cursor:pointer;
}

.slides{
    display:flex;
    transition:transform .7s ease-in-out;
    height:100%;
}

.slides img{
    width:100%;
    height:100%;
    min-width:100%;
    display:block;
    object-fit:cover;
}

.dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:8px;
    margin-bottom:4px;
}

.dots span{
    width:10px;
    height:10px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    transition:.35s;
}

.dots span.active{
    width:24px;
    height:10px;
    border-radius:20px;
    background:#FFC107;
    box-shadow:0 0 10px rgba(255,193,7,.4);
}

/* ===========================
   ASSISTANT SCREEN / MODAL (DIPERBAIKI)
=========================== */
.assistant-screen{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    z-index:99999;
    backdrop-filter:blur(5px);
}

.assistant-page{
    position:absolute;
    top:120px;
    left:12px;
    right:12px;
    bottom:0;
    background:#ffffff;
    color:#111;
    border-radius:28px 28px 0 0;
    border:2px solid #d8a400;
    box-shadow:0 -8px 30px rgba(0,0,0,.25);
    overflow-y:auto;
}

/* Header modal dan Tombol X dirapikan agar pas di dalam garis */
.assistant-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    height:70px;
    padding:15px 25px;
    border-bottom:3px solid #d4a514;
    font-weight:700;
    font-size:16px;
    color:#111;
}

.assistant-top button, #closeAssistant{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:#111;
    color:#fff;
    font-size:20px;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    transition:transform 0.2s ease, background 0.2s ease;
    margin: 0;
}

.assistant-top button:hover, #closeAssistant:hover{
    background:#333;
    transform:scale(1.05);
}

.assistant-content{
    padding:25px;
}

.paket-title{
    text-align:center;
    margin-bottom:20px;
    font-size:20px;
    font-weight:700;
    color:#111;
}

.paket-grid{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-bottom:25px;
}

.paket-btn{
    background:transparent;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:none;
    height:auto;
    width:auto;
}

.paket-btn img{
    width:95px;
    display:block;
    background:transparent;
    transition:.3s;
}

.paket-btn img:hover{
    transform:scale(1.05);
}

.paket-kosong{
    text-align:center;
    color:#777;
    padding:35px 10px;
}

/* ===========================
   MEDIA QUERY DESKTOP
=========================== */
@media screen and (min-width: 768px) {
    body {
        align-items: center;
        padding: 30px;
    }
    .container {
        max-width: 480px;
        padding: 25px;
        border-radius: 32px;
    }
    .menu-item img {
        width: 95px;
        height: 95px;
    }
}
</style>
</head>
    
<body>

<div class="container">
    <div class="hero-frame">
        <!-- ===== HERO BANNER BESAR ===== -->
        <div class="hero-big">
            <div class="hero-big-track">
                <img src="hero-banner1.png" alt="Hero 1">
                <img src="hero-banner2.png" alt="Hero 2">
                <img src="hero-banner3.png" alt="Hero 3">
            </div>
        </div>

        <!-- MINI BANNER -->
        <div class="mini-slider">
            <div class="mini-slides">
                <img src="banner-mini-assistant.png" alt="Mini Assistant">
                <img src="banner-mini-food.png" alt="Mini Food">
                <img src="banner-mini-ride.png" alt="Mini Ride">
            </div>
        </div>

        <div class="mini-dots">
            <span class="active"></span>
            <span></span>
            <span></span>
        </div>  
    </div>  

    <!-- MENU GRID -->
    <div class="menu-grid">
        <a id="btnAssistant" class="menu-item">
            <img src="tombol-assistant.png" class="assistant-icon" alt="ASSISTANT">
        </a>
        <a id="btnFood" class="menu-item">
            <img src="tombol-food.png" alt="FOOD">
        </a>
        <a id="btnRide" class="menu-item">
            <img src="tombol-ride.png" alt="RIDE">
        </a>
    </div>
    
    <!-- SLIDER UTAMA -->
    <div class="hero-banner">
        <div class="slider">
            <div class="slides">
                <img src="bannercgo1.png" alt="Banner 1">
                <img src="bannercgo2.png" alt="Banner 2">
                <img src="bannercgo3.png" alt="Banner 3">
            </div>
        </div>
        <div class="dots">
            <span class="active"></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="hero-tag">
        LAYANAN UTAMA
    </div>

    <h2 class="hero-title">
        CIKUR GO ASSISTANT
    </h2>

    <p class="hero-desc">
        Pendamping profesional untuk aktivitas harian Anda.
    </p>

    <p class="hero-info">
        Didukung oleh <strong>CIKUR GO FOOD</strong> dan
        <strong>CIKUR GO RIDE</strong> dalam satu ekosistem.
    </p>  

    <button id="chatBtn">
        💬 Mulai Chat
    </button>

    <footer>
        <p>© 2026 CIKUR GO</p>
        <p>Pasti Mudah, Pasti Nyaman.</p>
    </footer>
</div>
    
<!-- ===== ASSISTANT SCREEN / MODAL ===== -->
<div id="assistantScreen" class="assistant-screen">
    <div class="assistant-page">
        <div class="assistant-top">
            <span>CIKUR GO ASSISTANT</span>
            <button id="closeAssistant">✕</button>
        </div>
        <div class="assistant-content">
            <h3 class="paket-title">Pilih Paket Layanan</h3>

            <div class="paket-grid">
                <button class="paket-btn" id="btnDine">
                    <img src="icon-dine-in.png" alt="DINE-IN">
                </button>
                <button class="paket-btn" id="btnVip">
                    <img src="icon-vip.png" alt="VIP">
                </button>
                <button class="paket-btn" id="btnPrivate">
                    <img src="icon-private.png" alt="PRIVATE">
                </button>
            </div>
            
            <div id="paketContent">
                <p class="paket-kosong">
                    Silakan pilih salah satu paket di atas.
                </p>
            </div>
        </div>
    </div>
</div>
    
<!-- ===========================
   JAVASCRIPT SECTION
=========================== -->
<script>
// Slider Utama
const slides = document.querySelector(".slides");
const images = document.querySelectorAll(".slides img");
const dots = document.querySelectorAll(".dots span");
const slider = document.querySelector(".slider");
let current = 0;
const total = images.length;

function showSlide(index){
    slides.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach(dot => dot.classList.remove("active"));
    dots[index].classList.add("active");
}

function nextSlide(){
    current++;
    if(current >= total){
        current = 0;
    }
    showSlide(current);
}
let slideInterval = setInterval(nextSlide, 4000);

// Swipe Slider Utama
let startX = 0;
let endX = 0;

slider.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
});

slider.addEventListener("touchend", (e) => {
    endX = e.changedTouches[0].clientX;
    if(startX - endX > 50){
        current++;
        if(current >= total) current = 0;
        showSlide(current);
    }
    if(endX - startX > 50){
        current--;
        if(current < 0) current = total - 1;
        showSlide(current);
    }
});

// Klik Slider Utama
slider.addEventListener("click", () => {
    if(current === 0){
        window.location.href = "assistant.html";
    } else if(current === 1){
        window.location.href = "food.html";
    } else {
        window.location.href = "ride.html";
    }
});

// Botpress Chat Button
const chatBtn = document.getElementById("chatBtn");
chatBtn.addEventListener("click", () => {
    chatBtn.disabled = true;
    chatBtn.innerHTML = "Membuka CIKUR GO...";
    setTimeout(() => {
        if(window.botpress){
            window.botpress.open();
        }
        chatBtn.disabled = false;
        chatBtn.innerHTML = "💬 Mulai Chat";
    }, 500);
});

// Mini Banner Slider
const miniSlides = document.querySelector(".mini-slides");
const miniDots = document.querySelectorAll(".mini-dots span");
let miniCurrent = 0;
const miniTotal = miniDots.length;

function miniShow(index){
    miniSlides.style.transform = `translateX(-${index * 33.333}%)`;
    miniDots.forEach(dot => dot.classList.remove("active"));
    miniDots[index].classList.add("active");
}

function miniNext(){
    miniCurrent++;
    if(miniCurrent >= miniTotal){
        miniCurrent = 0;
    }
    miniShow(miniCurrent);
}
miniShow(0);
setInterval(miniNext, 7000);

// Hero Big Banner Slider
const heroTrack = document.querySelector(".hero-big-track");
let heroIndex = 0;

function heroSlide(){
    heroIndex++;
    if(heroIndex >= 3){
        heroIndex = 0;
    }
    heroTrack.style.transform = `translateX(-${heroIndex * 33.3333}%)`;
}
setInterval(heroSlide, 9000);

// Assistant Screen Modal Handler
const btnAssistant = document.getElementById("btnAssistant");
const assistantScreen = document.getElementById("assistantScreen");
const closeAssistant = document.getElementById("closeAssistant");

btnAssistant.addEventListener("click", function(e){
    e.preventDefault();
    assistantScreen.style.display = "block";
});

closeAssistant.addEventListener("click", function(){
    assistantScreen.style.display = "none";
});

// Tutup modal jika klik di luar area konten
assistantScreen.addEventListener("click", function(e){
    if(e.target === assistantScreen){
        assistantScreen.style.display = "none";
    }
});
</script>
    
<script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
<script src="https://files.bpcontent.cloud/2026/07/15/02/20260715020640-8DLE30VX.js" defer></script>

</body>
</html>
