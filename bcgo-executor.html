<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BCGO Internal Executor</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fa;color:#18202a}
main{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid #dfe4ea;border-radius:16px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{padding:12px;background:#f7f8fa;border-radius:10px}
.label{font-size:12px;opacity:.7}.value{font-weight:700;margin-top:4px}
pre{white-space:pre-wrap;word-break:break-word;background:#10151c;color:#eef2f6;padding:14px;border-radius:10px;min-height:100px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<section class="card">
<h1>BCGO Internal Executor</h1>
<p>Mesin eksekusi deterministik internal CIKUR GO.</p>
</section>
<section class="card">
<div class="grid">
<div class="item"><div class="label">ENGINE</div><div id="engine" class="value">BOOTING</div></div>
<div class="item"><div class="label">VERSION</div><div id="version" class="value">-</div></div>
<div class="item"><div class="label">STATUS</div><div id="status" class="value">OFFLINE</div></div>
<div class="item"><div class="label">EXTERNAL SERVICE</div><div id="service" class="value">NONE</div></div>
</div>
</section>
<section class="card">
<h2>Last Execution</h2>
<pre id="result">Belum ada execution.</pre>
</section>
</main>

<script src="./bcgo-executor-core.js"></script>
<script src="./bcgo-executor.js"></script>
<script>
(function(){
  function render(){
    const e=window.BCGOInternalExecutor;
    if(!e)return;
    const s=e.getStatus();
    document.getElementById("engine").textContent=s.engine;
    document.getElementById("version").textContent=s.version;
    document.getElementById("status").textContent=s.status;
    document.getElementById("service").textContent="NONE";
    document.getElementById("result").textContent=
      s.lastResult ? JSON.stringify(s.lastResult,null,2) : "Belum ada execution.";
  }
  window.addEventListener("bcgo-executor-state",render);
  window.addEventListener("bcgo-executor-core-ready",render);
  render();
})();
</script>
</body>
</html>
