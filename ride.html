<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIKUR Ride - Super App Engine v3.9</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script type="module" src="cikur-config.js"></script>
<style>
:root {
    --primary-red: #E50914;
    --primary-red-hover: #b80710;
    --dark-bg: #0f172a;
    --dark-card: #1e293b;
    --body-bg: #f1f5f9;
    --container-bg: #f8fafc;
    --border-color: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --font-main: 'Plus Jakarta Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: var(--font-main);
}

body{
    background: var(--body-bg);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

@media(min-width: 480px){
    body { padding: 20px; }
}

.container{
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 16px 16px 60px 16px;
    display: flex;
    flex-direction: column;
    background: var(--container-bg);
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    position: relative;
}

@media(min-width: 480px){
    .container {
        min-height: 850px;
        border-radius: 36px;
        border: 1px solid var(--border-color);
    }
}

/* ===========================
   HEADER & NAVIGATION
=========================== */
.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
}

.back-btn {
    background: #fff;
    border: 1px solid var(--border-color);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: 800;
    text-decoration: none;
    color: var(--text-main);
    transition: 0.2s;
}

.back-btn:hover {
    background: #fee2e2;
    color: var(--primary-red);
    border-color: var(--primary-red);
}

.app-header h2 {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-main);
}

/* ===========================
   MAP SIMULATION BOX
=========================== */
.map-simulation {
    width: 100%;
    height: 160px;
    background: #cbd5e1;
    border-radius: 16px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border-color);
}

.map-simulation img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.8;
}

.map-badge {
    position: absolute;
    bottom: 10px;
    background: rgba(15, 23, 42, 0.85);
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
}

/* ===========================
   FORM RIDE SECTION
=========================== */
.ride-form-card {
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
}

.form-group {
    margin-bottom: 10px;
}

.form-group label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
}

.input-box {
    width: 100%;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-main);
    outline: none;
    transition: 0.2s;
}

.input-box:focus {
    border-color: var(--primary-red);
}

/* ===========================
   FLEET SELECTION (BIKE/CAR)
=========================== */
.fleet-options {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
}

.fleet-card {
    flex: 1;
    background: #fff;
    border: 2px solid var(--border-color);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
}

.fleet-card.selected {
    border-color: var(--primary-red);
    background: #fff5f5;
}

.fleet-card h4 {
    font-size: 12px;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 2px;
}

.fleet-card p {
    font-size: 11px;
    color: var(--primary-red);
    font-weight: 700;
    font-family: var(--font-mono);
}

/* ===========================
   CHECKOUT / BOOKING BOX
=========================== */
.checkout-box {
    background: var(--dark-bg);
    color: #fff;
    border-radius: 16px;
    padding: 16px;
    margin-top: auto;
    box-shadow: 0 8px 20px rgba(15,23,42,0.2);
}

.btn-order {
    width: 100%;
    height: 46px;
    background: var(--primary-red);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.2s;
}

.btn-order:hover {
    background: var(--primary-red-hover);
}
</style>

<style id="cgo-modern-toast-style">
.cgo-modern-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,18px);width:min(390px,calc(100% - 24px));z-index:2147483646;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease,transform .3s cubic-bezier(.16,1,.3,1),visibility .22s ease;font-family:inherit;}
.cgo-modern-toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);}
.cgo-modern-toast-card{position:relative;display:flex;align-items:center;gap:11px;padding:12px 38px 12px 12px;background:rgba(255,255,255,.98);border:1px solid rgba(15,23,42,.08);border-radius:17px;box-shadow:0 16px 38px rgba(15,23,42,.18),0 5px 14px rgba(15,23,42,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden;}
.cgo-modern-toast-icon{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#dcfce7;color:#16a34a;font-size:18px;font-weight:900;}
.cgo-modern-toast-title{font-size:12px;font-weight:800;color:#0f172a;margin-bottom:2px;}
.cgo-modern-toast-message{font-size:10.5px;line-height:1.4;font-weight:600;color:#64748b;}
.cgo-modern-toast-close{position:absolute;right:8px;top:8px;width:24px;height:24px;border:0;border-radius:50%;background:#f1f5f9;color:#64748b;font-size:16px;line-height:1;cursor:pointer;}
.cgo-modern-toast.warning .cgo-modern-toast-icon{background:#fef3c7;color:#d97706;}
.cgo-modern-toast.error .cgo-modern-toast-icon{background:#fee2e2;color:#e50914;}
@media(max-width:440px){.cgo-modern-toast{width:calc(100% - 20px);bottom:calc(14px + env(safe-area-inset-bottom,0px));}}
</style>

</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="app-header">
        <a href="index.html" class="back-btn">←</a>
        <h2>CIKUR GO RIDE</h2>
        <div style="width: 38px;"></div>
    </div>

    <!-- Simulasi Peta -->
    <div class="map-simulation">
        <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=600" alt="Map Simulation">
        <div class="map-badge">📍 GPS Active - Menunggu Titik Jemput</div>
    </div>

    <!-- Form Titik Jemput & Tujuan -->
    <div class="ride-form-card">
        <div class="form-group">
            <label>Lokasi Penjemputan</label>
            <input type="text" id="pickupLocation" class="input-box" value="Lokasi Anda Saat Ini (GPS)">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label>Tujuan Perjalanan</label>
            <input type="text" id="destLocation" class="input-box" placeholder="Mau ke mana hari ini?">
        </div>
    </div>

    <!-- Pilihan Armada -->
    <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase;">Pilih Jenis Armada</div>
    <div class="fleet-options">
        <div class="fleet-card selected" id="fleetBike" onclick="selectFleet('bike', 10000)">
            <h4>🛵 CIKUR-Bike</h4>
            <p>Rp 10.000</p>
        </div>
        <div class="fleet-card" id="fleetCar" onclick="selectFleet('car', 25000)">
            <h4>🚗 CIKUR-Car</h4>
            <p>Rp 25.000</p>
        </div>
    </div>

    <!-- Kotak Pembayaran / Pemesanan -->
    <div class="checkout-box" id="rideCartSection">
        <div style="font-size: 11px; color: #94a3b8; font-weight: 700;">Layanan Terpilih</div>
        <h3 id="rideTypeName" style="font-size: 14px; font-weight: 800; margin: 2px 0 6px 0;">CIKUR-Bike (Motor)</h3>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
            <span>Tarif Perjalanan:</span>
            <span id="rideTotalPrice" style="color: #FFD700; font-weight: 800; font-family: var(--font-mono);">Rp 10.000</span>
        </div>
        <button class="btn-order" onclick="prosesPesanRide()">Pesan Driver Sekarang ⚡</button>
    </div>
</div>

<script>
let userProfile = {};
let selectedRide = { type: "CIKUR-Bike (Motor)", vehicleType: "bike", price: 10000 };

function selectFleet(type, price) {
    const cardBike = document.getElementById("fleetBike");
    const cardCar = document.getElementById("fleetCar");

    if (type === 'bike') {
        cardBike.classList.add("selected");
        cardCar.classList.remove("selected");
        selectedRide = { type: "CIKUR-Bike (Motor)", vehicleType: "bike", price: 10000 };
    } else {
        cardCar.classList.add("selected");
        cardBike.classList.remove("selected");
        selectedRide = { type: "CIKUR-Car (Mobil)", vehicleType: "car", price: 25000 };
    }

    document.getElementById("rideTypeName").innerText = selectedRide.type;
    document.getElementById("rideTotalPrice").innerText = "Rp " + selectedRide.price.toLocaleString('id-ID');
}

async function loadRideUser() {
    if (!window.CikurCloud) return;
    try {
        const firebaseUser = await window.CikurCloud.ensureAuth();
        const profile = await window.CikurCloud.getProfile(firebaseUser.uid);
        userProfile = {
            uid: firebaseUser.uid,
            name: profile?.name || "Customer",
            phone: profile?.phone || ""
        };
    } catch (error) {
        console.error("[CIKUR RIDE] Gagal memuat profil:", error);
        userProfile = { uid: "", name: "Customer", phone: "" };
    }
}

async function prosesPesanRide() {
    const pickup = document.getElementById("pickupLocation").value.trim();
    const destination = document.getElementById("destLocation").value.trim();

    if (!destination) {
        alert("[!] Mohon masukkan tujuan perjalanan terlebih dahulu.");
        return;
    }
    if (!pickup || pickup === "Lokasi Anda Saat Ini (GPS)") {
        alert("[!] Mohon tentukan lokasi penjemputan terlebih dahulu.");
        return;
    }
    if (!window.CikurCloud) {
        alert("[!] CIKUR Cloud belum siap. Silakan coba lagi.");
        return;
    }

    const button = document.querySelector('.btn-order');
    if (button) { button.disabled = true; button.textContent = "Mengirim pesanan..."; }

    try {
        if (!userProfile.uid) await loadRideUser();
        const order = await window.CikurCloud.createOrder("RIDE", {
            service: "RIDE",
            vehicleType: selectedRide.vehicleType,
            vehicleName: selectedRide.type,
            fare: selectedRide.price,
            pickup,
            destination,
            customerName: userProfile.name || "Customer",
            customerPhone: userProfile.phone || "",
            paymentMethod: "CIKURPAY",
            paymentStatus: "PENDING",
            mode: "REGULAR"
        });

        if (!order?.id) throw new Error("Pesanan Ride tidak menghasilkan ID.");
        alert(`[TERKIRIM] Pesanan ${selectedRide.type} sudah masuk ke CIKUR Cloud. Menunggu driver menerima.`);
        window.location.href = `index.html?rideOrder=${encodeURIComponent(order.id)}`;
    } catch (error) {
        console.error("[CIKUR RIDE] Gagal membuat order:", error);
        alert("Pesanan Ride gagal dikirim: " + (error?.message || error));
        if (button) { button.disabled = false; button.textContent = "Pesan Driver Sekarang ⚡"; }
    }
}

document.addEventListener("DOMContentLoaded", loadRideUser);
</script>


<div id="cgoModernToast" class="cgo-modern-toast" aria-hidden="true">
 <div class="cgo-modern-toast-card">
  <div id="cgoModernToastIcon" class="cgo-modern-toast-icon">✓</div>
  <div style="min-width:0;">
   <div id="cgoModernToastTitle" class="cgo-modern-toast-title">CIKUR GO</div>
   <div id="cgoModernToastMessage" class="cgo-modern-toast-message"></div>
  </div>
  <button id="cgoModernToastClose" class="cgo-modern-toast-close" type="button" aria-label="Tutup">×</button>
 </div>
</div>
<script>
(function(){
 const box=document.getElementById('cgoModernToast'), icon=document.getElementById('cgoModernToastIcon'), title=document.getElementById('cgoModernToastTitle'), msg=document.getElementById('cgoModernToastMessage'), close=document.getElementById('cgoModernToastClose');
 if(!box||!icon||!title||!msg) return;
 let timer=null;
 function hide(){clearTimeout(timer);box.classList.remove('show');box.setAttribute('aria-hidden','true');}
 window.showCGOModernNotification=function(type='success',t='CIKUR GO',m=''){clearTimeout(timer);box.classList.remove('success','warning','error');box.classList.add(type);icon.textContent=type==='error'?'×':type==='warning'?'!':'✓';title.textContent=t;msg.textContent=String(m||'');box.classList.add('show');box.setAttribute('aria-hidden','false');timer=setTimeout(hide,3600);};
 window.closeCGOModernNotification=hide;
 if(close) close.addEventListener('click',hide);
 window.alert=function(text){const s=String(text||'');let type='success',t='Berhasil';if(/gagal|error|salah|ditolak|tidak berhasil/i.test(s)){type='error';t='Terjadi Kesalahan';}else if(/harus|belum|tidak cocok|wajib|silakan|perhatian/i.test(s)){type='warning';t='Perhatian';}showCGOModernNotification(type,t,s);};
})();
</script>

</body>
</html>
