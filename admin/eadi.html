<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EADI v2.0 - Texture Steganography</title>
<style>
  body { margin: 0; background: #05070d; color: #eee; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  #log { background: #111820; padding: 15px 20px; border-radius: 8px; border: 1px solid #00ff88; color: #00ff88; font-size: 16px; box-shadow: 0 0 15px rgba(0,255,136,0.2); text-align: center; }
  .sub { font-size: 12px; color: #666; margin-top: 10px; }
</style>
</head>
<body>

<!-- Canvas WebGL disembunyikan -->
<canvas id="glCanvas" style="display:none;"></canvas>
<div id="log">Memproses EADI...</div>
<div class="sub">Menyembunyikan data ke dalam piksel GPU...</div>

<script>
  const canvas = document.getElementById('glCanvas');
  const gl = canvas.getContext('webgl'); // Gunakan WebGL1 untuk kompatibilitas maksimal
  const log = document.getElementById('log');

  if (!gl) {
    log.textContent = "ERROR: WebGL tidak didukung di browser ini.";
    log.style.color = "#ff3366";
  } else {
    // ============================================================
    // 1. DATA YANG INGIN DISEMBUNYIKAN
    // ============================================================
    const originalData = "TopSecretData2026";
    const encoder = new TextEncoder();
    const dataBytes = encoder.encode(originalData);
    const byteLen = dataBytes.length;

    // ============================================================
    // 2. ENCODE: Ubah Teks menjadi Gambar (RGBA Pixel)
    // ============================================================
    const size = Math.ceil(Math.sqrt(byteLen)); 
    const imgCanvas = document.createElement('canvas');
    imgCanvas.width = size;
    imgCanvas.height = size;
    const ctx = imgCanvas.getContext('2d');
    const imgData = ctx.createImageData(size, size);

    // Suntikkan byte ke dalam channel Merah (R)
    for (let i = 0; i < byteLen; i++) {
      const idx = i * 4;
      imgData.data[idx] = dataBytes[i]; // R (Merah) = Data
      imgData.data[idx + 1] = 0;        // G (Hijau) = 0
      imgData.data[idx + 2] = 0;        // B (Biru) = 0
      imgData.data[idx + 3] = 255;      // A (Alpha) = Full Opaque
    }
    ctx.putImageData(imgData, 0, 0);

    // ============================================================
    // 3. SETUP WEBGL & SHADERS
    // ============================================================
    canvas.width = size;
    canvas.height = size;
    
    const vsSource = `
      attribute vec2 aPos;
      varying vec2 vTexCoord;
      void main() {
        vTexCoord = (aPos + 1.0) / 2.0;
        gl_Position = vec4(aPos, 0.0, 1.0);
      }
    `;
    
    const fsSource = `
      precision mediump float;
      varying vec2 vTexCoord;
      uniform sampler2D uTexture;
      void main() {
        gl_FragColor = texture2D(uTexture, vTexCoord);
      }
    `;

    const compileShader = (type, source) => {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error("Shader Error:", gl.getShaderInfoLog(shader));
      }
      return shader;
    };

    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);
    gl.useProgram(program);

    // Buffer Segi Empat
    const vertBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vertBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(program, 'aPos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    // Buat Texture dari Canvas Data
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, imgCanvas);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    
    const uTexture = gl.getUniformLocation(program, 'uTexture');
    gl.uniform1i(uTexture, 0);

    // ============================================================
    // 4. RENDER KE LAYAR GPU
    // ============================================================
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // ============================================================
    // 5. DECODE: Baca Data dari Pixel GPU
    // ============================================================
    function readTexture() {
      const pixels = new Uint8Array(size * size * 4);
      gl.readPixels(0, 0, size, size, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      
      let decodedStr = "";
      for (let i = 0; i < byteLen; i++) {
        decodedStr += String.fromCharCode(pixels[i * 4]); // Ambil channel R
      }
      return decodedStr;
    }

    // Tampilkan Hasil
    const result = readTexture();
    if (result === originalData) {
      log.innerHTML = `✅ Dekode sukses: <strong>"${result}"</strong> (${byteLen} byte)`;
      log.style.color = "#00ff88";
    } else {
      log.innerHTML = `❌ ERROR! Dekode gagal.`;
      log.style.color = "#ff3366";
    }

    // Bersihkan jejak memori GPU untuk keamanan ekstra
    gl.clear(gl.COLOR_BUFFER_BIT);
  }
</script>
</body>
</html>
