<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS — Titanium Module Diagnostics</title>
    <style>
        :root {
            --bg: #05070d;
            --panel: rgba(10, 16, 30, 0.85);
            --border: rgba(79, 227, 255, 0.3);
            --cy: #4fe3ff;
            --vi: #9a6bff;
            --ok: #3dffb0;
            --err: #ff3d7f;
            --text: #e9edf5;
            --dim: #7d8fb0;
            --font: 'JetBrains Mono', ui-monospace, Menlo, monospace;
        }

        body {
            background: radial-gradient(circle at 50% 30%, #101c3a 0%, #05070d 70%);
            color: var(--text);
            font-family: var(--font);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .hud-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(79, 227, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79, 227, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .container {
            width: min(800px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(79, 227, 255, 0.1), inset 0 0 20px rgba(79, 227, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 24px;
            margin-top: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header svg {
            width: 32px;
            height: 32px;
            stroke: var(--cy);
            filter: drop-shadow(0 0 8px var(--cy));
        }

        .header h1 {
            font-size: 1.2rem;
            margin: 0;
            letter-spacing: 2px;
            color: var(--cy);
            text-transform: uppercase;
        }
        .header span {
            display: block;
            font-size: 0.75rem;
            color: var(--dim);
            letter-spacing: 1px;
            margin-top: 4px;
            text-transform: none;
        }

        .modules {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) {
            .modules { grid-template-columns: 1fr; }
        }

        .card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: 0.3s;
        }
        .card:hover { border-color: var(--cy); }

        .card-head {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        .card-head svg { width: 20px; height: 20px; stroke: var(--cy); }
        
        .status-icon {
            margin-left: auto;
            width: 20px; height: 20px;
            display: grid; place-items: center;
        }
        .status-icon svg { width: 16px; height: 16px; }

        .btn {
            background: rgba(79, 227, 255, 0.1);
            border: 1px solid var(--cy);
            color: var(--cy);
            padding: 10px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { background: var(--cy); color: #000; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #terminal {
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px;
            height: 250px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--dim);
        }
        #terminal::-webkit-scrollbar { width: 6px; }
        #terminal::-webkit-scrollbar-thumb { background: var(--cy); border-radius: 3px; }

        .log-line { margin-bottom: 4px; }
        .log-line .ts { color: #555; margin-right: 8px; }
        .log-ok { color: var(--ok); }
        .log-err { color: var(--err); }
        .log-info { color: var(--vi); }

        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .verdict {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            display: none;
        }
        .verdict.show { display: block; }
        .verdict.pass { background: rgba(61, 255, 176, 0.1); border: 1px solid var(--ok); color: var(--ok); }
        .verdict.fail { background: rgba(255, 61, 127, 0.1); border: 1px solid var(--err); color: var(--err); }
    </style>
</head>
<body>
    <div class="hud-grid"></div>

    <div class="container">
        <div class="header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <div>
                <h1>NEXUS Diagnostics</h1>
                <span>Titanium Grade Module Verification</span>
            </div>
        </div>

        <div class="modules">
            <!-- LBC Card -->
            <div class="card" id="card-lbc">
                <div class="card-head">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="9" y1="21" x2="9" y2="9"></line>
                    </svg>
                    SuperLBC (Schnorr & MPT)
                    <div class="status-icon" id="icon-lbc"></div>
                </div>
                <button class="btn" id="btn-lbc" onclick="testLBC()">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
                    Jalankan Uji LBC
                </button>
            </div>

            <!-- EADI Card -->
            <div class="card" id="card-eadi">
                <div class="card-head">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    SuperEADI (DCT & CRC)
                    <div class="status-icon" id="icon-eadi"></div>
                </div>
                <button class="btn" id="btn-eadi" onclick="testEADI()">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
                    Jalankan Uji EADI
                </button>
            </div>
        </div>

        <div id="terminal"></div>

        <div class="verdict" id="verdict"></div>
    </div>

    <!-- Panggil Modul -->
    <script src="SuperLBC.js"></script>
    <script src="SuperEADI.js"></script>

    <script>
        const term = document.getElementById('terminal');
        const verdict = document.getElementById('verdict');
        let passCount = 0;
        let totalTests = 2;

        function log(msg, type = 'info') {
            const ts = new Date().toLocaleTimeString('id-ID');
            const line = document.createElement('div');
            line.className = 'log-line';
            
            let icon = '';
            let cls = 'log-info';
            if (type === 'ok') { cls = 'log-ok'; icon = '✓ '; }
            if (type === 'err') { cls = 'log-err'; icon = '✗ '; }

            line.innerHTML = `<span class="ts">[${ts}]</span><span class="${cls}">${icon}${msg}</span>`;
            term.appendChild(line);
            term.scrollTop = term.scrollHeight;
        }

        function setIcon(id, status) {
            const el = document.getElementById(`icon-${id}`);
            if (status === 'loading') {
                el.innerHTML = `<svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="var(--cy)" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.22-8.56"></path></svg>`;
            } else if (status === 'ok') {
                el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            } else if (status === 'err') {
                el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="var(--err)" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
            } else {
                el.innerHTML = '';
            }
        }

        function checkVerdict() {
            if (passCount === totalTests) {
                verdict.className = 'verdict show pass';
                verdict.innerHTML = '✅ SEMUA MODUL LULUS! SISTEM SIAP DIGABUNGKAN.';
                log('SEMUA MODUL LULUS UJI KETAHANAN.', 'ok');
            } else {
                verdict.className = 'verdict show fail';
                verdict.innerHTML = '❌ ADA MODUL YANG GAGAL. PERIKSA LOG DI ATAS.';
            }
        }

        async function testLBC() {
            const btn = document.getElementById('btn-lbc');
            btn.disabled = true;
            setIcon('lbc', 'loading');
            log('Memulai pengujian SuperLBC (Schnorr & Merkle Trie)...', 'info');
            log('Menguji SHA-256, Kurva Eliptik, dan Bukti Trie...', 'info');
            
            try {
                const res = await NexusLBC.selfTest();
                
                res.results.forEach(r => {
                    if (r.ok) log(`LBC: ${r.name}`, 'ok');
                    else log(`LBC GAGAL: ${r.name}`, 'err');
                });

                if (res.ok) {
                    setIcon('lbc', 'ok');
                    passCount++;
                } else {
                    setIcon('lbc', 'err');
                }
            } catch (e) {
                log('Error fatal pada SuperLBC: ' + e.message, 'err');
                setIcon('lbc', 'err');
            }
            
            btn.disabled = false;
            checkVerdict();
        }

        async function testEADI() {
            const btn = document.getElementById('btn-eadi');
            btn.disabled = true;
            setIcon('eadi', 'loading');
            log('Memulai pengujian SuperEADI (DCT & CRC)...', 'info');
            log('Menguji Transformasi DCT, Kuantisasi, dan CRC32...', 'info');
            
            try {
                const res = await NexusEADI.selfTest();
                
                res.results.forEach(r => {
                    if (r.ok) log(`EADI: ${r.name}`, 'ok');
                    else log(`EADI GAGAL: ${r.name}`, 'err');
                });

                if (res.ok) {
                    setIcon('eadi', 'ok');
                    passCount++;
                } else {
                    setIcon('eadi', 'err');
                }
            } catch (e) {
                log('Error fatal pada SuperEADI: ' + e.message, 'err');
                setIcon('eadi', 'err');
            }
            
            btn.disabled = false;
            checkVerdict();
        }

        // Mulai log
        log('Terminal Diagnostics siap. Silakan jalankan uji modul.', 'info');
    </script>
</body>
</html>
