<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Megatron Voice — The DSP Heist</title>
<style>
    * { box-sizing: border-box; }
    body {
        background: radial-gradient(circle at 50% 35%, #18202a 0%, #080b0f 42%, #030405 100%);
        color: #dce7f0; font-family: 'Segoe UI', system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        height: 100vh; margin: 0; overflow: hidden;
    }
    .panel {
        width: min(92vw, 500px); padding: 30px;
        border: 1px solid rgba(160,190,220,.18); border-radius: 20px;
        background: linear-gradient(145deg, rgba(18,25,32,.96), rgba(5,8,11,.96));
        box-shadow: 0 30px 100px rgba(0,0,0,.65);
        text-align: center;
    }
    .core {
        width: 120px; height: 120px; margin: 0 auto 20px;
        border-radius: 50%; background: radial-gradient(circle, #c8e8ff 0%, #5687a9 15%, #182a38 40%, #090e13 70%);
        box-shadow: 0 0 20px rgba(80,170,255,.35), 0 0 70px rgba(40,120,190,.15);
        transition: .3s ease;
    }
    .core.active { transform: scale(1.1); box-shadow: 0 0 40px rgba(100,190,255,.8), 0 0 100px rgba(40,130,220,.4); }
    h1 { font-size: 20px; letter-spacing: 3px; margin: 0 0 5px; color: #eef7ff; }
    .subtitle { color: #7d8c99; font-size: 11px; letter-spacing: 2px; margin-bottom: 25px; }
    textarea {
        width: 100%; min-height: 80px; padding: 12px; color: #dcecff;
        background: rgba(0,0,0,.4); border: 1px solid rgba(130,170,200,.2);
        border-radius: 10px; outline: none; font-size: 14px; font-family: inherit; resize: none;
    }
    textarea:focus { border-color: rgba(110,190,255,.6); }
    button {
        width: 100%; margin-top: 15px; padding: 15px;
        border: 0; border-radius: 10px; background: linear-gradient(180deg,#273d4e,#13222d);
        color: #e9f7ff; font-weight: bold; letter-spacing: 2px; cursor: pointer;
        transition: .2s;
    }
    button:hover { background: linear-gradient(180deg,#34566e,#182e3e); }
    button:disabled { opacity: .5; cursor: wait; }
    .status { margin-top: 15px; color: #6f8797; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>
<body>

<div class="panel">
    <div id="core" class="core"></div>
    <h1>MEGATRON VOICE</h1>
    <div class="subtitle">100% BROWSER DSP // NO LIBRARY</div>
    <textarea id="text">Selamat datang di Sistem NEXUS. Saya adalah pelindung data Anda. Sistem berdaulat sepenuhnya.</textarea>
    <button id="speakBtn">AKTIFKAN SUARA</button>
    <div id="status" class="status">SYSTEM STANDBY</div>
</div>

<script>
"use strict";

const core = document.getElementById('core');
const button = document.getElementById('speakBtn');
const status = document.getElementById('status');
const textInput = document.getElementById('text');

let ctx = null;

async function initAudio() {
    if (!ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        ctx = new AudioCtx();
    }
    if (ctx.state === "suspended") await ctx.resume();
}

// 1. Kurva Distorsi Agresif untuk membuat suara serak/robot
function makeDistortionCurve(amount = 100) {
    const samples = 44100;
    const curve = new Float32Array(samples);
    const deg = Math.PI / 180;
    for (let i = 0; i < samples; i++) {
        const x = (i * 2) / samples - 1;
        curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
    }
    return curve;
}

// 2. Power-Up Bass Drop sebelum bicara
function playPowerUp() {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const now = ctx.currentTime;
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.5);
}

// 3. Mesin DSP Megatron
function playThroughDSP(audioBuffer) {
    const source = ctx.createBufferSource();
    source.buffer = audioBuffer;

    // Distorsi (Membuat suara kasar/berat)
    const distortion = ctx.createWaveShaper();
    distortion.curve = makeDistortionCurve(200);
    
    // Filter (Membuang frekuensi tinggi/cempreng)
    const lowpass = ctx.createBiquadFilter();
    lowpass.type = "lowpass";
    lowpass.frequency.value = 250; // Potong semua suara di atas 250Hz
    lowpass.Q.value = 2.0; // Sedikit resonansi agar tebal

    // Gema (Ruang Baja)
    const delay = ctx.createDelay(1.0);
    delay.delayTime.value = 0.2;
    const feedback = ctx.createGain();
    feedback.gain.value = 0.4;
    const echoGain = ctx.createGain();
    echoGain.gain.value = 0.3;

    // Master
    const master = ctx.createGain();
    master.gain.value = 0.8;

    // Rangkaian
    source.connect(distortion);
    distortion.connect(lowpass);
    lowpass.connect(master);
    
    // Jalur Gema
    lowpass.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(echoGain);
    echoGain.connect(master);
    
    master.connect(ctx.destination);

    source.start(0);
    source.onended = () => {
        core.classList.remove("active");
        status.textContent = "SYSTEM STANDBY";
    };
}

// 4. Eksekusi Utama
async function speak() {
    const text = textInput.value.trim();
    if (!text) return;

    button.disabled = true;
    core.classList.add("active");
    status.textContent = "MENGAMBIL SUARA & MEMPROSES...";

    try {
        await initAudio();
        playPowerUp();

        // TRIK: Mengambil suara TTS dari Google Translate API publik
        // Ini sangat ringan dan pasti didukung di semua HP
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=id&client=tw-ob`;
        
        // Gunakan proxy CORS karena kita tidak bisa fetch langsung ke Google
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("Gagal mengunduh suara.");
        
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await ctx.decodeAudioData(arrayBuffer);

        status.textContent = "MEGATRON ONLINE";
        playThroughDSP(audioBuffer);

    } catch (error) {
        console.error(error);
        status.textContent = "ERROR: " + error.message;
        core.classList.remove("active");
    } finally {
        setTimeout(() => { button.disabled = false; }, 1000);
    }
}

button.addEventListener("click", speak);
</script>
</body>
</html>
