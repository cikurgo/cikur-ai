<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EADI – Cyberpunk Steganography</title>
<style>
  body { margin: 0; background: #05070d; color: #0ff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #app { display: flex; flex-direction: column; align-items: center; height: 100%; width: 100%; padding: 10px; box-sizing: border-box; }
  #controls { padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; z-index: 10; }
  input { padding: 10px; border-radius: 4px; border: 1px solid #0ff; background: #111; color: #0ff; outline: none; font-family: inherit; width: 250px; }
  button { padding: 10px 15px; border-radius: 4px; border: 1px solid #0ff; background: #111; color: #0ff; cursor: pointer; transition: 0.2s; font-weight: bold; font-family: inherit; }
  button:hover { background: #0ff; color: #05070d; box-shadow: 0 0 15px #0ff; }
  #canvases { display: flex; width: 100%; flex: 1; gap: 10px; padding: 10px; box-sizing: border-box; flex-wrap: wrap; justify-content: center; }
  canvas { background: #000; border: 1px solid #333; border-radius: 8px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.1); }
  #viewCore { flex: 1; max-width: 500px; height: 100%; min-height: 300px; }
  #viewXray { flex: 1; max-width: 500px; height: 100%; min-height: 300px; image-rendering: pixelated; }
  #log { margin-top: 10px; color: #0f0; font-size: 14px; text-align: center; min-height: 20px; text-shadow: 0 0 5px #0f0; }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/build/three.min.js"></script>
</head>
<body>
<div id="app">
  <div id="controls">
    <input id="msg" type="text" placeholder="Masukkan pesan rahasia..." value="TopSecretData2026">
    <button id="enc">🔒 SEMBUNYIKAN (ENCODE)</button>
    <button id="dec">🔓 EKSTRAK (DECODE)</button>
  </div>
  
  <div id="canvases">
    <!-- Kanvas 3D WebGL -->
    <canvas id="viewCore"></canvas>
    <!-- Kanvas X-Ray 2D -->
    <canvas id="viewXray"></canvas>
  </div>
  
  <div id="log">Sistem siap. Menunggu data...</div>
</div>

<script>
const msgInp = document.getElementById('msg');
const log = document.getElementById('log');
const encBtn = document.getElementById('enc');
const decBtn = document.getElementById('dec');

let renderer, scene, camera, cube;
let pixelBuffer, texW, texH;
let isEncoded = false;

// ---------- 1. Setup Three.js ----------
function initThree() {
  const canvas = document.getElementById('viewCore');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 10);
  camera.position.set(0, 0, 3);
  
  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  
  const geom = new THREE.BoxGeometry(1.5, 1.5, 1.5);
  // Material awal (polos)
  cube = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ color: 0x222222 }));
  scene.add(cube);
  
  animate();
}

function animate() {
  requestAnimationFrame(animate);
  if (cube) {
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.015;
  }
  renderer.render(scene, camera);
}

// ---------- 2. Encode Data ----------
function encodeData() {
  const text = msgInp.value.trim();
  if (!text) { log.textContent = '❌ Masukkan teks terlebih dahulu!'; return; }

  // 1. Siapkan payload (Header 4-byte + Teks)
  const txtBytes = new TextEncoder().encode(text);
  const lenBuf = new Uint8Array(4);
  new DataView(lenBuf.buffer).setUint32(0, txtBytes.length, true);
  
  const totalBytes = 4 + txtBytes.length;
  
  // 2. Buat Pixel Buffer (RGBA)
  // 1 Byte data = 1 Piksel. R = Data, G = 0, B = 0, A = 255
  pixelBuffer = new Uint8Array(totalBytes * 4);
  for (let i = 0; i < totalBytes * 4; i++) {
    pixelBuffer[i] = 0;
  }
  
  for (let i = 0; i < totalBytes; i++) {
    const val = (i < 4) ? lenBuf[i] : txtBytes[i - 4];
    const idx = i * 4;
    pixelBuffer[idx] = val;       // R
    pixelBuffer[idx + 1] = 0;     // G
    pixelBuffer[idx + 2] = 0;     // B
    pixelBuffer[idx + 3] = 255;   // A
  }

  // 3. Hitung Dimensi Tekstur (Persegi)
  texW = Math.ceil(Math.sqrt(totalBytes));
  texH = Math.ceil(totalBytes / texW);

  // 4. Render ke Three.js (DataTexture)
  // DataTexture akan merender array RGBA kita langsung ke permukaan Kubus
  const texture = new THREE.DataTexture(pixelBuffer, texW, texH, THREE.RGBAFormat, THREE.UnsignedByteType);
  texture.needsUpdate = true;
  texture.magFilter = THREE.NearestFilter; // Agar pixel tidak blur
  texture.minFilter = THREE.NearestFilter;
  
  cube.material = new THREE.MeshBasicMaterial({ map: texture });
  cube.material.needsUpdate = true;

  // 5. Render ke X-Ray Canvas (Visualisasi 2D)
  drawXRay(pixelBuffer, texW, texH);

  isEncoded = true;
  log.textContent = `✅ Data disembunyikan! (${totalBytes} byte, Grid ${texW}x${texH})`;
  log.style.color = "#0f0";
}

// ---------- 3. Draw X-Ray ----------
function drawXRay(buffer, w, h) {
  const xrayCanvas = document.getElementById('viewXray');
  // Atur resolusi canvas sesuai grid data
  xrayCanvas.width = w;
  xrayCanvas.height = h;
  
  const ctx = xrayCanvas.getContext('2d');
  const imgData = ctx.createImageData(w, h);
  
  // Salin buffer ke ImageData
  for (let i = 0; i < buffer.length; i++) {
    imgData.data[i] = buffer[i];
  }
  
  ctx.putImageData(imgData, 0, 0);
  
  // Perbesar (Scale up) secara CSS agar terlihat kotak-kotaknya
  xrayCanvas.style.width = '100%';
  xrayCanvas.style.height = '100%';
  xrayCanvas.style.objectFit = 'contain';
}

// ---------- 4. Decode Data ----------
function decodeData() {
  if (!isEncoded) {
    log.textContent = '❌ Belum ada data yang di-encode.';
    log.style.color = "#f33";
    return;
  }

  try {
    const xrayCanvas = document.getElementById('viewXray');
    const ctx = xrayCanvas.getContext('2d');
    
    // Ambil data pixel dari X-Ray canvas (seukuran aslinya)
    const imgData = ctx.getImageData(0, 0, texW, texH);
    const data = imgData.data;
    
    // Baca 4 byte pertama dari Channel Merah (R)
    const lenBuf = new Uint8Array(4);
    for (let i = 0; i < 4; i++) {
      lenBuf[i] = data[i * 4]; 
    }
    
    const len = new DataView(lenBuf.buffer).getUint32(0, true);
    
    // Baca isi pesan
    const bodyBytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bodyBytes[i] = data[(4 + i) * 4]; // Mulai dari piksel ke-5
    }
    
    const decodedText = new TextDecoder().decode(bodyBytes);
    
    log.textContent = `🔓 EKSTRAK SUKSES: "${decodedText}"`;
    log.style.color = "#0ff";
    
  } catch (e) {
    log.textContent = `❌ GAGAL: ${e.message}`;
    log.style.color = "#f33";
  }
}

// ---------- 5. Event Listeners ----------
encBtn.addEventListener('click', encodeData);
decBtn.addEventListener('click', decodeData);

// Jalankan saat halaman dimuat
window.onload = () => {
  initThree();
  // Handle resize
  window.addEventListener('resize', () => {
    const canvas = document.getElementById('viewCore');
    if (renderer && camera) {
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
    }
  });
};
</script>
</body>
</html>
