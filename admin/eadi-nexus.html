<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EADI – Visual Cyberpunk Steganography</title>
<style>
  body { margin: 0; background: #05070d; color: #0ff; font-family: monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #controls { padding: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; z-index: 10; }
  input { padding: 10px; border-radius: 4px; border: 1px solid #0ff; background: #111; color: #0ff; outline: none; font-family: inherit; width: 200px; }
  button { padding: 10px 15px; border-radius: 4px; border: 1px solid #0ff; background: #111; color: #0ff; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.2s; }
  button:hover { background: #0ff; color: #000; box-shadow: 0 0 15px #0ff; }
  #canvases { display: flex; width: 100%; flex: 1; gap: 15px; padding: 15px; box-sizing: border-box; }
  .panel { flex: 1; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(0, 255, 255, 0.1); }
  canvas { width: 100%; height: 100%; object-fit: contain; }
  #viewCore { min-height: 250px; }
  #viewXray { image-rendering: pixelated; }
  #log { margin-top: 10px; color: #0f0; font-size: 14px; text-align: center; min-height: 20px; text-shadow: 0 0 5px #0f0; font-weight: bold; padding: 0 10px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/build/three.min.js"></script>
</head>
<body>
<div id="controls">
  <input id="msg" type="text" placeholder="Pesan rahasia..." value="TopSecretData2026">
  <button id="enc">🔒 ENCODE</button>
  <button id="dec">🔓 DECODE</button>
</div>

<div id="canvases">
  <div class="panel">
    <canvas id="viewCore"></canvas>
  </div>
  <div class="panel">
    <canvas id="viewXray"></canvas>
  </div>
</div>
<div id="log">Sistem siap...</div>

<script>
const msgInp = document.getElementById('msg');
const log = document.getElementById('log');
let renderer, scene, camera, cubeGroup;
let savedDataBuffer = null;
let texW = 0, texH = 0;

// ==========================================
// 1. SETUP THREE.JS (TAMPILAN 3D)
// ==========================================
function initThree() {
  const canvas = document.getElementById('viewCore');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  scene = new THREE.Scene();
  
  // Kamera dijauhkan agar kubus terlihat utuh
  camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
  camera.position.set(0, 0, 4); 
  
  cubeGroup = new THREE.Group();
  
  // 1. Kubus luar (Wireframe Neon)
  const wireframeGeom = new THREE.BoxGeometry(2, 2, 2);
  const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.3 });
  const wireframeCube = new THREE.Mesh(wireframeGeom, wireframeMat);
  cubeGroup.add(wireframeCube);

  // 2. Kubus dalam (Tempat Data)
  const dataGeom = new THREE.BoxGeometry(1.95, 1.95, 1.95); // Sedikit lebih kecil
  const dataMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
  const dataCube = new THREE.Mesh(dataGeom, dataMat);
  cubeGroup.add(dataCube);
  
  // Simpan referensi untuk diganti materialnya
  cubeGroup.userData.dataCube = dataCube;
  
  scene.add(cubeGroup);
  animate();
}

function animate() {
  requestAnimationFrame(animate);
  if (cubeGroup) {
    cubeGroup.rotation.x += 0.005;
    cubeGroup.rotation.y += 0.01;
  }
  if (renderer && scene && camera) {
    renderer.render(scene, camera);
  }
}

// ==========================================
// 2. PROSES ENCODE (Sembunyikan Data)
// ==========================================
function encodeData() {
  const text = msgInp.value.trim();
  if (!text) { 
    log.textContent = '❌ Masukkan teks terlebih dahulu!'; 
    log.style.color = '#ff3366'; return; 
  }

  const txtBytes = new TextEncoder().encode(text);
  const totalBytes = txtBytes.length + 4; 
  
  // Hitung grid (dibuat agak lebar agar terlihat)
  texW = Math.ceil(Math.sqrt(totalBytes));
  texH = Math.ceil(totalBytes / texW);

  const buf = new Uint8Array(texW * texH * 4);
  
  // Header (4 byte pertama)
  const lenBuf = new Uint8Array(4);
  new DataView(lenBuf.buffer).setUint32(0, txtBytes.length, true);
  
  // Simpan data di Channel RED (R)
  for(let i=0; i<4; i++) buf[i * 4] = lenBuf[i];
  for(let i=0; i<txtBytes.length; i++) buf[(4 + i) * 4] = txtBytes[i];

  // Set Alpha (Opacity) = 255 (Full)
  for(let i=0; i<buf.length; i+=4) buf[i+3] = 255;

  savedDataBuffer = buf; 

  // --- A. Terapkan ke Kubus 3D ---
  const texture = new THREE.DataTexture(buf, texW, texH, THREE.RGBAFormat, THREE.UnsignedByteType);
  texture.needsUpdate = true;
  texture.magFilter = THREE.NearestFilter; 
  texture.minFilter = THREE.NearestFilter;
  
  const dataCube = cubeGroup.userData.dataCube;
  dataCube.material.map = texture;
  dataCube.material.needsUpdate = true;

  // --- B. Gambar X-Ray (Diperbesar) ---
  const xrayCanvas = document.getElementById('viewXray');
  const ctx = xrayCanvas.getContext('2d');
  
  // Resolusi asli canvas disamakan dengan ukuran grid (misal 5x5)
  xrayCanvas.width = texW;
  xrayCanvas.height = texH;
  
  // Gambar data
  const imgData = ctx.createImageData(texW, texH);
  imgData.data.set(buf);
  ctx.putImageData(imgData, 0, 0);

  log.textContent = `✅ Data disembunyikan! (${totalBytes} byte, Grid ${texW}x${texH})`;
  log.style.color = "#0f0";
}

// ==========================================
// 3. PROSES DECODE (Ekstrak Data)
// ==========================================
function decodeData() {
  if (!savedDataBuffer) {
    log.textContent = '❌ Belum ada data yang di-encode!';
    log.style.color = '#ff3366';
    return;
  }

  try {
    // Baca Header (4 byte pertama)
    const lenBuf = new Uint8Array(4);
    for (let i = 0; i < 4; i++) lenBuf[i] = savedDataBuffer[i * 4];
    const msgLength = new DataView(lenBuf.buffer).getUint32(0, true);

    // Baca pesan
    const bodyBytes = new Uint8Array(msgLength);
    for (let i = 0; i < msgLength; i++) bodyBytes[i] = savedDataBuffer[(4 + i) * 4];

    const decodedText = new TextDecoder().decode(bodyBytes);
    log.textContent = `🔓 EKSTRAK SUKSES: "${decodedText}"`;
    log.style.color = "#0ff";
    
  } catch (e) {
    log.textContent = `❌ GAGAL: ${e.message}`;
    log.style.color = '#ff3366';
  }
}

// ==========================================
// 4. EVENT LISTENERS & RESIZE
// ==========================================
document.getElementById('enc').addEventListener('click', encodeData);
document.getElementById('dec').addEventListener('click', decodeData);

window.onload = () => {
  initThree();
  // Tangani resize agar canvas tidak gepeng
  window.addEventListener('resize', () => {
    const canvas = document.getElementById('viewCore');
    if (renderer && camera) {
      renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
    }
  });
};
</script>
</body>
</html>
