<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Holographic AI Avatar</title>
<style>
:root{--bg1:#0a2a78;--bg2:#030a22;--cy:#5cd6ff;--yl:#ffd23c;--or:#ff8a1f;--tx:#d8ecff;--pn:rgba(8,24,60,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:var(--tx)}
body{background:radial-gradient(ellipse at 50% 45%,var(--bg1),var(--bg2) 75%);transition:background 1.4s}
body.av{--bg1:#1b2236;--bg2:#05070d}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;pointer-events:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#hl{top:calc(14px + env(safe-area-inset-top,0px));left:16px;transition:opacity .8s}
#hl .t{font-size:30px;font-weight:300;letter-spacing:0;color:#fff}
#hl .m{opacity:.7;margin-top:2px}
body.av #hl{opacity:0}
#pill{position:fixed;z-index:8;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:6px 14px;border:1px solid var(--cy);border-radius:99px;background:var(--pn);color:var(--cy);font-size:11px;letter-spacing:.12em;cursor:pointer;display:none;backdrop-filter:blur(6px)}
#pill.on{display:block}
#pill i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--or);margin-right:8px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#exit{position:fixed;z-index:8;top:calc(14px + env(safe-area-inset-top,0px));left:14px;padding:5px 10px;border:1px solid var(--cy);border-radius:4px;background:var(--pn);color:var(--cy);font:11px/1 monospace;letter-spacing:.15em;cursor:pointer;display:none}
body.av #exit{display:block}
#stat{position:fixed;z-index:6;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);opacity:.85;min-height:16px;padding:0 12px}
#bar{position:fixed;z-index:7;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;padding:8px;border:1px solid rgba(92,214,255,.35);border-radius:16px;background:var(--pn);backdrop-filter:blur(8px)}
#bar button{display:flex;flex-direction:column;align-items:center;gap:4px;width:62px;padding:8px 0 6px;border:1px solid transparent;border-radius:10px;background:none;color:var(--tx);font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:.2s}
#bar button:hover,#bar button.on{border-color:var(--cy);background:rgba(92,214,255,.14);box-shadow:0 0 12px rgba(92,214,255,.4)}
#bar button.mic.on{border-color:var(--or);background:rgba(255,138,31,.15);box-shadow:0 0 12px rgba(255,138,31,.5)}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#lbls{position:fixed;inset:0;z-index:4;pointer-events:none;transition:opacity .6s}
#lbls.off{opacity:0}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:600;color:#fff;text-shadow:0 0 8px #0a2a78;pointer-events:auto;cursor:pointer;padding:2px 4px}
.lb.sel{color:var(--yl);text-shadow:0 0 10px var(--yl)}
.lb.y{color:#fff}.lb.c{color:#9fd8ff;font-weight:400}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="lbls"></div>
<div class="hud" id="hl"><div class="t" id="clk">--:--</div><div class="m" id="dt"></div><div class="m" id="gr" style="margin-top:10px"></div></div>
<div id="exit">Exit</div>
<div id="pill"><i></i>Berbicara · ketuk untuk berhenti</div>
<div id="stat"></div>
<div id="bar">
  <button id="bHub" class="on"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>Hub</button>
  <button id="bAv"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Avatar</button>
  <button id="bSp"><svg class="ic" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>Bicara</button>
  <button id="bMic" class="mic"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Mic</button>
</div>

<script type="x-shader/x-vertex" id="vs">
attribute vec3 p0,p1,p2; attribute vec4 c0,c1,c2; attribute float aR;
uniform float uT,uProg,uAmp,uPR; uniform int uFrom,uTo;
varying vec3 vC;
vec3 sp(int s){return s==0?p0:(s==1?p1:p2);}
vec4 sc(int s){return s==0?c0:(s==1?c1:c2);}
void main(){
  float p=clamp((uProg-aR*0.45)/0.55,0.,1.); p=p*p*(3.-2.*p);
  vec3 pos=mix(sp(uFrom),sp(uTo),p);
  pos+=vec3(sin(aR*61.+uT*2.),cos(aR*37.+uT*1.7),sin(aR*23.+uT*2.3))*sin(p*3.14159)*1.8;
  float n=0.022+uAmp*0.07;
  pos+=n*vec3(sin(uT*1.3+aR*80.+pos.y*3.),cos(uT*1.1+aR*50.+pos.x*3.),sin(uT*.9+aR*70.));
  vec4 c=mix(sc(uFrom),sc(uTo),p);
  vec4 mv=modelViewMatrix*vec4(pos,1.);
  gl_Position=projectionMatrix*mv;
  gl_PointSize=c.a*uPR*(40./-mv.z)*(1.+uAmp*.5);
  vC=c.rgb*(1.+uAmp*.7);
}
</script>
<script type="x-shader/x-fragment" id="fs">
varying vec3 vC;
void main(){float d=length(gl_PointCoord-.5)*2.;if(d>1.)discard;gl_FragColor=vec4(vC,pow(1.-d,1.6)*.95);}
</script>

<script>
(function(){
var N=17000,TAU=Math.PI*2,R=Math.random;
function g(){return (R()+R()+R()-1.5)*.8}
var NAMES=["Strategist","Researcher","Chief of staff","Sales","Marketing","Ops","Developer","Analytics","Social","CRM","Engineering","Calendar","Design","Memory","Email","Editor","Drive","Finance"];
var NP=NAMES.map(function(_,k){var a=k/18*TAU+.35,r=3.2+1.1*((k*7)%5)/4;return [Math.cos(a)*r*1.4,Math.sin(a)*r*.82+.2]});
var O=[0,.2];
function hub(i,f){
  if(f<.16){
    if(R()<.4){var a=R()*TAU,r=1.3+g()*.03;return [[O[0]+Math.cos(a)*r,O[1]+Math.sin(a)*r,g()*.05],[1,.8,.15,1.7]]}
    var u=R()*TAU,v=Math.acos(2*R()-1),rr=1.05*(.55+.45*R());
    return [[O[0]+rr*Math.sin(v)*Math.cos(u),O[1]+rr*Math.sin(v)*Math.sin(u),rr*Math.cos(v)*.6],[.3,.6,1,.9]];
  }
  if(f<.62){
    var k=(R()*18)|0,t=Math.pow(R(),.85),n=NP[k],dx=n[0]-O[0],dy=n[1]-O[1],l=Math.hypot(dx,dy);
    var sx=O[0]+dx/l*1.35,sy=O[1]+dy/l*1.35,s=(k%2?1:-1)*.8,cx=(sx+n[0])/2-dy/l*s,cy=(sy+n[1])/2+dx/l*s,q=1-t;
    var x=q*q*sx+2*q*t*cx+t*t*n[0],y=q*q*sy+2*q*t*cy+t*t*n[1];
    return [[x+g()*.05,y+g()*.05,g()*.15],[.2+.3*t,.55+.3*t,1,.75+.4*t]];
  }
  if(f<.72){
    var ln=(R()*14)|0,y2=(ln-6.5)*.62,x2=((ln*37)%11-5)*1.1+R()*3.2;
    return [[x2,y2+(Math.floor(x2*.8)%2?.14:0),-.4+g()*.1],[.15,.45,.95,.6]];
  }
  if(f<.8){var m=i%18,a2=R()*TAU;return [[NP[m][0]+Math.cos(a2)*.2,NP[m][1]+Math.sin(a2)*.2,0],m%2?[.35,.85,1,1.5]:[1,.82,.2,1.5]]}
  return [[(R()-.5)*16,(R()-.5)*9,-1-R()*2],[.15,.3,.7,.5]];
}
var AY=-1.3;
function avatar(i,f){
  var P,C;
  function face(x,y,z){var fo=1-(Math.pow(x/.85,2)+Math.pow((y-1.6)/.8,2));return z>.1&&fo>0?fo:0}
  if(f<.6||f<.7){
    var fillIn=f>=.6,v=((R()*60)|0)/30-.97+.016,y=1.5+v*1.55,rr=Math.sqrt(Math.max(0,1-v*v));
    var th=fillIn?Math.PI/2+g()*1.1:R()*TAU,sc=fillIn?.78+.22*R():1;
    var x=Math.cos(th)*1.15*rr*sc,z=Math.sin(th)*1.25*rr*sc;
    var fo=face(x,y,z);
    if(fo>0){C=[1,.5+.35*fo,.08+.2*fo,1.1+.7*fo]}
    else{var e=.55+.7*Math.abs(x)/1.15;C=[.1*e,.5*e,1*e,1.0]}
    if(fillIn&&fo<=0){C=[1,.45,.08,.9]}
    P=[x,y,z];
  }else if(f<.78){
    var th2=R()<.5?((R()*7)|0)/7*TAU+g()*.04:R()*TAU,y3=-.9+R()*1.0;
    P=[Math.cos(th2)*.5,y3,Math.sin(th2)*.42];
    C=R()<.5?[1,.65,.15,1.1]:[.2,.55,1,.9];
  }else if(f<.9){
    var k=(R()*10)|0,t=.05+R()*(Math.PI-.1),a=.9+k*.42;
    P=[a*Math.cos(t),-.9-k*.12+a*.5*Math.sin(t),.35*Math.sin(t)*(R()<.5?1:-1)*.8+g()*.05];
    var b=1-k*.07;C=[.1*b,.5*b,1*b,.9];
  }else if(f<.96){
    if(R()<.5)P=[g()*1.8,3.2+Math.abs(g())*1.2,g()*.6];else P=[1.8+Math.abs(g())*1.5,.9+g()*1.6,g()*.5];
    C=[.3,.75,1,.7];
  }else{
    P=[g()*.18,-.55+g()*.18,.3+g()*.1];C=[.5,.85,1,2.4];
  }
  P[1]+=AY;return [P,C];
}
function comet(i,f){
  var u,P,C;
  if(f>.92){var gx=g()*.3,gy=g()*.3;return [[gx,-1.9+gy,g()*.2],[.5+.5*R(),.9,1,1.8]]}
  u=Math.pow(R(),.6);var a=Math.PI*.9+u*Math.PI*1.6,j=(1-u)*.5+.04;
  P=[Math.cos(a)*3.6*(1-.58*u)+g()*j,-Math.sin(a)*2.1*(1-.5*u)-.4+g()*j,g()*j*.6];
  C=[.2+.5*u,.7+.2*u,1,.7+.5*u];
  return [P,C];
}
var gens=[hub,avatar,comet],pa=[],ca=[];
for(var s=0;s<3;s++){pa.push(new Float32Array(N*3));ca.push(new Float32Array(N*4))}
var ar=new Float32Array(N);
for(var i=0;i<N;i++){
  ar[i]=R();
  for(var s2=0;s2<3;s2++){var o=gens[s2](i,i/N);pa[s2].set(o[0],i*3);ca[s2].set(o[1],i*4)}
}
var cv=document.getElementById('cv');
var rd=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
var PR=Math.min(window.devicePixelRatio||1,2);rd.setPixelRatio(PR);
var sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,100);cam.position.z=12;
var geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));
for(var q=0;q<3;q++){geo.setAttribute('p'+q,new THREE.BufferAttribute(pa[q],3));geo.setAttribute('c'+q,new THREE.BufferAttribute(ca[q],4))}
geo.setAttribute('aR',new THREE.BufferAttribute(ar,1));
var U={uT:{value:0},uProg:{value:1},uAmp:{value:0},uPR:{value:PR},uFrom:{value:0},uTo:{value:0}};
var mat=new THREE.ShaderMaterial({vertexShader:document.getElementById('vs').textContent,fragmentShader:document.getElementById('fs').textContent,uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
var pts=new THREE.Points(geo,mat);pts.frustumCulled=false;sc.add(pts);

var asp=1,camZ=12,camZt=12;
function fit(){
  var w=innerWidth,h=innerHeight;asp=w/h;rd.setSize(w,h,false);cam.aspect=asp;cam.updateProjectionMatrix();
  camZt=[Math.min(30,Math.max(10.5,16.2/asp)),Math.min(24,Math.max(9.6,7.8/asp)),Math.min(24,Math.max(10,8.6/asp))][cur];
}
var cur=0,to=0,prog=1,dur=1.8,queue=null;
function go(s,d,after){
  if(s===cur&&prog>=1)return;
  U.uFrom.value=cur=to;U.uTo.value=to=s;prog=0;dur=d||1.8;queue=after||null;U.uProg.value=0;
  document.body.classList.toggle('av',s===1);
  document.getElementById('lbls').classList.toggle('off',s!==0);
  document.getElementById('bHub').classList.toggle('on',s===0);
  document.getElementById('bAv').classList.toggle('on',s===1);
  cur=s;fit();cur=s;
  setStat(s===0?'Pilih agen atau buka avatar':s===1?'Avatar aktif':'Membuka avatar…');
}
function setStat(t){document.getElementById('stat').textContent=t}
function open(){go(2,1.5,function(){go(1,1.6)})}
function exit(){go(2,1.1,function(){go(0,1.5)})}
document.getElementById('bHub').onclick=function(){if(cur===1)exit();else if(cur!==0)go(0,1.5)};
document.getElementById('bAv').onclick=function(){if(cur===0)open();else if(cur===2)go(1,1.4)};
document.getElementById('exit').onclick=exit;

/* labels */
var lb=document.getElementById('lbls'),els=[];
NAMES.forEach(function(n,k){
  var d=document.createElement('div');d.className='lb '+(k%2?'c':'y');d.textContent=n;
  d.onclick=function(){els.forEach(function(e){e.classList.remove('sel')});d.classList.add('sel');setStat('Agen aktif: '+n)};
  lb.appendChild(d);els.push(d);
});
var v3=new THREE.Vector3();
function place(){
  if(cur!==0)return;
  for(var k=0;k<18;k++){
    v3.set(NP[k][0],NP[k][1],0).project(cam);
    var x=(v3.x*.5+.5)*innerWidth,y=(-v3.y*.5+.5)*innerHeight,e=els[k],left=NP[k][0]<0;
    e.style.transform='translate('+(x+(left?-14-e.offsetWidth:14))+'px,'+(y-10)+'px)';
  }
}

/* audio + speaking */
var amp=0,micOn=false,spk=false,an,buf,ctx;
var pill=document.getElementById('pill');
function speak(on){
  spk=on;pill.classList.toggle('on',on);document.getElementById('bSp').classList.toggle('on',on);
  if(window.speechSynthesis){speechSynthesis.cancel()}
  if(on){
    var txt='Halo. Saya avatar AI Anda. Semua agen sudah siap membantu.';
    if(window.speechSynthesis&&window.SpeechSynthesisUtterance){
      var u=new SpeechSynthesisUtterance(txt);u.lang='id-ID';u.onend=function(){speak(false)};u.onerror=u.onend;speechSynthesis.speak(u);
    }else setTimeout(function(){speak(false)},4000);
  }
}
document.getElementById('bSp').onclick=function(){speak(!spk)};
pill.onclick=function(){speak(false)};
document.getElementById('bMic').onclick=async function(){
  var b=this;
  if(micOn){micOn=false;b.classList.remove('on');if(ctx)ctx.close();ctx=null;return}
  try{
    var st=await navigator.mediaDevices.getUserMedia({audio:true});
    ctx=new (window.AudioContext||window.webkitAudioContext)();an=ctx.createAnalyser();an.fftSize=256;
    ctx.createMediaStreamSource(st).connect(an);buf=new Uint8Array(an.frequencyBinCount);micOn=true;b.classList.add('on');
  }catch(e){setStat('Akses mikrofon ditolak atau tidak tersedia')}
};

/* hud */
function hud(){
  var d=new Date(),h=d.getHours();
  document.getElementById('clk').textContent=('0'+h).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  document.getElementById('dt').textContent=d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});
  document.getElementById('gr').textContent=(h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam')+' · 18 agen online';
}
hud();setInterval(hud,20000);

/* pointer */
var mx=0,my=0;
addEventListener('pointermove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
addEventListener('resize',fit);
fit();camZ=camZt;

var last=performance.now(),T=0;
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;U.uT.value=T;
  if(prog<1){prog=Math.min(1,prog+dt/dur);U.uProg.value=prog;if(prog>=1&&queue){var q2=queue;queue=null;q2()}}
  var a=0;
  if(micOn&&an){an.getByteFrequencyData(buf);var s=0;for(var i=0;i<buf.length;i++)s+=buf[i];a=Math.min(1,s/buf.length/70)}
  if(spk)a=Math.max(a,.35+.35*Math.abs(Math.sin(T*9)*Math.sin(T*3.1))+.15*R());
  amp+=(a-amp)*.25;U.uAmp.value=amp;
  camZ+=(camZt-camZ)*.06;cam.position.z=camZ;
  var ry=(cur===0?0:mx*.9),rx=(cur===0?0:my*.25);
  pts.rotation.y+=(ry-pts.rotation.y)*.06;pts.rotation.x+=(rx-pts.rotation.x)*.06;
  cam.position.x+=((cur===0?mx*.6:0)-cam.position.x)*.05;cam.lookAt(0,0,0);
  place();rd.render(sc,cam);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setStat('Pilih agen atau buka avatar');
})();
</script>
</body>
</html>
