<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Lab v3.1: Advanced Network Interceptor</title>
<style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
        --bg: #060a0f; --panel: #0b1118; --line: #1c2836;
        --cyan: #22d3ee; --green: #00ff9c; --purple: #b026ff;
        --red: #ff3b6b; --amber: #ffc857; --text: #c9d6e4; --muted: #6b7d92;
    }

    html, body { height: 100%; margin: 0; }

    body {
        display: flex; background: var(--bg); color: var(--text);
        font-family: 'Courier New', ui-monospace, monospace; overflow: hidden;
    }

    .panel {
        flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column;
        gap: 10px; padding: 14px 16px;
    }
    .panel.target {
        border-right: 1px solid var(--line);
        background: linear-gradient(180deg, #0b1118, #070c12);
    }
    .panel.hacker { background: #05080c; position: relative; overflow: hidden; }

    /* ---------- HEADER ---------- */
    .ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .ph h2 {
        margin: 0; font-size: 13px; letter-spacing: 1.6px;
        text-transform: uppercase; white-space: nowrap;
        display: flex; align-items: center; gap: 7px;
    }
    .ph h2 svg { flex: 0 0 auto; width: 16px; height: 16px; }
    .target .ph h2 { color: var(--cyan); }
    .hacker .ph h2 { color: var(--green); text-shadow: 0 0 10px rgba(0,255,156,.55); }

    .badge {
        font-size: 10px; letter-spacing: 1px; padding: 3px 8px;
        border-radius: 3px; border: 1px solid; white-space: nowrap;
    }
    .badge.ok { color: var(--green); border-color: rgba(0,255,156,.4); background: rgba(0,255,156,.08); }
    .badge.warn { color: var(--amber); border-color: rgba(255,200,87,.4); background: rgba(255,200,87,.08); }

    .stats { display: flex; gap: 6px; font-size: 10px; }
    .stats span {
        padding: 3px 8px; border: 1px solid var(--line); border-radius: 3px;
        color: var(--muted); transition: .2s;
    }
    .stats span.hot {
        color: var(--red); border-color: rgba(255,59,107,.5);
        background: rgba(255,59,107,.1);
    }

    .desc { margin: 0; font-size: 10.5px; line-height: 1.5; color: var(--muted); }

    /* ---------- URL BAR ---------- */
    .urlbar { display: flex; gap: 6px; }
    .urlbar input {
        flex: 1; background: #000; border: 1px solid var(--line);
        color: var(--text); padding: 7px 10px; font: inherit;
        font-size: 11px; border-radius: 3px; outline: none;
    }
    .urlbar input:focus { border-color: var(--cyan); }
    .urlbar button {
        padding: 7px 14px; background: transparent; border: 1px solid var(--cyan);
        color: var(--cyan); font: inherit; font-size: 11px; font-weight: bold;
        cursor: pointer; border-radius: 3px; transition: .15s;
    }
    .urlbar button:hover { background: rgba(34,211,238,.1); }
    .urlbar button.close-btn {
        border-color: var(--muted); color: var(--muted);
        padding: 7px 10px; display: none;
    }
    .urlbar button.close-btn.visible { display: inline-block; }
    .urlbar button.close-btn:hover { border-color: var(--red); color: var(--red); background: rgba(255,59,107,.1); }

    /* ---------- BUTTONS ---------- */
    .btn-group { display: flex; flex-direction: column; gap: 6px; }

    .btn {
        display: flex; align-items: center; gap: 10px; padding: 7px 12px;
        background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
        font: inherit; font-size: 10.5px; font-weight: bold; text-align: left;
        cursor: pointer; transition: all .18s;
    }
    .btn svg { flex: 0 0 auto; width: 14px; height: 14px; }
    .btn .lbl { flex: 1; }
    .btn:hover {
        background: rgba(34,211,238,.1); box-shadow: 0 0 14px rgba(34,211,238,.22);
        transform: translateX(3px);
    }
    .btn:active { transform: translateX(3px) scale(.985); }
    .btn.ws { border-color: var(--purple); color: var(--purple); }
    .btn.ws:hover { background: rgba(176,38,255,.1); box-shadow: 0 0 14px rgba(176,38,255,.28); }
    .btn.detect { border-color: var(--amber); color: var(--amber); }
    .btn.detect:hover { background: rgba(255,200,87,.1); box-shadow: 0 0 14px rgba(255,200,87,.25); }
    .btn.mini {
        border-color: #2b4c56; color: #6fa8b3;
        font-size: 10px; padding: 6px 10px;
    }
    .btn.mini:hover { border-color: #3d6b78; color: #8cd4e0; background: rgba(34,211,238,.05); transform: translateX(2px); }

    .group-label {
        font-size: 9px; letter-spacing: 1.4px; text-transform: uppercase;
        color: #3d4f63; margin: 2px 0 -2px;
    }

    /* ---------- SCREEN & IFRAME ---------- */
    .screen-wrap {
        flex: 1 1 auto; min-height: 100px;
        display: flex; position: relative;
    }
    .screen {
        flex: 1; overflow-y: auto; background: #000;
        border: 1px solid var(--line); padding: 8px 10px;
        font-size: 10.5px; line-height: 1.65;
    }
    .screen::-webkit-scrollbar { width: 6px; }
    .screen::-webkit-scrollbar-thumb { background: #1f3247; }
    .tline { color: #8ba0b8; }
    .tline.ok { color: var(--green); }
    .tline.err { color: var(--red); }

    #targetFrame {
        flex: 1; width: 100%; height: 100%; border: 1px solid var(--line);
        background: #fff; display: none;
    }

    /* ---------- FEED ---------- */
    .feed {
        height: 70px; flex: 0 0 auto; border: 1px solid var(--line);
        background: repeating-linear-gradient(0deg, #04070a, #04070a 2px, #060b10 2px, #060b10 4px);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px; font-size: 10px; letter-spacing: 1px; color: #26364a;
        position: relative; overflow: hidden; transition: .3s;
    }
    .feed.live { border-color: rgba(0,255,156,.35); color: var(--green); }
    .feed.live::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(180deg, transparent, rgba(0,255,156,.09), transparent);
        animation: sweep 2.4s linear infinite;
    }
    @keyframes sweep { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
    .feed .live-dot { animation: blink 1.1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .feed .cam { font-size: 13px; letter-spacing: 4px; color: var(--green); }
    .feed .url {
        font-size: 9px; color: #4d7a63; max-width: 92%;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ---------- TERMINAL ---------- */
    .filter-bar { display: flex; gap: 6px; }
    .filter-bar button {
        padding: 5px 12px; background: transparent; border: 1px solid var(--line);
        color: var(--muted); font: inherit; font-size: 9.5px; letter-spacing: 1px;
        cursor: pointer; transition: .15s; border-radius: 3px;
    }
    .filter-bar button:hover { color: var(--text); border-color: #2f4055; }
    .filter-bar button.on {
        color: var(--cyan); border-color: rgba(34,211,238,.5);
        background: rgba(34,211,238,.08);
    }
    .filter-bar button[data-filter="leak"].on {
        color: var(--red); border-color: rgba(255,59,107,.5);
        background: rgba(255,59,107,.08);
    }

    .terminal {
        flex: 1 1 auto; min-height: 120px; overflow-y: auto; background: #000;
        border: 1px solid var(--line); padding: 8px 10px;
        font-size: 10.5px; line-height: 1.6;
    }
    .terminal::-webkit-scrollbar { width: 7px; }
    .terminal::-webkit-scrollbar-thumb { background: #14372a; border-radius: 4px; }

    .log { white-space: pre-wrap; word-break: break-word; }
    .ts { color: #33475e; }
    .log-sys { color: #5d7288; }
    .log-info { color: var(--cyan); }
    .log-warn { color: var(--amber); }
    .log-danger { color: var(--red); }
    .log-success { color: var(--green); text-shadow: 0 0 8px rgba(0,255,156,.4); }

    /* ---------- VAULT ---------- */
    .vault {
        flex: 0 0 auto; max-height: 110px; overflow-y: auto;
        background: #080d13; border: 1px solid var(--line); padding: 7px 10px;
    }
    .vault h3 {
        margin: 0 0 5px; font-size: 10px; letter-spacing: 1.2px;
        text-transform: uppercase; color: var(--purple);
        display: flex; align-items: center; gap: 6px;
    }
    .vault h3 svg { width: 12px; height: 12px; }
    .vault h3 .count { color: var(--muted); font-weight: normal; }
    .vault ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
    .vault li {
        display: flex; align-items: center; gap: 6px; font-size: 10px;
        padding: 3px 6px; background: #0c141d; border-left: 2px solid var(--purple);
    }
    .vtag { flex: 0 0 auto; color: var(--purple); }
    .vault code {
        flex: 1; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; color: #9fb4c9;
    }
    .copy {
        flex: 0 0 auto; background: none; border: 1px solid var(--line);
        color: var(--muted); font-size: 10px; padding: 0 4px; cursor: pointer;
        border-radius: 2px; transition: .15s; display: flex; align-items: center;
    }
    .copy svg { width: 11px; height: 11px; }
    .copy:hover { color: var(--green); border-color: var(--green); }
    .copy.done { color: var(--green); border-color: var(--green); }

    /* ---------- ACTIONS ---------- */
    .actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .actions button {
        flex: 1 1 calc(50% - 3px); min-width: 0; padding: 7px 6px;
        background: transparent; border: 1px solid var(--line);
        color: var(--muted); font: inherit; font-size: 9.5px; letter-spacing: .3px;
        cursor: pointer; transition: .15s;
        display: flex; align-items: center; justify-content: center; gap: 5px;
        white-space: nowrap; overflow: hidden;
    }
    .actions button svg { width: 11px; height: 11px; flex: 0 0 auto; }
    .actions button:hover { color: var(--text); border-color: #2f4055; }
    .actions button.on {
        color: var(--green); border-color: rgba(0,255,156,.45);
        background: rgba(0,255,156,.07);
    }

    /* ---------- SCANLINE ---------- */
    .scanline {
        position: absolute; inset: 0; pointer-events: none; opacity: .35;
        background: linear-gradient(to bottom, transparent, transparent 50%, rgba(0,0,0,.35) 50%, rgba(0,0,0,.35));
        background-size: 100% 4px;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 860px) {
        body { flex-direction: column; overflow-y: auto; height: auto; }
        .panel { flex: 0 0 auto; }
        .panel.target { border-right: none; border-bottom: 1px solid var(--line); }
        .terminal { min-height: 240px; }
        .screen-wrap { min-height: 130px; }
        .feed { height: 80px; }
        .actions button { flex: 1 1 calc(50% - 3px); }
    }
</style>
</head>
<body>

<script>
/* ============================================================
   0. SIMPAN REFERENSI FUNGSI ASLI (NATIVE)
   ============================================================ */
const NATIVE = {
    fetch:            window.fetch,
    XHR:              window.XMLHttpRequest,
    XHRopen:          window.XMLHttpRequest.prototype.open,
    XHRsend:          window.XMLHttpRequest.prototype.send,
    WS:               window.WebSocket,
    StorageSet:       Storage.prototype.setItem,
    sendBeacon:       navigator.sendBeacon,
    RTC:              window.RTCPeerConnection,
    ES:               window.EventSource,
    freeze:           Object.freeze,
    seal:             Object.seal,
    preventExtensions: Object.preventExtensions
};

/* ============================================================
   1. UTILITAS
   ============================================================ */
const $     = (id) => document.getElementById(id);
const rnd   = (a, b) => a + Math.random() * (b - a);
const trunc = (s, n = 110) => { s = String(s); return s.length > n ? s.slice(0, n) + '…' : s; };
const now   = () => new Date().toLocaleTimeString('id-ID', { hour12: false });

const termEl = $('terminal');
const stats  = { req: 0, leak: 0 };
const vaultEntries = [];
const vaultSet = new Set();

/* ---------- SVG PATH HELPER (untuk elemen dinamis) ---------- */
const SVG_PATHS = {
    copy:  '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>',
    check: '<polyline points="20 6 9 17 4 12"/>'
};
function svgHTML(name, size = 11) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${SVG_PATHS[name] || ''}</svg>`;
}

/* ============================================================
   2. LOGGING TERMINAL (dengan dukungan filter)
   ============================================================ */
let currentFilter = 'all';  // 'all' | 'leak'

function log(msg, type = 'sys', isLeak = false) {
    const row = document.createElement('div');
    row.className = `log log-${type}`;
    if (isLeak) row.dataset.leak = '1';

    const stamp = document.createElement('span');
    stamp.className = 'ts';
    stamp.textContent = `[${now()}] `;
    row.appendChild(stamp);
    row.appendChild(document.createTextNode(msg));

    if (currentFilter === 'leak' && !isLeak) {
        row.style.display = 'none';
    }

    termEl.appendChild(row);
    termEl.scrollTop = termEl.scrollHeight;

    while (termEl.childElementCount > 400) termEl.removeChild(termEl.firstElementChild);
}

function updateVaultCount() {

function addVault(name, value) {
    if (!value || vaultSet.has(value)) return false;
    vaultSet.add(value);
    vaultEntries.push({ name, value });

    const li = document.createElement('li');
    const tag = document.createElement('span');
    tag.className = 'vtag';
    tag.textContent = name;

    const code = document.createElement('code');
    code.textContent = trunc(value, 56);
    code.title = value;

    const btn = document.createElement('button');
    btn.className = 'copy';
    btn.innerHTML = svgHTML('copy');
    btn.title = 'Salin';
    btn.addEventListener('click', () => {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(value).then(() => {
                btn.innerHTML = svgHTML('check');
                btn.classList.add('done');
                setTimeout(() => {
                    btn.innerHTML = svgHTML('copy');
                    btn.classList.remove('done');
                }, 1200);
            }).catch(() => {});
        }
    });

    li.append(tag, code, btn);
    $('vault').prepend(li);

    stats.leak++;
    refreshStats();
    updateVaultCount();
    return true;
}

/* ============================================================
   4. POLA SENSITIF (Capture Group = hanya nilai rahasia)
   ============================================================ */
const PATTERNS = [
    { name: 'JWT Token',    re: /(eyJ[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]+)/g },
    { name: 'HLS Stream',   re: /(https?:\/\/[^\s"'<>\\]+\.m3u8[^\s"'<>\\]*)/gi },
    { name: 'RTSP Cam',     re: /(rtsp:\/\/[^\s"'<>\\]+)/gi },
    { name: 'Secret Field', re: /"[a-zA-Z_]*(?:pin|password|secret|token)[a-zA-Z_]*"\s*:\s*"([^"]+)"/gi },
    { name: 'API Key',      re: /\b(sk_live_[A-Za-z0-9_-]{8,})/g }
];

/* ---------- FILTER IP: skip alamat non-rahasia ---------- */
function isInterestingIP(ip) {
    if (ip.startsWith('127.'))   return false;
    if (ip.startsWith('0.'))     return false;
    if (ip === '255.255.255.255') return false;
    return true;
}

function scanPayload(payload, source, verbose = false) {
    if (payload === undefined || payload === null) return 0;

    const text = (typeof payload === 'string') ? payload : JSON.stringify(payload);
    if (!text) return 0;

    let found = 0;

    for (const pattern of PATTERNS) {
        pattern.re.lastIndex = 0;
        let match;
        while ((match = pattern.re.exec(text)) !== null) {
            const value = match[1];
            if (!value) continue;
            if (pattern.name === 'IP Address' && !isInterestingIP(value)) continue;

            if (addVault(pattern.name, value)) {
                found++;
                log(`[LEAK] ${pattern.name} (via ${source}): ${trunc(value, 78)}`, 'danger', true);
            }
        }
    }

    if (found === 0 && verbose) {
        log(`[SCAN] ${source}: bersih — tidak ada pola sensitif.`, 'sys');
    }

    return found;
}

   5. UTIL: timeout wrapper
   ============================================================ */
function withTimeout(promise, ms) {
    return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
    ]);
}

/* ---------- 7A. FETCH (Pass-Through Sniffer) ---------- */
async function hookedFetch(input, init) {
    const url = (typeof input === 'string') ? input : (input && input.url) || String(input);
    const method = (init && init.method) || 'GET';

    stats.req++; refreshStats();
    log(`[FETCH] ${method} ${trunc(url, 82)}`, 'info');
    if (init && init.body) log(`[FETCH] body → ${trunc(init.body, 60)}`, 'warn');

    /* --- Selective mock: hanya untuk API CCTV demo --- */
    if (url.includes('api.cctv-portal.go.id')) {
        const payload = MOCK_FETCH_PAYLOAD();
        const body = JSON.stringify(payload);
        const response = new Response(body, {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
        });
        response.clone().text().then(t => scanPayload(t, 'FETCH')).catch(() => {});
        return response;
    }

    /* --- Pass-through ke server ASLI --- */
    try {
        const response = await withTimeout(NATIVE.fetch.call(this, input, init), 8000);
        response.clone().text()
            .then(text => scanPayload(text, 'FETCH', true))
            .catch(() => {});
        return response;
    } catch (err) {
        /* Fallback OFFLINE untuk demo button JSONPlaceholder */
        if (url.includes('jsonplaceholder.typicode.com')) {
            log(`[FETCH] ⚠ Native gagal (${err.message}) — fallback demo offline`, 'warn');
            const mock = JSON.stringify({
                userId: 1, id: 1,
                title: 'delectus aut autem (offline fallback)',
                completed: false
            });
            return new Response(mock, {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
            });
        }
        log(`[FETCH] ✖ ${err.message}`, 'danger');
        throw err;
    }
}

/* ---------- 7B. XHR (Pass-Through Sniffer) ---------- */
function hookedXHROpen(method, url) {
    this.__meta = { method: String(method || 'GET').toUpperCase(), url: String(url) };
    return NATIVE.XHRopen.apply(this, arguments);
}

function hookedXHRSend(body) {
    const meta = this.__meta || {};
    stats.req++; refreshStats();
    log(`[XHR] ${meta.method || 'GET'} ${trunc(meta.url || '?', 82)}`, 'info');
    if (body) log(`[XHR] body → ${trunc(body, 60)}`, 'warn');

    /* --- Selective mock: hanya untuk API CCTV demo --- */
    if (meta.url && meta.url.includes('api.cctv-portal.go.id')) {
        const self = this;
        const payload = MOCK_XHR_PAYLOAD();
        const bodyStr = JSON.stringify(payload);

        setTimeout(() => {
            const props = {
                readyState: 4,
                status: 200,
                statusText: 'OK',
                responseText: bodyStr,
                response: bodyStr,
                responseURL: meta.url
            };
            for (const [k, v] of Object.entries(props)) {
                try {
                    Object.defineProperty(self, k, { value: v, configurable: true, writable: true });
                } catch (e) {
                    try { self[k] = v; } catch (e2) {}
                }
            }
            fireXHREvent(self, 'readystatechange');
            fireXHREvent(self, 'load');
            fireXHREvent(self, 'loadend');
            scanPayload(bodyStr, 'XHR');
        }, 400);
        return;
    }

    /* --- Pass-through: sniff response lewat listener 'load' --- */
    this.addEventListener('load', function () {
        try {
            if (this.responseType === '' || this.responseType === 'text') {
                scanPayload(this.responseText, 'XHR', true);
            } else if (this.responseType === 'json') {
                scanPayload(this.response, 'XHR', true);
            }
        } catch (e) {}
    });

    return NATIVE.XHRsend.apply(this, arguments);
}

function fireXHREvent(xhr, type) {
    try { xhr.dispatchEvent(new Event(type)); } catch (e) {}
    const handler = xhr['on' + type];
    if (typeof handler === 'function') {
        try { handler.call(xhr, new Event(type)); } catch (e) {}
    }
}

/* ---------- 7C. WEBSOCKET (Pass-Through Sniffer) ---------- */
class MockWS extends EventTarget {
    constructor(url) {
        super();
        this.url = String(url);
        this.protocol = '';
        this.readyState = 0;
        this.bufferedAmount = 0;
        this.binaryType = 'blob';
        setTimeout(() => {
            if (this.readyState !== 0) return;
            this.readyState = 1;
            this.dispatchEvent(new Event('open'));
            if (typeof this.onopen === 'function') {
                try { this.onopen(new Event('open')); } catch (e) {}
            }
        }, 300);
    }
    send(data) {
        log(`[WS] → ${trunc(data, 60)}`, 'warn');
        let cmd = 'UNKNOWN';
        try { cmd = JSON.parse(data).command || cmd; } catch (e) {}
        const reply = MOCK_WS_PAYLOAD(cmd);
        setTimeout(() => {
            const ev = new MessageEvent('message', { data: reply });
            this.dispatchEvent(ev);
            if (typeof this.onmessage === 'function') {
                try { this.onmessage(ev); } catch (e) {}
            }
            scanPayload(reply, 'WEBSOCKET');
        }, 600);
    }
    close() {
        this.readyState = 3;
        this.dispatchEvent(new Event('close'));
        if (typeof this.onclose === 'function') {
            try { this.onclose(new Event('close')); } catch (e) {}
        }
    }
}

function HookedWS(url, protocols) {
    const urlStr = String(url);
    stats.req++; refreshStats();
    log(`[WS] handshake → ${trunc(urlStr, 82)}`, 'info');

    /* --- Selective mock: hanya untuk drone CCTV demo --- */
    if (urlStr.includes('drone.cctv-portal.go.id')) {
        return new MockWS(urlStr);
    }

    /* --- Pass-through ke server ASLI --- */
    const ws = (protocols !== undefined)
        ? new NATIVE.WS(url, protocols)
        : new NATIVE.WS(url);

    ws.addEventListener('open',  () => log('[WS] terbuka', 'success'));
    ws.addEventListener('close', () => log('[WS] ditutup', 'sys'));
    ws.addEventListener('error', () => log('[WS] error', 'danger'));
    ws.addEventListener('message', (e) => {
        log(`[WS] ← frame ${String(e.data).length} byte`, 'info');
        scanPayload(e.data, 'WEBSOCKET');
    });

    /* Sniff frame keluar */
    const nativeSend = ws.send.bind(ws);
    ws.send = function (data) {
        log(`[WS] → ${trunc(data, 60)}`, 'warn');
        scanPayload(data, 'WS-SEND');
        return nativeSend(data);
    };

    return ws;
}
HookedWS.prototype = NATIVE.WS.prototype;
HookedWS.CONNECTING = 0;
HookedWS.OPEN = 1;
HookedWS.CLOSING = 2;
HookedWS.CLOSED = 3;

/* ---------- 7E. RTCPeerConnection ---------- */
function HookedRTC(config) {
    stats.req++; refreshStats();
    log('[RTC] PeerConnection dibuat', 'info');

    if (config && config.iceServers) {
        const cfg = JSON.stringify(config.iceServers);
        log(`[RTC] ICE servers: ${trunc(cfg, 70)}`, 'warn');
        scanPayload(cfg, 'RTC-CONFIG');
    }

    const pc = new NATIVE.RTC(config);

    const origSetLocal = pc.setLocalDescription.bind(pc);
    pc.setLocalDescription = function (desc) {
        if (desc && desc.sdp) {
            log(`[RTC] SDP lokal (${desc.sdp.length} byte)`, 'info');
            scanPayload(desc.sdp, 'RTC-SDP-LOCAL');
        }
        return origSetLocal(desc);
    };

    const origSetRemote = pc.setRemoteDescription.bind(pc);
    pc.setRemoteDescription = function (desc) {
        if (desc && desc.sdp) {
            log(`[RTC] SDP remote (${desc.sdp.length} byte)`, 'info');
            scanPayload(desc.sdp, 'RTC-SDP-REMOTE');
        }
        return origSetRemote(desc);
    };

    const origAddIce = pc.addIceCandidate.bind(pc);
    pc.addIceCandidate = function (candidate) {
        if (candidate && candidate.candidate) {
            log(`[RTC] ICE candidate: ${trunc(candidate.candidate, 60)}`, 'sys');
            scanPayload(candidate.candidate, 'RTC-ICE');
        }
        return origAddIce(candidate);
    };

    return pc;
}
HookedRTC.prototype = NATIVE.RTC.prototype;

/* ---------- 7F. navigator.sendBeacon ---------- */
function hookedSendBeacon(url, data) {
    stats.req++; refreshStats();
    log(`[BEACON] → ${trunc(url, 82)}`, 'info');

    if (data !== undefined && data !== null) {
        if (typeof data === 'string') {
            log(`[BEACON] payload: ${trunc(data, 60)}`, 'warn');
            scanPayload(data, 'BEACON');
        } else if (data instanceof Blob) {
            data.text().then(t => {
                log(`[BEACON] blob payload: ${trunc(t, 60)}`, 'warn');
                scanPayload(t, 'BEACON');
            }).catch(() => {});
        } else {
            log(`[BEACON] payload: [FormData/binary]`, 'sys');
        }
    }

    try {
        return NATIVE.sendBeacon.call(navigator, url, data);
    } catch (e) {
        log(`[BEACON] ✖ ${e.message}`, 'danger');
        return false;
    }
}

/* ============================================================
   8. PASANG / LEPAS HOOKS (Idempotent)
   ============================================================ */
let hooksActive = false;

function applyHooks() {
    if (hooksActive) return;

    window.fetch = hookedFetch;
    NATIVE.XHR.prototype.open = hookedXHROpen;
    NATIVE.XHR.prototype.send = hookedXHRSend;
    window.WebSocket = HookedWS;
    HookedWS.prototype = NATIVE.WS.prototype;
    Storage.prototype.setItem = hookedSetItem;

    if (NATIVE.RTC) window.RTCPeerConnection = HookedRTC;
    if (NATIVE.sendBeacon) {
        try {
            Object.defineProperty(navigator, 'sendBeacon', {
                value: hookedSendBeacon,
                writable: true,
                configurable: true
            });
        } catch (e) {
            try { navigator.sendBeacon = hookedSendBeacon; } catch (e2) {}
        }
    }
    if (NATIVE.ES) window.EventSource = HookedES;

    hooksActive = true;
    $('targetStatus').textContent = 'ONLINE (Hooked)';
    $('targetStatus').className = 'badge warn';
    $('restoreLbl').textContent = 'RESTORE';
}

function removeHooks() {
    if (!hooksActive) return;
    if (stealthOn) setStealth(false);

    window.fetch = NATIVE.fetch;
    NATIVE.XHR.prototype.open = NATIVE.XHRopen;
    NATIVE.XHR.prototype.send = NATIVE.XHRsend;
    window.WebSocket = NATIVE.WS;
    Storage.prototype.setItem = NATIVE.StorageSet;

    if (NATIVE.RTC) window.RTCPeerConnection = NATIVE.RTC;
    if (NATIVE.sendBeacon) {
        try {
            Object.defineProperty(navigator, 'sendBeacon', {
                value: NATIVE.sendBeacon,
                writable: true,
                configurable: true
            });
        } catch (e) {
            try { navigator.sendBeacon = NATIVE.sendBeacon; } catch (e2) {}
        }
    }
    if (NATIVE.ES) window.EventSource = NATIVE.ES;

    /* Restore Object.freeze/seal bila di-patch oleh stealth */
    if (window.__stealthBackup) {
        Object.freeze = window.__stealthBackup.freeze;
        Object.seal = window.__stealthBackup.seal;
        Object.preventExtensions = window.__stealthBackup.preventExtensions;
        delete window.__stealthBackup;
    }

    hooksActive = false;
    $('targetStatus').textContent = 'ONLINE (Native)';
    $('targetStatus').className = 'badge ok';
    $('restoreLbl').textContent = 'REAPPLY';
    log('[SYS] Semua hook dilepas. Sistem kembali normal.', 'success');
}

/* ============================================================
   9. STEALTH MODE (toString + freeze protection)
   ============================================================ */
let stealthOn = false;

function setStealth(on) {
    stealthOn = on;

    const fakeNative = (name) => `function ${name}() { [native code] }`;

    const hookTargets = [
        [window.fetch,                    'fetch'],
        [XMLHttpRequest.prototype.open,   'open'],
        [XMLHttpRequest.prototype.send,   'send'],
        [window.WebSocket,                'WebSocket'],
        [Storage.prototype.setItem,       'setItem'],
        [navigator.sendBeacon,            'sendBeacon'],
        [window.RTCPeerConnection,        'RTCPeerConnection'],
        [window.EventSource,              'EventSource']
    ];

    if (on) {
        /* 1) Palsukan toString */
        for (const [fn, name] of hookTargets) {
            if (typeof fn === 'function') {
                try { fn.toString = () => fakeNative(name); } catch (e) {}
            }
        }

        /* 2) Lindungi hook dari Object.freeze / seal / preventExtensions */
        if (!window.__stealthBackup) {
            window.__stealthBackup = {
                freeze:           Object.freeze,
                seal:             Object.seal,
                preventExtensions: Object.preventExtensions
            };
        }
        const bk = window.__stealthBackup;

        Object.freeze = function (obj) {
            if (obj === window || obj === navigator) {
                log('[STEALTH] Object.freeze() pada global diblokir', 'warn');
                return obj;
            }
            return bk.freeze.call(Object, obj);
        };
        Object.seal = function (obj) {
            if (obj === window || obj === navigator) {
                log('[STEALTH] Object.seal() pada global diblokir', 'warn');
                return obj;
            }
            return bk.seal.call(Object, obj);
        };
        Object.preventExtensions = function (obj) {
            if (obj === window || obj === navigator) {
                log('[STEALTH] Object.preventExtensions() pada global diblokir', 'warn');
                return obj;
            }
            return bk.preventExtensions.call(Object, obj);
        };

        log('[SYS] Stealth AKTIF — hook disamarkan & dilindungi dari freeze/seal', 'success');
    } else {
        /* 1) Pulihkan toString */
        for (const [fn] of hookTargets) {
            if (typeof fn === 'function') {
                try { delete fn.toString; } catch (e) {}
            }
        }
        /* 2) Pulihkan Object.* */
        if (window.__stealthBackup) {
            Object.freeze = window.__stealthBackup.freeze;
            Object.seal = window.__stealthBackup.seal;
            Object.preventExtensions = window.__stealthBackup.preventExtensions;
            delete window.__stealthBackup;
        }
        log('[SYS] Stealth NONAKTIF — hook terdeteksi', 'warn');
    }

    $('stealthLbl').textContent = `STEALTH: ${on ? 'ON' : 'OFF'}`;
    $('stealthBtn').classList.toggle('on', on);
}

                tlog('200 OK — respons tidak valid', 'err');
            }
        } else {
            tlog(`✖ ${xhr.status} ${xhr.statusText}`, 'err');
        }
    };
    xhr.onerror = function () { tlog('✖ network error', 'err'); };
    xhr.send();
}

/* ---------- 10F. INTEGRITY CHECK ---------- */
function targetDetect() {
    tlog('Menjalankan Integrity Check...');

    setTimeout(() => {
        const checks = [
            ['window.fetch',                window.fetch],
            ['XMLHttpRequest.open',         XMLHttpRequest.prototype.open],
            ['XMLHttpRequest.send',         XMLHttpRequest.prototype.send],
            ['window.WebSocket',            window.WebSocket],
            ['Storage.setItem',             Storage.prototype.setItem],
            ['navigator.sendBeacon',        navigator.sendBeacon],
            ['window.RTCPeerConnection',    window.RTCPeerConnection],
            ['window.EventSource',          window.EventSource]
        ].filter(([, fn]) => typeof fn === 'function');

        const dirty = checks
            .filter(([, fn]) => !/\[native code\]/.test(String(fn)))
            .map(([name]) => name);

        if (dirty.length) {
            tlog(`⚠ ANOMALI pada: ${dirty.join(', ')}`, 'err');
        } else {
            tlog('✔ Lingkungan bersih. Tidak ada hook terdeteksi.', 'ok');
        }
    }, 400);
}

/* ============================================================
   11. URL / IFRAME LOADER
   ============================================================ */
function openUrl() {
    let url = $('urlInput').value.trim();
    if (!url) return;

    /* Auto-prepend scheme jika perlu */
    if (!/^https?:\/\//i.test(url) && !/^(about|data):/i.test(url)) {
        if (/^[\w.-]+\.[a-z]{2,}/i.test(url)) url = 'https://' + url;
        else { tlog('URL tidak valid.', 'err'); return; }
    }

    const frame  = $('targetFrame');
    const screen = $('targetScreen');

    frame.src = url;
    frame.style.display = 'block';
    screen.style.display = 'none';
    $('closeUrlBtn').classList.add('visible');

    tlog(`Memuat iframe: ${trunc(url, 40)}`);
    log(`[BROWSER] Memuat iframe: ${trunc(url, 70)}`, 'warn');
    log(`[BROWSER] ⚠ Catatan: request dari iframe TIDAK dapat disadap dari parent (same-origin policy).`, 'sys');
    log(`[BROWSER] Gunakan tombol demo di panel kiri untuk menguji hook.`, 'sys');
}

function closeUrl() {
    const frame  = $('targetFrame');
    const screen = $('targetScreen');

    frame.src = 'about:blank';
    frame.style.display = 'none';
    screen.style.display = '';
    $('closeUrlBtn').classList.remove('visible');
    tlog('Iframe ditutup.');
}

/* ============================================================
   12. EXPORT VAULT (JSON)
   ============================================================ */
function exportVault() {
    if (vaultEntries.length === 0) {
        log('[EXPORT] Vault kosong — tidak ada yang diekspor.', 'warn');
        return;
    }

    const data = {
        exported_at: new Date().toISOString(),
        total: vaultEntries.length,
        entries: vaultEntries
    };

    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = `vault-${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(() => URL.revokeObjectURL(url), 1500);
    log(`[EXPORT] ${vaultEntries.length} entri diekspor ke vault-*.json`, 'success');
}
