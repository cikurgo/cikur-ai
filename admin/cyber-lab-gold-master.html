<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Lab v3: Advanced Network Interceptor</title>
<style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
        --bg: #060a0f; --panel: #0b1118; --line: #1c2836;
        --cyan: #22d3ee; --green: #00ff9c; --purple: #b026ff;
        --red: #ff3b6b; --amber: #ffc857; --text: #c9d6e4; --muted: #6b7d92;
    }

    html, body { height: 100%; margin: 0; }

    body {
        display: flex; background: var(--bg); color: var(--text);
        font-family: 'Courier New', ui-monospace, monospace; overflow: hidden;
    }

    .panel {
        flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column;
        gap: 12px; padding: 16px 18px;
    }
    .panel.target {
        border-right: 1px solid var(--line);
        background: linear-gradient(180deg, #0b1118, #070c12);
    }
    .panel.hacker { background: #05080c; position: relative; overflow: hidden; }

    /* ---------- HEADER ---------- */
    .ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .ph h2 {
        margin: 0; font-size: 13px; letter-spacing: 1.6px;
        text-transform: uppercase; white-space: nowrap;
        display: flex; align-items: center; gap: 7px;
    }
    .ph h2 svg { flex: 0 0 auto; width: 16px; height: 16px; }
    .target .ph h2 { color: var(--cyan); }
    .hacker .ph h2 { color: var(--green); text-shadow: 0 0 10px rgba(0,255,156,.55); }

    .badge {
        font-size: 10px; letter-spacing: 1px; padding: 3px 8px;
        border-radius: 3px; border: 1px solid; white-space: nowrap;
    }
    .badge.ok { color: var(--green); border-color: rgba(0,255,156,.4); background: rgba(0,255,156,.08); }
    .badge.warn { color: var(--amber); border-color: rgba(255,200,87,.4); background: rgba(255,200,87,.08); }

    .stats { display: flex; gap: 6px; font-size: 10px; }
    .stats span {
        padding: 3px 8px; border: 1px solid var(--line); border-radius: 3px;
        color: var(--muted); transition: .2s;
    }
    .stats span.hot {
        color: var(--red); border-color: rgba(255,59,107,.5);
        background: rgba(255,59,107,.1);
    }

    .desc { margin: 0; font-size: 11px; line-height: 1.55; color: var(--muted); }

    /* ---------- BUTTONS ---------- */
    .btn-group { display: flex; flex-direction: column; gap: 8px; }

    .btn {
        display: flex; align-items: center; gap: 10px; padding: 9px 12px;
        background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
        font: inherit; font-size: 11px; font-weight: bold; text-align: left;
        cursor: pointer; transition: all .18s;
    }
    .btn svg { flex: 0 0 auto; width: 15px; height: 15px; }
    .btn .lbl { flex: 1; }
    .btn:hover {
        background: rgba(34,211,238,.1); box-shadow: 0 0 14px rgba(34,211,238,.22);
        transform: translateX(3px);
    }
    .btn:active { transform: translateX(3px) scale(.985); }
    .btn.ws { border-color: var(--purple); color: var(--purple); }
    .btn.ws:hover { background: rgba(176,38,255,.1); box-shadow: 0 0 14px rgba(176,38,255,.28); }
    .btn.detect { border-color: var(--amber); color: var(--amber); }
    .btn.detect:hover { background: rgba(255,200,87,.1); box-shadow: 0 0 14px rgba(255,200,87,.25); }

    /* ---------- TARGET SCREEN ---------- */
    .screen {
        flex: 1 1 auto; min-height: 110px; overflow-y: auto; background: #000;
        border: 1px solid var(--line); padding: 10px 12px;
        font-size: 11px; line-height: 1.7;
    }
    .screen::-webkit-scrollbar { width: 6px; }
    .screen::-webkit-scrollbar-thumb { background: #1f3247; }
    .tline { color: #8ba0b8; }
    .tline.ok { color: var(--green); }
    .tline.err { color: var(--red); }

    /* ---------- FEED ---------- */
    .feed {
        height: 88px; flex: 0 0 auto; border: 1px solid var(--line);
        background: repeating-linear-gradient(0deg, #04070a, #04070a 2px, #060b10 2px, #060b10 4px);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 4px; font-size: 10px; letter-spacing: 1px; color: #26364a;
        position: relative; overflow: hidden; transition: .3s;
    }
    .feed.live { border-color: rgba(0,255,156,.35); color: var(--green); }
    .feed.live::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(180deg, transparent, rgba(0,255,156,.09), transparent);
        animation: sweep 2.4s linear infinite;
    }
    @keyframes sweep { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
    .feed .live-dot { animation: blink 1.1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .feed .cam { font-size: 15px; letter-spacing: 4px; color: var(--green); }
    .feed .url {
        font-size: 9.5px; color: #4d7a63; max-width: 92%;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ---------- TERMINAL ---------- */
    .terminal {
        flex: 1 1 auto; min-height: 140px; overflow-y: auto; background: #000;
        border: 1px solid var(--line); padding: 10px 12px;
        font-size: 11px; line-height: 1.65;
    }
    .terminal::-webkit-scrollbar { width: 7px; }
    .terminal::-webkit-scrollbar-thumb { background: #14372a; border-radius: 4px; }

    .log { white-space: pre-wrap; word-break: break-word; }
    .ts { color: #33475e; }
    .log-sys { color: #5d7288; }
    .log-info { color: var(--cyan); }
    .log-warn { color: var(--amber); }
    .log-danger { color: var(--red); }
    .log-success { color: var(--green); text-shadow: 0 0 8px rgba(0,255,156,.4); }

    /* ---------- VAULT ---------- */
    .vault {
        flex: 0 0 auto; max-height: 120px; overflow-y: auto;
        background: #080d13; border: 1px solid var(--line); padding: 8px 10px;
    }
    .vault h3 {
        margin: 0 0 6px; font-size: 10px; letter-spacing: 1.2px;
        text-transform: uppercase; color: var(--purple);
        display: flex; align-items: center; gap: 6px;
    }
    .vault h3 svg { width: 12px; height: 12px; }
    .vault h3 .count { color: var(--muted); font-weight: normal; }
    .vault ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .vault li {
        display: flex; align-items: center; gap: 7px; font-size: 10.5px;
        padding: 4px 7px; background: #0c141d; border-left: 2px solid var(--purple);
    }
    .vtag { flex: 0 0 auto; color: var(--purple); }
    .vault code {
        flex: 1; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; color: #9fb4c9;
    }
    .copy {
        flex: 0 0 auto; background: none; border: 1px solid var(--line);
        color: var(--muted); font-size: 10px; padding: 1px 5px; cursor: pointer;
        border-radius: 2px; transition: .15s; display: flex; align-items: center;
    }
    .copy svg { width: 11px; height: 11px; }
    .copy:hover { color: var(--green); border-color: var(--green); }
    .copy.done { color: var(--green); border-color: var(--green); }

    /* ---------- ACTIONS ---------- */
    .actions { display: flex; gap: 8px; }
    .actions button {
        flex: 1; padding: 8px 6px; background: transparent; border: 1px solid var(--line);
        color: var(--muted); font: inherit; font-size: 10px; letter-spacing: .5px;
        cursor: pointer; transition: .15s;
        display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .actions button svg { width: 12px; height: 12px; flex: 0 0 auto; }
    .actions button:hover { color: var(--text); border-color: #2f4055; }
    .actions button.on {
        color: var(--green); border-color: rgba(0,255,156,.45);
        background: rgba(0,255,156,.07);
    }

    /* ---------- SCANLINE ---------- */
    .scanline {
        position: absolute; inset: 0; pointer-events: none; opacity: .35;
        background: linear-gradient(to bottom, transparent, transparent 50%, rgba(0,0,0,.35) 50%, rgba(0,0,0,.35));
        background-size: 100% 4px;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 860px) {
        body { flex-direction: column; overflow-y: auto; height: auto; }
        .panel { flex: 0 0 auto; }
        .panel.target { border-right: none; border-bottom: 1px solid var(--line); }
        .terminal { min-height: 260px; }
        .screen { min-height: 130px; }
        .feed { height: 84px; }
    }
</style>
</head>
<body>

<script>
/* ============================================================
   0. SIMPAN REFERENSI FUNGSI ASLI (NATIVE)
   ============================================================ */
const NATIVE = {
    fetch: window.fetch,
    XHR: window.XMLHttpRequest,
    XHRopen: window.XMLHttpRequest.prototype.open,
    XHRsend: window.XMLHttpRequest.prototype.send,
    WS: window.WebSocket,
    StorageSet: Storage.prototype.setItem
};

/* ============================================================
   1. UTILITAS
   ============================================================ */
const $     = (id) => document.getElementById(id);
const rnd   = (a, b) => a + Math.random() * (b - a);
const trunc = (s, n = 110) => { s = String(s); return s.length > n ? s.slice(0, n) + '…' : s; };
const now   = () => new Date().toLocaleTimeString('id-ID', { hour12: false });

const termEl = $('terminal');
const stats  = { req: 0, leak: 0 };
const vaultMap = new Map();

/* ---------- SVG ICON HELPER (untuk elemen dinamis) ---------- */
const SVG_PATHS = {
    copy:    '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>',
    check:   '<polyline points="20 6 9 17 4 12"/>',
    dot:     '<circle cx="5" cy="5" r="4" fill="currentColor" stroke="none"/>'
};

function svgHTML(name, size = 12) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${SVG_PATHS[name] || ''}</svg>`;
}

/* ============================================================
   2. LOGGING TERMINAL
   ============================================================ */
function log(msg, type = 'sys') {
    const row = document.createElement('div');
    row.className = `log log-${type}`;

    const stamp = document.createElement('span');
    stamp.className = 'ts';
    stamp.textContent = `[${now()}] `;
    row.appendChild(stamp);
    row.appendChild(document.createTextNode(msg));

    termEl.appendChild(row);
    termEl.scrollTop = termEl.scrollHeight;

    // Jaga DOM tetap ringan
    while (termEl.childElementCount > 400) termEl.removeChild(termEl.firstElementChild);
}

function refreshStats() {
    $('statReq').textContent  = `${stats.req} request`;
    $('statLeak').textContent = `${stats.leak} bocor`;
    $('statLeak').classList.toggle('hot', stats.leak > 0);
}

/* ============================================================
   3. VAULT & SCANNER
   ============================================================ */
function updateVaultCount() {
    $('vaultCount').textContent = `(${vaultMap.size})`;
}

function addVault(name, value) {
    if (!value || vaultMap.has(value)) return false;
    vaultMap.set(value, true);

    const li = document.createElement('li');

    const tag = document.createElement('span');
    tag.className = 'vtag';
    tag.textContent = name;

    const code = document.createElement('code');
    code.textContent = trunc(value, 62);
    code.title = value;

    const btn = document.createElement('button');
    btn.className = 'copy';
    btn.innerHTML = svgHTML('copy');
    btn.title = 'Salin';
    btn.addEventListener('click', () => {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(value).then(() => {
                btn.innerHTML = svgHTML('check');
                btn.classList.add('done');
                setTimeout(() => {
                    btn.innerHTML = svgHTML('copy');
                    btn.classList.remove('done');
                }, 1200);
            }).catch(() => {});
        }
    });

    li.append(tag, code, btn);
    $('vault').prepend(li);

    stats.leak++;
    refreshStats();
    updateVaultCount();
    return true;
}

/* ---------- POLA SENSITIF ---------- */
const PATTERNS = [
    { name: 'JWT Token',    re: /(eyJ[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]+)/g },
    { name: 'HLS Stream',   re: /(https?:\/\/[^\s"'<>\\]+\.m3u8[^\s"'<>\\]*)/gi },
    { name: 'RTSP Cam',     re: /(rtsp:\/\/[^\s"'<>\\]+)/gi },
    { name: 'Secret Field', re: /"[a-zA-Z_]*(?:pin|password|secret)[a-zA-Z_]*"\s*:\s*"([^"]+)"/gi }
];

function scanPayload(payload, source, verbose = false) {
    if (payload === undefined || payload === null) return 0;

    const text = (typeof payload === 'string') ? payload : JSON.stringify(payload);
    if (!text) return 0;

    let found = 0;

    for (const pattern of PATTERNS) {
        const matches = [...text.matchAll(pattern.re)];
        for (const match of matches) {
            const value = match[1];
            if (value && addVault(pattern.name, value)) {
                found++;
                log(`[LEAK] ${pattern.name} (via ${source}): ${trunc(value, 80)}`, 'danger');
            }
        }
    }

    if (found === 0 && verbose) {
        log(`[SCAN] ${source}: bersih — tidak ada pola sensitif.`, 'sys');
    }

    return found;
}

/* ============================================================
   4. UTIL: timeout wrapper
   ============================================================ */
function withTimeout(promise, ms) {
    return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
    ]);
}

/* ============================================================
   5. DEFINISI FUNGSI HOOK (agar bisa dipasang/dilepas berulang)
   ============================================================ */

/* ---------- 5A. HOOK FETCH ---------- */
const hookedFetch = async function (input, init) {
    const url = (typeof input === 'string') ? input : (input && input.url) || String(input);
    const method = (init && init.method) || 'GET';

    stats.req++; refreshStats();
    log(`[FETCH] ${method} ${trunc(url, 80)}`, 'info');
    if (init && init.body) log(`[FETCH] body → ${trunc(init.body, 60)}`, 'warn');

    /* --- Mock: API CCTV internal --- */
    if (url.includes('api.cctv-portal.go.id')) {
        const payload = {
            camera_id:  'CAM-01-PRESIDEN',
            stream_url: 'https://cdn.cctv-portal.go.id/live/cam01.m3u8?token=SECRET',
            admin_pin:  '8899',
            rtsp_url:   'rtsp://admin:Pass123@10.0.0.1/live'
        };
        const body = JSON.stringify(payload);

        setTimeout(() => scanPayload(body, 'FETCH'), 50);

        return new Response(body, {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
        });
    }

    /* --- Passthrough: internet asli (dengan fallback) --- */
    try {
        const response = await withTimeout(NATIVE.fetch.call(this, input, init), 6000);
        const clone = response.clone();
        clone.text()
            .then((text) => scanPayload(text, 'FETCH', true))
            .catch(() => {});
        return response;
    } catch (err) {
        if (url.includes('jsonplaceholder.typicode.com')) {
            log(`[FETCH] ⚠ Native fetch gagal (${err.message}) — pakai fallback mock`, 'warn');
            const mock = JSON.stringify({
                userId: 1, id: 1,
                title: 'delectus aut autem (offline fallback)',
                completed: false
            });
            return new Response(mock, {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
            });
        }
        log(`[FETCH] ✖ ${err.message}`, 'danger');
        throw err;
    }
};

/* ---------- 5B. HOOK XHR ---------- */
const hookedXHROpen = function (method, url) {
    this.__meta = { method: String(method || 'GET').toUpperCase(), url: String(url) };
    return NATIVE.XHRopen.apply(this, arguments);
};

const hookedXHRSend = function (body) {
    const meta = this.__meta || {};
    stats.req++; refreshStats();
    log(`[XHR] ${meta.method || 'GET'} ${trunc(meta.url || '?', 80)}`, 'info');
    if (body) log(`[XHR] body → ${trunc(body, 60)}`, 'warn');

    /* Mock: API CCTV internal */
    if (meta.url && meta.url.includes('api.cctv-portal.go.id')) {
        const self = this;
        const payload = {
            status: 'success',
            user: 'admin',
            token: 'eyJhbGciOiJIUzI1NiJ9.U0VDUkVULVRPS0VOLTEyMw.abc'
        };
        const bodyStr = JSON.stringify(payload);

        setTimeout(() => {
            /* Set properti response di instance */
            const props = {
                readyState: 4,
                status: 200,
                statusText: 'OK',
                responseText: bodyStr,
                response: bodyStr,
                responseURL: meta.url
            };

            for (const [k, v] of Object.entries(props)) {
                try {
                    Object.defineProperty(self, k, { value: v, configurable: true, writable: true });
                } catch (e) {
                    try { self[k] = v; } catch (e2) {}
                }
            }

            /* Fire event handlers */
            const fire = (type, handler) => {
                if (typeof handler === 'function') {
                    try { handler.call(self, new Event(type)); } catch (e) {}
                }
            };

            try { self.dispatchEvent(new Event('readystatechange')); } catch (e) {}
            fire('readystatechange', self.onreadystatechange);

            try { self.dispatchEvent(new Event('load')); } catch (e) {}
            fire('load', self.onload);

            try { self.dispatchEvent(new Event('loadend')); } catch (e) {}
            fire('loadend', self.onloadend);

            scanPayload(bodyStr, 'XHR');
        }, 500);

        return;
    }

    /* XHR asli */
    return NATIVE.XHRsend.apply(this, arguments);
};

/* ---------- 5C. HOOK WEBSOCKET ---------- */
const HookedWS = function (url, protocols) {
    const urlStr = String(url);
    stats.req++; refreshStats();
    log(`[WS] Handshake → ${trunc(urlStr, 80)}`, 'info');

    /* Mock: Drone CCTV internal */
    if (urlStr.includes('drone.cctv-portal.go.id')) {
        const fakeWS = {
            readyState: 0,
            url: urlStr,
            send: function (data) {
                log(`[WS] frame keluar → ${trunc(data, 60)}`, 'warn');

                let cmd = 'UNKNOWN';
                try { cmd = JSON.parse(data).command || cmd; } catch (e) {}

                setTimeout(() => {
                    const reply = JSON.stringify({
                        type: 'STREAM_CONFIG',
                        command: cmd,
                        url: 'https://cdn.cctv-portal.go.id/live/drone-07.m3u8?token=DRONE',
                        rtsp_url: 'rtsp://admin:Dr0n3P4ss@10.10.4.7:554/live/drone07',

                    });

                    if (typeof fakeWS.onmessage === 'function') {
                        try { fakeWS.onmessage({ data: reply }); } catch (e) {}
                    }
                    scanPayload(reply, 'WEBSOCKET');
                }, 700);
            },
            close: function () {
                this.readyState = 3;
                if (typeof this.onclose === 'function') this.onclose();
            }
        };

        setTimeout(() => {
            fakeWS.readyState = 1;
            if (typeof fakeWS.onopen === 'function') {
                try { fakeWS.onopen(); } catch (e) {}
            }
        }, 300);

        return fakeWS;
    }

    /* WebSocket asli */
    const realWS = (protocols !== undefined)
        ? new NATIVE.WS(url, protocols)
        : new NATIVE.WS(url);

    realWS.addEventListener('message', (e) => {
        log(`[WS] frame masuk (${String(e.data).length} byte)`, 'info');
        scanPayload(e.data, 'WEBSOCKET');
    });

    return realWS;
};
HookedWS.prototype = NATIVE.WS.prototype;
HookedWS.CONNECTING = 0;
HookedWS.OPEN = 1;
HookedWS.CLOSING = 2;
HookedWS.CLOSED = 3;

/* ---------- 5D. HOOK STORAGE ---------- */
const hookedSetItem = function (key, value) {
    log(`[STORAGE] Menyimpan "${key}" (${String(value).length} byte)`, 'info');
    scanPayload(value, 'STORAGE');
    return NATIVE.StorageSet.call(this, key, value);
};

/* ============================================================

   ============================================================ */
let hooksActive = false;

function applyHooks() {
    if (hooksActive) return;

    window.fetch = hookedFetch;
    NATIVE.XHR.prototype.open = hookedXHROpen;
    NATIVE.XHR.prototype.send = hookedXHRSend;
    window.WebSocket = HookedWS;
    HookedWS.prototype = NATIVE.WS.prototype;
    Storage.prototype.setItem = hookedSetItem;

    hooksActive = true;

    $('targetStatus').textContent = 'ONLINE (Hooked)';
    $('targetStatus').className = 'badge warn';
    $('restoreLbl').textContent = 'RESTORE HOOKS';
}

function removeHooks() {
    if (!hooksActive) return;

    if (stealthOn) setStealth(false);

    window.fetch = NATIVE.fetch;
    NATIVE.XHR.prototype.open = NATIVE.XHRopen;
    NATIVE.XHR.prototype.send = NATIVE.XHRsend;
    window.WebSocket = NATIVE.WS;
    Storage.prototype.setItem = NATIVE.StorageSet;

    hooksActive = false;

    $('targetStatus').textContent = 'ONLINE (Native)';
    $('targetStatus').className = 'badge ok';
    $('restoreLbl').textContent = 'REAPPLY HOOKS';
    log('[SYS] Semua hook dilepas. Sistem kembali normal.', 'success');
}

/* ============================================================

let stealthOn = false;

function setStealth(on) {
    stealthOn = on;

    const fakeNative = (name) => `function ${name}() { [native code] }`;

    if (on) {
        window.fetch.toString                = () => fakeNative('fetch');
        NATIVE.XHR.prototype.open.toString   = () => fakeNative('open');
        NATIVE.XHR.prototype.send.toString   = () => fakeNative('send');
        window.WebSocket.toString            = () => fakeNative('WebSocket');
        Storage.prototype.setItem.toString   = () => fakeNative('setItem');
    } else {
        delete window.fetch.toString;
        delete NATIVE.XHR.prototype.open.toString;
        delete NATIVE.XHR.prototype.send.toString;
        delete window.WebSocket.toString;
        delete Storage.prototype.setItem.toString;
    }

    $('stealthLbl').textContent = `STEALTH: ${on ? 'ON' : 'OFF'}`;
    $('stealthBtn').classList.toggle('on', on);
    log(`[SYS] Stealth ${on ? 'AKTIF — hook disamarkan' : 'NONAKTIF — hook terdeteksi'}`, on ? 'success' : 'warn');
}

/* ---------- 8F. INTEGRITY CHECK ---------- */
function targetDetect() {
    tlog('Menjalankan Integrity Check...');

    setTimeout(() => {
        const checks = [
            ['window.fetch',              window.fetch],
            ['XMLHttpRequest.open',       XMLHttpRequest.prototype.open],
            ['XMLHttpRequest.send',       XMLHttpRequest.prototype.send],
            ['window.WebSocket',          window.WebSocket],
            ['Storage.setItem',           Storage.prototype.setItem]
        ];

        const dirty = checks
            .filter(([, fn]) => !/\[native code\]/.test(String(fn)))
            .map(([name]) => name);

        if (dirty.length) {
            tlog(`⚠ ANOMALI pada: ${dirty.join(', ')}`, 'err');
        } else {
            tlog('✔ Lingkungan bersih. Tidak ada hook terdeteksi.', 'ok');
        }
    }, 400);
}
