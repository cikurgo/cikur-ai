<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGO AI Core - Pro Sandbox v2.3</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #060b14;
            --bg-panel: #0d1526;
            --bg-bubble-user: #1e3a8a;
            --bg-bubble-ai: #111827;
            --text-main: #e2e8f0;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --border-color: #1e293b;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.05) 0%, transparent 50%);
        }

        .hud-container {
            width: 100%;
            max-width: 940px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* HEADER */
        .hud-header {
            background: rgba(13, 21, 38, 0.94);
            backdrop-filter: blur(12px);
            padding: 12px 18px;
            border-bottom: 1px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 20;
            gap: 10px;
            flex-wrap: wrap;
        }
        .hud-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .status-dot {
            width: 10px; height: 10px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }
        .status-dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: none; }
        .status-dot.busy { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .system-badge {
            font-size: 0.66rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .btn-icon {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #94a3b8;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            font-size: 0.95rem;
        }
        .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
        .btn-icon.active { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.1); }

        /* SETTINGS PANEL */
        .settings-panel {
            display: none;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 18px;
            gap: 14px;
            flex-wrap: wrap;
            align-items: flex-end;
            animation: slideDown 0.2s ease;
        }
        .settings-panel.open { display: flex; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 140px;
        }
        .field label {
            font-size: 0.72rem;
            color: #94a3b8;
            font-family: 'Share Tech Mono', monospace;
        }
        .field input, .field select {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 7px;
            font-size: 0.86rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus, .field select:focus { border-color: var(--accent); }
        .field input[type="password"] { font-family: monospace; letter-spacing: 1px; }
        .field-wide { flex: 1; min-width: 200px; }
        .settings-hint {
            font-size: 0.7rem;
            color: #64748b;
            width: 100%;
            margin-top: -4px;
        }
        .settings-hint a { color: var(--accent); text-decoration: none; }
        .settings-hint a:hover { text-decoration: underline; }

        /* CHAT AREA */
        .chat-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: var(--bg-main); }
        .chat-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 88%;
            animation: slideIn 0.25s ease-out forwards;
            opacity: 0;
            transform: translateY(8px);
        }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        .message.user { align-self: flex-end; }
        .message.ai { align-self: flex-start; width: 100%; max-width: 88%; }

        .sender {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.76rem;
            color: #94a3b8;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .message.user .sender { justify-content: flex-end; }

        .bubble {
            padding: 13px 16px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 0.93rem;
            position: relative;
            word-wrap: break-word;
            overflow-x: auto;
        }
        .message.user .bubble {
            background: var(--bg-bubble-user);
            border: 1px solid #3b82f6;
            border-bottom-right-radius: 2px;
        }
        .message.ai .bubble {
            background: var(--bg-bubble-ai);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 2px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.45);
        }

        .bubble p { margin-bottom: 10px; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble strong { color: var(--accent); }
        .bubble ul, .bubble ol { margin-left: 20px; margin-bottom: 10px; }
        .bubble li { margin-bottom: 4px; }
        .bubble pre {
            background: #000;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
            margin: 10px 0;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            position: relative;
        }
        .bubble code {
            font-family: 'Share Tech Mono', monospace;
            background: rgba(255,255,255,0.08);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.87em;
        }
        .bubble pre code { background: transparent; padding: 0; }
        .bubble table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.89em; }
        .bubble th, .bubble td { border: 1px solid var(--border-color); padding: 7px 10px; text-align: left; }
        .bubble th { background: rgba(56, 189, 248, 0.12); color: var(--accent); }
        .bubble blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            margin: 10px 0;
            color: #94a3b8;
        }
        .bubble a { color: var(--accent); text-decoration: none; }
        .bubble a:hover { text-decoration: underline; }

        .chart-container {
            margin-top: 12px;
            background: #0f172a;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            max-width: 100%;
            height: 280px;
            position: relative;
        }

        /* INPUT */
        .input-area {
            padding: 14px 16px;
            background: rgba(13, 21, 38, 0.94);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-wrapper {
            flex: 1;
            display: flex;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrapper:focus-within { 
            border-color: var(--accent); 
            box-shadow: 0 0 12px rgba(56,189,248,0.18); 
        }
        
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 12px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 0.93rem;
            resize: none;
            outline: none;
            max-height: 150px;
            min-height: 48px;
            overflow-y: auto;
            line-height: 1.45;
        }
        
        .btn {
            padding: 0 16px;
            height: 48px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.88rem;
            white-space: nowrap;
        }
        .btn-send { background: var(--accent); color: var(--bg-main); }
        .btn-send:hover:not(:disabled) { background: #0ea5e9; box-shadow: 0 0 15px var(--accent-glow); }
        .btn-send:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
        .btn-stop { background: var(--danger); color: white; display: none; }
        .btn-stop:hover { background: #dc2626; }

        .typing-indicator {
            display: inline-block;
            width: 7px; height: 14px;
            background: var(--accent);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 4px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .error-text { color: var(--danger); }

        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b;
            border: 1px solid var(--accent);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.84rem;
            opacity: 0;
            transition: 0.3s;
            z-index: 100;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.warning { border-color: var(--warning); color: var(--warning); }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            color: #94a3b8;
            font-size: 0.7rem;
            padding: 3px 7px;
            border-radius: 5px;
            cursor: pointer;
            opacity: 0;
            transition: 0.2s;
        }
        .bubble pre:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    </style>
</head>
<body>

    <div class="hud-container">
        <!-- HEADER -->
        <header class="hud-header">
            <div class="hud-title">
                <div class="status-dot" id="status-dot"></div>
                CGO NEURAL INTERFACE v2.3
            </div>
            <div class="header-right">
                <div class="system-badge" id="engine-badge">ENGINE: CLASSIC (FREE)</div>
                <button class="btn-icon" id="settings-btn" title="Pengaturan">⚙</button>
                <button class="btn-icon" id="clear-btn" title="Bersihkan riwayat">🗑</button>
            </div>
        </header>

        <!-- SETTINGS PANEL -->
        <div class="settings-panel" id="settings-panel">
            <div class="field field-wide">
                <label>API KEY (opsional)</label>
                <input type="password" id="api-key-input" placeholder="sk_... atau pk_... (kosongkan = gratis)" autocomplete="off">
            </div>
            <div class="field">
                <label>MODEL</label>
                <select id="model-select">
                    <option value="openai">openai (default)</option>
                    <option value="openai-fast">openai-fast</option>
                    <option value="mistral">mistral</option>
                    <option value="deepseek">deepseek</option>
                    <option value="gemini">gemini</option>
                    <option value="grok">grok</option>
                    <option value="claude">claude</option>
                    <option value="openai-large">openai-large</option>
                </select>
            </div>
            <div class="field">
                <label>&nbsp;</label>
                <button class="btn btn-send" id="save-settings-btn" style="height:36px;padding:0 14px;font-size:0.82rem;">SIMPAN</button>
            </div>
            <div class="settings-hint">
                Kosongkan API Key = mode gratis (rate limit ~30 dtk). Dapatkan key gratis di 
                <a href="https://enter.pollinations.ai" target="_blank" rel="noopener">enter.pollinations.ai</a>
            </div>
        </div>

        <!-- CHAT AREA -->
        <main class="chat-container" id="chat-container">
            <!-- Boot message will be injected by JS -->
        </main>

        <!-- INPUT AREA -->
        <footer class="input-area">
            <div class="input-wrapper">
                <textarea id="chat-input" rows="1" placeholder="Masukkan perintah atau pertanyaan... (Enter = kirim, Shift+Enter = baris baru)"></textarea>
            </div>
            <button class="btn btn-send" id="send-btn">KIRIM</button>
            <button class="btn btn-stop" id="stop-btn">STOP</button>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==========================================
        // 1. CONSTANTS & STATE
        // ==========================================
        const STORAGE_KEY = 'cgo_ai_pro_v23'; // Ubah versi storage
        const MAX_HISTORY = 14;

        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusDot = document.getElementById('status-dot');
        const clearBtn = document.getElementById('clear-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const apiKeyInput = document.getElementById('api-key-input');
        const modelSelect = document.getElementById('model-select');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const engineBadge = document.getElementById('engine-badge');
        const toastEl = document.getElementById('toast');

        let chatHistory = [];
        let currentAbortController = null;
        let isGenerating = false;
        let settings = {
            apiKey: '',
            model: 'openai'
        };

        const SYSTEM_PROMPT = `Kamu adalah CGO (Cyber Guardian Operator), asisten AI cerdas yang terintegrasi dengan sistem keamanan dan operasional drone. 
Jawab dengan tegas, futuristik, dan bahasa Indonesia yang natural. Gunakan format Markdown untuk penekanan dan struktur.

ATURAN KHUSUS UNTUK GRAFIK:
Jika user meminta grafik, chart, atau visualisasi data, kamu WAJIB mengeluarkan format JSON di dalam blok kode seperti ini (tanpa teks lain di dalam blok tersebut):
\`\`\`chart
{
  "type": "bar",
  "data": {
    "labels": ["Jan", "Feb", "Mar"],
    "datasets": [{"label": "Trafik", "data": [10, 20, 30], "backgroundColor": "#38bdf8"}]
  },
  "options": {
    "responsive": true,
    "maintainAspectRatio": false,
    "plugins": { "legend": { "labels": { "color": "#e2e8f0" } } },
    "scales": {
      "x": { "ticks": { "color": "#94a3b8" }, "grid": { "color": "#1e293b" } },
      "y": { "ticks": { "color": "#94a3b8" }, "grid": { "color": "#1e293b" } }
    }
  }
}
\`\`\`
Gunakan warna yang cocok dengan tema gelap (#38bdf8, #10b981, #f59e0b, dll). Hanya keluarkan JSON murni di dalam blok \`\`\`chart.`;

        // Marked setup
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                gfm: true,
                breaks: true
            });
        }

        // ==========================================
        // 2. PERSISTENCE
        // ==========================================
        function loadSettings() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data.settings) {
                        settings.apiKey = data.settings.apiKey || '';
                        settings.model = data.settings.model || 'openai';
                    }
                    if (Array.isArray(data.history)) {
                        chatHistory = data.history.slice(-MAX_HISTORY);
                    }
                }
            } catch (e) {
                console.warn('Gagal load localStorage', e);
            }
            apiKeyInput.value = settings.apiKey;
            modelSelect.value = settings.model;
            updateEngineBadge();
        }

        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    settings: { ...settings },
                    history: chatHistory.slice(-MAX_HISTORY)
                }));
            } catch (e) {
                console.warn('Gagal simpan localStorage', e);
            }
        }

        function updateEngineBadge() {
            if (settings.apiKey && settings.apiKey.trim()) {
                engineBadge.textContent = 'ENGINE: GEN (API KEY)';
                engineBadge.style.borderColor = '#10b981';
                engineBadge.style.color = '#10b981';
            } else {
                engineBadge.textContent = 'ENGINE: CLASSIC (FREE)';
                engineBadge.style.borderColor = 'var(--accent)';
                engineBadge.style.color = 'var(--accent)';
            }
        }

        // ==========================================
        // 3. UI HELPERS
        // ==========================================
        function showToast(msg, duration = 2400, isWarning = false) {
            toastEl.textContent = msg;
            toastEl.className = 'toast show' + (isWarning ? ' warning' : '');
            setTimeout(() => toastEl.classList.remove('show'), duration);
        }

        function setStatus(state) {
            statusDot.className = 'status-dot';
            if (state === 'busy') statusDot.classList.add('busy');
            else if (state === 'error') statusDot.classList.add('error');
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        // Auto-resize
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!isGenerating) sendMessage();
            }
        });

        sendBtn.addEventListener('click', () => { if (!isGenerating) sendMessage(); });
        stopBtn.addEventListener('click', () => {
            if (currentAbortController) currentAbortController.abort();
        });

        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('open');
            settingsBtn.classList.toggle('active');
        });

        saveSettingsBtn.addEventListener('click', () => {
            settings.apiKey = apiKeyInput.value.trim();
            settings.model = modelSelect.value;
            saveToStorage();
            updateEngineBadge();
            settingsPanel.classList.remove('open');
            settingsBtn.classList.remove('active');
            showToast(settings.apiKey ? 'API Key tersimpan • Mode GEN aktif' : 'Mode CLASSIC (gratis) aktif');
        });

        clearBtn.addEventListener('click', () => {
            if (isGenerating) return;
            chatHistory = [];
            saveToStorage();
            renderBootMessage(true);
            showToast('Riwayat dibersihkan');
        });

        function addMessageToUI(role, text, isTyping = false) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role);
            
            const senderDiv = document.createElement('div');
            senderDiv.classList.add('sender');
            senderDiv.textContent = role === 'user' ? 'ANDA (Operator)' : 'CGO';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('bubble');
            
            if (role === 'ai') {
                // Perbaikan: render Markdown dulu, baru tambahkan kursor (agar format tidak rusak)
                const displayText = isTyping ? (text || '') : (text || ' ');
                bubbleDiv.innerHTML = DOMPurify.sanitize(marked.parse(displayText));
                if (isTyping) bubbleDiv.innerHTML += '<span class="typing-indicator"></span>';
            } else {
                bubbleDiv.innerText = text;
            }

            msgDiv.appendChild(senderDiv);
            msgDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
            return bubbleDiv;
        }

        function renderBootMessage(force = false) {
            if (!force && chatHistory.length > 0) return;
            chatContainer.innerHTML = '';
            const bootHtml = `
                <div class="message ai">
                    <div class="sender">CGO OPERATOR <span style="font-size:0.7em; opacity:0.5;">(System Boot)</span></div>
                    <div class="bubble">
                        Sistem aktif. Koneksi Neural Network berhasil terjalin.<br><br>
                        <strong>Fitur Tersedia:</strong>
                        <ul>
                            <li>Analisis Teks &amp; Kode (Markdown + Syntax Highlight)</li>
                            <li>Rendering Grafik Chart.js (contoh: <em>"Buatkan grafik trafik jaringan"</em>)</li>
                            <li>Streaming real-time + tombol STOP</li>
                            <li>Memori kontekstual + penyimpanan lokal</li>
                            <li>Dukungan API Key (opsional) &amp; pilih model</li>
                        </ul>
                        Ada yang bisa saya bantu, Operator?
                    </div>
                </div>`;
            chatContainer.innerHTML = bootHtml;
        }

        function restoreHistoryUI() {
            chatContainer.innerHTML = '';
            if (chatHistory.length === 0) {
                renderBootMessage(true);
                return;
            }
            // Show a small system note
            const note = document.createElement('div');
            note.className = 'message ai';
            note.innerHTML = `<div class="sender">SYSTEM</div><div class="bubble" style="font-size:0.85rem;opacity:0.8;">Riwayat sebelumnya dipulihkan dari penyimpanan lokal (${chatHistory.length} pesan).</div>`;
            chatContainer.appendChild(note);

            chatHistory.forEach(msg => {
                addMessageToUI(msg.role === 'user' ? 'user' : 'ai', msg.content);
            });
            // Re-render charts that may exist in restored messages
            chatContainer.querySelectorAll('.bubble').forEach(b => renderChartsInElement(b));
        }

        // ==========================================
        // 4. CHART + CODE ENHANCEMENTS
        // ==========================================
        function renderChartsInElement(element) {
            const codeBlocks = element.querySelectorAll('pre code.language-chart');
            
            codeBlocks.forEach((codeBlock) => {
                try {
                    const jsonStr = codeBlock.innerText.trim();
                    const chartConfig = JSON.parse(jsonStr);
                    
                    if (!chartConfig.options) chartConfig.options = {};
                    chartConfig.options.responsive = true;
                    chartConfig.options.maintainAspectRatio = false;

                    const canvasContainer = document.createElement('div');
                    canvasContainer.classList.add('chart-container');
                    const canvas = document.createElement('canvas');
                    canvasContainer.appendChild(canvas);
                    
                    const pre = codeBlock.parentElement;
                    if (pre) {
                        pre.style.display = 'none';
                        if (pre.parentElement) {
                            pre.parentElement.insertBefore(canvasContainer, pre.nextSibling);
                        }
                    } else {
                        element.appendChild(canvasContainer);
                    }

                    // Mencegah memory leak (jika chart dirender ulang)
                    const existingChart = Chart.getChart(canvas);
                    if (existingChart) existingChart.destroy();

                    new Chart(canvas, chartConfig);
                } catch (e) {
                    console.error("Gagal merender grafik:", e);
                    codeBlock.parentElement.insertAdjacentHTML('afterend', 
                        '<div class="error-text" style="font-size:0.85rem;margin:8px 0;">⚠️ Gagal merender grafik (JSON tidak valid)</div>');
                }
            });
            
            // Highlight + add copy buttons
            element.querySelectorAll('pre code:not(.language-chart)').forEach((el) => {
                try { hljs.highlightElement(el); } catch(e) {}
                const pre = el.parentElement;
                if (pre && !pre.querySelector('.copy-btn')) {
                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.textContent = 'Copy';
                    btn.onclick = () => {
                        navigator.clipboard.writeText(el.innerText).then(() => {
                            btn.textContent = 'Copied!';
                            setTimeout(() => btn.textContent = 'Copy', 1500);
                        });
                    };
                    pre.style.position = 'relative';
                    pre.appendChild(btn);
                }
            });
        }

        // ==========================================
        // 5. ROBUST SSE PARSER
        // ==========================================
        async function* parseSSE(reader) {
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || trimmed === 'data: [DONE]') continue;
                    if (trimmed.startsWith('data: ')) {
                        try {
                            yield JSON.parse(trimmed.slice(6));
                        } catch (e) {}
                    }
                }
            }
            if (buffer.trim().startsWith('data: ') && buffer.trim() !== 'data: [DONE]') {
                try { yield JSON.parse(buffer.trim().slice(6)); } catch (e) {}
            }
        }

        // ==========================================
        // 6. MAIN SEND LOGIC (ZERO REGRESSION CORE)
        // ==========================================
        async function sendMessage() {
            const userText = chatInput.value.trim();
            if (!userText || isGenerating) return;

            isGenerating = true;
            setStatus('busy');

            chatInput.value = '';
            chatInput.style.height = 'auto';
            chatInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.style.display = 'none';
            stopBtn.style.display = 'flex';

            addMessageToUI('user', userText);
            chatHistory.push({ role: 'user', content: userText });
            saveToStorage();

            const aiBubble = addMessageToUI('ai', '', true);
            let fullAiResponse = '';

            currentAbortController = new AbortController();

            // Decide endpoint & headers
            const hasKey = !!(settings.apiKey && settings.apiKey.trim());
            let endpoint = hasKey 
                ? 'https://gen.pollinations.ai/v1/chat/completions'
                : 'https://text.pollinations.ai/openai';

            const headers = {
                'Content-Type': 'application/json',
                'Accept': 'text/event-stream'
            };
            if (hasKey) {
                headers['Authorization'] = `Bearer ${settings.apiKey.trim()}`;
            }

            const body = {
                model: settings.model || 'openai',
                stream: true,
                messages: [
                    { role: 'system', content: SYSTEM_PROMPT },
                    ...chatHistory
                ]
            };

            try {
                let response;
                
                try {
                    // Tembak Endpoint Utama
                    response = await fetch(endpoint, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(body),
                        signal: currentAbortController.signal
                    });

                    if (!response.ok) {
                        let errMsg = `HTTP ${response.status}`;
                        if (response.status === 401 || response.status === 403) {
                            errMsg = 'API Key tidak valid atau tidak memiliki akses. Periksa key Anda.';
                        } else if (response.status === 402) {
                            errMsg = hasKey 
                                ? 'Saldo Pollen habis atau model berbayar. Coba model lain / isi ulang.'
                                : 'Rate limit tercapai (402). Tunggu ~30 detik atau masukkan API Key.';
                        } else if (response.status === 429) {
                            errMsg = 'Terlalu banyak permintaan. Tunggu sebentar.';
                        }
                        throw new Error(errMsg);
                    }
                } catch (fetchError) {
                    // CORS FALLBACK: Jika pakai API Key tapi koneksi diblokir browser
                    if (hasKey && (fetchError.name === 'TypeError' || fetchError.message.includes('Failed to fetch'))) {
                        showToast("Koneksi API Key terblokir (CORS). Beralih ke Mode Gratis...", 4000, true);
                        console.warn("CORS diblokir pada gen.pollinations.ai, melakukan fallback ke text.pollinations.ai");
                        
                        endpoint = 'https://text.pollinations.ai/openai';
                        delete headers['Authorization'];
                        
                        response = await fetch(endpoint, {
                            method: 'POST',
                            headers,
                            body: JSON.stringify(body),
                            signal: currentAbortController.signal
                        });
                        
                        if (!response.ok) throw new Error(`HTTP Error Fallback: ${response.status}`);
                    } else {
                        throw fetchError;
                    }
                }

                const reader = response.body.getReader();

                for await (const data of parseSSE(reader)) {
                    const delta = data?.choices?.[0]?.delta;
                    const content = (delta && (delta.content || delta.text)) || '';
                    
                    if (content) {
                        fullAiResponse += content;
                        // Perbaikan: Render text dulu, baru tambahkan kursor
                        const sanitizedHtml = DOMPurify.sanitize(marked.parse(fullAiResponse));
                        aiBubble.innerHTML = sanitizedHtml + '<span class="typing-indicator"></span>';
                        scrollToBottom();
                    }
                }

                if (!fullAiResponse.trim()) {
                    fullAiResponse = '_Tidak ada respons dari model._';
                }
                aiBubble.innerHTML = DOMPurify.sanitize(marked.parse(fullAiResponse));
                renderChartsInElement(aiBubble);

                chatHistory.push({ role: 'assistant', content: fullAiResponse });
                if (chatHistory.length > MAX_HISTORY) {
                    chatHistory = chatHistory.slice(chatHistory.length - MAX_HISTORY);
                }
                saveToStorage();
                setStatus('ok');

            } catch (error) {
                if (error.name === 'AbortError') {
                    const note = fullAiResponse 
                        ? '<br><br><em class="error-text">[Dihentikan oleh Operator]</em>'
                        : '<em class="error-text">[Dihentikan oleh Operator]</em>';
                    aiBubble.innerHTML = DOMPurify.sanitize(marked.parse(fullAiResponse || '')) + note;
                    if (fullAiResponse) {
                        chatHistory.push({ role: 'assistant', content: fullAiResponse });
                        saveToStorage();
                    }
                    setStatus('ok');
                } else {
                    console.error(error);
                    aiBubble.innerHTML = `<span class="error-text">⚠️ Neural link terputus: ${error.message || 'Gagal menghubungi server AI.'}</span>`;
                    setStatus('error');
                    if (chatHistory.length && chatHistory[chatHistory.length - 1].role === 'user') {
                        chatHistory.pop();
                        saveToStorage();
                    }
                }
            } finally {
                isGenerating = false;
                chatInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.style.display = 'flex';
                stopBtn.style.display = 'none';
                currentAbortController = null;
                chatInput.focus();
                scrollToBottom();
            }
        }

        // ==========================================
        // 7. INIT
        // ==========================================
        loadSettings();
        restoreHistoryUI();
        chatInput.focus();
    </script>
</body>
