<style>
:root{
  --bg1:#0a2a78;--bg2:#030a22;--cy:#5cd6ff;--yl:#ffd23c;--or:#ff8a1f;
  --tx:#d8ecff;--pn:rgba(8,24,60,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--tx);-webkit-tap-highlight-color:transparent;touch-action:none}
body{background:radial-gradient(ellipse at 50% 45%,var(--bg1),var(--bg2) 75%);transition:background 1.4s}
body.av{--bg1:#1b2236;--bg2:#05070d}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;pointer-events:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#hl{top:calc(14px + env(safe-area-inset-top,0px));left:16px;transition:opacity .8s}
#hl .t{font-size:clamp(22px,6vw,30px);font-weight:300;letter-spacing:0;color:#fff}
#hl .m{opacity:.7;margin-top:2px}
body.av #hl{opacity:0}
#pill{position:fixed;z-index:8;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:6px 14px;border:1px solid var(--cy);border-radius:99px;background:var(--pn);color:var(--cy);font-size:11px;letter-spacing:.12em;cursor:pointer;display:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);user-select:none}
#pill.on{display:block}
#pill i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--or);margin-right:8px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#exit{position:fixed;z-index:8;top:calc(14px + env(safe-area-inset-top,0px));left:14px;padding:5px 10px;border:1px solid var(--cy);border-radius:4px;background:var(--pn);color:var(--cy);font:11px/1 monospace;letter-spacing:.15em;cursor:pointer;display:none;user-select:none}
body.av #exit{display:block}
#stat{position:fixed;z-index:6;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);opacity:.85;min-height:16px;padding:0 12px;pointer-events:none}
#bar{position:fixed;z-index:7;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;padding:8px;border:1px solid rgba(92,214,255,.35);border-radius:16px;background:var(--pn);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bar button{display:flex;flex-direction:column;align-items:center;gap:4px;width:62px;padding:8px 0 6px;border:1px solid transparent;border-radius:10px;background:none;color:var(--tx);font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:.2s;user-select:none;-webkit-user-select:none}
#bar button:hover,#bar button.on{border-color:var(--cy);background:rgba(92,214,255,.14);box-shadow:0 0 12px rgba(92,214,255,.4)}
#bar button.mic.on{border-color:var(--or);background:rgba(255,138,31,.15);box-shadow:0 0 12px rgba(255,138,31,.5)}
#bar button:active{transform:scale(.96)}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#lbls{position:fixed;inset:0;z-index:4;pointer-events:none;transition:opacity .7s .9s}
#lbls.off{opacity:0;transition-delay:0s}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:600;color:#fff;text-shadow:0 0 8px #0a2a78;pointer-events:auto;cursor:pointer;padding:2px 4px;user-select:none}
.lb.sel{color:var(--yl);text-shadow:0 0 10px var(--yl)}
.lb.y{color:#fff}.lb.c{color:#9fd8ff;font-weight:400}
#errorBox{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#030a22;color:#d8ecff;padding:24px;text-align:center;font-size:15px;line-height:1.5}
#errorBox.show{display:flex;flex-direction:column;gap:12px}
#errorBox code{font-size:12px;opacity:.7;word-break:break-all}
#loader{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,#0a2a78,#030a22 75%);color:var(--cy);font-size:13px;letter-spacing:.15em;text-transform:uppercase;transition:opacity .6s}
#loader.hide{opacity:0;pointer-events:none}

/* ===== UPGRADE: FUTURE UI ===== */
:root{--vi:#9a6bff;--cy:#4fe3ff}
body.av{--bg1:#14224d;--bg2:#02040c}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(79,227,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(79,227,255,.08) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 55%,#000 15%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 55%,#000 15%,transparent 72%);animation:gd 12s linear infinite}
@keyframes gd{to{background-position:0 44px,44px 0}}
body::after{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,8,.6))}
#frm{position:fixed;inset:10px;z-index:3;pointer-events:none;opacity:.45;transition:inset 1s cubic-bezier(.2,.8,.2,1),opacity 1s;background:linear-gradient(var(--cy),var(--cy)) 0 0/24px 1px,linear-gradient(var(--cy),var(--cy)) 0 0/1px 24px,linear-gradient(var(--cy),var(--cy)) 100% 0/24px 1px,linear-gradient(var(--cy),var(--cy)) 100% 0/1px 24px,linear-gradient(var(--cy),var(--cy)) 0 100%/24px 1px,linear-gradient(var(--cy),var(--cy)) 0 100%/1px 24px,linear-gradient(var(--cy),var(--cy)) 100% 100%/24px 1px,linear-gradient(var(--cy),var(--cy)) 100% 100%/1px 24px;background-repeat:no-repeat}
body.av #frm{inset:20px;opacity:.9}
#fl{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 42%,rgba(190,240,255,.6),rgba(70,120,255,.2) 35%,transparent 65%)}

@keyframes fl{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
#sw{position:fixed;left:50%;top:42%;z-index:9;width:30px;height:30px;margin:-15px 0 0 -15px;border:1px solid var(--cy);border-radius:50%;pointer-events:none;opacity:0;box-shadow:0 0 24px var(--cy),inset 0 0 24px var(--cy)}
#sw.go{animation:sw 1.3s cubic-bezier(.15,.7,.2,1)}
@keyframes sw{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(50)}}
.sd{position:fixed;z-index:5;top:calc(74px + env(safe-area-inset-top,0px));width:96px;font:10px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--cy);pointer-events:none;opacity:0;transition:opacity .8s,transform 1s cubic-bezier(.2,.8,.2,1)}
#sl{left:24px;transform:translateX(-40px)}
#sr{right:24px;text-align:right;transform:translateX(40px)}
body.av .sd{opacity:.85;transform:none;transition-delay:.7s}
.sd div{margin-bottom:12px}
.sd span{opacity:.6;display:block;font-size:9px}
.sd b{font-weight:500;font-size:13px;color:#fff}
.sd u{display:block;height:2px;margin-top:4px;background:rgba(79,227,255,.18);text-decoration:none}
.sd u i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--cy));box-shadow:0 0 8px var(--cy);transition:width .9s}
#sr u i{margin-left:auto}
#bar{border-color:rgba(79,227,255,.4);background:linear-gradient(180deg,rgba(20,40,90,.55),rgba(6,14,40,.7));box-shadow:0 0 30px rgba(79,227,255,.15),inset 0 0 20px rgba(79,227,255,.06);animation:up 1s .4s both cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translate(-50%,40px)}}
#hl .t,#clk{font-family:Orbitron,"Segoe UI",system-ui,sans-serif;font-weight:500;letter-spacing:.06em;background:linear-gradient(90deg,#fff,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
#stat{font-family:ui-monospace,Menlo,monospace}
#loader::before{content:"";width:46px;height:46px;border:2px solid rgba(79,227,255,.2);border-top-color:var(--cy);border-radius:50%;animation:spin 1s linear infinite;margin-right:16px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:360px){.sd{display:none}}
@media(prefers-reduced-motion:reduce){body::before,#loader::before{animation:none}}
/* ===== COUNCIL ===== */
#stat{bottom:calc(142px + env(safe-area-inset-bottom,0px))}
#cb{position:fixed;z-index:7;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);display:flex;gap:4px;max-width:98vw;opacity:0;pointer-events:none;transition:opacity .7s,transform .8s cubic-bezier(.2,.8,.2,1)}
body.av #cb{opacity:1;pointer-events:auto;transform:translateX(-50%);transition-delay:.5s}
#cb button{--c:#4fe3ff;display:flex;align-items:center;gap:5px;padding:7px 9px;border:1px solid var(--c);border-radius:99px;background:var(--pn);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font:600 10px/1 Orbitron,system-ui,sans-serif;letter-spacing:.05em;cursor:pointer;opacity:.55;transition:.3s;user-select:none}
#cb button i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
#cb button.on{opacity:1;background:rgba(255,255,255,.1);box-shadow:0 0 16px var(--c)}
#np{position:fixed;z-index:6;left:0;right:0;top:calc(54px + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;opacity:0;transition:opacity .8s,color .8s;text-shadow:0 0 14px currentColor}
body.av #np{opacity:1}
#np b{display:block;font:700 clamp(18px,5vw,26px) Orbitron,system-ui,sans-serif;letter-spacing:.12em}
#np span{font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.85}
#fps{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));right:18px;font:9px ui-monospace,Menlo,monospace;color:var(--cy);opacity:.6;pointer-events:none}
</style>
<script>
// Robust Three.js loader with fallback CDNs
(function(){
  var urls = [
    'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js',
    'https://unpkg.com/three@0.158.0/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js'
  ];
  var i = 0;
  function load(){
    if(i >= urls.length){
      window.__THREE_FAIL = true;
      return;
    }
    var s = document.createElement('script');
    s.src = urls[i++];
    s.onload = function(){ window.__THREE_READY = true; };
    s.onerror = load;
    document.head.appendChild(s);
  }
  load();
})();
</script>

<script type="x-shader/x-vertex" id="vs">
attribute vec3 p0,p1; attribute vec4 c0,c1,aD,aE; attribute float aR,aB;
uniform float uT,uM,uAmp,uPR,uJaw,uWide,uRound,uSmile,uBlink,uBrow,uBreath;
uniform vec2 uGaze; uniform vec3 uHead,uPiv;
attribute vec3 q1,q2,q3,q4; uniform vec4 uPf,uPt; uniform float uPk; uniform vec3 uC1,uC2;
vec3 ry(vec3 v,float a){float c=cos(a),s=sin(a);return vec3(v.x*c+v.z*s,v.y,-v.x*s+v.z*c);}
varying vec3 vC;
void main(){
  float dl=(1.-clamp((p1.y+4.)/6.,0.,1.))*.3;
  float p=clamp(uM*1.9-aR*.45-dl,0.,1.); p=p*p*(3.-2.*p);
  vec3 B=p1; float op=max(uJaw,uSmile*.35);
  B.y-=uJaw*.46*aD.x; B.z-=uJaw*.09*max(aD.x,0.);
  B.x*=1.-uRound*.38*aD.y; B.z+=uRound*.1*aD.y;
  B.x+=sign(B.x)*aD.z*uWide*.11; B.y+=aD.z*uSmile*.1;
  B.y-=uBlink*aD.w; B.y+=uBrow*.12*aE.y;
  B.xy+=uGaze*vec2(.055,.04)*aE.x;
  vec3 d=B-uPiv; float h=aE.w,a=uHead.x*h,b=uHead.y*h,c=uHead.z*h;
  d=vec3(d.x*cos(a)+d.z*sin(a),d.y,-d.x*sin(a)+d.z*cos(a));
  d=vec3(d.x,d.y*cos(b)-d.z*sin(b),d.y*sin(b)+d.z*cos(b));
  d=vec3(d.x*cos(c)-d.y*sin(c),d.x*sin(c)+d.y*cos(c),d.z);
  B=uPiv+d; B.y+=uBreath*aB; B.z+=uBreath*.5*aB;
  float kq=clamp(uPk*1.7-aR*.7,0.,1.); kq=kq*kq*(3.-2.*kq);
  vec4 pw=mix(uPf,uPt,kq); float wX=clamp(1.-pw.x-pw.y-pw.z-pw.w,0.,1.); float tt=uT;
  vec3 qa=ry(q1,tt*.25);
  vec3 qb=ry(q2,tt*.9); qb.y+=sin(qb.x*2.6+tt*5.+aR*6.)*.28; qb.z+=cos(qb.y*2.6+tt*4.)*.2;
  vec3 qc=ry(q3,sin(tt*.6)*.25); qc*=1.+.025*sin(tt*2.2-qc.y*2.);
  vec3 qd=ry(q4,-tt*.35); float js=floor(tt*8.);
  qd+=vec3(sin(aR*91.+js),cos(aR*57.+js),sin(aR*33.+js))*.14*step(.6,fract(aR*13.+js*.37));
  vec3 tgt=B*wX+qa*pw.x+qb*pw.y+qc*pw.z+qd*pw.w;
  vec3 pos=mix(p0,tgt,p); float sw=sin(p*3.14159);
  pos+=vec3(sin(aR*43.+tt*3.),cos(aR*29.+tt*2.6),sin(aR*17.+tt*3.4))*sin(kq*3.14159)*1.2;
  pos+=vec3(sin(aR*61.+uT*2.),cos(aR*37.+uT*1.7),sin(aR*23.+uT*2.3))*sw*1.6;
  float an=sw*(aR-.5)*2.2,ca=cos(an),sa=sin(an);
  pos.xy=vec2(pos.x*ca-pos.y*sa,pos.x*sa+pos.y*ca);
  float n=mix(.022+uAmp*.07,.005+uAmp*.008,p);
  pos+=n*vec3(sin(uT*1.3+aR*80.+pos.y*3.),cos(uT*1.1+aR*50.+pos.x*3.),sin(uT*.9+aR*70.));
  float gt=step(.965,fract(sin(floor(uT*6.)*91.7)*437.5))*p;
  pos.x+=gt*sin(floor(pos.y*18.)*53.)*.06;
  vec4 cc=mix(c0,c1,p);
  float vis=1.; if(aE.z>1.5)vis=1.-smoothstep(.25,.85,uBlink); else if(aE.z>.5)vis=smoothstep(.03,.3,op);
  vis=mix(1.,vis,p*wX);
  vec4 mv=modelViewMatrix*vec4(pos,1.); gl_Position=projectionMatrix*mv;
  float sc=pow(max(0.,sin(pos.y*4.2-uT*2.4)),30.)*p;
  gl_PointSize=mix(.85+.25*aR,cc.a,wX)*uPR*(40./-mv.z)*(1.+uAmp*.5*(1.-p*.7)+sc*.9)*vis;
  vec3 bs=cc.rgb*(1.+uAmp*.7*(1.-p*.6));
  float lu=mix(.5+.5*fract(aR*37.+uT*.3),dot(cc.rgb,vec3(.3,.5,.2)),wX);
  vec3 hc=mix(uC1,uC2,smoothstep(-3.5,mix(3.,1.4,wX),pos.y));
  hc=mix(hc,vec3(1.),smoothstep(.6,1.2,lu)*.55);
  vec3 hg=hc*(.3+lu*1.5)+cc.rgb*clamp(cc.r-cc.b,0.,1.)*.4*wX;
  hg+=vec3(.5,.95,1.)*sc*1.2+vec3(.2,.5,1.)*sw*.5;
  hg*=1.+uAmp*.6;
  vC=mix(bs,hg,p)*vis;
}
</script>
<script type="x-shader/x-fragment" id="fs">
varying vec3 vC;
void main(){
  float d=length(gl_PointCoord-.5)*2.;
  if(d>1.)discard;
  gl_FragColor=vec4(vC,pow(1.-d,1.6)*.95);
}
</script>
<script>
(function(){
'use strict';

function showError(msg){
  var box = document.getElementById('errorBox');
  document.getElementById('errDetail').textContent = msg || '';
  box.classList.add('show');
  var loader = document.getElementById('loader');
  if(loader) loader.classList.add('hide');
}

// Wait for Three.js (max ~8s)
var waitStart = performance.now();
function waitThree(cb){
  if(window.THREE){ cb(); return; }
  if(window.__THREE_FAIL || performance.now()-waitStart > 8000){
    showError('Gagal memuat Three.js dari CDN. Cek koneksi internet.');
    return;
  }
  setTimeout(function(){ waitThree(cb); }, 50);
}

waitThree(function(){
  try{
    initApp();
  }catch(e){
    console.error(e);
    showError(e.message || String(e));
  }
});

function initApp(){
  // Adaptive particle count for robustness (mobile / low-end)
  var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                 (navigator.maxTouchPoints > 1 && window.innerWidth < 900);
  var isLowEnd = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
                 (window.devicePixelRatio > 2.5 && isMobile);
  var N = isLowEnd ? 10000 : (isMobile ? 16000 : 30000);

  var TAU = Math.PI * 2, R = Math.random;
  function g(){ return (R()+R()+R()-1.5)*.8; }
  function cl(x,a,b){ return x<a?a:x>b?b:x; }
  function sm(a,b,x){ var t=cl((x-a)/(b-a),0,1); return t*t*(3-2*t); }
  function gs(a,s){ return Math.exp(-a*a/(2*s*s)); }
  function lr(a,b,t){ return a+(b-a)*t; }

  var NAMES = ["Strategist","Researcher","Chief of staff","Sales","Marketing","Ops","Developer","Analytics","Social","CRM","Engineering","Calendar","Design","Memory","Email","Editor","Drive","Finance"];
  var NP = NAMES.map(function(_,k){
    var a = k/18*TAU + .35, r = 3.2 + 1.1*((k*7)%5)/4;
    return [Math.cos(a)*r*1.4, Math.sin(a)*r*.82 + .2];
  });
  var O = [0, .2];

  function hub(i,f){
    if(f < .16){
      if(R() < .4){
        var a = R()*TAU, r = 1.3 + g()*.03;
        return [[O[0]+Math.cos(a)*r, O[1]+Math.sin(a)*r, g()*.05], [1,.8,.15,1.7]];
      }
      var u = R()*TAU, v = Math.acos(2*R()-1), rr = 1.05*(.55+.45*R());
      return [[O[0]+rr*Math.sin(v)*Math.cos(u), O[1]+rr*Math.sin(v)*Math.sin(u), rr*Math.cos(v)*.6], [.3,.6,1,.9]];
    }
    if(f < .62){
      var k = (R()*18)|0, t = Math.pow(R(),.85), n = NP[k];

  cam.position.z = 12;

  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
  for(var q=0; q<2; q++){
    geo.setAttribute('p'+q, new THREE.BufferAttribute(pa[q], 3));
    geo.setAttribute('c'+q, new THREE.BufferAttribute(ca[q], 4));
  }
  for(var qi=0; qi<4; qi++) geo.setAttribute('q'+(qi+1), new THREE.BufferAttribute(qs[qi], 3));
  geo.setAttribute('aR', new THREE.BufferAttribute(ar, 1));
  geo.setAttribute('aB', new THREE.BufferAttribute(aB, 1));
  geo.setAttribute('aD', new THREE.BufferAttribute(aD, 4));
  geo.setAttribute('aE', new THREE.BufferAttribute(aE, 4));

  var U = {
    uT:{value:0}, uM:{value:0}, uAmp:{value:0}, uPR:{value:PR},
    uJaw:{value:0}, uWide:{value:0}, uRound:{value:0}, uSmile:{value:.15},
    uBlink:{value:0}, uBrow:{value:0}, uBreath:{value:0},
    uGaze:{value:new THREE.Vector2()}, uHead:{value:new THREE.Vector3()},
    uPf:{value:new THREE.Vector4()}, uPt:{value:new THREE.Vector4()}, uPk:{value:1}, uC1:{value:new THREE.Vector3(.5,.25,1)}, uC2:{value:new THREE.Vector3(1,.95,1)},
    uPiv:{value:new THREE.Vector3(0, HY-.55, -.3)}
  };

  var mat = new THREE.ShaderMaterial({
    vertexShader: document.getElementById('vs').textContent,
    fragmentShader: document.getElementById('fs').textContent,
    uniforms: U,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  var pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  sc.add(pts);
  var rings = [];
  [[2.4,.012],[2.9,.008],[3.3,.01],[3.7,.007],[4.0,.006],[2.0,.01],[4.35,.005]].forEach(function(c,k){
    var m = new THREE.Mesh(new THREE.TorusGeometry(c[0],c[1],6,160), new THREE.MeshBasicMaterial({color:k===1?0xb48cff:0x4fe3ff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.position.set(0,.9,-1); m.visible=false; sc.add(m); rings.push(m);
  });

  var asp=1, camZ=12, camZt=12, cur=0, mm=0, mv=0, settled=1;
  function fit(){
    var w = innerWidth, h = innerHeight;
    if(w < 1 || h < 1) return;
    asp = w/h;
    rd.setSize(w, h, false);
    cam.aspect = asp;
    cam.updateProjectionMatrix();
    camZt = cur===1 ? Math.min(22, Math.max(9.5, 6.2/asp)) : Math.min(28, Math.max(10.5, 15.8/asp));
  }
  function setStat(t){ document.getElementById('stat').textContent = t || ''; }

  function go(s){
    if(s === cur) return;
    cur = s; settled = 0;
    document.body.classList.toggle('av', s===1);
    document.getElementById('lbls').classList.toggle('off', s!==0);
    document.getElementById('bHub').classList.toggle('on', s===0);
    document.getElementById('bAv').classList.toggle('on', s===1);
    fit();
    fx(); theme();
    setStat(s===1 ? 'Membuka avatar…' : 'Kembali ke hub…');
  }
  document.getElementById('bHub').onclick = function(){ go(0); };
  document.getElementById('bAv').onclick = function(){ go(1); };
  document.getElementById('exit').onclick = function(){ go(0); };

  var lb = document.getElementById('lbls'), els = [];
  NAMES.forEach(function(n,k){
    var d = document.createElement('div');
    d.className = 'lb ' + (k%2 ? 'c' : 'y');
    d.textContent = n;
    d.onclick = function(){
      els.forEach(function(e){ e.classList.remove('sel'); });
      d.classList.add('sel');
      setStat('Agen aktif: ' + n);
    };
    lb.appendChild(d);
    els.push(d);
  });

  var v3 = new THREE.Vector3();
  function place(){
    if(cur !== 0) return;
    for(var k=0; k<18; k++){
      v3.set(NP[k][0], NP[k][1], 0).project(cam);
      var x = (v3.x*.5+.5)*innerWidth, y = (-v3.y*.5+.5)*innerHeight;
      var e = els[k], left = NP[k][0] < 0;
      e.style.transform = 'translate(' + (x + (left ? -14 - e.offsetWidth : 14)) + 'px,' + (y-10) + 'px)';
    }
  }

  /* ===== suara + lipsync ===== */
  var TXT = 'Halo. Saya avatar AI Anda. Semua agen sudah siap membantu.';
  var CPS = 13.5;
  var VZ = {a:[.85,.1,0],i:[.28,.95,0],e:[.5,.6,0],o:[.55,-.1,.85],u:[.3,-.1,1],m:[0,0,0],b:[0,0,0],p:[0,0,0],f:[.1,.3,0],v:[.1,.3,0],w:[.2,-.1,.6]};
  function vis(ch){
    ch = (ch||'').toLowerCase();
    if(VZ[ch]) return VZ[ch];
    if(ch==='.'||ch===','||ch==='!'||ch==='?'||ch===' ') return [0,0,0];
    if(/[a-z]/.test(ch)) return [.2,.3,0];
    return [.04,0,0];
  }

  var micOn = false, spk = false, an = null, buf = null, ctx = null, micStream = null;
  var sT = 0, bI = -1, bT = 0, pill = document.getElementById('pill');

  function stopMic(){
    micOn = false;
    document.getElementById('bMic').classList.remove('on');
    if(micStream){
      try{ micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(_){}
      micStream = null;
    }
    if(ctx){
      try{ ctx.close(); }catch(_){}
      ctx = null; an = null; buf = null;
    }
  }

  function speak(on, mute){
    spk = !!on;
    pill.classList.toggle('on', spk);
    document.getElementById('bSp').classList.toggle('on', spk);
    if(window.speechSynthesis){
      try{ speechSynthesis.cancel(); }catch(_){}
    }
    if(spk){
      sT = performance.now(); bI = -1;
      if(!mute && window.speechSynthesis && window.SpeechSynthesisUtterance){
        try{
          var u = new SpeechSynthesisUtterance(TXT);
          u.lang = 'id-ID';
          u.rate = PER[per].rt; u.pitch = PER[per].pt;
          u.onboundary = function(e){
            if(typeof e.charIndex === 'number'){ bI = e.charIndex; bT = performance.now(); }
          };
          u.onend = function(){ speak(false); };
          u.onerror = function(){ speak(false); };
          speechSynthesis.speak(u);
        }catch(e){
          // fallback timer-based lipsync
          setTimeout(function(){ speak(false); }, Math.max(3000, TXT.length / CPS * 1000 + 800));
        }
      } else {
        setTimeout(function(){ speak(false); }, Math.max(3000, TXT.length / CPS * 1000 + 800));
      }
    }
  }
  document.getElementById('bSp').onclick = function(){ speak(!spk); };
  pill.onclick = function(){ speak(false); };

  document.getElementById('bMic').onclick = async function(){
    var b = this;
    if(micOn){ stopMic(); return; }
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        setStat('Mikrofon tidak didukung di browser ini');
        return;
      }
      micStream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      an = ctx.createAnalyser();
      an.fftSize = 256;
      an.smoothingTimeConstant = 0.6;
      ctx.createMediaStreamSource(micStream).connect(an);
      buf = new Uint8Array(an.frequencyBinCount);
      micOn = true;
      b.classList.add('on');
      setStat('Mikrofon aktif — bicara sekarang');
    }catch(e){
      setStat('Akses mikrofon ditolak atau tidak tersedia');
      stopMic();
    }
  };

  function hud(){
    var d = new Date(), h = d.getHours();
    document.getElementById('clk').textContent = ('0'+h).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    document.getElementById('dt').textContent = d.toLocaleDateString('id-ID', {weekday:'short', day:'numeric', month:'short'});
    document.getElementById('gr').textContent = (h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam') + ' · 18 agen online';
  }
  hud();
  setInterval(hud, 20000);

  var mx=0, my=0, lastMv=-1e9;
  function onPointer(e){
    var cx = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : innerWidth/2);
    var cy = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : innerHeight/2);
    mx = cx/innerWidth - .5;
    my = cy/innerHeight - .5; lastMv = performance.now();
  }
  addEventListener('pointermove', onPointer, {passive:true});
  addEventListener('touchmove', onPointer, {passive:true});
  addEventListener('resize', function(){ fit(); });
  // orientation change
  addEventListener('orientationchange', function(){ setTimeout(fit, 200); });

  fit();
  camZ = camZt;

  /* state animasi wajah */
  var jw=0, wd=0, rn=0, sl=.15, bl=0, br=0, gx=0, gy=0, hx=0, hy=0, hz=0, amp=0;
  var nb=2, bt=-1, ns=0, sx=0, sy=0;
  function ease(c,t,k,dt){ return c + (t-c)*(1-Math.exp(-k*dt)); }

  var last = performance.now(), T = 0, frameId = 0;
  function frame(now){
    frameId = requestAnimationFrame(frame);
    var dt = Math.min(.05, (now - last)/1000);
    last = now;
    T += dt;
    U.uT.value = T; pstep(dt); fpsTick(dt);
    if(now - lastMv > 3500){ mx = ease(mx, .2*Math.sin(T*.37), 1.6, dt); my = ease(my, .08*Math.sin(T*.29+1), 1.6, dt); }

    /* critical-ish spring for morph – smooth & reversible */
    var tg = cur===1 ? 1 : 0;
    var acc = 13*(tg - mm) - 2*3.6*mv;
    mv += acc * dt;
    mm += mv * dt;
    if(mm < 0){ mm=0; mv=0; }
    if(mm > 1){ mm=1; mv=0; }
    if(Math.abs(tg-mm) < .0015 && Math.abs(mv) < .02){
      mm = tg; mv = 0;
      if(!settled){
        settled = 1;
        setStat(cur===1 ? 'Avatar aktif' : 'Pilih agen atau buka avatar');
      }
    }
    U.uM.value = mm;

    /* target mulut */
    var tj=0, tw=0, tr=0, ma=0;
    if(spk){
      var idx = bI >= 0 ? bI + (now - bT)/1000 * CPS : (now - sT)/1000 * CPS;
      if(bI >= 0){
        var ns2 = TXT.indexOf(' ', bI+1);
        if(ns2 < 0) ns2 = TXT.length;
        idx = Math.min(idx, ns2);
      }
      var ch = TXT.charAt(Math.min(TXT.length-1, Math.floor(idx)));
      var vz = vis(ch), nx = vis(TXT.charAt(Math.min(TXT.length-1, Math.floor(idx)+1)));
      var fr = idx % 1;
      tj = lr(vz[0], nx[0], fr*fr) * (.82 + .18*Math.sin(T*10));
      tw = lr(vz[1], nx[1], fr*fr);
      tr = lr(vz[2], nx[2], fr*fr);
      if(idx > TXT.length + 2) tj = 0;
    }
    if(micOn && an && buf){
      try{
        an.getByteFrequencyData(buf);
        var s=0, lo=0, hi=0, i2;
        for(i2=0; i2<buf.length; i2++) s += buf[i2];
        for(i2=2; i2<6; i2++) lo += buf[i2];
        for(i2=8; i2<20; i2++) hi += buf[i2];
        lo /= 4; hi /= 12;
        ma = Math.min(1, s / buf.length / 55);
        var hN = hi / (lo + hi + 1);
        tj = Math.max(tj, ma * 1.15);
        tw = Math.max(tw, (hN - .3)*2.5 * ma);
        tr = Math.max(tr, Math.max(0, (.3 - hN)*3.2) * ma);
      }catch(_){}
    }
    jw = ease(jw, cl(tj,0,1), 22, dt);
    wd = ease(wd, cl(tw,-.3,1), 14, dt);
    rn = ease(rn, cl(tr,0,1), 14, dt);

    var act = Math.max(tj, ma), spkA = spk ? 1 : 0;
    sl = ease(sl, .14 + .08*Math.sin(T*.3) + .1*wd*spkA + .12*(1-Math.min(1,act*2)), 4, dt);

    /* kedip alami */
    if(T > nb){
      bt = 0;
      nb = T + 2.2 + R()*3.5;
      if(R() < .18) nb = T + .3;
    }
    var bv = 0;
    if(bt >= 0){
      bt += dt;
      bv = bt < .07 ? bt/.07 : bt < .22 ? 1 - (bt-.07)/.15 : 0;
      if(bt > .22) bt = -1;
    }
    bl = bv*bv*(3-2*bv);

    /* tatapan + saccade */
    if(T > ns){
      sx = (R()-.5)*.7; sy = (R()-.5)*.4;
      ns = T + .7 + R()*2.2;
    }
    gx = ease(gx, cl(mx*2.2 + sx, -1, 1), 14, dt);
    gy = ease(gy, cl(-my*2.2 + sy, -1, 1), 14, dt);

    /* kepala */
    hx = ease(hx, mx*.5 + .06*Math.sin(T*.5) + .035*Math.sin(T*.83+1), 5, dt);
    hy = ease(hy, my*.3 + .03*Math.sin(T*.61) + .04*act, 5, dt);
    hz = ease(hz, .025*Math.sin(T*.4) - mx*.05, 5, dt);

    amp = ease(amp, Math.max(ma, spk ? .2 + .35*jw : 0), 10, dt);
    U.uAmp.value = amp;
    U.uJaw.value = jw;
    U.uWide.value = wd;
    U.uRound.value = rn;
    U.uSmile.value = sl;
    U.uBlink.value = bl;
    U.uBrow.value = ease(U.uBrow.value, .25*act + .12*Math.sin(T*.7), 6, dt);
    U.uBreath.value = .03 * Math.sin(T*1.6);
    U.uGaze.value.set(gx, gy);
    U.uHead.value.set(hx, hy, hz);

    camZ += (camZt - camZ) * (1 - Math.exp(-3.2*dt));
    cam.position.z = camZ;

    var ry = cur===0 ? mx*.9 : mx*.16;
    var rx = cur===0 ? my*.25 : my*.05;
    pts.rotation.y += (ry - pts.rotation.y) * .06;
    pts.rotation.x += (rx - pts.rotation.x) * .06;
    cam.position.x += ((cur===0 ? mx*.6 : 0) - cam.position.x) * .05;
    cam.lookAt(0, 0, 0);
    pts.rotation.z = Math.sin(mm*Math.PI)*.45*(cur?1:-1);
    var fv = 50 + 9*Math.sin(mm*Math.PI);
    if(Math.abs(fv-cam.fov) > .01){ cam.fov = fv; cam.updateProjectionMatrix(); }
    for(var rk=0; rk<rings.length; rk++){ rv[rk] = cl(RC-rk,0,1);
      var rg = rings[rk];
      rg.rotation.x = 1.15 + .35*Math.sin(T*.5+rk*2) + rk*.28; rg.rotation.z = rk*.5 + T*.12*(rk%3-1);
      rg.rotation.y = T*(.22+.1*rk)*(rk%2?-1:1)*RSP;
      rg.material.opacity = mm*mm*rv[rk]*(.3+.15*Math.sin(T*2+rk)); rg.material.color.setRGB(CR,CG,CB);
      rg.visible = mm > .02 && rv[rk] > .01;
    }

    place();
    try{
      rd.render(sc, cam);
    }catch(e){
      console.warn('render error', e);
    }
  }

  /* ===== UPGRADE: transisi otomatis, efek, telemetri, API ===== */
  function fx(){
    ['fl','sw'].forEach(function(id){
      var e = document.getElementById(id);
      e.classList.remove('go'); void e.offsetWidth; e.classList.add('go');
    });
  }
  var auto = true;
  function stopAuto(){ auto = false; }
  addEventListener('pointerdown', stopAuto, {once:true});
  addEventListener('keydown', stopAuto, {once:true});
  function tour(){ if(auto) go(1); }
  function cyc(){ if(auto && cur===1 && !document.hidden) pick((per+1)%5, true); }
  setTimeout(tour, 3200); setInterval(cyc, 6500);

  var TL = [[1,92,99,'%'],[2,8,19,'ms'],[3,30,68,'%'],[4,-42,-28,'dB']];
  function tel(){
    TL.forEach(function(t){
      var v = t[1] + R()*(t[2]-t[1]);
      document.getElementById('t'+t[0]).textContent = v.toFixed(t[0]===2||t[0]===4 ? 0 : 1) + t[3];
      document.getElementById('b'+t[0]).style.width = ((v-t[1])/(t[2]-t[1])*70+30) + '%';
    });
  }
  tel(); setInterval(tel, 1100);

  /* API untuk integrasi NEXUS */
  window.NexusAvatar = {
    show: function(){ stopAuto(); go(1); },
    hub: function(){ stopAuto(); go(0); },
    say: function(t){ stopAuto(); if(t) TXT = String(t); speak(true); },
    stop: function(){ speak(false); },
    persona: function(i){ stopAuto(); if(typeof i==='string') i = PER.map(function(p){ return p.s.toLowerCase(); }).indexOf(i.toLowerCase()); if(i>=0) pick(i, true); }
  };

  /* ===== DEWAN: persona, morphing, UI, FPS ===== */
  var PER = [
    {s:'Nova',n:'Dr. Nova',r:'Teoretikus',c1:[.1,.3,1],c2:[.35,.95,1],ring:2,spd:.4,rt:.9,pt:1.1,line:'Secara teori, struktur ini konsisten dan elegan.'},
    {s:'Flux',n:'Dr. Flux',r:'Eksperimentalis',c1:[.02,.65,.4],c2:[.55,1,.8],ring:3,spd:2.4,rt:1.25,pt:1.2,line:'Mari kita uji sekarang, hasil eksperimen datang cepat!'},
    {s:'CGO',n:'CGO',r:'Cyber Guardian',c1:[1,.5,0],c2:[1,.9,.25],ring:2,spd:.3,rt:.85,pt:.6,line:'Sistem aman. Perisai aktif, tidak ada ancaman.'},
    {s:'Lyric',n:'Dr. Lyric',r:'Kritikus',c1:[.95,.05,.3],c2:[1,.35,.9],ring:1,spd:1.6,rt:1.1,pt:1.4,line:'Saya menemukan celah. Argumen ini retak.'},
    {s:'Cortex',n:'Dr. Cortex',r:'Polymath',c1:[.5,.25,1],c2:[1,.95,1],ring:7,spd:.8,rt:.95,pt:.9,line:'Semua sudut pandang menyatu menjadi satu kesimpulan.'}
  ];
  var per = 4, PK = 1, pf = [0,0,0,0,1], pt = [0,0,0,0,1], wc = [0,0,0,0,1];
  var RC = 7, RSP = .8, CR = 1, CG = .95, CB = 1, rv = [0,0,0,0,0,0,0];
  function rgb(c, f){ f = f || 1; return 'rgb(' + ((c[0]*f*255)|0) + ',' + ((c[1]*f*255)|0) + ',' + ((c[2]*f*255)|0) + ')'; }
  function pstep(dt){
    if(PK < 1) PK = Math.min(1, PK + dt/1.8);
    var k = PK*PK*(3-2*PK), i, j, s1 = [0,0,0], s2 = [0,0,0];
    RC = 0; RSP = 0;
    for(i=0; i<5; i++){
      wc[i] = pf[i] + (pt[i]-pf[i])*k;
      for(j=0; j<3; j++){ s1[j] += wc[i]*PER[i].c1[j]; s2[j] += wc[i]*PER[i].c2[j]; }
      RC += wc[i]*PER[i].ring; RSP += wc[i]*PER[i].spd;
    }
    U.uPk.value = PK;
    U.uC1.value.set(s1[0], s1[1], s1[2]); U.uC2.value.set(s2[0], s2[1], s2[2]);
    CR = s2[0]; CG = s2[1]; CB = s2[2];
  }
  var cbEl = document.getElementById('cb'), npEl = document.getElementById('np'), chips = [];
  function theme(){
    var p = PER[per], b = document.body;
    chips.forEach(function(c,j){ c.classList.toggle('on', j===per); });
    npEl.innerHTML = '<b>' + p.n + '</b><span>' + p.r + '</span>';
    npEl.style.color = rgb(p.c2);
    if(cur === 1){
      b.style.setProperty('--cy', rgb(p.c2)); b.style.setProperty('--vi', rgb(p.c1)); b.style.setProperty('--bg1', rgb(p.c1, .28));
    } else {
      ['--cy','--vi','--bg1'].forEach(function(v){ b.style.removeProperty(v); });
    }
  }
  function pick(i, mute){
    if(i !== per){
      for(var j=0; j<5; j++){ pf[j] = wc[j]; pt[j] = (j===i) ? 1 : 0; }
      U.uPf.value.set(pf[0], pf[1], pf[2], pf[3]); U.uPt.value.set(pt[0], pt[1], pt[2], pt[3]);
      per = i; PK = 0;
      fx(); theme();
    }
    TXT = PER[per].line; speak(true, mute);
    setStat('Berbicara: ' + PER[per].n);
  }
  PER.forEach(function(p,i){
    var b = document.createElement('button');
    b.innerHTML = '<i></i>' + p.s; b.style.setProperty('--c', rgb(p.c2));
    b.onclick = function(){ stopAuto(); pick(i, false); };
    cbEl.appendChild(b); chips.push(b);
  });
  theme();

  var fpsEl = document.getElementById('fps'), fA = 0, fN = 0, fLow = 0, drawN = N;
  function fpsTick(dt){
    fA += dt; fN++;
    if(fA >= 1){
      var f = fN/fA;
      fLow = (f < 50 && !document.hidden) ? fLow+1 : 0;
      if(fLow >= 2 && drawN > 12000){ drawN = Math.max(12000, (drawN*.88)|0); geo.setDrawRange(0, drawN); fLow = 0; }
      fpsEl.textContent = (f|0) + ' FPS · ' + drawN;
      fA = 0; fN = 0;
    }
  }

  // Hide loader once ready
  requestAnimationFrame(function(){
    document.getElementById('loader').classList.add('hide');
    setTimeout(function(){
      var l = document.getElementById('loader');
      if(l && l.parentNode) l.parentNode.removeChild(l);
    }, 700);
  });

  requestAnimationFrame(frame);
  setStat('Pilih agen atau buka avatar');

  // Visibility / battery friendly pause
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      if(frameId) cancelAnimationFrame(frameId);
      if(spk) speak(false);
    } else {
      last = performance.now();
      requestAnimationFrame(frame);
    }
  });

  // Cleanup on page unload
  window.addEventListener('pagehide', function(){
    stopMic();
    if(window.speechSynthesis) try{ speechSynthesis.cancel(); }catch(_){}
  });
}

})();
</script>
</body>
