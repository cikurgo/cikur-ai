<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>CGO NEXUS 3D</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

body {
    position: fixed;
    inset: 0;
}

#nexus-logo-container {
    position: absolute;
    inset: 0;

    width: 100vw;
    height: 100vh;
    height: 100dvh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(0,255,255,0.085) 0%,
            rgba(0,255,255,0.025) 25%,
            rgba(0,0,0,0) 52%
        ),
        #000;
}

#nexus-logo-container canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.nexus-label {
    position: absolute;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    color: rgba(255,255,255,0.36);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 7px;
    font-weight: 500;

    letter-spacing: 5px;

    white-space: nowrap;

    pointer-events: none;
}
</style>
</head>

<body>

<div id="nexus-logo-container"></div>

<div class="nexus-label">
    CGO NEXUS
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

(function initNexus3DLogo() {

"use strict";


/* =========================================================
   CONTAINER
========================================================= */

const container =
    document.getElementById(
        "nexus-logo-container"
    );

if (!container || typeof THREE === "undefined") {
    return;
}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        38,
        1,
        0.1,
        100
    );

camera.position.set(
    0,
    0,
    18
);

camera.lookAt(
    0,
    0,
    0
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.setClearColor(
    0x000000,
    0
);

container.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1.5
    );

scene.add(
    ambient
);


const cyanLight =
    new THREE.PointLight(
        0x00ffff,
        7,
        30
    );

cyanLight.position.set(
    -4,
    5,
    8
);

scene.add(
    cyanLight
);


const whiteLight =
    new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

whiteLight.position.set(
    -5,
    6,
    10
);

scene.add(
    whiteLight
);


const rimLight =
    new THREE.PointLight(
        0x00ffff,
        4,
        25
    );

rimLight.position.set(
    5,
    -3,
    5
);

scene.add(
    rimLight
);


/* =========================================================
   MATERIAL
========================================================= */

const logoMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x00eaff,

        emissive: 0x00aebd,

        emissiveIntensity: 1.0,

        metalness: 0.48,

        roughness: 0.16,

        transparent: true,

        opacity: 0.94,

        side: THREE.DoubleSide

    });


/* =========================================================
   EDGE MATERIAL
========================================================= */

const edgeMaterial =
    new THREE.LineBasicMaterial({

        color: 0xffffff,

        transparent: true,

        opacity: 0.95,

        depthWrite: false

    });


/* =========================================================
   LOGO GROUP
========================================================= */

const logoGroup =
    new THREE.Group();


/*
    Koordinat asli bentuk logo.
    Bentuk tidak diubah.
*/

const S = 100;

const CX = 768;
const CY = 512;


function P(x, y) {

    return {

        x: (x - CX) / S,

        y: (CY - y) / S

    };

}


/* =========================================================
   SHAPE 1
   DIAGONAL UTAMA
========================================================= */

const shapeDiag =
    new THREE.Shape();

let p =
    P(376,130);

shapeDiag.moveTo(
    p.x,
    p.y
);


p =
    P(377,311);

shapeDiag.lineTo(
    p.x,
    p.y
);


p =
    P(1161,912);

shapeDiag.lineTo(
    p.x,
    p.y
);


p =
    P(1158,718);

shapeDiag.lineTo(
    p.x,
    p.y
);

shapeDiag.closePath();


/* =========================================================
   SHAPE 2
   SAYAP KIRI
========================================================= */

const shapeLeft =
    new THREE.Shape();


p =
    P(376,371);

shapeLeft.moveTo(
    p.x,
    p.y
);


p =
    P(376,802);

shapeLeft.lineTo(
    p.x,
    p.y
);


p =
    P(634,624);

shapeLeft.lineTo(
    p.x,
    p.y
);


p =
    P(640,570);

shapeLeft.lineTo(
    p.x,
    p.y
);

shapeLeft.closePath();


/* =========================================================
   SHAPE 3
   SAYAP KANAN / NOTCH
========================================================= */

const shapeRight =
    new THREE.Shape();


p =
    P(1161,131);

shapeRight.moveTo(
    p.x,
    p.y
);


p =
    P(887,323);

shapeRight.lineTo(
    p.x,
    p.y
);


p =
    P(889,451);

shapeRight.lineTo(
    p.x,
    p.y
);


p =
    P(958,504);

shapeRight.lineTo(
    p.x,
    p.y
);


p =
    P(961,398);

shapeRight.lineTo(
    p.x,
    p.y
);


p =
    P(1160,560);

shapeRight.lineTo(
    p.x,
    p.y
);

shapeRight.closePath();


/* =========================================================
   3D DEPTH
========================================================= */

const extrudeSettings = {

    depth: 0.62,

    bevelEnabled: true,

    bevelThickness: 0.025,

    bevelSize: 0.018,

    bevelOffset: 0,

    bevelSegments: 2,

    curveSegments: 1,

    steps: 1

};


/* =========================================================
   CREATE 3D PARTS
========================================================= */

[
    shapeLeft,
    shapeDiag,
    shapeRight

].forEach(function(shape) {

    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            extrudeSettings
        );


    /*
       ExtrudeGeometry membentang
       dari z=0 sampai depth.

       Kita pusatkan tepat di tengah
       agar rotasi terlihat natural.
    */

    geometry.translate(
        0,
        0,
        -extrudeSettings.depth / 2
    );


    geometry.computeVertexNormals();


    const mesh =
        new THREE.Mesh(
            geometry,
            logoMaterial
        );


    logoGroup.add(
        mesh
    );


    /*
       EDGE PUTIH
    */

    const edges =
        new THREE.EdgesGeometry(
            geometry,
            15
        );


    const edgeLines =
        new THREE.LineSegments(
            edges,
            edgeMaterial
        );


    logoGroup.add(
        edgeLines
    );

});


/* =========================================================
   POSISI & UKURAN LOGO
========================================================= */

logoGroup.position.set(
    0,
    0,
    0
);


/*
   Ini sengaja lebih kecil daripada
   versi yang menyebabkan logo keluar layar.
*/

logoGroup.scale.set(
    0.78,
    0.78,
    0.78
);

scene.add(
    logoGroup
);


/* =========================================================
   GLOW LAYER
========================================================= */

const glowGroup =
    new THREE.Group();


[
    shapeLeft,
    shapeDiag,
    shapeRight

].forEach(function(shape) {

    const glowGeometry =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth: 0.72,
                bevelEnabled: false,
                curveSegments: 1
            }
        );


    glowGeometry.translate(
        0,
        0,
        -0.36
    );


    const glowMaterial =
        new THREE.MeshBasicMaterial({

            color: 0x00ffff,

            transparent: true,

            opacity: 0.075,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false,

            side: THREE.DoubleSide

        });


    const glowMesh =
        new THREE.Mesh(
            glowGeometry,
            glowMaterial
        );


    glowGroup.add(
        glowMesh
    );

});


glowGroup.scale.set(
    0.80,
    0.80,
    0.80
);

scene.add(
    glowGroup
);


/* =========================================================
   SECOND GLOW / HALO
========================================================= */

const haloGeometry =
    new THREE.CircleGeometry(
        5.4,
        64
    );


const haloMaterial =
    new THREE.MeshBasicMaterial({

        color: 0x00ffff,

        transparent: true,

        opacity: 0.018,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false

    });


const halo =
    new THREE.Mesh(
        haloGeometry,
        haloMaterial
    );

halo.position.z =
    -1.2;

scene.add(
    halo
);


/* =========================================================
   PARTICLE FIELD
========================================================= */

const particleCount =
    420;


const particlePositions =
    new Float32Array(
        particleCount * 3
    );


for (
    let i = 0;
    i < particleCount * 3;
    i += 3
) {

    const radius =
        5.0 +
        Math.random() * 4.5;


    const theta =
        Math.random() *
        Math.PI *
        2;


    const phi =
        Math.acos(
            (Math.random() * 2) - 1
        );


    particlePositions[i] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);


    particlePositions[i + 1] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);


    particlePositions[i + 2] =
        radius *
        Math.cos(phi);

}


const particleGeometry =
    new THREE.BufferGeometry();


particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        particlePositions,
        3
    )
);


const particleMaterial =
    new THREE.PointsMaterial({

        color: 0x00ffff,

        size: 0.042,

        transparent: true,

        opacity: 0.62,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false

    });


const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );


scene.add(
    particles
);


/* =========================================================
   RESIZE / FRAMING
========================================================= */

function resize() {

    const width =
        container.clientWidth;

    const height =
        container.clientHeight;


    if (
        width <= 0 ||
        height <= 0
    ) {
        return;
    }


    camera.aspect =
        width / height;


    /*
       Tetap menggunakan perspective,
       tetapi FOV cukup lebar supaya
       logo tidak keluar layar.
    */

    camera.fov =
        width < height
            ? 42
            : 38;


    camera.updateProjectionMatrix();


    renderer.setSize(
        width,
        height,
        false
    );

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(
    t,
    dt
) {

    /*
       PULSE
    */

    const pulse =
        0.5 +
        0.5 *
        Math.sin(
            t * 2.4
        );


    /*
       MATERIAL PULSE
    */

    logoMaterial.emissiveIntensity =
        0.82 +
        pulse * 0.55;


    logoMaterial.opacity =
        0.91 +
        pulse * 0.06;


    edgeMaterial.opacity =
        0.72 +
        pulse * 0.28;


    particleMaterial.opacity =
        0.42 +
        pulse * 0.26;


    /*
       BREATHING
    */

    const breathing =
        1 +
        Math.sin(
            t * 2.0
        ) *
        0.012;


    logoGroup.scale.set(
        0.78 * breathing,
        0.78 * breathing,
        0.78 * breathing
    );


    /*
       ROTASI 3D.
       
       Ini yang membuat kedalaman
       ExtrudeGeometry benar-benar terlihat.
    */

    logoGroup.rotation.y =
        Math.sin(
            t * 0.55
        ) *
        0.16;


    logoGroup.rotation.x =
        Math.sin(
            t * 0.42
        ) *
        0.055;


    /*
       Glow mengikuti logo.
    */

    glowGroup.rotation.y =
        logoGroup.rotation.y;

    glowGroup.rotation.x =
        logoGroup.rotation.x;


    /*
       Particle bergerak
       sangat pelan.
    */

    particles.rotation.y -=
        dt * 0.025;

    particles.rotation.x +=
        dt * 0.008;


    /*
       Halo pulse.
    */

    halo.scale.set(
        1 +
        pulse * 0.10,
        1 +
        pulse * 0.10,
        1
    );


    haloMaterial.opacity =
        0.012 +
        pulse * 0.025;


    /*
       Render.
    */

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   CGONEXUS ONFRAME
========================================================= */

if (
    typeof onFrame === "function"
) {

    onFrame(
        function(t, dt) {

            animate(
                t,
                dt
            );

        }
    );

}

else {

    let previous =
        performance.now();


    function loop() {

        const now =
            performance.now();


        const dt =
            Math.min(
                (now - previous) / 1000,
                0.05
            );


        previous =
            now;


        animate(
            now / 1000,
            dt
        );


        requestAnimationFrame(
            loop
        );

    }


    loop();

}


/* =========================================================
   RESIZE EVENTS
========================================================= */

window.addEventListener(
    "resize",
    resize,
    {
        passive: true
    }
);


window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            resize,
            120
        );

    },
    {
        passive: true
    }
);


resize();


})();
</script>

</body>
</html>
