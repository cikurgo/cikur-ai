<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>CGO NEXUS 3D</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#nexus-logo-container {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(0,255,255,.10) 0%,
            rgba(0,0,0,0) 48%
        ),
        #000;
}

#nexus-logo-container canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.nexus-label {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);

    color: rgba(255,255,255,.38);
    font-family: Arial, sans-serif;
    font-size: 8px;
    letter-spacing: 5px;

    pointer-events: none;
    white-space: nowrap;
}
</style>
</head>

<body>

<div id="nexus-logo-container"></div>

<div class="nexus-label">
    CGO NEXUS
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

(function () {

"use strict";


const container =
    document.getElementById(
        "nexus-logo-container"
    );

if (!container || !window.THREE) {
    return;
}


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.OrthographicCamera(
        -10,
         10,
         10,
        -10,
        0.1,
        100
    );

camera.position.set(
    0,
    0,
    20
);

camera.lookAt(
    0,
    0,
    0
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

container.appendChild(
    renderer.domElement
);


/* =========================================================
   MATERIAL
========================================================= */

const material =
    new THREE.MeshStandardMaterial({
        color: 0x00f4ff,
        emissive: 0x00aebb,
        emissiveIntensity: 0.75,
        metalness: 0.45,
        roughness: 0.18,
        transparent: true,
        opacity: 0.94,
        side: THREE.DoubleSide
    });


const edgeMaterial =
    new THREE.LineBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.9
    });


/* =========================================================
   LIGHT
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.4
    )
);

const cyanLight =
    new THREE.PointLight(
        0x00ffff,
        5,
        20
    );

cyanLight.position.set(
    -3,
    3,
    8
);

scene.add(
    cyanLight
);

const whiteLight =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

whiteLight.position.set(
    -4,
    6,
    10
);

scene.add(
    whiteLight
);


/* =========================================================
   LOGO
========================================================= */

const logo =
    new THREE.Group();


const SCALE = 100;

const CX = 768;
const CY = 512;


function P(x, y) {

    return {
        x: (x - CX) / SCALE,
        y: (CY - y) / SCALE
    };

}


/* =========================================================
   DIAGONAL
========================================================= */

const diagonal =
    new THREE.Shape();

let p = P(376,130);

diagonal.moveTo(
    p.x,
    p.y
);

p = P(377,311);

diagonal.lineTo(
    p.x,
    p.y
);

p = P(1161,912);

diagonal.lineTo(
    p.x,
    p.y
);

p = P(1158,718);

diagonal.lineTo(
    p.x,
    p.y
);

diagonal.closePath();


/* =========================================================
   LEFT
========================================================= */

const left =
    new THREE.Shape();

p = P(376,371);

left.moveTo(
    p.x,
    p.y
);

p = P(376,802);

left.lineTo(
    p.x,
    p.y
);

p = P(634,624);

left.lineTo(
    p.x,
    p.y
);

p = P(640,570);

left.lineTo(
    p.x,
    p.y
);

left.closePath();


/* =========================================================
   RIGHT
========================================================= */

const right =
    new THREE.Shape();

p = P(1161,131);

right.moveTo(
    p.x,
    p.y
);

p = P(887,323);

right.lineTo(
    p.x,
    p.y
);

p = P(889,451);

right.lineTo(
    p.x,
    p.y
);

p = P(958,504);

right.lineTo(
    p.x,
    p.y
);

p = P(961,398);

right.lineTo(
    p.x,
    p.y
);

p = P(1160,560);

right.lineTo(
    p.x,
    p.y
);

right.closePath();


/* =========================================================
   3D EXTRUSION
========================================================= */

const settings = {
    depth: 0.55,
    bevelEnabled: false,
    curveSegments: 1,
    steps: 1
};


[
    left,
    diagonal,
    right

].forEach(function (shape) {

    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            settings
        );

    geometry.translate(
        0,
        0,
        -0.275
    );

    geometry.computeVertexNormals();


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    logo.add(
        mesh
    );


    const edges =
        new THREE.LineSegments(
            new THREE.EdgesGeometry(
                geometry
            ),
            edgeMaterial
        );

    logo.add(
        edges
    );

});


/* =========================================================
   UKURAN LOGO
========================================================= */

logo.scale.set(
    0.78,
    0.78,
    0.78
);

scene.add(
    logo
);


/* =========================================================
   GLOW
========================================================= */

const glow =
    new THREE.Group();

[
    left,
    diagonal,
    right

].forEach(function (shape) {

    const g =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth: 0.1,
                bevelEnabled: false
            }
        );

    g.translate(
        0,
        0,
        -0.32
    );

    const m =
        new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.055,
            blending:
                THREE.AdditiveBlending,
            depthWrite: false
        });

    const mesh =
        new THREE.Mesh(
            g,
            m
        );

    glow.add(
        mesh
    );

});

glow.scale.set(
    0.82,
    0.82,
    0.82
);

scene.add(
    glow
);


/* =========================================================
   PARTICLES
========================================================= */

const count = 420;

const pos =
    new Float32Array(
        count * 3
    );

for (
    let i = 0;
    i < count * 3;
    i += 3
) {

    const r =
        6 +
        Math.random() * 5;

    const theta =
        Math.random() *
        Math.PI *
        2;

    const phi =
        Math.acos(
            Math.random() * 2 - 1
        );

    pos[i] =
        r *
        Math.sin(phi) *
        Math.cos(theta);

    pos[i + 1] =
        r *
        Math.sin(phi) *
        Math.sin(theta);

    pos[i + 2] =
        r *
        Math.cos(phi) -
        4;

}


const pg =
    new THREE.BufferGeometry();

pg.setAttribute(
    "position",
    new THREE.BufferAttribute(
        pos,
        3
    )
);


const pm =
    new THREE.PointsMaterial({
        color: 0x00ffff,
        size: 0.035,
        transparent: true,
        opacity: 0.58,
        blending:
            THREE.AdditiveBlending,
        depthWrite: false
    });


const particles =
    new THREE.Points(
        pg,
        pm
    );

scene.add(
    particles
);


/* =========================================================
   CAMERA FIT
       
   SENGAJA DIBUAT LEBIH LONGGAR.
   
   Tidak menggunakan perhitungan logoWidth/aspect
   yang sebelumnya menyebabkan logo terlalu memenuhi
   layar portrait.
========================================================= */

function resize() {

    const w =
        container.clientWidth;

    const h =
        container.clientHeight;

    if (!w || !h) {
        return;
    }


    const aspect =
        w / h;


    /*
     * View height besar = logo mengecil.
     *
     * Untuk HP portrait:
     * sekitar 15 - 16 unit.
     *
     * Untuk layar lebar:
     * sekitar 11 - 12 unit.
     */

    let viewHeight;

    if (aspect < 0.65) {

        viewHeight = 16.5;

    }

    else if (aspect < 0.9) {

        viewHeight = 14.0;

    }

    else {

        viewHeight = 11.5;

    }


    const halfH =
        viewHeight / 2;

    const halfW =
        halfH * aspect;


    camera.left =
        -halfW;

    camera.right =
         halfW;

    camera.top =
         halfH;

    camera.bottom =
        -halfH;


    camera.updateProjectionMatrix();


    renderer.setSize(
        w,
        h
    );

}


/* =========================================================
   ANIMATION
========================================================= */

function draw(t, dt) {

    const pulse =
        0.5 +
        Math.sin(
            t * 2.2
        ) * 0.5;


    material.emissiveIntensity =
        0.68 +
        pulse * 0.38;


    material.opacity =
        0.90 +
        pulse * 0.07;


    edgeMaterial.opacity =
        0.72 +
        pulse * 0.24;


    pm.opacity =
        0.38 +
        pulse * 0.28;


    /*
     * Sedikit gerakan 3D.
     * Bukan rotasi besar.
     */

    logo.rotation.y =
        Math.sin(
            t * 0.55
        ) * 0.045;


    logo.rotation.x =
        Math.sin(
            t * 0.40
        ) * 0.025;


    /*
     * Gerakan glow mengikuti logo.
     */

    glow.rotation.copy(
        logo.rotation
    );


    glow.position.copy(
        logo.position
    );


    particles.rotation.y -=
        dt * 0.018;

    particles.rotation.x +=
        dt * 0.006;


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   CGONEXUS ENGINE
========================================================= */

if (
    typeof onFrame === "function"
) {

    onFrame(
        function (t, dt) {
            draw(t, dt);
        }
    );

}

else {

    let last =
        performance.now() / 1000;


    function loop() {

        const now =
            performance.now() / 1000;


        const dt =
            Math.min(
                now - last,
                0.05
            );


        last = now;


        draw(
            now,
            dt
        );


        requestAnimationFrame(
            loop
        );

    }


    loop();

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    resize,
    {
        passive: true
    }
);

window.addEventListener(
    "orientationchange",
    function () {

        setTimeout(
            resize,
            100
        );

    },
    {
        passive: true
    }
);


resize();

})();

</script>

</body>
</html>
