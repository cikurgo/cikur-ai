<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 3D Logo Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* Latar hitam pekat */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #nexus-logo-container {
            width: 100vw; /* Lebar penuh layar */
            height: 100vh; /* Tinggi penuh layar */
        }
    </style>
    <!-- Memuat Library Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Wadah untuk merender 3D -->
    <div id="nexus-logo-container"></div>

    <script>
        // --- ENGINE ANIMASI SEDERHANA (PENGGANTI onFrame) ---
        let lastTime = performance.now();
        function onFrame(callback) {
            function loop(time) {
                // Menghitung delta time (dt) dalam satuan detik
                const dt = (time - lastTime) / 1000; 
                // Waktu total (t) dalam satuan detik
                const t = time / 1000; 
                
                lastTime = time;
                
                // Menjalankan fungsi callback (animasi)
                callback(t, dt);
                
                // Meminta frame berikutnya
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        // --- KODE DARI USER (DENGAN SEDIKIT PENYESUAIAN UKURAN) ---
        (function initNexus3DLogo() {
            const container = document.getElementById('nexus-logo-container');
            if (!container || typeof THREE === 'undefined') return;

            // 1. Setup Scene, Camera, Renderer
            const scene = new THREE.Scene();
            // Aspect ratio disesuaikan dengan ukuran layar
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 15; // Digeser sedikit ke belakang agar pas di layar HP

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 2. Material Setup (Neon Cyan & Glowing White Edges)
            const logoMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00FFFF, 
                transparent: true, 
                opacity: 0.8,
                side: THREE.DoubleSide
            });
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: 0xFFFFFF, 
                transparent: true, 
                opacity: 1.0 
            });

            // 3. Geometri Logo "N" (Presisi dari bentuk panah/perisai)
            const logoGroup = new THREE.Group();
            const extrudeSettings = { depth: 0.5, bevelEnabled: false, curveSegments: 1 };

            // Bagian 1: Sayap Kiri (Segitiga)
            const shapeLeft = new THREE.Shape();
            shapeLeft.moveTo(-3, 4);
            shapeLeft.lineTo(-3, -4);
            shapeLeft.lineTo(0, -1);
            shapeLeft.lineTo(-0.5, 4);
            shapeLeft.lineTo(-3, 4);

            // Bagian 2: Garis Diagonal Utama
            const shapeDiag = new THREE.Shape();
            shapeDiag.moveTo(-0.5, 4);
            shapeDiag.lineTo(1.5, 4);
            shapeDiag.lineTo(4, -4);
            shapeDiag.lineTo(2, -4);
            shapeDiag.lineTo(-0.5, 4);

            // Bagian 3: Sayap Kanan (Dengan potongan/notch)
            const shapeRight = new THREE.Shape();
            shapeRight.moveTo(4, 4);
            shapeRight.lineTo(4, -4);
            shapeRight.lineTo(1.5, -1);
            shapeRight.lineTo(2.5, -1);
            shapeRight.lineTo(2.5, 1.5);
            shapeRight.lineTo(4, 4);

            // Gabungkan Shapes ke dalam Geometri 3D
            [shapeLeft, shapeDiag, shapeRight].forEach(shape => {
                const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                
                // Solid Mesh
                const mesh = new THREE.Mesh(geo, logoMaterial);
                logoGroup.add(mesh);
                
                // Glowing Edges
                const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMaterial);
                logoGroup.add(edges);
            });

            // Posisikan agar tepat di tengah
            logoGroup.position.x = -0.5;
            scene.add(logoGroup);

            // 4. Efek Partikel Energi di Sekitar Logo
            const particleCount = 400;
            const particleGeo = new THREE.BufferGeometry();
            const particlePos = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                // Sebar partikel dalam radius bola
                const r = 3 + Math.random() * 4;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                
                particlePos[i] = r * Math.sin(phi) * Math.cos(theta);
                particlePos[i+1] = r * Math.sin(phi) * Math.sin(theta);
                particlePos[i+2] = r * Math.cos(phi);
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
            const particleMat = new THREE.PointsMaterial({ 
                color: 0x00FFFF, 
                size: 0.05, 
                transparent: true, 
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            const particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            // 5. Animasi Menggunakan Hook `onFrame`
            onFrame((t, dt) => {
                // Rotasi Konstan pada Sumbu Y
                logoGroup.rotation.y += dt * 0.4;
                particles.rotation.y -= dt * 0.15;
                particles.rotation.x += dt * 0.05;

                // Efek Pulsing Glow (Denyutan Opacity & Skala)
                const pulse = Math.sin(t * 3) * 0.5 + 0.5; // Nilai 0 s/d 1
                logoMaterial.opacity = 0.5 + (pulse * 0.5);
                lineMaterial.opacity = 0.7 + (pulse * 0.3);
                
                // Skala sedikit membesar-mengecil untuk efek "bernafas"
                const scale = 1 + (pulse * 0.03);
                logoGroup.scale.set(scale, scale, scale);

                // Render Scene
                renderer.render(scene, camera);
            });

            // Handle Resize agar responsif
            window.addEventListener('resize', () => {
                if (container.clientWidth === 0) return;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

        })();
    </script>
</body>
</html>
