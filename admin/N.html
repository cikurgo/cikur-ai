<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>CGO NEXUS — 3D Logo</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, sans-serif;
}

#nexus-logo-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(0,255,255,0.075) 0%,
            rgba(0,40,45,0.035) 25%,
            #000 68%
        );
}

#nexus-logo-container canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.nexus-label {
    position: absolute;
    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    font-size: 7px;
    letter-spacing: 6px;

    color: rgba(180,255,255,0.42);

    white-space: nowrap;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="nexus-logo-container">
    <div class="nexus-label">CGO NEXUS</div>
</div>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

(function initNexus3DLogo() {

    const container =
        document.getElementById("nexus-logo-container");

    if (!container || typeof THREE === "undefined") {
        console.error("CGO NEXUS: Three.js tidak tersedia.");
        return;
    }


    /* =========================================================
       SCENE
       ========================================================= */

    const scene = new THREE.Scene();


    /* =========================================================
       CAMERA
       ========================================================= */

    const camera = new THREE.PerspectiveCamera(
        38,
        container.clientWidth /
        Math.max(container.clientHeight, 1),

        0.1,
        100
    );

    camera.position.set(0, 0, 18);

    camera.lookAt(0, 0, 0);


    /* =========================================================
       RENDERER
       ========================================================= */

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            powerPreference: "high-performance"
        });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(
        container.clientWidth,
        container.clientHeight,
        false
    );

    renderer.setClearColor(0x000000, 0);

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    container.appendChild(renderer.domElement);


    /* =========================================================
       MATERIAL LOGO
       ========================================================= */

    const logoMaterial =
        new THREE.MeshBasicMaterial({

            color: 0x00f5ff,

            transparent: true,

            opacity: 0.88,

            side: THREE.DoubleSide

        });


    /* =========================================================
       EDGE MATERIAL
       ========================================================= */

    const edgeMaterial =
        new THREE.LineBasicMaterial({

            color: 0xdfffff,

            transparent: true,

            opacity: 0.95

        });


    /* =========================================================
       LOGO GROUP
       ========================================================= */

    const logoGroup =
        new THREE.Group();


    /*
       KEDALAMAN LOGO 3D
    */

    const extrudeSettings = {

        depth: 0.34,

        bevelEnabled: false,

        curveSegments: 1,

        steps: 1

    };


    /* =========================================================
       FUNCTION MEMBUAT BAGIAN LOGO
       ========================================================= */

    function addLogoShape(points) {

        const shape =
            new THREE.Shape();

        shape.moveTo(
            points[0][0],
            points[0][1]
        );

        for (
            let i = 1;
            i < points.length;
            i++
        ) {

            shape.lineTo(
                points[i][0],
                points[i][1]
            );

        }

        shape.closePath();


        const geometry =
            new THREE.ExtrudeGeometry(
                shape,
                extrudeSettings
            );

        geometry.computeVertexNormals();


        /*
         * SOLID
         */

        const mesh =
            new THREE.Mesh(
                geometry,
                logoMaterial
            );

        mesh.position.z = -0.17;

        logoGroup.add(mesh);


        /*
         * OUTLINE
         */

        const edges =
            new THREE.LineSegments(
                new THREE.EdgesGeometry(
                    geometry,
                    1
                ),
                edgeMaterial
            );

        edges.position.z = -0.17;

        logoGroup.add(edges);

    }


    /* =========================================================
       BENTUK LOGO NEXUS
       ========================================================= */


    /*
       LEFT UPPER
    */

    addLogoShape([

        [-4.05,  3.85],

        [-4.05,  1.75],

        [ 0.05, -1.05],

        [ 0.05,  0.95]

    ]);


    /*
       LEFT LOWER
    */

    addLogoShape([

        [-4.05,  0.95],

        [-4.05, -3.55],

        [-0.55, -1.20],

        [-0.55, -0.05]

    ]);


    /*
       DIAGONAL UTAMA
    */

    addLogoShape([

        [-3.35,  3.85],

        [-1.55,  3.85],

        [ 3.75, -3.55],

        [ 1.95, -3.55]

    ]);


    /*
       RIGHT WING
       DENGAN NOTCH
    */

    addLogoShape([

        [ 1.85,  1.85],

        [ 4.05,  3.85],

        [ 4.05, -1.45],

        [ 2.35, -0.25],

        [ 2.35,  1.05],

        [ 1.85,  1.40]

    ]);


    scene.add(logoGroup);


    /* =========================================================
       GLOW GEOMETRY
       ========================================================= */

    const glowMaterial =
        new THREE.MeshBasicMaterial({

            color: 0x00eaff,

            transparent: true,

            opacity: 0.11,

            side: THREE.DoubleSide,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false

        });


    const glowGroup =
        new THREE.Group();


    function addGlowShape(points) {

        const shape =
            new THREE.Shape();

        shape.moveTo(
            points[0][0],
            points[0][1]
        );

        for (
            let i = 1;
            i < points.length;
            i++
        ) {

            shape.lineTo(
                points[i][0],
                points[i][1]
            );

        }

        shape.closePath();


        const geometry =
            new THREE.ShapeGeometry(shape);


        const mesh =
            new THREE.Mesh(
                geometry,
                glowMaterial
            );


        mesh.scale.set(
            1.018,
            1.018,
            1
        );


        glowGroup.add(mesh);

    }


    /* Glow setiap bagian */

    addGlowShape([
        [-4.05,3.85],
        [-4.05,1.75],
        [0.05,-1.05],
        [0.05,0.95]
    ]);

    addGlowShape([
        [-4.05,0.95],
        [-4.05,-3.55],
        [-0.55,-1.20],
        [-0.55,-0.05]
    ]);

    addGlowShape([
        [-3.35,3.85],
        [-1.55,3.85],
        [3.75,-3.55],
        [1.95,-3.55]
    ]);

    addGlowShape([
        [1.85,1.85],
        [4.05,3.85],
        [4.05,-1.45],
        [2.35,-0.25],
        [2.35,1.05],
        [1.85,1.40]
    ]);


    scene.add(glowGroup);


    /* =========================================================
       PARTICLES
       ========================================================= */

    const particleCount = 260;

    const particlePositions =
        new Float32Array(
            particleCount * 3
        );


    for (
        let i = 0;
        i < particleCount;
        i++
    ) {

        const i3 = i * 3;

        const radius =
            5.2 +
            Math.random() * 4.8;

        const theta =
            Math.random() *
            Math.PI * 2;

        const phi =
            Math.acos(
                2 * Math.random() - 1
            );


        particlePositions[i3] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);

        particlePositions[i3 + 1] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);

        particlePositions[i3 + 2] =
            (Math.random() - 0.5) * 5;

    }


    const particleGeometry =
        new THREE.BufferGeometry();


    particleGeometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            particlePositions,
            3
        )

    );


    const particleMaterial =
        new THREE.PointsMaterial({

            color: 0x00eaff,

            size: 0.045,

            transparent: true,

            opacity: 0.58,

            depthWrite: false,

            blending:
                THREE.AdditiveBlending

        });


    const particles =
        new THREE.Points(
            particleGeometry,
            particleMaterial
        );


    scene.add(particles);


    /* =========================================================
       HALO
       ========================================================= */

    const haloCanvas =
        document.createElement("canvas");

    haloCanvas.width = 256;
    haloCanvas.height = 256;


    const haloContext =
        haloCanvas.getContext("2d");


    const gradient =
        haloContext.createRadialGradient(
            128,
            128,
            0,
            128,
            128,
            128
        );


    gradient.addColorStop(
        0,
        "rgba(0,255,255,0.16)"
    );

    gradient.addColorStop(
        0.35,
        "rgba(0,255,255,0.07)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,255,255,0)"
    );


    haloContext.fillStyle =
        gradient;

    haloContext.fillRect(
        0,
        0,
        256,
        256
    );


    const haloTexture =
        new THREE.CanvasTexture(
            haloCanvas
        );


    const haloMaterial =
        new THREE.SpriteMaterial({

            map: haloTexture,

            transparent: true,

            depthWrite: false,

            blending:
                THREE.AdditiveBlending,

            opacity: 0.8

        });


    const halo =
        new THREE.Sprite(
            haloMaterial
        );


    halo.scale.set(
        11,
        11,
        1
    );


    halo.position.set(
        0,
        0,
        -1.5
    );


    scene.add(halo);


    /* =========================================================
       ANIMATION
       ========================================================= */

    let lastTime =
        performance.now();


    function animate(now) {

        const dt =
            Math.min(
                (now - lastTime) / 1000,
                0.05
            );

        lastTime = now;


        const t =
            now / 1000;


        /*
         * ROTASI 3D
         *
         * Sangat pelan supaya bentuk N
         * tetap terbaca.
         */

        logoGroup.rotation.y +=
            dt * 0.18;


        logoGroup.rotation.x =
            Math.sin(t * 0.45) * 0.035;


        /*
         * PULSE
         */

        const pulse =
            0.5 +
            0.5 *
            Math.sin(t * 2.4);


        logoMaterial.opacity =
            0.78 +
            pulse * 0.14;


        edgeMaterial.opacity =
            0.72 +
            pulse * 0.25;


        glowMaterial.opacity =
            0.07 +
            pulse * 0.08;


        particleMaterial.opacity =
            0.38 +
            pulse * 0.28;


        /*
         * BREATHING
         */

        const breathing =
            1 +
            Math.sin(t * 1.8) *
            0.008;


        logoGroup.scale.set(
            breathing,
            breathing,
            breathing
        );


        /*
         * PARTICLE MOVEMENT
         */

        particles.rotation.y -=
            dt * 0.035;

        particles.rotation.x +=
            dt * 0.012;


        /*
         * RENDER
         */

        renderer.render(
            scene,
            camera
        );


        /*
         * INI KUNCI:
         * TIDAK menggunakan onFrame().
         */

        requestAnimationFrame(
            animate
        );

    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    function resize() {

        const width =
            Math.max(
                container.clientWidth,
                1
            );

        const height =
            Math.max(
                container.clientHeight,
                1
            );


        camera.aspect =
            width / height;

        camera.updateProjectionMatrix();


        renderer.setSize(
            width,
            height,
            false
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );

    }


    window.addEventListener(
        "resize",
        resize,
        {
            passive: true
        }
    );


    window.addEventListener(
        "orientationchange",
        resize,
        {
            passive: true
        }
    );


    resize();


    /*
       MULAI ANIMASI
    */

    requestAnimationFrame(
        animate
    );


})();

</script>

</body>
</html>
