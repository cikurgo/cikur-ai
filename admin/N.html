<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>CGO NEXUS 3D</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    background:
        radial-gradient(
            ellipse at center,
            rgba(0,255,255,.055) 0%,
            rgba(0,255,255,.018) 35%,
            #000 72%
        );
}

#nexus-logo-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
}

#nexus-logo-container canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#label {
    position: fixed;
    left: 50%;
    bottom: 19px;
    transform: translateX(-50%);

    color: rgba(0,255,255,.45);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 7px;
    font-weight: 600;

    letter-spacing: 5px;

    white-space: nowrap;

    text-shadow:
        0 0 8px rgba(0,255,255,.35);

    pointer-events: none;
}

.vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            transparent 40%,
            rgba(0,0,0,.15) 68%,
            rgba(0,0,0,.62) 100%
        );
}
</style>
</head>

<body>

<div id="nexus-logo-container"></div>

<div class="vignette"></div>

<div id="label">
    CGO NEXUS
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(() => {

"use strict";


/* ==========================================================
   CONTAINER
========================================================== */

const container =
    document.getElementById("nexus-logo-container");

if (!container) {
    throw new Error("NEXUS container tidak ditemukan.");
}

if (typeof THREE === "undefined") {
    throw new Error("Three.js tidak tersedia.");
}


/* ==========================================================
   SCENE
========================================================== */

const scene =
    new THREE.Scene();


/* ==========================================================
   CAMERA
========================================================== */

const camera =
    new THREE.PerspectiveCamera(
        38,
        1,
        0.1,
        1000
    );


/* ==========================================================
   RENDERER
========================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.setClearColor(
    0x000000,
    0
);

container.appendChild(
    renderer.domElement
);


/* ==========================================================
   GROUP
========================================================== */

const logoGroup =
    new THREE.Group();

scene.add(
    logoGroup
);


/* ==========================================================
   MATERIAL
========================================================== */

const mainMaterial =
    new THREE.MeshBasicMaterial({
        color: 0x00eaf5,
        transparent: true,
        opacity: 0.82,
        side: THREE.DoubleSide
    });


const edgeMaterial =
    new THREE.LineBasicMaterial({
        color: 0xbfffff,
        transparent: true,
        opacity: 0.92
    });


/*
   Glow dibuat sebagai lapisan tipis.
   BUKAN sebagai mesh raksasa,
   sehingga bentuk logo tidak berubah.
*/

const glowMaterial =
    new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.07,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });


/* ==========================================================
   EXTRUSION
========================================================== */

const extrudeSettings = {

    depth: 0.38,

    bevelEnabled: true,

    bevelThickness: 0.035,

    bevelSize: 0.018,

    bevelSegments: 1,

    curveSegments: 1
};


/* ==========================================================
   LOGO SHAPES
========================================================== */


/* ----------------------------------------------------------
   BAGIAN KIRI ATAS
---------------------------------------------------------- */

const leftTop =
    new THREE.Shape();

leftTop.moveTo(-3.0, 4.0);
leftTop.lineTo(-3.0, 1.65);
leftTop.lineTo(0.0, -1.0);
leftTop.lineTo(-0.5, 4.0);
leftTop.closePath();


/* ----------------------------------------------------------
   BAGIAN KIRI BAWAH
---------------------------------------------------------- */

const leftBottom =
    new THREE.Shape();

leftBottom.moveTo(-3.0, 0.85);
leftBottom.lineTo(-3.0, -4.0);
leftBottom.lineTo(-0.15, -1.75);
leftBottom.lineTo(0.0, -0.65);
leftBottom.closePath();


/* ----------------------------------------------------------
   DIAGONAL UTAMA
---------------------------------------------------------- */

const diagonal =
    new THREE.Shape();

diagonal.moveTo(-0.5, 4.0);
diagonal.lineTo(1.5, 4.0);
diagonal.lineTo(4.0, -4.0);
diagonal.lineTo(2.0, -4.0);
diagonal.closePath();


/* ----------------------------------------------------------
   BAGIAN KANAN
---------------------------------------------------------- */

const right =
    new THREE.Shape();

right.moveTo(4.0, 4.0);

right.lineTo(4.0, -0.9);

right.lineTo(2.5, 0.15);

right.lineTo(2.5, 1.55);

right.lineTo(1.55, 1.55);

right.lineTo(1.55, 0.55);

right.lineTo(2.45, -0.1);

right.lineTo(1.5, -1.0);

right.lineTo(1.5, 1.15);

right.closePath();


/*
   Catatan:
   bentuk utama tetap dipisah menjadi beberapa bidang
   seperti logo referensi, bukan dipaksa menjadi satu
   polygon besar.
*/

const shapes = [
    leftTop,
    leftBottom,
    diagonal,
    right
];


/* ==========================================================
   BUILD LOGO
========================================================== */

for (const shape of shapes) {

    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            extrudeSettings
        );

    geometry.center();

    geometry.computeVertexNormals();


    /* SOLID */

    const mesh =
        new THREE.Mesh(
            geometry,
            mainMaterial
        );

    logoGroup.add(
        mesh
    );


    /* GLOW */

    const glow =
        new THREE.Mesh(
            geometry.clone(),
            glowMaterial
        );

    glow.scale.set(
        1.018,
        1.018,
        1.018
    );

    logoGroup.add(
        glow
    );


    /* EDGE */

    const edgeGeometry =
        new THREE.EdgesGeometry(
            geometry,
            1
        );

    const edges =
        new THREE.LineSegments(
            edgeGeometry,
            edgeMaterial
        );

    logoGroup.add(
        edges
    );
}


/* ==========================================================
   POSISI LOGO
========================================================== */

logoGroup.position.set(
    0,
    0,
    0
);


/* ==========================================================
   PARTICLES
========================================================== */

const particleCount = 380;

const particlePositions =
    new Float32Array(
        particleCount * 3
    );

for (
    let i = 0;
    i < particleCount;
    i++
) {

    const r =
        5.0 +
        Math.random() * 4.5;

    const theta =
        Math.random() *
        Math.PI *
        2;

    const phi =
        Math.acos(
            (Math.random() * 2) - 1
        );

    particlePositions[i * 3] =
        r *
        Math.sin(phi) *
        Math.cos(theta);

    particlePositions[i * 3 + 1] =
        r *
        Math.sin(phi) *
        Math.sin(theta);

    particlePositions[i * 3 + 2] =
        r *
        Math.cos(phi);
}


const particleGeometry =
    new THREE.BufferGeometry();

particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        particlePositions,
        3
    )
);


const particleMaterial =
    new THREE.PointsMaterial({
        color: 0x00ffff,
        size: 0.035,
        transparent: true,
        opacity: 0.55,
        depthWrite: false,
        blending: THREE.AdditiveBlending
    });


const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

scene.add(
    particles
);


/* ==========================================================
   CENTRAL AURA
========================================================== */

const auraGeometry =
    new THREE.SphereGeometry(
        3.9,
        32,
        32
    );


const auraMaterial =
    new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        transparent: true,
        opacity: 0.018,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });


const aura =
    new THREE.Mesh(
        auraGeometry,
        auraMaterial
    );

aura.scale.set(
    1.35,
    1.0,
    0.55
);

scene.add(
    aura
);


/* ==========================================================
   RESPONSIVE CAMERA
========================================================== */

function resize() {

    const width =
        Math.max(
            container.clientWidth,
            1
        );

    const height =
        Math.max(
            container.clientHeight,
            1
        );

    const aspect =
        width / height;

    renderer.setSize(
        width,
        height,
        false
    );

    camera.aspect =
        aspect;

    camera.updateProjectionMatrix();


    /*
       KUNCI UTAMA.

       Pada HP portrait, kamera dibuat lebih jauh
       agar logo tetap UTUH.

       Pada layar lebar, kamera mendekat sedikit.
    */

    let distance;

    if (aspect < 0.60) {

        distance =
            24.0;

    } else if (aspect < 0.75) {

        distance =
            20.0;

    } else if (aspect < 1.0) {

        distance =
            17.0;

    } else if (aspect < 1.5) {

        distance =
            14.0;

    } else {

        distance =
            12.5;
    }

    camera.position.set(
        0,
        0,
        distance
    );

    camera.lookAt(
        0,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resize,
    {
        passive: true
    }
);

resize();


/* ==========================================================
   ANIMATION
========================================================== */

let previous =
    performance.now();


function animate(now) {

    requestAnimationFrame(
        animate
    );

    let dt =
        (now - previous) /
        1000;

    previous =
        now;

    /*
       Proteksi ketika browser kembali
       dari background.
    */

    if (dt > 0.05) {
        dt = 0.05;
    }


    /* ------------------------------------------------------
       ROTASI 3D
    ------------------------------------------------------ */

    logoGroup.rotation.y +=
        dt * 0.22;


    /*
       Sedikit gerakan X.
       Sangat kecil supaya bentuk logo
       tetap mudah dikenali.
    */

    logoGroup.rotation.x =
        Math.sin(
            now * 0.00045
        ) * 0.035;


    /* ------------------------------------------------------
       PARTICLES
    ------------------------------------------------------ */

    particles.rotation.y -=
        dt * 0.035;

    particles.rotation.x +=
        dt * 0.012;


    /* ------------------------------------------------------
       PULSE
    ------------------------------------------------------ */

    const pulse =
        (
            Math.sin(
                now * 0.0025
            ) + 1
        ) / 2;


    mainMaterial.opacity =
        0.72 +
        pulse * 0.14;


    edgeMaterial.opacity =
        0.70 +
        pulse * 0.30;


    glowMaterial.opacity =
        0.035 +
        pulse * 0.065;


    auraMaterial.opacity =
        0.012 +
        pulse * 0.022;


    particleMaterial.opacity =
        0.35 +
        pulse * 0.28;


    /*
       Breathing sangat kecil.
    */

    const breathe =
        1 +
        pulse * 0.008;

    logoGroup.scale.set(
        breathe,
        breathe,
        breathe
    );


    /* ------------------------------------------------------
       RENDER
    ------------------------------------------------------ */

    renderer.render(
        scene,
        camera
    );
}


/* ==========================================================
   START
========================================================== */

requestAnimationFrame(
    animate
);

})();
</script>

</body>
</html>
