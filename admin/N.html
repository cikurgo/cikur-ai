<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             viewport-fit=cover"
>

<title>CGO NEXUS 3D</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #000;
}

#nexus-logo-container {
    position: relative;

    width: 100vw;
    height: 100vh;
    height: 100dvh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(0,255,255,0.055) 0%,
            rgba(0,0,0,0) 42%
        ),
        #000;
}

#nexus-logo-container canvas {
    display: block;

    width: 100%;
    height: 100%;
}

.nexus-label {
    position: absolute;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    color: rgba(255,255,255,0.38);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 8px;

    letter-spacing: 5px;

    white-space: nowrap;

    pointer-events: none;
}

</style>
</head>


<body>

<div id="nexus-logo-container"></div>

<div class="nexus-label">
    CGO NEXUS
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

(function initNexus3DLogo() {

    const container =
        document.getElementById(
            "nexus-logo-container"
        );

    if (
        !container ||
        typeof THREE === "undefined"
    ) {
        return;
    }


    /*
     * =========================================================
     * KONFIGURASI DASAR
     * =========================================================
     */

    const scene =
        new THREE.Scene();


    /*
     * Orthographic camera digunakan supaya
     * SILUET DEPAN tidak mengalami distorsi perspektif.
     */

    const camera =
        new THREE.OrthographicCamera(
            -5.5,
             5.5,
             5.5,
            -5.5,
            0.1,
            100
        );

    camera.position.set(
        0,
        0,
        20
    );

    camera.lookAt(
        0,
        0,
        0
    );


    /*
     * Renderer
     */

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            2
        )
    );


    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    container.appendChild(
        renderer.domElement
    );


    /*
     * =========================================================
     * MATERIAL
     * =========================================================
     */

    const logoMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x00F4FF,

            emissive: 0x00AAB8,

            emissiveIntensity: 0.55,

            metalness: 0.38,

            roughness: 0.20,

            transparent: true,

            opacity: 0.93,

            side: THREE.DoubleSide

        });


    const edgeMaterial =
        new THREE.LineBasicMaterial({

            color: 0xFFFFFF,

            transparent: true,

            opacity: 0.78

        });


    /*
     * =========================================================
     * LIGHT
     * =========================================================
     */

    const ambient =
        new THREE.AmbientLight(
            0xFFFFFF,
            1.35
        );

    scene.add(
        ambient
    );


    const keyLight =
        new THREE.DirectionalLight(
            0xFFFFFF,
            1.8
        );

    keyLight.position.set(
        -4,
         6,
        10
    );

    scene.add(
        keyLight
    );


    /*
     * =========================================================
     * LOGO GROUP
     * =========================================================
     */

    const logoGroup =
        new THREE.Group();


    /*
     * =========================================================
     * KOORDINAT SILUET LOGO
     * =========================================================
     *
     * Titik diambil dari bentuk referensi.
     *
     * Referensi asli:
     *
     *   1536 x 1024
     *
     * Titik pusat:
     *
     *   X = 768
     *   Y = 512
     *
     * Skala:
     *
     *   100 pixel = 1 unit
     *
     * Koordinat Y dibalik karena Three.js
     * menggunakan Y positif ke atas.
     *
     * =========================================================
     */


    const SCALE = 100;

    const CENTER_X = 768;
    const CENTER_Y = 512;


    function P(x, y) {

        return {
            x: (x - CENTER_X) / SCALE,
            y: (CENTER_Y - y) / SCALE
        };

    }


    /*
     * =========================================================
     * BENTUK 1
     *
     * DIAGONAL UTAMA
     *
     * Referensi:
     *
     * 376,130
     * 377,311
     * 1161,912
     * 1158,718
     *
     * =========================================================
     */

    const diagonal =
        new THREE.Shape();


    let p =
        P(376,130);

    diagonal.moveTo(
        p.x,
        p.y
    );


    p =
        P(377,311);

    diagonal.lineTo(
        p.x,
        p.y
    );


    p =
        P(1161,912);

    diagonal.lineTo(
        p.x,
        p.y
    );


    p =
        P(1158,718);

    diagonal.lineTo(
        p.x,
        p.y
    );


    diagonal.closePath();


    /*
     * =========================================================
     * BENTUK 2
     *
     * KIRI BAWAH
     *
     * Referensi:
     *
     * 376,371
     * 376,802
     * 634,624
     * 640,570
     *
     * =========================================================
     */

    const leftWing =
        new THREE.Shape();


    p =
        P(376,371);

    leftWing.moveTo(
        p.x,
        p.y
    );


    p =
        P(376,802);

    leftWing.lineTo(
        p.x,
        p.y
    );


    p =
        P(634,624);

    leftWing.lineTo(
        p.x,
        p.y
    );


    p =
        P(640,570);

    leftWing.lineTo(
        p.x,
        p.y
    );


    leftWing.closePath();


    /*
     * =========================================================
     * BENTUK 3
     *
     * KANAN ATAS + NOTCH
     *
     * Referensi:
     *
     * 1161,131
     * 887,323
     * 889,451
     * 958,504
     * 961,398
     * 1160,560
     *
     * =========================================================
     */

    const rightWing =
        new THREE.Shape();


    p =
        P(1161,131);

    rightWing.moveTo(
        p.x,
        p.y
    );


    p =
        P(887,323);

    rightWing.lineTo(
        p.x,
        p.y
    );


    p =
        P(889,451);

    rightWing.lineTo(
        p.x,
        p.y
    );


    p =
        P(958,504);

    rightWing.lineTo(
        p.x,
        p.y
    );


    p =
        P(961,398);

    rightWing.lineTo(
        p.x,
        p.y
    );


    p =
        P(1160,560);

    rightWing.lineTo(
        p.x,
        p.y
    );


    rightWing.closePath();


    /*
     * =========================================================
     * EXTRUSION 3D
     * =========================================================
     *
     * Tidak menggunakan bevel.
     *
     * Jadi bentuk muka depan benar-benar
     * mengikuti kontur referensi.
     */

    const extrudeSettings = {

        depth: 0.38,

        bevelEnabled: false,

        curveSegments: 1,

        steps: 1

    };


    /*
     * Semua bagian diproses terpisah.
     *
     * Ini penting karena logo asli memang
     * memiliki 3 kontur terpisah.
     */

    [
        leftWing,
        diagonal,
        rightWing

    ].forEach(function(shape) {

        const geometry =
            new THREE.ExtrudeGeometry(
                shape,
                extrudeSettings
            );


        /*
         * Letakkan extrusion
         * di sekitar Z = 0.
         */

        geometry.translate(
            0,
            0,
            -0.19
        );


        geometry.computeVertexNormals();


        /*
         * SOLID
         */

        const mesh =
            new THREE.Mesh(
                geometry,
                logoMaterial
            );


        logoGroup.add(
            mesh
        );


        /*
         * EDGE
         */

        const edges =
            new THREE.LineSegments(
                new THREE.EdgesGeometry(
                    geometry
                ),
                edgeMaterial
            );


        logoGroup.add(
            edges
        );

    });


    /*
     * =========================================================
     * POSISI LOGO
     * =========================================================
     *
     * Karena koordinat sudah berasal dari
     * pusat gambar referensi, tidak perlu
     * menggeser bagian-bagian secara manual.
     */

    logoGroup.position.set(
        0,
        0,
        0
    );


    /*
     * Ukuran sedikit diperkecil
     * supaya aman pada layar HP.
     */

    logoGroup.scale.set(
        0.93,
        0.93,
        0.93
    );


    scene.add(
        logoGroup
    );


    /*
     * =========================================================
     * PARTICLE FIELD
     * =========================================================
     */

    const particleCount =
        260;


    const particlePositions =
        new Float32Array(
            particleCount * 3
        );


    for (
        let i = 0;
        i < particleCount * 3;
        i += 3
    ) {

        const radius =
            6.5 +
            Math.random() * 4.5;


        const theta =
            Math.random() *
            Math.PI *
            2;


        const phi =
            Math.acos(
                Math.random() * 2 - 1
            );


        particlePositions[i] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);


        particlePositions[i + 1] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);


        /*
         * Ditaruh di belakang logo.
         */

        particlePositions[i + 2] =
            radius *
            Math.cos(phi) -
            4;

    }


    const particleGeometry =
        new THREE.BufferGeometry();


    particleGeometry.setAttribute(
        "position",

        new THREE.BufferAttribute(
            particlePositions,
            3
        )
    );


    const particleMaterial =
        new THREE.PointsMaterial({

            color: 0x00F4FF,

            size: 0.026,

            transparent: true,

            opacity: 0.45,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false

        });


    const particles =
        new THREE.Points(
            particleGeometry,
            particleMaterial
        );


    scene.add(
        particles
    );


    /*
     * =========================================================
     * ANIMASI
     * =========================================================
     *
     * Logo TIDAK diputar Y.
     *
     * Dengan demikian bentuk tetap identik
     * dengan siluet referensi.
     *
     * Yang bergerak hanya pulse + partikel.
     */

    function renderFrame(
        t,
        dt
    ) {

        const pulse =
            0.5 +
            0.5 *
            Math.sin(
                t * 2.4
            );


        /*
         * Pulse material
         */

        logoMaterial.opacity =
            0.88 +
            pulse * 0.08;


        edgeMaterial.opacity =
            0.65 +
            pulse * 0.20;


        particleMaterial.opacity =
            0.28 +
            pulse * 0.20;


        /*
         * Gerakan sangat kecil.
         */

        logoGroup.position.y =
            Math.sin(
                t * 0.7
            ) * 0.012;


        /*
         * Partikel bergerak
         */

        particles.rotation.y -=
            dt * 0.015;


        particles.rotation.x +=
            dt * 0.006;


        /*
         * Render
         */

        renderer.render(
            scene,
            camera
        );

    }


    /*
     * =========================================================
     * onFrame ENGINE
     * =========================================================
     */

    if (
        typeof onFrame === "function"
    ) {

        onFrame(
            function(t, dt) {

                renderFrame(
                    t,
                    dt
                );

            }
        );

    }

    else {

        let last =
            performance.now() /
            1000;


        function loop() {

            const now =
                performance.now() /
                1000;


            const dt =
                Math.min(
                    now - last,
                    0.05
                );


            last =
                now;


            renderFrame(
                now,
                dt
            );


            requestAnimationFrame(
                loop
            );

        }


        loop();

    }


    /*
     * =========================================================
     * RESPONSIVE CAMERA
     * =========================================================
     */

    function resize() {

        const width =
            container.clientWidth;


        const height =
            container.clientHeight;


        if (
            !width ||
            !height
        ) {
            return;
        }


        const aspect =
            width / height;


        const viewHeight =
            11;


        camera.top =
            viewHeight / 2;


        camera.bottom =
            -viewHeight / 2;


        camera.left =
            -(viewHeight * aspect) / 2;


        camera.right =
             (viewHeight * aspect) / 2;


        camera.updateProjectionMatrix();


        renderer.setSize(
            width,
            height
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );

    }


    window.addEventListener(
        "resize",
        resize,
        {
            passive: true
        }
    );


    resize();

})();

</script>

</body>
</html>
