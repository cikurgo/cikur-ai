<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>CGO NEXUS 3D</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

#nexus-logo-container {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(0, 255, 255, 0.06) 0%,
            rgba(0, 0, 0, 0) 45%
        ),
        #000;
}

#nexus-logo-container canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.nexus-label {
    position: absolute;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    color: rgba(255,255,255,0.38);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 8px;

    letter-spacing: 5px;

    white-space: nowrap;

    pointer-events: none;
}
</style>
</head>

<body>

<div id="nexus-logo-container"></div>

<div class="nexus-label">
    CGO NEXUS
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

(function initNexus3DLogo() {

    const container =
        document.getElementById(
            "nexus-logo-container"
        );

    if (
        !container ||
        typeof THREE === "undefined"
    ) {
        return;
    }


    /* =========================================================
       SCENE
    ========================================================= */

    const scene =
        new THREE.Scene();


    /* =========================================================
       CAMERA
       
       Orthographic dipakai supaya siluet logo tetap presisi.
    ========================================================= */

    const camera =
        new THREE.OrthographicCamera(
            -6,
             6,
             6,
            -6,
            0.1,
            100
        );

    camera.position.set(
        0,
        0,
        20
    );

    camera.lookAt(
        0,
        0,
        0
    );


    /* =========================================================
       RENDERER
    ========================================================= */

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            2
        )
    );

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    container.appendChild(
        renderer.domElement
    );


    /* =========================================================
       MATERIAL
    ========================================================= */

    const logoMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x00f4ff,

            emissive: 0x00aabb,

            emissiveIntensity: 0.55,

            metalness: 0.35,

            roughness: 0.22,

            transparent: true,

            opacity: 0.92
        });


    const edgeMaterial =
        new THREE.LineBasicMaterial({

            color: 0xffffff,

            transparent: true,

            opacity: 0.75
        });


    /* =========================================================
       LIGHT
    ========================================================= */

    const ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            1.2
        );

    scene.add(
        ambientLight
    );


    const directionalLight =
        new THREE.DirectionalLight(
            0xffffff,
            2.0
        );

    directionalLight.position.set(
        -4,
        6,
        10
    );

    scene.add(
        directionalLight
    );


    /* =========================================================
       LOGO GROUP
    ========================================================= */

    const logoGroup =
        new THREE.Group();


    /*
     * LOGO REFERENSI MEMILIKI 3 BIDANG.
     *
     * Sistem koordinat di bawah dibuat dari proporsi
     * gambar asli.
     *
     * Y positif = atas
     * X negatif = kiri
     */


    /* =========================================================
       1. DIAGONAL UTAMA
       
       Bentuk:
       
       kiri atas
          \
           \
            \
             kanan bawah
       
       Ini adalah batang diagonal utama logo.
    ========================================================= */

    const diagonal =
        new THREE.Shape();

    diagonal.moveTo(
        -4.25,
         3.90
    );

    diagonal.lineTo(
         4.25,
        -2.35
    );

    diagonal.lineTo(
         4.25,
        -4.05
    );

    diagonal.lineTo(
        -4.25,
         2.35
    );

    diagonal.closePath();


    /* =========================================================
       2. BAGIAN KIRI BAWAH
       
       Ada gap jelas antara bagian ini
       dengan diagonal utama.
    ========================================================= */

    const leftWing =
        new THREE.Shape();

    leftWing.moveTo(
        -4.25,
         0.95
    );

    leftWing.lineTo(
        -1.55,
        -1.05
    );

    leftWing.lineTo(
        -1.55,
        -1.55
    );

    leftWing.lineTo(
        -4.25,
        -3.55
    );

    leftWing.closePath();


    /* =========================================================
       3. BAGIAN KANAN ATAS
       
       Memiliki notch / potongan di bagian dalam.
    ========================================================= */

    const rightWing =
        new THREE.Shape();

    rightWing.moveTo(
         1.48,
         1.92
    );

    rightWing.lineTo(
         4.25,
         3.90
    );

    rightWing.lineTo(
         4.25,
        -0.48
    );

    rightWing.lineTo(
         2.05,
         1.10
    );

    rightWing.lineTo(
         2.05,
         0.10
    );

    rightWing.lineTo(
         1.48,
        -0.35
    );

    rightWing.closePath();


    /* =========================================================
       CREATE 3D PARTS
       
       TANPA BEVEL.
       
       Ini penting supaya siluet depan tidak berubah.
    ========================================================= */

    const shapes = [
        leftWing,
        diagonal,
        rightWing
    ];


    shapes.forEach(function(shape) {

        const geometry =
            new THREE.ExtrudeGeometry(
                shape,
                {
                    depth: 0.42,

                    bevelEnabled: false,

                    curveSegments: 1,

                    steps: 1
                }
            );


        /*
         * Geser supaya extrusion
         * berada di sekitar titik tengah Z.
         */

        geometry.translate(
            0,
            0,
            -0.21
        );


        geometry.computeVertexNormals();


        const mesh =
            new THREE.Mesh(
                geometry,
                logoMaterial
            );


        logoGroup.add(
            mesh
        );


        /* EDGE */

        const edges =
            new THREE.LineSegments(
                new THREE.EdgesGeometry(
                    geometry
                ),
                edgeMaterial
            );


        logoGroup.add(
            edges
        );

    });


    /* =========================================================
       SCALE
       
       Tidak terlalu besar.
       Tidak terlalu kecil.
    ========================================================= */

    logoGroup.scale.set(
        0.92,
        0.92,
        0.92
    );


    logoGroup.position.set(
        0,
        0,
        0
    );


    scene.add(
        logoGroup
    );


    /* =========================================================
       PARTICLES
       
       Partikel dibuat jauh di belakang
       agar tidak mengganggu siluet logo.
    ========================================================= */

    const particleCount =
        240;


    const positions =
        new Float32Array(
            particleCount * 3
        );


    for (
        let i = 0;
        i < particleCount * 3;
        i += 3
    ) {

        const r =
            7 +
            Math.random() * 5;

        const theta =
            Math.random() *
            Math.PI *
            2;

        const phi =
            Math.acos(
                Math.random() * 2 - 1
            );


        positions[i] =
            r *
            Math.sin(phi) *
            Math.cos(theta);


        positions[i + 1] =
            r *
            Math.sin(phi) *
            Math.sin(theta);


        positions[i + 2] =
            r *
            Math.cos(phi) -
            4;

    }


    const particleGeometry =
        new THREE.BufferGeometry();


    particleGeometry.setAttribute(
        "position",

        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    const particleMaterial =
        new THREE.PointsMaterial({

            color: 0x00f4ff,

            size: 0.028,

            transparent: true,

            opacity: 0.48,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false
        });


    const particles =
        new THREE.Points(
            particleGeometry,
            particleMaterial
        );


    scene.add(
        particles
    );


    /* =========================================================
       ANIMATION
       
       SENGAJA TIDAK MEMUTAR LOGO PADA SUMBU Y.
       
       Kalau logo diputar Y, siluet referensi berubah
       dan bagian-bagiannya terlihat bertumpuk.
       
       Yang bergerak hanya efek pulse dan partikel.
    ========================================================= */

    function renderFrame(
        t,
        dt
    ) {

        /*
         * Pulse
         */

        const pulse =
            0.5 +
            0.5 *
            Math.sin(
                t * 2.4
            );


        logoMaterial.opacity =
            0.84 +
            pulse * 0.10;


        edgeMaterial.opacity =
            0.62 +
            pulse * 0.25;


        particleMaterial.opacity =
            0.30 +
            pulse * 0.20;


        /*
         * Gerakan sangat kecil
         * hanya untuk memberikan kesan hidup.
         */

        logoGroup.position.y =
            Math.sin(
                t * 0.8
            ) * 0.025;


        /*
         * Partikel bergerak pelan.
         */

        particles.rotation.y -=
            dt * 0.018;

        particles.rotation.x +=
            dt * 0.008;


        renderer.render(
            scene,
            camera
        );
    }


    /* =========================================================
       CGONEXUS onFrame
    ========================================================= */

    if (
        typeof onFrame === "function"
    ) {

        onFrame(
            function(t, dt) {

                renderFrame(
                    t,
                    dt
                );

            }
        );

    }

    else {

        let last =
            performance.now() /
            1000;


        function loop() {

            const now =
                performance.now() /
                1000;


            const dt =
                Math.min(
                    now - last,
                    0.05
                );


            last =
                now;


            renderFrame(
                now,
                dt
            );


            requestAnimationFrame(
                loop
            );

        }


        loop();
    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    function resize() {

        const width =
            container.clientWidth;


        const height =
            container.clientHeight;


        if (
            !width ||
            !height
        ) {
            return;
        }


        /*
         * Orthographic camera mengikuti
         * aspect ratio layar.
         */

        const aspect =
            width / height;


        const viewHeight =
            12;


        camera.left =
            -viewHeight * aspect / 2;


        camera.right =
             viewHeight * aspect / 2;


        camera.top =
             viewHeight / 2;


        camera.bottom =
            -viewHeight / 2;


        camera.updateProjectionMatrix();


        renderer.setSize(
            width,
            height
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );

    }


    window.addEventListener(
        "resize",
        resize,
        {
            passive: true
        }
    );


    resize();


})();

</script>

</body>
</html>
