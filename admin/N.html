<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>CGO NEXUS — 3D Logo</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
}

#nexus-logo-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(0, 255, 255, 0.07) 0%,
            rgba(0, 0, 0, 0) 42%
        ),
        #000;
}

#nexus-logo-container canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.nexus-label {
    position: absolute;
    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    color: rgba(255, 255, 255, 0.42);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 9px;
    font-weight: 500;

    letter-spacing: 5px;

    white-space: nowrap;

    pointer-events: none;
}
</style>
</head>

<body>

<div id="nexus-logo-container"></div>

<div class="nexus-label">
    CGO NEXUS
</div>


<!-- ==========================================================
     THREE.JS
========================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

(function initNexus3DLogo() {

    const container =
        document.getElementById(
            'nexus-logo-container'
        );

    if (
        !container ||
        typeof THREE === 'undefined'
    ) {
        return;
    }


    /* ==========================================================
       1. SCENE
    ========================================================== */

    const scene =
        new THREE.Scene();


    /* ==========================================================
       2. CAMERA
    ========================================================== */

    const camera =
        new THREE.PerspectiveCamera(
            42,
            container.clientWidth /
            container.clientHeight,
            0.1,
            1000
        );

    /*
     * Kamera dibuat lebih jauh agar
     * seluruh logo terlihat pada layar HP.
     */
    camera.position.set(
        0,
        0,
        15
    );


    /* ==========================================================
       3. RENDERER
    ========================================================== */

    const renderer =
        new THREE.WebGLRenderer({

            alpha: true,

            antialias: true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            2
        )
    );


    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    container.appendChild(
        renderer.domElement
    );


    /* ==========================================================
       4. LOGO GROUP
    ========================================================== */

    const logoGroup =
        new THREE.Group();


    /* ==========================================================
       5. MATERIAL LOGO
    ========================================================== */

    const logoMaterial =
        new THREE.MeshBasicMaterial({

            color: 0x00F7FF,

            transparent: true,

            opacity: 0.82,

            side: THREE.DoubleSide
        });


    const edgeMaterial =
        new THREE.LineBasicMaterial({

            color: 0xFFFFFF,

            transparent: true,

            opacity: 0.90
        });


    /* ==========================================================
       6. EXTRUDE SETTINGS
    ========================================================== */

    const extrudeSettings = {

        depth: 0.48,

        bevelEnabled: true,

        bevelThickness: 0.035,

        bevelSize: 0.025,

        bevelSegments: 1,

        curveSegments: 1
    };


    /* ==========================================================
       7. BENTUK LOGO
       
       Dibuat mengikuti bentuk referensi:
       
       - diagonal utama panjang
       - blok kiri bawah
       - blok kanan atas
       - notch pada bagian kanan
    ========================================================== */


    /* ----------------------------------------------------------
       DIAGONAL UTAMA
    ---------------------------------------------------------- */

    const diagonal =
        new THREE.Shape();


    diagonal.moveTo(
        -4.25,
         3.35
    );

    diagonal.lineTo(
         4.25,
        -3.05
    );

    diagonal.lineTo(
         4.25,
        -4.35
    );

    diagonal.lineTo(
        -4.25,
         2.05
    );

    diagonal.closePath();


    /* ----------------------------------------------------------
       BAGIAN KIRI BAWAH
    ---------------------------------------------------------- */

    const left =
        new THREE.Shape();


    left.moveTo(
        -4.25,
         1.15
    );

    left.lineTo(
        -1.55,
        -0.82
    );

    left.lineTo(
        -1.55,
        -1.65
    );

    left.lineTo(
        -4.25,
        -3.58
    );

    left.closePath();


    /* ----------------------------------------------------------
       BAGIAN KANAN ATAS
       DENGAN NOTCH
    ---------------------------------------------------------- */

    const right =
        new THREE.Shape();


    right.moveTo(
         1.55,
         1.92
    );

    right.lineTo(
         4.25,
         3.35
    );

    right.lineTo(
         4.25,
        -0.92
    );

    right.lineTo(
         1.55,
         1.02
    );

    /*
     * Masuk ke notch
     */
    right.lineTo(
         1.55,
         0.02
    );

    right.lineTo(
         0.92,
         0.47
    );

    right.lineTo(
         0.92,
         1.53
    );

    right.closePath();


    /* ==========================================================
       8. CREATE 3D GEOMETRY
    ========================================================== */

    [
        left,
        diagonal,
        right

    ].forEach(function(shape) {

        const geometry =
            new THREE.ExtrudeGeometry(
                shape,
                extrudeSettings
            );


        geometry.center();


        /*
         * SOLID LOGO
         */

        const mesh =
            new THREE.Mesh(
                geometry,
                logoMaterial
            );


        logoGroup.add(
            mesh
        );


        /*
         * OUTLINE / EDGE
         */

        const edges =
            new THREE.LineSegments(
                new THREE.EdgesGeometry(
                    geometry
                ),
                edgeMaterial
            );


        logoGroup.add(
            edges
        );

    });


    /* ==========================================================
       9. SCALE LOGO
       
       Ini sengaja dibuat lebih kecil agar
       logo tidak memenuhi layar seperti screenshot sebelumnya.
    ========================================================== */

    logoGroup.scale.set(
        0.82,
        0.82,
        0.82
    );


    /*
     * Posisi logo sedikit ke tengah.
     */

    logoGroup.position.set(
        0,
        0,
        0
    );


    scene.add(
        logoGroup
    );


    /* ==========================================================
       10. PARTICLE FIELD
    ========================================================== */

    const particleCount =
        260;


    const particlePositions =
        new Float32Array(
            particleCount * 3
        );


    for (
        let i = 0;
        i < particleCount * 3;
        i += 3
    ) {

        const radius =
            6 +
            Math.random() * 5;


        const theta =
            Math.random() *
            Math.PI *
            2;


        const phi =
            Math.acos(
                Math.random() * 2 - 1
            );


        particlePositions[i] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);


        particlePositions[i + 1] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);


        particlePositions[i + 2] =
            radius *
            Math.cos(phi) -
            2;

    }


    const particleGeometry =
        new THREE.BufferGeometry();


    particleGeometry.setAttribute(
        'position',

        new THREE.BufferAttribute(
            particlePositions,
            3
        )
    );


    const particleMaterial =
        new THREE.PointsMaterial({

            color: 0x00F7FF,

            size: 0.035,

            transparent: true,

            opacity: 0.5,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false
        });


    const particles =
        new THREE.Points(
            particleGeometry,
            particleMaterial
        );


    scene.add(
        particles
    );


    /* ==========================================================
       11. ANIMATION
    ========================================================== */

    function renderFrame(
        t,
        dt
    ) {

        /*
         * Rotasi sangat kecil.
         * Tujuannya supaya siluet logo tetap terlihat.
         */

        logoGroup.rotation.y +=
            dt * 0.055;


        logoGroup.rotation.x =
            Math.sin(
                t * 0.35
            ) * 0.012;


        /*
         * Partikel
         */

        particles.rotation.y -=
            dt * 0.035;


        particles.rotation.x +=
            dt * 0.012;


        /*
         * Pulse
         */

        const pulse =
            0.5 +
            0.5 *
            Math.sin(
                t * 2.4
            );


        logoMaterial.opacity =
            0.70 +
            pulse * 0.16;


        edgeMaterial.opacity =
            0.72 +
            pulse * 0.22;


        particleMaterial.opacity =
            0.32 +
            pulse * 0.22;


        /*
         * Render
         */

        renderer.render(
            scene,
            camera
        );

    }


    /* ==========================================================
       12. CGONEXUS onFrame COMPATIBILITY
    ========================================================== */

    if (
        typeof onFrame === 'function'
    ) {

        onFrame(
            function(t, dt) {

                renderFrame(
                    t,
                    dt
                );

            }
        );

    }

    else {

        /*
         * Standalone fallback
         */

        let last =
            performance.now() *
            0.001;


        function loop() {

            const now =
                performance.now() *
                0.001;


            const dt =
                Math.min(
                    now - last,
                    0.05
                );


            last =
                now;


            renderFrame(
                now,
                dt
            );


            requestAnimationFrame(
                loop
            );

        }


        loop();

    }


    /* ==========================================================
       13. RESPONSIVE RESIZE
    ========================================================== */

    function resize() {

        const width =
            container.clientWidth;


        const height =
            container.clientHeight;


        if (
            !width ||
            !height
        ) {
            return;
        }


        camera.aspect =
            width /
            height;


        camera.updateProjectionMatrix();


        renderer.setSize(
            width,
            height
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );

    }


    window.addEventListener(
        'resize',
        resize,
        {
            passive: true
        }
    );


    resize();

})();

</script>

</body>
</html>
