<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>CGO NEXUS 3D</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #000;
}

#nexus-logo-container {
    position: relative;

    width: 100vw;
    height: 100vh;
    height: 100dvh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(0,255,255,0.09) 0%,
            rgba(0,80,100,0.035) 24%,
            rgba(0,0,0,0) 52%
        ),
        #000;
}

#nexus-logo-container canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.nexus-label {
    position: absolute;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    color: rgba(255,255,255,0.42);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 8px;

    letter-spacing: 5px;

    white-space: nowrap;

    pointer-events: none;

    text-shadow:
        0 0 8px rgba(0,255,255,0.25);
}

</style>
</head>

<body>

<div id="nexus-logo-container"></div>

<div class="nexus-label">
    CGO NEXUS
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

(function initNexus3DLogo() {

    const container =
        document.getElementById(
            "nexus-logo-container"
        );

    if (
        !container ||
        typeof THREE === "undefined"
    ) {
        return;
    }


    /* =========================================================
       SCENE
    ========================================================= */

    const scene =
        new THREE.Scene();


    /* =========================================================
       CAMERA
       
       Orthographic = bentuk logo tidak berubah karena
       perspektif.
    ========================================================= */

    const camera =
        new THREE.OrthographicCamera(
            -5,
             5,
             5,
            -5,
            0.1,
            100
        );

    camera.position.set(
        0,
        0,
        20
    );

    camera.lookAt(
        0,
        0,
        0
    );


    /* =========================================================
       RENDERER
    ========================================================= */

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            2
        )
    );

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    renderer.setClearColor(
        0x000000,
        0
    );

    container.appendChild(
        renderer.domElement
    );


    /* =========================================================
       MATERIAL UTAMA
    ========================================================= */

    const logoMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x00F4FF,

            emissive: 0x00A8B8,

            emissiveIntensity: 0.85,

            metalness: 0.42,

            roughness: 0.16,

            transparent: true,

            opacity: 0.94,

            side: THREE.DoubleSide

        });


    /* =========================================================
       EDGE MATERIAL
    ========================================================= */

    const edgeMaterial =
        new THREE.LineBasicMaterial({

            color: 0xFFFFFF,

            transparent: true,

            opacity: 0.88

        });


    /* =========================================================
       GLOW MATERIAL
       
       Lapisan transparan di belakang logo.
    ========================================================= */

    const glowMaterial =
        new THREE.MeshBasicMaterial({

            color: 0x00F6FF,

            transparent: true,

            opacity: 0.085,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false,

            side: THREE.BackSide

        });


    /* =========================================================
       LIGHT
    ========================================================= */

    scene.add(
        new THREE.AmbientLight(
            0xFFFFFF,
            1.45
        )
    );


    const cyanLight =
        new THREE.PointLight(
            0x00FFFF,
            5.0,
            16
        );

    cyanLight.position.set(
        -2,
         2,
         6
    );

    scene.add(
        cyanLight
    );


    const whiteLight =
        new THREE.DirectionalLight(
            0xFFFFFF,
            2.2
        );

    whiteLight.position.set(
        -4,
        5,
        8
    );

    scene.add(
        whiteLight
    );


    /* =========================================================
       LOGO GROUP
    ========================================================= */

    const logoGroup =
        new THREE.Group();


    /* =========================================================
       REFERENSI KOORDINAT LOGO
       
       Berdasarkan bentuk referensi yang diberikan.
    ========================================================= */

    const SCALE = 100;

    const CENTER_X = 768;
    const CENTER_Y = 512;


    function P(x, y) {

        return {
            x: (x - CENTER_X) / SCALE,
            y: (CENTER_Y - y) / SCALE
        };

    }


    /* =========================================================
       BAGIAN DIAGONAL
    ========================================================= */

    const diagonal =
        new THREE.Shape();

    let p =
        P(376,130);

    diagonal.moveTo(
        p.x,
        p.y
    );

    p =
        P(377,311);

    diagonal.lineTo(
        p.x,
        p.y
    );

    p =
        P(1161,912);

    diagonal.lineTo(
        p.x,
        p.y
    );

    p =
        P(1158,718);

    diagonal.lineTo(
        p.x,
        p.y
    );

    diagonal.closePath();


    /* =========================================================
       SAYAP KIRI
    ========================================================= */

    const leftWing =
        new THREE.Shape();

    p =
        P(376,371);

    leftWing.moveTo(
        p.x,
        p.y
    );

    p =
        P(376,802);

    leftWing.lineTo(
        p.x,
        p.y
    );

    p =
        P(634,624);

    leftWing.lineTo(
        p.x,
        p.y
    );

    p =
        P(640,570);

    leftWing.lineTo(
        p.x,
        p.y
    );

    leftWing.closePath();


    /* =========================================================
       SAYAP KANAN + NOTCH
    ========================================================= */

    const rightWing =
        new THREE.Shape();

    p =
        P(1161,131);

    rightWing.moveTo(
        p.x,
        p.y
    );

    p =
        P(887,323);

    rightWing.lineTo(
        p.x,
        p.y
    );

    p =
        P(889,451);

    rightWing.lineTo(
        p.x,
        p.y
    );

    p =
        P(958,504);

    rightWing.lineTo(
        p.x,
        p.y
    );

    p =
        P(961,398);

    rightWing.lineTo(
        p.x,
        p.y
    );

    p =
        P(1160,560);

    rightWing.lineTo(
        p.x,
        p.y
    );

    rightWing.closePath();


    /* =========================================================
       EXTRUSION
    ========================================================= */

    const extrudeSettings = {

        depth: 0.46,

        bevelEnabled: false,

        curveSegments: 1,

        steps: 1

    };


    const shapes = [
        leftWing,
        diagonal,
        rightWing
    ];


    shapes.forEach(function(shape) {

        const geometry =
            new THREE.ExtrudeGeometry(
                shape,
                extrudeSettings
            );

        geometry.translate(
            0,
            0,
            -0.23
        );

        geometry.computeVertexNormals();


        /* -----------------------------
           GLOW BACK LAYER
        ----------------------------- */

        const glow =
            new THREE.Mesh(
                geometry,
                glowMaterial
            );

        glow.scale.set(
            1.018,
            1.018,
            1.0
        );

        glow.position.z =
            -0.035;

        logoGroup.add(
            glow
        );


        /* -----------------------------
           MAIN BODY
        ----------------------------- */

        const mesh =
            new THREE.Mesh(
                geometry,
                logoMaterial
            );

        logoGroup.add(
            mesh
        );


        /* -----------------------------
           EDGES
        ----------------------------- */

        const edges =
            new THREE.LineSegments(
                new THREE.EdgesGeometry(
                    geometry
                ),
                edgeMaterial
            );

        logoGroup.add(
            edges
        );

    });


    /* =========================================================
       LOGO SCALE
       
       Ukuran dasar tetap.
       Kamera yang akan menyesuaikan viewport.
    ========================================================= */

    logoGroup.scale.set(
        0.93,
        0.93,
        0.93
    );


    scene.add(
        logoGroup
    );


    /* =========================================================
       PARTICLES
    ========================================================= */

    const particleCount =
        420;

    const particlePositions =
        new Float32Array(
            particleCount * 3
        );


    for (
        let i = 0;
        i < particleCount * 3;
        i += 3
    ) {

        const radius =
            5.5 +
            Math.random() * 5.5;

        const theta =
            Math.random() *
            Math.PI *
            2;

        const phi =
            Math.acos(
                Math.random() * 2 - 1
            );


        particlePositions[i] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);

        particlePositions[i + 1] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);

        particlePositions[i + 2] =
            radius *
            Math.cos(phi) -
            3;

    }


    const particleGeometry =
        new THREE.BufferGeometry();


    particleGeometry.setAttribute(
        "position",

        new THREE.BufferAttribute(
            particlePositions,
            3
        )
    );


    const particleMaterial =
        new THREE.PointsMaterial({

            color: 0x00FFFF,

            size: 0.035,

            transparent: true,

            opacity: 0.62,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false

        });


    const particles =
        new THREE.Points(
            particleGeometry,
            particleMaterial
        );


    scene.add(
        particles
    );


    /* =========================================================
       PROPORTIONAL CAMERA
       
       INI BAGIAN PENTING.
       
       Sebelumnya view terlalu sempit pada layar portrait,
       sehingga logo keluar layar.
       
       Sekarang ukuran kamera dihitung dari aspect ratio.
    ========================================================= */

    function resizeCamera() {

        const width =
            container.clientWidth;

        const height =
            container.clientHeight;


        if (
            width <= 0 ||
            height <= 0
        ) {
            return;
        }


        const aspect =
            width / height;


        /*
         * Ukuran logo kira-kira:
         *
         * width  = 7.85
         * height = 6.71
         *
         * Kita beri margin 12%.
         */


        const logoWidth =
            7.85 *
            0.93;

        const logoHeight =
            6.71 *
            0.93;


        const margin =
            1.16;


        const requiredWidth =
            logoWidth *
            margin;


        const requiredHeight =
            logoHeight *
            margin;


        /*
         * Tentukan ukuran viewport
         * berdasarkan sisi yang paling membutuhkan ruang.
         */

        let viewHeight =
            requiredHeight;


        const heightForWidth =
            requiredWidth /
            aspect;


        if (
            heightForWidth >
            viewHeight
        ) {
            viewHeight =
                heightForWidth;
        }


        /*
         * Tambahkan sedikit ruang ekstra
         * supaya tidak menempel ke tepi.
         */

        viewHeight *=
            1.05;


        const halfHeight =
            viewHeight / 2;


        const halfWidth =
            halfHeight *
            aspect;


        camera.top =
            halfHeight;

        camera.bottom =
            -halfHeight;

        camera.left =
            -halfWidth;

        camera.right =
            halfWidth;


        camera.updateProjectionMatrix();


        renderer.setSize(
            width,
            height
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );

    }


    /* =========================================================
       ANIMATION
       
       Logo tetap menghadap depan,
       tetapi diberi sedikit gerakan 3D
       agar depth extrusion terlihat.
    ========================================================= */

    function renderFrame(
        t,
        dt
    ) {

        /*
         * Pulse
         */

        const pulse =
            0.5 +
            0.5 *
            Math.sin(
                t * 2.4
            );


        /*
         * Brightness
         */

        logoMaterial.emissiveIntensity =
            0.65 +
            pulse * 0.35;


        logoMaterial.opacity =
            0.88 +
            pulse * 0.08;


        edgeMaterial.opacity =
            0.68 +
            pulse * 0.25;


        glowMaterial.opacity =
            0.055 +
            pulse * 0.055;


        particleMaterial.opacity =
            0.38 +
            pulse * 0.30;


        /*
         * Gerakan 3D kecil.
         *
         * Tidak sampai mengubah siluet
         * secara ekstrem.
         */

        logoGroup.rotation.y =
            Math.sin(
                t * 0.55
            ) * 0.035;


        logoGroup.rotation.x =
            Math.sin(
                t * 0.42
            ) * 0.022;


        /*
         * Gerakan naik turun sangat kecil.
         */

        logoGroup.position.y =
            Math.sin(
                t * 0.7
            ) * 0.018;


        /*
         * Partikel bergerak perlahan.
         */

        particles.rotation.y -=
            dt * 0.022;

        particles.rotation.x +=
            dt * 0.009;


        /*
         * Render
         */

        renderer.render(
            scene,
            camera
        );

    }


    /* =========================================================
       CGONEXUS onFrame
    ========================================================= */

    if (
        typeof onFrame === "function"
    ) {

        onFrame(
            function(t, dt) {

                renderFrame(
                    t,
                    dt
                );

            }
        );

    }

    else {

        let last =
            performance.now() /
            1000;


        function loop() {

            const now =
                performance.now() /
                1000;


            const dt =
                Math.min(
                    now - last,
                    0.05
                );


            last =
                now;


            renderFrame(
                now,
                dt
            );


            requestAnimationFrame(
                loop
            );

        }


        loop();

    }


    /* =========================================================
       RESIZE
    ========================================================= */

    window.addEventListener(
        "resize",
        resizeCamera,
        {
            passive: true
        }
    );


    resizeCamera();


})();

</script>

</body>
</html>
