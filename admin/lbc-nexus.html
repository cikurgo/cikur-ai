<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04060c">
<title>NEXUS LBC · Lightweight Blockchain</title>
<style>
:root{--void:#04060c;--panel:rgba(14,22,36,.72);--line:rgba(120,180,255,.16);--ink:#e8f0ff;--dim:#7d8fb0;--cy:#22e4ff;--vi:#8b5cff;--mint:#3dffb0;--red:#ff4d6d;--amb:#ffc83d;
--ui:"Segoe UI",system-ui,-apple-system,sans-serif;--mono:ui-monospace,"JetBrains Mono","SF Mono",Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--void);color:var(--ink);font:14px/1.5 var(--ui);min-height:100vh;overflow-x:hidden;
background-image:radial-gradient(60% 40% at 15% -5%,rgba(139,92,255,.22),transparent),radial-gradient(50% 40% at 95% 10%,rgba(34,228,255,.16),transparent),
linear-gradient(rgba(120,180,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,255,.05) 1px,transparent 1px);background-size:auto,auto,40px 40px,40px 40px;background-attachment:fixed}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-.2em}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cy),var(--vi));color:#031018;box-shadow:0 0 28px rgba(34,228,255,.4)}
.logo .i{width:26px;height:26px;stroke-width:2.2}
h1{font:700 1.5rem/1.1 var(--mono);letter-spacing:.02em}
h1 small{display:block;font:400 .78rem var(--ui);color:var(--dim);margin-top:4px;letter-spacing:0}
.peer{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font:.8rem var(--mono);color:var(--mint)}
.peer b{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
#status{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin-bottom:16px;font-size:.88rem;transition:.25s}
#status.loading{color:var(--amb);border-color:rgba(255,200,61,.4)}#status.success{color:var(--mint);border-color:rgba(61,255,176,.4)}
#status.error{color:var(--red);border-color:rgba(255,77,109,.5)}#status.sync{color:var(--cy);border-color:rgba(34,228,255,.4)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(10px)}
.stat span{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:.75rem}
.stat b{display:block;font:600 1.25rem var(--mono);margin-top:2px;color:var(--ink)}
.stat b.ok{color:var(--mint)}.stat b.bad{color:var(--red)}
.grid{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(12px);padding:18px}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
@media(max-width:860px){.side{position:static}}
.reactor{position:relative;width:200px;height:200px;margin:0 auto}
.reactor svg{width:100%;height:100%;transform:rotate(-90deg)}
.reactor circle{fill:none;stroke-width:5}
.trk{stroke:rgba(120,180,255,.12)}.arc{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset .3s;filter:drop-shadow(0 0 5px var(--cy))}
.orb{stroke:var(--vi);stroke-width:1.5!important;stroke-dasharray:3 9;opacity:.6;transform-origin:60px 60px}
.mining .orb{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.core{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.core b{font:700 1.4rem var(--mono)}.core span{font-size:.72rem;color:var(--dim)}
label.l{display:block;font-size:.78rem;color:var(--dim);margin:2px 0 6px}
input.t,textarea.t{width:100%;background:rgba(4,8,16,.7);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:12px;font:.9rem var(--mono);outline:none;resize:vertical;transition:.2s}
input.t:focus,textarea.t:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,228,255,.14)}
.cnt{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim);margin-top:4px}
.seg{display:flex;gap:6px}.seg button{flex:1;justify-content:center}.seg button.on{background:rgba(34,228,255,.18);border-color:var(--cy);color:var(--cy)}
button{display:inline-flex;align-items:center;gap:7px;background:rgba(120,180,255,.08);border:1px solid var(--line);color:var(--ink);padding:9px 13px;border-radius:11px;font:600 .82rem var(--ui);cursor:pointer;transition:.18s}
button:hover:not(:disabled){border-color:var(--cy);color:var(--cy);transform:translateY(-1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,summary:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.go{width:100%;justify-content:center;padding:14px;font-size:.95rem;color:#03121a;border:0;background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 24px rgba(34,228,255,.3)}
.go:hover:not(:disabled){color:#03121a;box-shadow:0 0 36px rgba(139,92,255,.5)}
.go.stop{background:linear-gradient(90deg,var(--red),#ff8a4d);color:#fff}.go.stop:hover{color:#fff}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools button{justify-content:center}
.tools .warn:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.listhead{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.srch{position:relative;flex:1}.srch .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim)}.srch input{padding-left:36px}
#chain{display:flex;flex-direction:column;max-height:calc(100vh - 250px);min-height:340px;overflow:auto;padding-right:4px}
#chain::-webkit-scrollbar{width:5px}#chain::-webkit-scrollbar-thumb{background:var(--cy);border-radius:3px}
.blk{display:flex;gap:12px}
.rail{display:flex;flex-direction:column;align-items:center;width:18px;flex-shrink:0}
.rail i{width:12px;height:12px;border-radius:4px;transform:rotate(45deg);background:var(--mint);box-shadow:0 0 12px var(--mint);margin-top:16px}
.rail::after{content:"";flex:1;width:2px;background:linear-gradient(var(--mint),rgba(120,180,255,.15));margin-top:4px}
.blk:last-child .rail::after{display:none}
.blk.bad .rail i{background:var(--red);box-shadow:0 0 12px var(--red)}.blk.bad .rail::after{background:var(--red)}
.body{flex:1;min-width:0;margin-bottom:12px;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:rgba(8,14,26,.8)}
.blk.bad .body{border-color:rgba(255,77,109,.6);background:rgba(60,10,24,.45)}
.blk.new .body{animation:land .9s ease-out}@keyframes land{from{box-shadow:0 0 0 2px var(--cy),0 0 30px var(--cy)}}
.bh{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:.75rem;margin-bottom:6px}
.bh b{color:var(--amb);font:700 .95rem var(--mono)}
.pl{word-break:break-word;margin-bottom:8px}
code.h{display:block;font:.74rem/1.5 var(--mono);color:var(--dim);word-break:break-all}code.h em{font-style:normal;color:var(--mint);font-weight:700;text-shadow:0 0 8px rgba(61,255,176,.6)}
.bf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;font-size:.72rem;color:var(--dim)}
.chip{padding:2px 8px;border:1px solid var(--line);border-radius:99px;font-family:var(--mono)}
.bf button{padding:3px 9px;font-size:.72rem;margin-left:auto}.bf button+button{margin-left:0}
.more{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font:.72rem/1.6 var(--mono);color:var(--dim);word-break:break-all}
.more a{color:var(--cy);cursor:pointer;text-decoration:underline dotted}.blk.open .more{display:block}
.empty{padding:40px 10px;text-align:center;color:var(--dim)}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,30px);opacity:0;padding:10px 18px;border-radius:99px;background:#0c1626;border:1px solid var(--cy);font-size:.82rem;transition:.3s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22e4ff"/><stop offset="1" stop-color="#8b5cff"/></linearGradient></defs>
<symbol id="i-chain" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>

<div class="wrap">
<header class="top">
  <div class="logo"><svg class="i"><use href="#i-chain"/></svg></div>
  <h1>NEXUS LBC<small>Lightweight blockchain · mining, validasi, dan sinkron antar-tab</small></h1>
  <div class="peer" title="Tab lain yang terhubung"><b></b><svg class="i"><use href="#i-users"/></svg><span id="peers">1 node</span></div>
</header>

<div id="status"><svg class="i"><use href="#i-check"/></svg><span id="status-text">Sistem siap. Menunggu data.</span></div>

<section class="stats">
  <div class="stat"><span><svg class="i"><use href="#i-layers"/></svg>Tinggi rantai</span><b id="s-h">0</b></div>
  <div class="stat"><span><svg class="i"><use href="#i-cpu"/></svg>Hashrate</span><b id="s-hr">0 H/s</b></div>
  <div class="stat"><span><svg class="i"><use href="#i-clock"/></svg>Rata-rata blok</span><b id="s-t">–</b></div>
  <div class="stat"><span><svg class="i"><use href="#i-tag"/></svg>Kesulitan</span><b id="s-d">3</b></div>
  <div class="stat"><span><svg class="i"><use href="#i-shield"/></svg>Integritas</span><b id="s-v" class="ok">Memeriksa…</b></div>
</section>

<div class="grid">
  <aside class="side">
    <div class="card" id="miner">
      <div class="reactor"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="orb" cx="60" cy="60" r="44"/><circle class="arc" id="arc" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
        <div class="core"><b id="nonce">0</b><span id="nonce-l">nonce · siaga</span></div></div>
      <label class="l" for="data" style="margin-top:14px">Data blok (memori / skill)</label>
      <textarea id="data" class="t" rows="3" maxlength="280" placeholder="Tulis data yang ingin disegel ke rantai…"></textarea>
      <div class="cnt"><span>Ctrl + Enter untuk mining</span><span id="cnt">0/280</span></div>
      <label class="l" style="margin-top:10px">Tingkat kesulitan (jumlah nol di awal hash)</label>
      <div class="seg" id="seg"><button data-d="2">2</button><button data-d="3" class="on">3</button><button data-d="4">4</button></div>
      <button class="go" id="mine" style="margin-top:14px"><svg class="i"><use href="#i-hammer"/></svg><span>Mine blok baru</span></button>
    </div>
    <div class="card"><div class="tools">
      <button id="verify"><svg class="i"><use href="#i-shield"/></svg>Verifikasi</button>
      <button id="tamper" class="warn"><svg class="i"><use href="#i-bug"/></svg>Uji manipulasi</button>
      <button id="export"><svg class="i"><use href="#i-down"/></svg>Ekspor</button>
      <button id="import"><svg class="i"><use href="#i-up"/></svg>Impor</button>
      <button id="reset" class="warn" style="grid-column:1/-1"><svg class="i"><use href="#i-trash"/></svg>Reset rantai</button>
    </div><input type="file" id="file" accept="application/json" hidden></div>
  </aside>
  <main class="card">
    <div class="listhead"><div class="srch"><svg class="i"><use href="#i-search"/></svg><input id="q" class="t" placeholder="Cari data, hash, atau nomor blok…" autocomplete="off"></div>
      <button id="jump" title="Ke blok terbaru"><svg class="i"><use href="#i-down2"/></svg>Terbaru</button></div>
    <div id="chain" aria-live="polite"></div>
  </main>
</div>
</div>
<div id="toast" role="status"></div>

<script>
/* NEXUS LBC v4 — hash mencakup index|prevHash|time|diff|data|nonce; blok v3 lama tetap valid (legacy). */
const KEY='nexus_lbc_chain_v4',OLD='nexus_lbc_chain_v3',MAXLEN=280,$=s=>document.querySelector(s);
const GEN={index:0,prevHash:'0',hash:'0',nonce:0,data:'GENESIS_BLOCK',time:0,diff:0,v:4};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const sha=async m=>hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m)));
const pre=b=>b.v===4?[b.index,b.prevHash,b.time,b.diff,b.data,b.nonce].join('|'):b.prevHash+b.data+b.nonce;
const dif=b=>b.v===4?b.diff:3;
const fmt=n=>n>=1e3?(n/1e3).toFixed(1)+'k':String(Math.round(n));

let chain=[],difficulty=3,mining=false,pending=null,worker=null,hr=0,tampered=false,badSet=new Set(),newIdx=-1,tm;
const ID=Math.random().toString(36).slice(2),peers=new Map();
const ch=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('nexus_lbc_network'):null;

/* ---------- UI ---------- */
function setStatus(type,icon,text){const s=$('#status');s.className=type;s.querySelector('svg').innerHTML=`<use href="#${icon}"/>`;$('#status-text').textContent=text}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>e.classList.remove('show'),1800)}
function blockHTML(b){
  const z=b.hash.match(/^0*/)[0].length,time=b.index===0?'Genesis':new Date(b.time||0).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  return `<article class="blk${badSet.has(b.index)?' bad':''}${b.index===newIdx?' new':''}" id="b${b.index}" data-i="${b.index}"><div class="rail"><i></i></div><div class="body">
  <div class="bh"><span>Blok <b>#${b.index}</b></span><span><svg class="i"><use href="#i-clock"/></svg> ${esc(time)}</span></div>
  <p class="pl">${esc(b.data)}</p>
  <code class="h"><svg class="i"><use href="#i-tag"/></svg> <em>${esc(b.hash.slice(0,z))}</em>${esc(b.hash.slice(z))}</code>
  <div class="bf"><span class="chip">diff ${dif(b)||0}</span><span class="chip">nonce ${b.nonce}</span>${b.mt?`<span class="chip">${b.mt} ms</span>`:''}${badSet.has(b.index)?'<span class="chip" style="color:var(--red)">tidak valid</span>':''}
  <button data-act="copy" title="Salin hash"><svg class="i"><use href="#i-copy"/></svg>Salin</button><button data-act="more">Detail</button></div>
  <div class="more">hash: ${esc(b.hash)}<br>prev: ${b.index?`<a data-go="${b.index-1}">${esc(b.prevHash)}</a>`:'–'}<br>versi: ${b.v===4?'v4':'legacy v3'}</div></div></article>`}
function render(){
  const q=$('#q').value.trim().toLowerCase(),list=chain.filter(b=>!q||String(b.index)===q||b.data.toLowerCase().includes(q)||b.hash.includes(q));
  $('#chain').innerHTML=list.length?list.map(blockHTML).join(''):'<div class="empty">Tidak ada blok yang cocok. Coba kata kunci lain.</div>';
  stats();
}
function stats(){
  $('#s-h').textContent=chain.length-1;$('#s-d').textContent=difficulty;$('#s-hr').textContent=fmt(hr)+' H/s';
  const mt=chain.filter(b=>b.mt).slice(-10).map(b=>b.mt);$('#s-t').textContent=mt.length?(mt.reduce((a,b)=>a+b)/mt.length/1000).toFixed(2)+' s':'–';
  const v=$('#s-v');v.className=badSet.size?'bad':'ok';v.textContent=badSet.size?`Rusak di #${Math.min(...badSet)}`:'Valid';
  const peersN=[...peers.values()].filter(t=>Date.now()-t<8000).length+1;$('#peers').textContent=peersN+' node';
}
function reactor(n,label){
  $('#nonce').textContent=n.toLocaleString('id-ID');$('#nonce-l').textContent=label;
  const exp=Math.pow(16,difficulty),p=mining?Math.min(.97,n/exp):0;$('#arc').style.strokeDashoffset=326.7*(1-p);
  $('#miner').classList.toggle('mining',mining);
}
function setMineBtn(){
  const b=$('#mine');b.className='go'+(mining?' stop':'');b.disabled=tampered;
  b.innerHTML=mining?'<svg class="i"><use href="#i-stop"/></svg><span>Batalkan mining</span>':'<svg class="i"><use href="#i-hammer"/></svg><span>Mine blok baru</span>';
  $('#data').disabled=mining;document.querySelectorAll('#seg button').forEach(x=>x.disabled=mining);
}

/* ---------- Penyimpanan & validasi ---------- */
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(chain))}catch(e){}};
async function validate(c){
  const bad=new Set();
  if(!Array.isArray(c)||!c.length||c[0].index!==0||c[0].hash!=='0')return{ok:false,bad:new Set([0])};
  for(let i=1;i<c.length;i++){
    const b=c[i],p=c[i-1];let ok=b&&typeof b.data==='string'&&typeof b.hash==='string'&&b.index===p.index+1&&b.prevHash===p.hash&&!bad.has(i-1);
    if(ok){const d=dif(b);ok=Number.isInteger(d)&&d>=1&&d<=6&&b.hash.startsWith('0'.repeat(d))&&await sha(pre(b))===b.hash}
    if(!ok)bad.add(i)}
  return{ok:!bad.size,bad}}
async function recheck(){const r=await validate(chain);badSet=r.bad;render();return r}
async function load(){
  let c=null;
  try{c=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!c){try{const o=JSON.parse(localStorage.getItem(OLD));if(Array.isArray(o)&&o.length)c=o}catch(e){}}
  if(c&&(await validate(c)).ok)chain=c;else{chain=[{...GEN}]}
  save();await recheck();
}

/* ---------- Mining (Web Worker, bisa dibatalkan) ---------- */
const WCODE=`onmessage=async e=>{const{index,prevHash,time,diff,data}=e.data,t=performance.now(),z='0'.repeat(diff),enc=new TextEncoder();let n=0,last=t;for(;;){const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode([index,prevHash,time,diff,data,n].join('|'))))].map(b=>b.toString(16).padStart(2,'0')).join('');if(h.startsWith(z)){postMessage({done:1,block:{index,prevHash,time,diff,data,nonce:n,hash:h,v:4,mt:Math.round(performance.now()-t)}});return}n++;if(n%2000===0){const now=performance.now();postMessage({p:1,n,hr:2000/((now-last)/1000)});last=now;await new Promise(r=>setTimeout(r))}}}`;
function spawn(){
  if(worker)worker.terminate();
  worker=new Worker(URL.createObjectURL(new Blob([WCODE],{type:'application/javascript'})));
  worker.onmessage=onWork;
  worker.onerror=()=>{mining=false;setMineBtn();reactor(0,'nonce · siaga');setStatus('error','i-alert','Worker mining gagal. Muat ulang halaman.')};
}
function startMine(){
  const tip=chain[chain.length-1];spawn();
  worker.postMessage({index:tip.index+1,prevHash:tip.hash,time:Date.now(),diff:difficulty,data:pending});
}
function mineClick(){
  if(mining){mining=false;worker.terminate();worker=null;setMineBtn();reactor(0,'nonce · siaga');setStatus('','i-check','Mining dibatalkan.');return}
  const d=$('#data').value.trim();
  if(!d)return setStatus('error','i-alert','Data tidak boleh kosong.');
  if(tampered)return setStatus('error','i-alert','Pulihkan rantai dari mode uji manipulasi dulu.');
  pending=d;mining=true;setMineBtn();setStatus('loading','i-refresh',`Mining dengan kesulitan ${difficulty}… mencari nonce.`);startMine();
}
async function onWork(e){
  const m=e.data;
  if(m.p){hr=m.hr;reactor(m.n,'nonce · '+fmt(m.hr)+' H/s');stats();return}
  const b=m.block,tip=chain[chain.length-1],r=await check(b,tip);
  mining=false;worker.terminate();worker=null;
  if(r){setStatus('error','i-alert','Blok ditolak: '+r);setMineBtn();return}
  addBlock(b);ch&&ch.postMessage({type:'NEW_BLOCK',block:b,from:ID});
  setStatus('success','i-check',`Blok #${b.index} tersegel dalam ${b.mt} ms (nonce ${b.nonce}).`);
  $('#data').value='';$('#cnt').textContent='0/'+MAXLEN;setMineBtn();reactor(b.nonce,'blok tersegel');
}
async function check(b,tip){
  if(b.index!==tip.index+1)return'index tidak berurutan';
  if(b.prevHash!==tip.hash)return'prevHash tidak cocok (rantai sudah berubah)';
  if(!(b.diff>=1&&b.diff<=6)||!b.hash.startsWith('0'.repeat(b.diff)))return'hash tidak memenuhi kesulitan';
  if(await sha(pre(b))!==b.hash)return'hash tidak cocok (data dimanipulasi)';return null}
function addBlock(b){chain.push(b);newIdx=b.index;save();render();const e=$('#chain');e.scrollTop=e.scrollHeight;setTimeout(()=>newIdx=-1,1000)}

/* ---------- Jaringan antar-tab ---------- */
function net(){
  if(!ch)return;
  const ping=()=>ch.postMessage({type:'PING',from:ID});ping();setInterval(()=>{ping();stats()},3000);
  ch.postMessage({type:'REQ',from:ID});
  ch.onmessage=async e=>{
    const{type,from}=e.data||{};if(from===ID)return;
    if(type==='PING'||type==='REQ')peers.set(from,Date.now());
    if(type==='REQ')ch.postMessage({type:'CHAIN',chain,from:ID});
    if(type==='CHAIN'&&!tampered&&e.data.chain.length>chain.length&&(await validate(e.data.chain)).ok){
      chain=e.data.chain;save();await recheck();setStatus('sync','i-refresh',`Sinkron: rantai lebih panjang diterima (${chain.length-1} blok).`);if(mining)startMine()}
    if(type==='NEW_BLOCK'&&!tampered){
      const b=e.data.block,tip=chain[chain.length-1];
      if(chain.some(x=>x.hash===b.hash))return;
      if(b.index>tip.index+1)return ch.postMessage({type:'REQ',from:ID});
      if(!(await check(b,tip))){addBlock(b);setStatus('sync','i-refresh',`Blok #${b.index} diterima dari tab lain.`);if(mining)startMine()}}
  };
}

/* ---------- Alat ---------- */
async function verifyClick(){setStatus('loading','i-refresh','Memverifikasi seluruh rantai…');const r=await recheck();
  r.ok?setStatus('success','i-shield',`Semua ${chain.length} blok valid. Rantai utuh.`):setStatus('error','i-alert',`Rantai rusak mulai blok #${Math.min(...r.bad)}.`)}
async function tamperClick(){
  if(mining)return toast('Hentikan mining dulu');
  if(!tampered){if(chain.length<2)return toast('Mine minimal satu blok dulu');
    const i=Math.max(1,chain.length>>1);chain=chain.map(b=>({...b}));chain[i].data='DATA DIUBAH PENYUSUP';tampered=true;
    $('#tamper').innerHTML='<svg class="i"><use href="#i-refresh"/></svg>Pulihkan rantai';await verifyClick();setMineBtn()}
  else{tampered=false;$('#tamper').innerHTML='<svg class="i"><use href="#i-bug"/></svg>Uji manipulasi';await load();setMineBtn();setStatus('success','i-check','Rantai dipulihkan dari penyimpanan.')}
}
function exportClick(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(chain,null,2)],{type:'application/json'}));a.download=`lbc-chain-${chain.length-1}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Rantai diekspor')}
async function importFile(f){
  if(!f)return;let c;try{c=JSON.parse(await f.text())}catch(e){return setStatus('error','i-alert','File bukan JSON yang valid.')}
  const r=await validate(c);if(!r.ok)return setStatus('error','i-alert','Impor ditolak: rantai tidak valid.');
  if(!confirm(`Ganti rantai saat ini dengan ${c.length-1} blok dari file?`))return;
  chain=c;save();await recheck();ch&&ch.postMessage({type:'CHAIN',chain,from:ID});setStatus('success','i-check','Rantai berhasil diimpor.')}
async function resetClick(){
  if(mining||tampered)return toast('Hentikan mining/uji dulu');
  if(!confirm('Hapus semua blok dan mulai dari genesis?'))return;
  chain=[{...GEN}];save();hr=0;await recheck();setStatus('','i-check','Rantai direset ke genesis.');reactor(0,'nonce · siaga')}

/* ---------- Event ---------- */
$('#mine').onclick=mineClick;$('#verify').onclick=verifyClick;$('#tamper').onclick=tamperClick;$('#export').onclick=exportClick;
$('#import').onclick=()=>$('#file').click();$('#file').onchange=e=>{importFile(e.target.files[0]);e.target.value=''};$('#reset').onclick=resetClick;
$('#jump').onclick=()=>{const e=$('#chain');e.scrollTop=e.scrollHeight};
$('#q').oninput=render;
$('#data').oninput=e=>$('#cnt').textContent=e.target.value.length+'/'+MAXLEN;
$('#data').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();mineClick()}};
$('#seg').onclick=e=>{const d=e.target.closest('button');if(!d||mining)return;difficulty=+d.dataset.d;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===d));stats()};
$('#chain').onclick=e=>{
  const go=e.target.closest('[data-go]');if(go){const t=$('#b'+go.dataset.go);t&&t.scrollIntoView({block:'center',behavior:'smooth'});return}
  const btn=e.target.closest('button[data-act]');if(!btn)return;const el=btn.closest('.blk'),b=chain[+el.dataset.i];
  if(btn.dataset.act==='more')el.classList.toggle('open');
  else(navigator.clipboard?navigator.clipboard.writeText(b.hash):Promise.reject()).then(()=>toast('Hash disalin'),()=>toast('Gagal menyalin'))};

load().then(()=>{net();setMineBtn();const e=$('#chain');e.scrollTop=e.scrollHeight;setStatus('','i-check','Sistem siap. Menunggu data.')});
</script>
</body>
