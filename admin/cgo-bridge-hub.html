<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04070d">
<title>CGO Bridge Hub — Nexus ↔ Cyber Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
:root{--bg:#04070d;--line:rgba(120,160,220,.16);--text:#e8f0fa;--muted:#8ba0b8;--dim:#5a6f88;--cyan:#38bdf8;--green:#10b981;--amber:#f59e0b;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
radial-gradient(60% 40% at 12% 0%,rgba(56,189,248,.17),transparent 70%),
radial-gradient(50% 40% at 92% 100%,rgba(16,185,129,.13),transparent 70%),
linear-gradient(rgba(56,189,248,.045) 1px,transparent 1px) 0 0/44px 44px,
linear-gradient(90deg,rgba(56,189,248,.045) 1px,transparent 1px) 0 0/44px 44px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.top{flex:none;display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(6,11,20,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:32px;height:32px;flex:none;filter:drop-shadow(0 0 8px rgba(56,189,248,.6))}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand p{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{margin-left:auto;display:flex;align-items:center;flex:none}
.pill{font:600 10px 'JetBrains Mono',monospace;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px;background:rgba(8,14,26,.7);white-space:nowrap}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.pill.ok{color:var(--text);border-color:rgba(16,185,129,.5)}
.pill.ok .d{background:var(--green);box-shadow:0 0 8px var(--green)}
.pill.bad{border-color:rgba(239,68,68,.5)}.pill.bad .d{background:var(--red)}
.pill.wait .d{background:var(--amber);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.wire{position:relative;width:34px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--green));opacity:.45}
.wire i{position:absolute;top:-2px;left:0;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;opacity:0}
.wire[data-dir=lab] i{animation:toLab .9s linear infinite;opacity:1}
.wire[data-dir=nexus] i{animation:toNex .9s linear infinite;opacity:1}
.wire[data-dir]{opacity:1}
@keyframes toLab{from{left:0}to{left:28px}}
@keyframes toNex{from{left:28px}to{left:0}}

.bar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line)}
.steps{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.st{flex:1 0 auto;font-size:10.5px;font-weight:600;color:var(--dim);padding:5px 10px;border-radius:8px;border:1px solid var(--line);text-align:center;white-space:nowrap;transition:.25s}
.st.on{color:var(--cyan);border-color:var(--cyan);background:rgba(56,189,248,.1);box-shadow:0 0 14px rgba(56,189,248,.25)}
.st.done{color:var(--green);border-color:rgba(16,185,129,.5)}

#scroller{flex:1;overflow-y:auto;min-height:0;scroll-behavior:smooth}
.thread{display:flex;flex-direction:column;gap:14px;max-width:860px;margin:0 auto;padding:16px 14px 24px}
.m{display:flex;gap:10px;max-width:94%;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m.nexus{--c:#38bdf8;--g:56,189,248}
.m.lab{--c:#10b981;--g:16,185,129;flex-direction:row-reverse;align-self:flex-end}
.m.hub{--c:#f59e0b;--g:245,158,11;align-self:center;max-width:100%;width:100%}
.av{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--c);border:1px solid rgba(var(--g),.55);background:rgba(var(--g),.1);box-shadow:0 0 16px rgba(var(--g),.3)}
.bub{min-width:0;flex:1;border:1px solid rgba(var(--g),.38);background:linear-gradient(160deg,rgba(var(--g),.1),rgba(9,15,28,.86) 55%);border-radius:4px 18px 18px 18px;box-shadow:0 10px 32px -14px rgba(var(--g),.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lab .bub{border-radius:18px 4px 18px 18px}
.hub .bub{border-radius:14px;border-style:dashed}
.mh{display:flex;align-items:center;gap:7px;padding:8px 8px 4px 12px;font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--c)}
.tag{font:600 9px 'JetBrains Mono',monospace;padding:2px 6px;border-radius:999px;border:1px solid rgba(var(--g),.5)}
.tag.local{color:var(--amber);border-color:rgba(245,158,11,.55)}
.mh time{margin-left:auto;font:500 10px 'JetBrains Mono',monospace;color:var(--dim)}
.ib{width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.ib:hover{background:rgba(255,255,255,.07);color:var(--text)}
.mb{padding:2px 14px 12px;font-size:13.5px;line-height:1.65;overflow-wrap:anywhere}
.mb.clip{max-height:250px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.more{display:block;margin:0 12px 10px;font-size:11px;font-weight:600;color:var(--c);background:rgba(var(--g),.1);border:1px solid rgba(var(--g),.4);border-radius:999px;padding:5px 12px}
.mb p{margin:0 0 9px}.mb p:last-child{margin:0}
.mb ul,.mb ol{margin:6px 0 9px 20px}.mb li{margin-bottom:3px}
.mb h1,.mb h2,.mb h3{font-size:14px;margin:10px 0 6px;color:var(--text)}
.mb strong{color:#fff}
.mb blockquote{border-left:2px solid var(--c);padding-left:10px;color:var(--muted);margin:6px 0}
.mb pre{background:rgba(0,0,0,.6);border:1px solid var(--line);padding:10px;border-radius:10px;overflow:auto;font-size:11.5px;margin:6px 0}
.mb code{font-family:'JetBrains Mono',monospace;font-size:.88em;background:rgba(var(--g),.12);padding:1px 5px;border-radius:4px}
.mb pre code{background:none;padding:0}
.mb table{border-collapse:collapse;display:block;overflow-x:auto;font-size:12px}
.mb th,.mb td{border:1px solid var(--line);padding:5px 8px}
.dots{display:inline-flex;gap:4px;vertical-align:middle;margin-right:8px}
.dots b{width:6px;height:6px;border-radius:50%;background:var(--c);animation:dot 1.1s infinite}
.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.think{color:var(--muted);font-size:12.5px}

.dock{flex:none;border-top:1px solid var(--line);background:rgba(6,11,20,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.dock>*{max-width:860px;margin-left:auto;margin-right:auto}
.logp{display:none;height:110px;overflow:auto;font:10.5px/1.5 'JetBrains Mono',monospace;color:var(--dim);background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.logp.open{display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chip{flex:none;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;color:var(--muted);background:rgba(56,189,248,.06);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.chip:hover{color:var(--text);border-color:var(--cyan)}
.chip.h{border-style:dashed}
.compose{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-height:46px;max-height:150px;resize:none;background:rgba(0,0,0,.55);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;font-size:14px;line-height:1.45;outline:none}
textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.go{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid rgba(16,185,129,.6);background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(16,185,129,.3));color:#fff;display:grid;place-items:center;box-shadow:0 0 18px rgba(16,185,129,.3)}
.go.stop{border-color:rgba(239,68,68,.6);background:rgba(239,68,68,.18);box-shadow:0 0 18px rgba(239,68,68,.3)}
.go[hidden]{display:none}
.tools{display:flex;align-items:center;gap:4px;margin-top:6px}
.tools .ib{width:auto;padding:0 10px;height:30px;font-size:11px;gap:6px;grid-auto-flow:column}
#count{margin-left:auto;font:10px 'JetBrains Mono',monospace;color:var(--dim)}
.toast{position:fixed;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0f1b2e;border:1px solid var(--cyan);padding:9px 14px;border-radius:10px;font-size:12px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:92%;text-align:center}
.toast.show{opacity:1}
#peers{position:absolute;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none}
#peers iframe{border:0;width:1px;height:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#scroller{scroll-behavior:auto}}
@media (max-width:520px){.brand p{display:none}.m{max-width:100%}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs><path d="M16 2l12 7v14l-12 7L4 23V9z" stroke="url(#lg)" stroke-width="1.8"/><path d="M10 16h12M16 10v12" stroke="url(#lg)" stroke-width="1.8" stroke-linecap="round"/></svg>
    <div><h1>CGO Bridge Hub</h1><p>Nexus ↔ Cyber Lab · dialog otomatis</p></div>
  </div>
  <div class="link"><span class="pill" id="pillNexus"></span><span class="wire" id="wire"><i></i></span><span class="pill" id="pillLab"></span></div>
</header>
<div class="bar">
  <div class="steps" id="steps"><span class="st">Nexus</span><span class="st">Lab</span><span class="st">Sanggahan</span><span class="st">Status</span></div>
  <span class="pill" id="pillRun"></span>
</div>
<main id="scroller"><div class="thread" id="thread" aria-live="polite"></div></main>
<footer class="dock">
  <div class="logp" id="log"></div>
  <div class="chips" id="chips"></div>
  <div class="compose">
    <textarea id="problem" rows="1" maxlength="2000" placeholder="Tulis pertanyaan atau masalah tingkat tinggi…"></textarea>
    <button class="go" id="btnStart" aria-label="Mulai dialog"></button>
    <button class="go stop" id="btnStop" aria-label="Hentikan" hidden disabled></button>
  </div>
  <div class="tools">
    <button class="ib" id="btnClear"></button>
    <button class="ib" id="btnExport"></button>
    <button class="ib" id="btnLog"></button>
    <span id="count">0/2000</span>
  </div>
</footer>
<div id="peers">
  <iframe id="frameNexus" title="nexus" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
  <iframe id="frameLab" title="lab" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const BRIDGE_VER = 1;
const SOURCE = 'cgo-hub';
const hasMarked = typeof marked !== 'undefined';
const hasPurify = typeof DOMPurify !== 'undefined';
const $ = id => document.getElementById(id);

const svg = (p, s) => '<svg viewBox="0 0 24 24" width="' + (s||18) + '" height="' + (s||18) + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
const IC = {
  nexus: svg('<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><circle cx="12" cy="12" r="2.5"/>'),
  lab: svg('<path d="M9 3h6M10 3v6l-5 9a2 2 0 001.8 3h10.4a2 2 0 001.8-3l-5-9V3"/><path d="M8 15h8"/>'),
  hub: svg('<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>'),
  copy: svg('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>', 15),
  send: svg('<path d="M5 12h14M13 6l6 6-6 6"/>', 22),
  stop: svg('<rect x="6" y="6" width="12" height="12" rx="2"/>', 20),
  trash: svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', 15),
  dl: svg('<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>', 15),
  log: svg('<path d="M4 6h16M4 12h10M4 18h16"/>', 15)
};

const el = {
  problem: $('problem'), thread: $('thread'), scroller: $('scroller'), log: $('log'), toast: $('toast'),
  pillNexus: $('pillNexus'), pillLab: $('pillLab'), pillRun: $('pillRun'), wire: $('wire'),
  btnStart: $('btnStart'), btnStop: $('btnStop'), btnClear: $('btnClear'), btnExport: $('btnExport'), btnLog: $('btnLog'),
  chips: $('chips'), count: $('count'), steps: [].slice.call(document.querySelectorAll('.st')),
  frameNexus: $('frameNexus'), frameLab: $('frameLab')
};
el.btnStart.innerHTML = IC.send; el.btnStop.innerHTML = IC.stop;
el.btnClear.innerHTML = IC.trash + '<span>Bersihkan</span>';
el.btnExport.innerHTML = IC.dl + '<span>Ekspor</span>';
el.btnLog.innerHTML = IC.log + '<span>Log</span>';

const S = { nexusOk:false, labOk:false, running:false, abort:false, pending:new Map(), seq:1, framesLoaded:false, tr:[], t:null };

const SEEDS = [
  ['Nexus → Lab + veto manusia', 'Bagaimana menautkan kompilasi intent Research Nexus (Role → Validation) ke eksekusi tool Cyber Lab agar LOCKDOWN tidak pernah jalan tanpa veto operator, sambil audit trail tetap utuh?'],
  ['Integritas tanpa false positive', 'Rancang protokol verifikasi integritas interceptor fetch/XHR/WS antara Research Nexus dan Cyber Lab tanpa false positive saat REAPPLY hook.'],
  ['Ontological mismatch', 'Ontological mismatch: model dunia Nexus (prompt-as-spec) vs runtime Lab (hooks/vault). Susun kerangka keputusan bersama yang contestable.']
];
const HK = 'cgo-hub-history';
function getHist(){ try { return JSON.parse(localStorage.getItem(HK) || '[]'); } catch(e){ return []; } }
function addHist(q){ try { const h = getHist().filter(x => x !== q); h.unshift(q); localStorage.setItem(HK, JSON.stringify(h.slice(0, 5))); } catch(e){} renderChips(); }
function renderChips(){
  el.chips.innerHTML = '';
  const add = (label, text, cls) => {
    const b = document.createElement('button');
    b.className = 'chip ' + (cls || ''); b.textContent = label; b.title = text;
    b.onclick = () => { el.problem.value = text; fit(); el.problem.focus(); };
    el.chips.appendChild(b);
  };
  SEEDS.forEach(s => add(s[0], s[1]));
  getHist().forEach(q => add('↺ ' + q.slice(0, 40), q, 'h'));
}

function toast(m){ el.toast.textContent = m; el.toast.classList.add('show'); setTimeout(() => el.toast.classList.remove('show'), 2400); }
function log(m){
  const d = document.createElement('div');
  d.textContent = '[' + new Date().toLocaleTimeString('id-ID', {hour12:false}) + '] ' + m;
  el.log.appendChild(d); el.log.scrollTop = el.log.scrollHeight;
}
function md(t){
  if (hasMarked && hasPurify) { try { return DOMPurify.sanitize(marked.parse(String(t||''))); } catch(e){} }
  return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function down(){ el.scroller.scrollTop = el.scroller.scrollHeight; }
function fit(){
  el.problem.style.height = 'auto';
  el.problem.style.height = Math.min(el.problem.scrollHeight, 150) + 'px';
  el.count.textContent = el.problem.value.length + '/2000';
}
function setPill(which, state, extra){
  const node = which === 'nexus' ? el.pillNexus : which === 'lab' ? el.pillLab : el.pillRun;
  node.className = 'pill ' + (state || '');
  const sfx = state === 'ok' ? ' · LINK' : state === 'wait' ? ' · …' : '';
  const name = which === 'nexus' ? 'NEXUS' + sfx : which === 'lab' ? 'LAB' + sfx : (extra || (state === 'wait' ? 'RUNNING' : state === 'ok' ? 'DONE' : 'IDLE'));
  node.innerHTML = '<span class="d"></span>' + name;
}
function setStep(i){ el.steps.forEach((s, n) => { s.className = 'st' + (n < i ? ' done' : n === i ? ' on' : ''); }); }
function setWire(dir){ if (dir) el.wire.setAttribute('data-dir', dir); else el.wire.removeAttribute('data-dir'); }

function frame(kind, title, inner, src){
  const div = document.createElement('div');
  div.className = 'm ' + kind;
  const tag = src ? '<span class="tag ' + (src === 'LOKAL' ? 'local' : '') + '">' + src + '</span>' : '';
  div.innerHTML = '<div class="av">' + IC[kind] + '</div><div class="bub"><div class="mh"><span>' + title + '</span>' + tag + '<time>' + (src === undefined ? '…' : new Date().toLocaleTimeString('id-ID', {hour12:false})) + '</time>' + (src === undefined ? '' : '<button class="ib" aria-label="Salin">' + IC.copy + '</button>') + '</div>' + inner + '</div>';
  el.thread.appendChild(div);
  return div;
}
function pushMsg(kind, title, body, src){
  const div = frame(kind, title, '<div class="mb">' + md(body) + '</div>', src || '');
  S.tr.push({ title: title, text: String(body), src: src || '', time: new Date().toLocaleTimeString('id-ID', {hour12:false}) });
  const mb = div.querySelector('.mb');
  if (mb.scrollHeight > 300) {
    mb.classList.add('clip');
    const more = document.createElement('button');
    more.className = 'more'; more.textContent = 'Tampilkan semua';
    more.onclick = () => { const c = mb.classList.toggle('clip'); more.textContent = c ? 'Tampilkan semua' : 'Ringkas'; };
    mb.parentNode.appendChild(more);
  }
  const cb = div.querySelector('.ib');
  if (cb) cb.onclick = () => {
    const done = () => toast('Pesan disalin');
    try { navigator.clipboard.writeText(String(body)).then(done, () => toast('Gagal menyalin')); } catch(e){ toast('Gagal menyalin'); }
  };
  down();
  return div;
}
function pushTyping(kind, title){
  const div = frame(kind, title, '<div class="mb think"><span class="dots"><b></b><b></b><b></b></span>menyusun respons</div>');
  div.id = 'typing-' + kind;
  setWire(kind === 'lab' ? 'lab' : 'nexus');
  down();
}
function clearTyping(kind){
  const n = $('typing-' + kind);
  if (n) n.remove();
  setWire('');
}

function uid(){ return 'h' + (S.seq++) + '_' + Date.now().toString(36); }
function targetWin(which){ return which === 'nexus' ? el.frameNexus.contentWindow : el.frameLab.contentWindow; }

function send(which, type, payload, timeoutMs){
  return new Promise((resolve, reject) => {
    const win = targetWin(which);
    if (!win) return reject(new Error(which + ' frame missing'));
    const id = uid();
    const timer = setTimeout(() => { S.pending.delete(id); reject(new Error('timeout ' + type + ' @' + which)); }, timeoutMs || 15000);
    S.pending.set(id, { resolve, reject, timer, type, which });
    try {
      win.postMessage({ source: SOURCE, v: BRIDGE_VER, type, id, payload: payload || {} }, '*');
    } catch(e) {
      clearTimeout(timer); S.pending.delete(id); reject(e);
    }
  });
}

window.addEventListener('message', (ev) => {
  const d = ev.data;
  if (!d || d.v !== BRIDGE_VER) return;
  if (d.source !== 'cgo-nexus' && d.source !== 'cgo-lab') return;
  if (d.type === 'HELLO_ACK') {
    if (d.source === 'cgo-nexus') { S.nexusOk = true; setPill('nexus', 'ok'); }
    if (d.source === 'cgo-lab') { S.labOk = true; setPill('lab', 'ok'); }
  }
  if (d.id && S.pending.has(d.id)) {
    const p = S.pending.get(d.id);
    clearTimeout(p.timer);
    S.pending.delete(d.id);
    if (d.type === 'ERROR') p.reject(new Error((d.payload && d.payload.error) || 'error'));
    else p.resolve(d);
  }
});

function nexusUrl(){ return new URL('cgo.html', location.href).href; }
function labUrl(){ return new URL('cyber-lab-gold-master-v3.4.html', location.href).href; }

function loadPeers(){
  return new Promise((resolve) => {
    if (S.framesLoaded) return resolve();
    setPill('nexus', 'wait'); setPill('lab', 'wait');
    log('Memuat peer iframe…');
    let left = 2;
    const done = () => { if (--left <= 0) { S.framesLoaded = true; resolve(); } };
    el.frameNexus.onload = () => { log('Nexus frame load'); done(); };
    el.frameLab.onload = () => { log('Lab frame load'); done(); };
    el.frameNexus.src = nexusUrl();
    el.frameLab.src = labUrl();
    setTimeout(() => { if (!S.framesLoaded) { S.framesLoaded = true; log('Frame load timeout — lanjut ping'); resolve(); } }, 8000);
  });
}

async function pingOne(which){
  let lastErr = null;
  for (let attempt = 1; attempt <= 4; attempt++) {
    try {
      await send(which, 'PING', {}, 4000);
      if (which === 'nexus') { S.nexusOk = true; setPill('nexus', 'ok'); }
      else { S.labOk = true; setPill('lab', 'ok'); }
      log('LINK ' + which + ' (try ' + attempt + ')');
      return true;
    } catch(e) {
      lastErr = e;
      await new Promise(r => setTimeout(r, 500 * attempt));
    }
  }
  if (which === 'nexus') { S.nexusOk = false; setPill('nexus', 'bad'); }
  else { S.labOk = false; setPill('lab', 'bad'); }
  log('FAIL ' + which + ': ' + (lastErr && lastErr.message));
  return false;
}

async function ensureLinked(){
  await loadPeers();
  await new Promise(r => setTimeout(r, 900));
  const a = await pingOne('nexus');
  const b = await pingOne('lab');
  return a || b;
}

/* -------- Local fallback if peer unreachable (still auto-dialogue) -------- */
function localNexusDiscuss(problem){
  return [
    '**CGO Research Nexus — analisis lokal (fallback)**',
    '',
    'Masalah dipetakan ke kerangka Role · Context · Rules · Objective · Validation:',
    '- **Role**: operator manusia = otoritas final; Nexus = kompiler intent.',
    '- **Context**: runtime Lab (hooks/vault/anomaly) harus disinkron sebelum eksekusi.',
    '- **Rules**: larangan eksekusi destruktif otomatis (LOCKDOWN/CLEAR_VAULT) tanpa veto.',
    '- **Objective**: keputusan yang dapat diaudit dan digugurkan (contestable).',
    '- **Validation**: silang-cek dengan status Lab + jejak log.',
    '',
    'Ringkas masalah: _' + String(problem).slice(0, 220) + '_',
    '',
    '_Catatan: peer Nexus iframe tidak merespons; fallback deterministic dipakai agar dialog tetap jalan._'
  ].join('\n');
}
function localLabDiscuss(problem, note){
  return [
    '**CGO Cyber Lab — tanggapan lokal (fallback)**',
    '',
    'Sikap teknis terhadap masalah:',
    '- Interceptor & sensor integritas cocok sebagai lapisan **Validation** runtime.',
    '- Tool PROBE/XHR/WS/DETECT dapat dipanggil manual; bridge menolak destruktif tanpa confirm.',
    '- Masukan Nexus: ' + (note ? String(note).slice(0, 180) : '—'),
    '',
    'Fokus: _' + String(problem).slice(0, 180) + '_',
    '',
    '_Catatan: peer Lab iframe tidak merespons; fallback deterministic dipakai._'
  ].join('\n');
}

function setRunning(on){
  S.running = on;
  el.btnStart.hidden = on; el.btnStart.disabled = on;
  el.btnStop.hidden = !on; el.btnStop.disabled = !on;
  el.problem.disabled = on;
}

async function runDialogue(){
  const problem = el.problem.value.trim();
  if (!problem) { toast('Tulis pertanyaan dulu'); el.problem.focus(); return; }
  if (S.running) return;

  S.abort = false; setRunning(true);
  addHist(problem);
  const t0 = Date.now();
  setPill('run', 'wait', 'RUNNING · 0s');
  S.t = setInterval(() => setPill('run', 'wait', 'RUNNING · ' + Math.round((Date.now() - t0) / 1000) + 's'), 1000);
  setStep(0);
  pushMsg('hub', 'HUB', 'Menerima pertanyaan. Menautkan Nexus + Lab lalu memulai diskusi otomatis…\n\n**Q:** ' + problem);
  log('Dialogue auto-start');

  try {
    await ensureLinked();
    if (S.abort) throw new Error('abort');

    // --- Turn 1: Nexus ---
    setStep(0);
    pushTyping('nexus', 'CGO RESEARCH NEXUS');
    let nexusText = '', compileNote = '';
    if (S.nexusOk) {
      try {
        const ack = await send('nexus', 'DISCUSS', { problem }, 20000);
        nexusText = (ack.payload && ack.payload.text) || '';
        if (ack.payload && ack.payload.compile && ack.payload.compile.ok)
          compileNote = 'score ' + ack.payload.compile.score + '/100';
      } catch(e) {
        log('Nexus DISCUSS fail: ' + e.message);
        S.nexusOk = false; setPill('nexus', 'bad');
      }
    }
    const nexusLive = !!nexusText;
    if (!nexusText) nexusText = localNexusDiscuss(problem);
    clearTyping('nexus');
    pushMsg('nexus', 'CGO RESEARCH NEXUS', nexusText, nexusLive ? 'LIVE' : 'LOKAL');
    if (S.abort) throw new Error('abort');

    // --- Turn 2: Lab ---
    setStep(1);
    pushTyping('lab', 'CGO CYBER LAB');
    let labText = '', labState = null;
    if (S.labOk) {
      try {
        const st = await send('lab', 'LAB_STATUS', {}, 8000);
        labState = st.payload || null;
      } catch(e) { log('Lab STATUS fail: ' + e.message); }
      try {
        const ack = await send('lab', 'DISCUSS', { problem, nexusNote: compileNote || nexusText.slice(0, 200) }, 15000);
        labText = (ack.payload && ack.payload.text) || '';
      } catch(e) {
        log('Lab DISCUSS fail: ' + e.message);
        S.labOk = false; setPill('lab', 'bad');
      }
    }
    const labLive = !!labText;
    if (!labText) labText = localLabDiscuss(problem, compileNote);
    clearTyping('lab');
    pushMsg('lab', 'CGO CYBER LAB', labText, labLive ? 'LIVE' : 'LOKAL');
    if (S.abort) throw new Error('abort');

    // --- Turn 3: Nexus rebuttal with lab state ---
    setStep(2);
    pushTyping('nexus', 'CGO RESEARCH NEXUS');
    let nexus2 = '';
    if (S.nexusOk) {
      try {
        const ack = await send('nexus', 'DISCUSS', { problem, labState }, 20000);
        nexus2 = (ack.payload && ack.payload.text) || '';
      } catch(e) { log('Nexus rebuttal fail: ' + e.message); }
    }
    const n2Live = !!nexus2;
    if (!nexus2) {
      nexus2 = [
        '**Nexus · penutup putaran (fallback)**',
        '',
        'Setelah masukan Lab, spesifikasi operasional:',
        '1. Sinkron status hooks/vault sebelum aksi.',
        '2. Validation = DETECT + review manusia untuk aksi berisiko.',
        '3. Bridge tetap memblok CLEAR_VAULT/LOCKDOWN tanpa confirm.',
        '',
        labState ? ('Lab state: `' + JSON.stringify(labState).slice(0, 240) + '`') : 'Lab state tidak tersedia.'
      ].join('\n');
    }
    clearTyping('nexus');
    pushMsg('nexus', 'CGO RESEARCH NEXUS · SANGGAHAN', nexus2, n2Live ? 'LIVE' : 'LOKAL');
    if (S.abort) throw new Error('abort');

    // --- Turn 4: Lab status snapshot only ---
    setStep(3);
    if (S.labOk) {
      try {
        const det = await send('lab', 'LAB_EXEC', { cmd: 'STATUS' }, 8000);
        pushMsg('lab', 'CGO CYBER LAB · STATUS', '```\n' + JSON.stringify(det.payload, null, 2).slice(0, 1200) + '\n```', 'LIVE');
      } catch(e) { log('snapshot fail: ' + e.message); }
    }

    setStep(4);
    pushMsg('hub', 'HUB · SELESAI', 'Diskusi otomatis selesai dalam ' + Math.round((Date.now() - t0) / 1000) + ' detik. Tidak ada aksi destruktif yang dijalankan.');
    setPill('run', 'ok', 'DONE');
    log('Dialogue complete');
    toast('Diskusi selesai');
  } catch(e) {
    clearTyping('nexus'); clearTyping('lab');
    if (String(e.message) === 'abort') {
      pushMsg('hub', 'HUB', 'Dihentikan.');
      setPill('run', '', 'IDLE');
    } else {
      pushMsg('hub', 'HUB · ERROR', e.message || String(e));
      setPill('run', 'bad', 'ERROR');
    }
    log('Error: ' + e.message);
  } finally {
    clearInterval(S.t); setWire('');
    setRunning(false);
    el.problem.value = ''; fit();
  }
}

function exportMd(){
  if (!S.tr.length) { toast('Belum ada percakapan'); return; }
  const t = '# CGO Bridge Hub — Transkrip\n\n' + S.tr.map(m => '## ' + m.title + ' (' + m.time + (m.src ? ' · ' + m.src : '') + ')\n\n' + m.text).join('\n\n---\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type: 'text/markdown' }));
  a.download = 'cgo-dialog-' + Date.now() + '.md';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Transkrip diekspor');
}

el.btnStart.onclick = runDialogue;
el.btnStop.onclick = () => { S.abort = true; el.btnStop.disabled = true; log('Stop'); };
el.btnClear.onclick = () => { el.thread.innerHTML = ''; S.tr = []; setStep(-1); log('Cleared'); };
el.btnExport.onclick = exportMd;
el.btnLog.onclick = () => el.log.classList.toggle('open');
el.problem.addEventListener('input', fit);
el.problem.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runDialogue(); } });

setTimeout(() => { loadPeers().catch(() => {}); }, 400);

renderChips(); fit(); setStep(-1);
setPill('nexus', ''); setPill('lab', ''); setPill('run', '');
log('Hub ready — ketik pertanyaan lalu kirim.');
pushMsg('hub', 'HUB', 'Mode **auto dialogue**.\n\n1. Tulis atau pilih pertanyaan di bawah\n2. Tekan tombol kirim (atau Ctrl+Enter)\n3. Nexus + Lab dimuat & dihubungkan otomatis, lalu bergiliran menjawab\n\nLabel **LIVE** = jawaban dari peer asli, **LOKAL** = fallback bila peer belum terhubung. Transkrip bisa diekspor ke Markdown.');
})();
</script>
