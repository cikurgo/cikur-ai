<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIKUR GO FOOD</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary-red: #E50914;
    --primary-red-hover: #b80710;
    --dark-bg: #0f172a;
    --body-bg: #f1f5f9;
    --container-bg: #f8fafc;
    --border-color: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --font-main: 'Plus Jakarta Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: var(--font-main);
}

body{
    background: var(--body-bg);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

@media(min-width: 480px){
    body { padding: 20px; }
}

.container{
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 16px 16px 60px 16px;
    display: flex;
    flex-direction: column;
    background: var(--container-bg);
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    position: relative;
}

@media(min-width: 480px){
    .container {
        min-height: 850px;
        border-radius: 36px;
        border: 1px solid var(--border-color);
    }
}

/* Header */
.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
}

.back-btn {
    background: #fff;
    border: 1px solid var(--border-color);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: 800;
    text-decoration: none;
    color: var(--text-main);
    transition: 0.2s;
}

.back-btn:hover {
    background: #fee2e2;
    color: var(--primary-red);
    border-color: var(--primary-red);
}

.app-header h2 {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: 0.5px;
}

/* Search Box */
.search-box-wrapper {
    margin-bottom: 14px;
}

.input-box {
    width: 100%;
    padding: 10px 14px;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-main);
    outline: none;
    transition: 0.2s;
}

.input-box:focus {
    border-color: var(--primary-red);
}

/* Resto Section / Kolom Mitra */
.resto-section {
    margin-bottom: 16px;
}

.resto-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
}

/* Food Cards */
.food-card {
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 10px;
    display: flex;
    gap: 12px;
    align-items: center;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 2px 6px rgba(0,0,0,0.02);
}

.food-card:hover {
    border-color: var(--primary-red);
    background: #fff5f5;
    transform: translateY(-2px);
}

.food-img {
    width: 70px;
    height: 70px;
    border-radius: 12px;
    object-fit: cover;
    background: #e2e8f0;
    flex-shrink: 0;
}

.food-info {
    flex: 1;
}

.food-info h4 {
    font-size: 13px;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 2px;
}

.food-info p {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
    line-height: 1.3;
}

.food-price {
    font-size: 12px;
    font-weight: 800;
    color: var(--primary-red);
    font-family: var(--font-mono);
}

/* Checkout Box */
.checkout-box {
    background: var(--dark-bg);
    color: #fff;
    border-radius: 16px;
    padding: 16px;
    margin-top: auto;
    box-shadow: 0 8px 20px rgba(15,23,42,0.2);
}

.btn-order {
    width: 100%;
    height: 46px;
    background: var(--primary-red);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.2s;
}

.btn-order:hover {
    background: var(--primary-red-hover);
}
</style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="app-header">
        <a href="index.html" class="back-btn">←</a>
        <h2>CIKUR GO FOOD</h2>
        <div style="width: 38px;"></div>
    </div>

    <!-- Kotak Pencarian Makanan -->
    <div class="search-box-wrapper">
        <input type="text" id="searchFood" class="input-box" placeholder="Cari makanan favoritmu...">
    </div>

    <!-- Daftar Berdasarkan Kolom Mitra / Resto -->
    <div id="foodListContainer">
        <!-- Render dinamis per Resto -->
    </div>

    <!-- Kotak Keranjang & Checkout Sederhana -->
    <div class="checkout-box" id="cartSection" style="display:none;">
        <div style="font-size: 11px; color: #94a3b8; font-weight: 700;">Menu Terpilih</div>
        <h3 id="cartItemName" style="font-size: 14px; font-weight: 800; margin: 2px 0 6px 0;">-</h3>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 8px;">
            <span>Total Pembayaran:</span>
            <span id="cartItemPrice" style="color: #FFD700; font-weight: 800; font-family: var(--font-mono);">-</span>
        </div>
        <button class="btn-order" onclick="prosesPesanFood()">Pesan Sekarang ⚡</button>
    </div>
</div>

<script>
let userProfile = JSON.parse(localStorage.getItem('cikur_user')) || { saldo: 125000 };
let selectedFood = { name: "", price: 0 };

// Data dikelompokkan per Kolom Mitra / Resto
let restoList = [
    {
        restoName: "🍜 Dapur 1",
        items: [
            { name: "Seblak Mantap Cikur", price: 18000, desc: "Kuah pedas kencur khas Sunda dengan topping lengkap.", img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=150" },
            { name: "Seblak Mercon Tulang", price: 21000, desc: "Seblak kuah kental dengan tambahan tulang rangu gurih pedas.", img: "https://images.unsplash.com/photo-1541544741938-0af808871cc0?w=150" }
        ]
    },
    {
        restoName: "🍛 Dapur 2",
        items: [
            { name: "Nasi Liwet Sunda Komplit", price: 25000, desc: "Disajikan dengan ikan asin, tahu, tempe, lalapan & sambal terasi.", img: "https://images.unsplash.com/photo-1541544741938-0af808871cc0?w=150" },
            { name: "Ayam Bakar Madu Cikur", price: 22000, desc: "Ayam empuk dibalut bumbu rempah bakar madu manis gurih.", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=150" }
        ]
    }
];

        items: [

            { name: "Ayam Bakar Madu Cikur", price: 22000, desc: "Ayam empuk dibalut bumbu rempah bakar madu manis gurih.", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=150" }
        ]
    }
];
    {
        restoName: "🍛 Dapur 4",
        items: [
            { name: "Nasi Liwet Sunda Komplit", price: 25000, desc: "Disajikan dengan ikan asin, tahu, tempe, lalapan & sambal terasi.", img: "https://images.unsplash.com/photo-1541544741938-0af808871cc0?w=150" },
            { name: "Ayam Bakar Madu Cikur", price: 22000, desc: "Ayam empuk dibalut bumbu rempah bakar madu manis gurih.", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=150" }
        ]
    }
];
    {
        restoName: "🍛 Dapur 5",
        items: [
            { name: "Nasi Liwet Sunda Komplit", price: 25000, desc: "Disajikan dengan ikan asin, tahu, tempe, lalapan & sambal terasi.", img: "https://images.unsplash.com/photo-1541544741938-0af808871cc0?w=150" },
            { name: "Ayam Bakar Madu Cikur", price: 22000, desc: "Ayam empuk dibalut bumbu rempah bakar madu manis gurih.", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=150" }

            { name: "Ayam Bakar Madu Cikur", price: 22000, desc: "Ayam empuk dibalut bumbu rempah bakar madu manis gurih.", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=150" }
        ]
    }
];
    {
        restoName: "🍛 Dapur 8",
        items: [
            { name: "Nasi Liwet Sunda Komplit", price: 25000, desc: "Disajikan dengan ikan asin, tahu, tempe, lalapan & sambal terasi.", img: "https://images.unsplash.com/photo-1541544741938-0af808871cc0?w=150" },
            { name: "Ayam Bakar Madu Cikur", price: 22000, desc: "Ayam empuk dibalut bumbu rempah bakar madu manis gurih.", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=150" }
        ]
    }
];

function renderRestoList(data) {
    let container = document.getElementById("foodListContainer");
    container.innerHTML = "";

    if(data.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:12px; padding:20px;">Menu tidak ditemukan.</p>`;
        return;
    }

    data.forEach(resto => {
        let section = document.createElement("div");
        section.className = "resto-section";
        
        let titleHTML = `<div class="resto-title">${resto.restoName}</div>`;
        let itemsHTML = "";

        resto.items.forEach(item => {
            itemsHTML += `
                <div class="food-card" onclick="pilihMenu('${item.name}', ${item.price})">
                    <img src="${item.img}" class="food-img" alt="${item.name}">
                    <div class="food-info">
                        <h4>${item.name}</h4>
                        <p>${item.desc}</p>
                        <div class="food-price">Rp ${item.price.toLocaleString('id-ID')}</div>
                    </div>
                </div>
            `;
        });

        section.innerHTML = titleHTML + itemsHTML;
        container.appendChild(section);
    });
}

// Render awal
renderRestoList(restoList);

// Pencarian Makanan
document.getElementById("searchFood").addEventListener("input", function(e) {
    let keyword = e.target.value.toLowerCase();
    let filteredResto = restoList.map(resto => {
        let filteredItems = resto.items.filter(item => 
            item.name.toLowerCase().includes(keyword) || item.desc.toLowerCase().includes(keyword)
        );
        return { restoName: resto.restoName, items: filteredItems };
    }).filter(resto => resto.items.length > 0);

    renderRestoList(filteredResto);
});

function pilihMenu(name, price) {
    selectedFood = { name, price };
    document.getElementById("cartSection").style.display = "block";
    document.getElementById("cartItemName").innerText = name;
    document.getElementById("cartItemPrice").innerText = "Rp " + price.toLocaleString('id-ID');
}

function prosesPesanFood() {
    if (userProfile.saldo < selectedFood.price) {
        alert("[!] Saldo CikurPay tidak mencukupi.");
        return;
    }
    
    userProfile.saldo -= selectedFood.price;
    localStorage.setItem('cikur_user', JSON.stringify(userProfile));

    // Catat ke riwayat pesanan & transaksi global
    let riwayatPesanan = JSON.parse(localStorage.getItem('cikur_orders')) || [];
    let riwayatTransaksi = JSON.parse(localStorage.getItem('cikur_transactions')) || [];
    let kodeTrx = 'TRX-' + Math.floor(100000 + Math.random() * 900000);
    let waktuSekarang = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' • ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

    riwayatPesanan.unshift({
        kode: kodeTrx,
        layanan: selectedFood.name,
        kategori: 'CIKUR Food',
        harga: selectedFood.price,
        status: 'Diproses Resto',
        waktu: waktuSekarang
    });

    riwayatTransaksi.unshift({
        kode: kodeTrx,
        ket: `Pembayaran ${selectedFood.name}`,
        nominal: -selectedFood.price,
        waktu: waktuSekarang,
        status: 'Berhasil'
    });

    localStorage.setItem('cikur_orders', JSON.stringify(riwayatPesanan));
    localStorage.setItem('cikur_transactions', JSON.stringify(riwayatTransaksi));

    alert(`[SUKSES] Pesanan ${selectedFood.name} berhasil dibuat!`);
    window.location.href = "index.html";
}
</script>

</body>
</html>
