<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cikur Go Food - Puluhan Mitra Resto & Global Auto Address</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --primary-gradient: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            --surface: #ffffff;
            --surface-glass: rgba(255, 255, 255, 0.92);
            --background: #f4f7f6;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --shadow-soft: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 40px -10px rgba(255, 71, 87, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--background); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; }

        .app-container {
            width: 100%; max-width: 480px; background: var(--surface);
            min-height: 100vh; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.08);
            display: flex; flex-direction: column; padding-bottom: 130px;
        }

        .header {
            padding: 18px 24px; display: flex; align-items: center; justify-content: space-between;
            background: var(--surface-glass); backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border);
        }
        .back-btn {
            width: 40px; height: 40px; border-radius: 50%; background: var(--background);
            border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition);
        }
        .back-btn:active { transform: scale(0.9); }
        .app-title { font-size: 15px; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .content-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; }

        .assistant-banner {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: var(--radius-md); padding: 20px; color: #fff; position: relative; overflow: hidden;
        }
        .assistant-banner h3 { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
        .assistant-banner p { font-size: 11px; opacity: 0.8; line-height: 1.4; }

        .destination-box {
            background: var(--background); border: 1.5px solid var(--border);
            border-radius: var(--radius-md); padding: 18px; transition: var(--transition);
        }
        .destination-box:focus-within { border-color: var(--primary); background: #fff; box-shadow: var(--shadow-hover); }
        
        .input-field {
            width: 100%; padding: 14px; background: #fff; border: 1px solid var(--border);
            border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; color: var(--text-main); outline: none; transition: var(--transition);
        }
        .input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,71,87,0.1); }

        .address-wrapper { position: relative; width: 100%; }
        #addressSuggestionsList {
            position: absolute; top: 100%; left: 0; right: 0; background: #fff;
            border: 1.5px solid var(--border); border-radius: var(--radius-sm); margin-top: 6px;
            box-shadow: var(--shadow-hover); max-height: 220px; overflow-y: auto; z-index: 1000; display: none;
        }
        .suggestion-item {
            padding: 12px 14px; font-size: 11px; font-weight: 600; border-bottom: 1px solid var(--border);
            cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: var(--transition);
        }
        .suggestion-item:hover { background: #fff5f5; color: var(--primary); padding-left: 18px; }

        .search-container { position: relative; }
        .search-input {
            width: 100%; padding: 14px 14px 14px 44px; background: var(--background);
            border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 12px; font-weight: 600; outline: none; transition: var(--transition);
        }
        .search-input:focus { border-color: var(--primary); background: #fff; box-shadow: var(--shadow-hover); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .mode-switcher { display: flex; background: var(--background); padding: 4px; border-radius: var(--radius-md); gap: 4px; border: 1px solid var(--border); }
        .mode-tab { flex: 1; padding: 10px; border: none; background: transparent; font-size: 11px; font-weight: 700; color: var(--text-muted); border-radius: 10px; cursor: pointer; transition: var(--transition); }
        .mode-tab.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-soft); }

        .resto-card { background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 18px; box-shadow: var(--shadow-soft); margin-bottom: 14px; }
        .menu-item-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .menu-item-row:last-child { border-bottom: none; }
        .menu-thumb { width: 56px; height: 56px; border-radius: var(--radius-sm); object-fit: cover; border: 1px solid var(--border); }

        .counter-control { display: flex; align-items: center; background: var(--background); padding: 3px; border-radius: 10px; border: 1px solid var(--border); }
        .counter-btn { width: 28px; height: 28px; border-radius: 8px; border: none; background: #fff; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .counter-btn.plus { background: var(--primary-gradient); color: #fff; }

        .footer-action {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: var(--surface-glass); backdrop-filter: blur(16px);
            padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; z-index: 100;
        }
        .btn-main { flex: 1; padding: 14px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 800; border: none; cursor: pointer; transition: var(--transition); }
        .btn-checkout { background: var(--primary-gradient); color: #fff; box-shadow: 0 8px 25px rgba(255,71,87,0.3); }
        .btn-secondary { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn-main:active { transform: scale(0.97); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <button class="back-btn" onclick="history.back()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1 class="app-title">CIKUR GO FOOD</h1>
        <div style="width: 40px;"></div>
    </div>

    <div class="content-body">
        <div class="assistant-banner">
            <h3>CIKUR GO ASSISTANT</h3>
            <p>Menampilkan puluhan mitra resto terdaftar secara real-time dengan pencarian alamat otomatis global.</p>
        </div>

        <div class="destination-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-size: 10px; font-weight: 800; color: var(--text-muted);">TUJUAN PENGIRIMAN</span>
                <span id="lockBadge" style="font-size: 9px; font-weight: 700; padding: 3px 8px; background: #fee2e2; color: var(--primary); border-radius: 12px;">Wajib Diisi</span>
            </div>
            
            <div class="address-wrapper">
                <input type="text" id="globalCustomerAddress" class="input-field" placeholder="Ketik nama jalan, tempat, atau daerah..." autocomplete="off">
                <div id="addressSuggestionsList"></div>
            </div>

            <div style="margin-top: 10px; display: flex; align-items: center; gap: 6px;">
                <input type="checkbox" id="checkSimpanAlamat" onclick="handleAddressCheckbox(this)" style="width: 14px; height: 14px; accent-color: var(--primary);">
                <label for="checkSimpanAlamat" style="font-size: 11px; font-weight: 700; color: var(--text-muted); cursor: pointer;">Kunci Alamat Tujuan Ini</label>
            </div>
        </div>

        <div class="search-container">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Cari resto atau menu..." oninput="filterRestoList()">
        </div>

        <div class="mode-switcher">
            <button class="mode-tab active" id="btnInstant" onclick="switchMode('instant')">⚡ Pesan Sekarang</button>
            <button class="mode-tab" id="btnRes" onclick="switchMode('reservasi')">📅 Atur Reservasi</button>
        </div>

        <div id="panelReservasi" style="display: none; background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 14px;">
            <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                <div style="flex: 1;"><label style="font-size: 9px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 4px;">TANGGAL</label><input type="date" id="resTanggal" class="input-field"></div>
                <div style="flex: 1;"><label style="font-size: 9px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 4px;">JAM</label><input type="time" id="resJam" class="input-field"></div>
            </div>
            <label style="font-size: 9px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 4px;">METODE</label>
            <select id="resMetode" class="input-field">
                <option value="Makan di Tempat (Dine-in)">Makan di Tempat (Dine-in)</option>
                <option value="Ambil Sendiri (Takeaway)">Ambil Sendiri (Takeaway)</option>
            </select>
        </div>

        <div id="restoContainer"></div>
    </div>

    <div class="footer-action">
        <button class="btn-main btn-checkout" onclick="proceedToCheckout()">Checkout Pesanan</button>
        <button class="btn-main btn-secondary" onclick="lanjutKe2In1()">Cikur 2-in-1</button>
    </div>
</div>

<script>
let cartQuantities = {};
let databaseResto = [];
let currentModeSelected = 'instant';
let searchTimeout = null;

function loadRestoData() {
    // Mendukung puluhan mitra resto dari sistem multi-resto maupun single input dari resto.html
    let multiRestos = JSON.parse(localStorage.getItem('cikur_all_restaurants')) || [];
    let singleProfile = JSON.parse(localStorage.getItem('cikur_resto_profile')) || {};
    let singleMenus = JSON.parse(localStorage.getItem('cikur_resto_menus')) || JSON.parse(localStorage.getItem('menuList')) || [
        { id: 'm1', name: 'Minuman Spesial Cikur', price: 17500, img: 'https://images.unsplash.com/photo-154154741938-0af808871cc0?w=150', status: 'Tersedia' },
        { id: 'm2', name: 'Kuliner Lezat Nusantara', price: 25000, img: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=150', status: 'Tersedia' }
    ];

    if (multiRestos.length > 0) {
        databaseResto = multiRestos;
    } else {
        databaseResto = [{
            id: singleProfile.id || 'resto_single',
            restoName: singleProfile.name || singleProfile.restoName || 'CIKUR Rubidotcom',
            restoAddress: singleProfile.address || singleProfile.alamat || 'Jl. KH. Abdul Halim, Majasari',
            restoPhoto: singleProfile.photo || singleProfile.restoPhoto || 'https://images.unsplash.com/photo-154154741938-0af808871cc0?w=150',
            isOpen: true,
            statusText: 'Buka',
            items: singleMenus
        }];
    }
    renderRestoList(databaseResto);
}

function renderRestoList(restos) {
    let container = document.getElementById("restoContainer");
    container.innerHTML = "";
    
    if(!restos || restos.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 12px;">Belum ada mitra resto atau menu tersedia.</div>`;
        return;
    }

    restos.forEach(resto => {
        let card = document.createElement("div");
        card.className = "resto-card";
        let menusHTML = "";
        
        let itemsList = resto.items || resto.menus || [];
        if(itemsList.length === 0) {
            menusHTML = `<div style="padding: 10px; font-size: 11px; color: var(--text-muted);">Menu belum diinput oleh resto ini.</div>`;
        } else {
            itemsList.forEach(item => {
                let itemId = item.id || item.nama || Math.random();
                let key = `${resto.id}_${itemId}`;
                let qty = cartQuantities[key] || 0;
                let price = item.discountPrice || item.price || 0;
                let itemName = item.name || item.nama || 'Menu Cikur';
                let itemImg = item.img || item.image || 'https://images.unsplash.com/photo-154154741938-0af808871cc0?w=150';

                menusHTML += `
                    <div class="menu-item-row">
                        <img src="${itemImg}" class="menu-thumb">
                        <div style="flex:1; min-width:0;">
                            <h4 style="font-size: 12px; font-weight: 700; margin-bottom: 2px;">${itemName}</h4>
                            <span style="font-size: 12px; font-weight: 800; color: var(--primary);">Rp ${Number(price).toLocaleString('id-ID')}</span>
                        </div>
                        <div class="counter-control">
                            <button class="counter-btn" onclick="updateQty('${resto.id}', '${itemId}', -1)">-</button>
                            <span style="font-size: 11px; font-weight: 700; min-width: 18px; text-align: center;" id="q_${key}">${qty}</span>
                            <button class="counter-btn plus" onclick="updateQty('${resto.id}', '${itemId}', 1)">+</button>
                        </div>
                    </div>`;
            });
        }

        card.innerHTML = `
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                <img src="${resto.restoPhoto || resto.photo || 'https://images.unsplash.com/photo-154154741938-0af808871cc0?w=150'}" style="width: 42px; height: 42px; border-radius: 50%; object-fit: cover;">
                <div style="flex:1; min-width:0;">
                    <h3 style="font-size: 13px; font-weight: 800;">${resto.restoName || resto.name || 'Mitra Resto Cikur'}</h3>
                    <p style="font-size: 10px; color: var(--text-muted);">📍 ${resto.restoAddress || resto.address || 'Lokasi Mitra'}</p>
                </div>
            </div>
            <div style="border-top: 1px solid var(--border);">${menusHTML}</div>`;
        container.appendChild(card);
    });
}

function updateQty(restoId, itemId, change) {
    let key = `${restoId}_${itemId}`;
    let curr = cartQuantities[key] || 0;
    let next = curr + change;
    if(next < 0) next = 0;
    cartQuantities[key] = next;
    let el = document.getElementById(`q_${key}`);
    if(el) el.innerText = next;
}

function filterRestoList() {
    let keyword = document.getElementById("searchInput").value.toLowerCase();
    if(!keyword) {
        renderRestoList(databaseResto);
        return;
    }
    let filtered = databaseResto.map(resto => {
        let matchedItems = (resto.items || resto.menus || []).filter(i => 
            (i.name || i.nama || '').toLowerCase().includes(keyword)
        );
        let restoNameMatch = (resto.restoName || resto.name || '').toLowerCase().includes(keyword);
        if(restoNameMatch || matchedItems.length > 0) {
            return { ...resto, items: restoNameMatch ? (resto.items || resto.menus) : matchedItems };
        }
        return null;
    }).filter(Boolean);

    renderRestoList(filtered);
}

function switchMode(mode) {
    currentModeSelected = mode;
    document.getElementById("btnInstant").className = mode === 'instant' ? "mode-tab active" : "mode-tab";
    document.getElementById("btnRes").className = mode === 'reservasi' ? "mode-tab active" : "mode-tab";
    document.getElementById("panelReservasi").style.display = mode === 'reservasi' ? 'block' : 'none';
}

function handleAddressCheckbox(cb) {
    let input = document.getElementById("globalCustomerAddress");
    let badge = document.getElementById("lockBadge");
    if(!input.value.trim()) { alert("Silakan masukkan atau pilih alamat tujuan dahulu!"); cb.checked = false; return; }
    input.disabled = cb.checked;
    badge.innerText = cb.checked ? "Terkunci ✓" : "Wajib Diisi";
    badge.style.background = cb.checked ? "#dcfce7" : "#fee2e2";
    badge.style.color = cb.checked ? "#10b981" : "#ff4757";
}

// Inisialisasi OpenStreetMap untuk Pencarian Alamat Otomatis Berbagai Daerah
document.addEventListener("DOMContentLoaded", () => {
    loadRestoData();
    let searchInput = document.getElementById("globalCustomerAddress");
    let list = document.getElementById("addressSuggestionsList");

    searchInput.addEventListener("input", function() {
        let query = this.value.trim();
        clearTimeout(searchTimeout);

        if(query.length < 3) {
            list.style.display = "none";
            return;
        }

        searchTimeout = setTimeout(() => {
            let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=id&limit=8`;
            
            list.innerHTML = `<div style="padding: 12px; font-size: 11px; color: var(--text-muted); text-align: center;">Mencari lokasi dan daerah sekitar...</div>`;
            list.style.display = 'block';

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if(data && data.length > 0) {
                        list.innerHTML = data.map(item => `
                            <div class="suggestion-item" onclick="selectAutoAddress('${item.display_name.replace(/'/g, "")}')">
                                <div>
                                    <div style="font-weight: 700; color: var(--text-main); line-height: 1.3;">${item.display_name}</div>
                                </div>
                                <span style="color: var(--primary); font-weight: 800; white-space: nowrap; margin-left: 8px;">Pilih ➔</span>
                            </div>
                        `).join('');
                        list.style.display = 'block';
                    } else {
                        list.innerHTML = `<div style="padding: 12px; font-size: 11px; color: var(--text-muted); text-align: center;">Gunakan alamat mandiri: "${query}"</div>`;
                        list.style.display = 'block';
                    }
                })
                .catch(() => {
                    list.style.display = 'none';
                });
        }, 400);
    });

    document.addEventListener("click", function(e) {
        if (!searchInput.contains(e.target) && !list.contains(e.target)) {
            list.style.display = 'none';
        }
    });
});

function selectAutoAddress(displayName) {
    document.getElementById("globalCustomerAddress").value = displayName;
    document.getElementById("addressSuggestionsList").style.display = 'none';
}

function proceedToCheckout() {
    let addressVal = document.getElementById("globalCustomerAddress").value.trim();
    if(!addressVal) { alert("Tentukan alamat tujuan pengiriman terlebih dahulu!"); return; }

    let subtotal = 0, summaryList = [], structuredItems = [], targetRestoName = 'CIKUR Resto';
    
    databaseResto.forEach(resto => {
        let itemsList = resto.items || resto.menus || [];
        itemsList.forEach(item => {
            let itemId = item.id || item.nama;
            let key = `${resto.id}_${itemId}`;
            let qty = cartQuantities[key] || 0;
            if(qty > 0) {
                targetRestoName = resto.restoName || resto.name || 'Mitra Resto';
                let price = item.discountPrice || item.price || 0;
                subtotal += price * qty;
                summaryList.push(`${qty}x ${item.name || item.nama}`);
                structuredItems.push({ id: itemId, name: item.name || item.nama, quantity: qty, price: price });
            }
        });
    });

    if(summaryList.length === 0) { alert("Keranjang belanja masih kosong!"); return; }

    let grandTotal = subtotal + 10000;
    
    let orderData = {
        id: 'ORD_' + Date.now(),
        kode: 'TRX-' + Math.floor(100000 + Math.random() * 900000),
        menu: summaryList.join(', '),
        items: structuredItems,
        total: grandTotal,
        status: 'Pending',
        mode: currentModeSelected,
        reservationDetail: currentModeSelected === 'reservasi' ? {
            tanggal: document.getElementById('resTanggal').value || '-',
            jam: document.getElementById('resJam').value || '-',
            metode: document.getElementById('resMetode').value || '-'
        } : null,
        restoName: targetRestoName,
        customerAddress: addressVal,
        waktu: new Date().toLocaleDateString('id-ID') + ' ' + new Date().toLocaleTimeString('id-ID')
    };

    // Sinkronisasi ke LocalStorage multi-layanan (Resto, Driver, & Universal Orders)
    let restoOrders = JSON.parse(localStorage.getItem('cikur_restaurant_orders')) || [];
    let driverOrders = JSON.parse(localStorage.getItem('cikur_driver_orders')) || [];
    let allOrders = JSON.parse(localStorage.getItem('cikur_orders')) || [];

    restoOrders.unshift(orderData);
    driverOrders.unshift(orderData);
    allOrders.unshift(orderData);

    localStorage.setItem('cikur_restaurant_orders', JSON.stringify(restoOrders));
    localStorage.setItem('cikur_driver_orders', JSON.stringify(driverOrders));
    localStorage.setItem('cikur_orders', JSON.stringify(allOrders));

    alert("Pesanan berhasil diproses & terintegrasi ke sistem Resto, Driver, serta Cikur 2-in-1!");
    window.location.href = "cikurgo2in1.html";
}

function lanjutKe2In1() { 
    window.location.href = "cikurgo2in1.html"; 
}
</script>

</body>
</html>
