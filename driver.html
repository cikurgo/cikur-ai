<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cikur Go - Panel Driver Terintegrasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS untuk Peta Real-Time -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #ff4757;
            --primary-gradient: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            --surface: #ffffff;
            --background: #f4f7f6;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-sm: 12px;
            --radius-md: 20px;
            --shadow-soft: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--background); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }

        .app-container {
            width: 100%; max-width: 440px; min-height: 100vh; background: var(--surface);
            display: flex; flex-direction: column; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
        }

        .header {
            padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;
            background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
        }
        .app-title { font-size: 15px; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .content-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; flex: 1; padding-bottom: 40px; }

        .card-box { background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-soft); display: flex; flex-direction: column; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 11px; font-weight: 700; color: var(--text-muted); }
        .form-input, .form-select {
            padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 12px; outline: none; background: #fafafa; transition: var(--transition);
        }
        .form-input:focus, .form-select:focus { border-color: var(--primary); background: #fff; }

        .btn-primary {
            background: var(--primary-gradient); color: #fff; border: none; padding: 12px;
            border-radius: var(--radius-sm); font-weight: 800; font-size: 12px; cursor: pointer; transition: var(--transition); text-align: center;
        }

        .driver-status-card {
            background: #1e293b; color: #fff; border-radius: var(--radius-md); padding: 18px;
            display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-soft);
        }
        .status-toggle-btn {
            background: #10b981; color: #fff; border: none; padding: 10px; border-radius: var(--radius-sm);
            font-weight: 800; font-size: 11px; cursor: pointer; transition: var(--transition);
        }
        .status-toggle-btn.offline { background: #dc2626; }

        .driver-tabs { display: flex; background: var(--background); padding: 4px; border-radius: var(--radius-md); gap: 4px; border: 1px solid var(--border); }
        .driver-tab { flex: 1; padding: 10px; border: none; background: transparent; font-size: 11px; font-weight: 700; color: var(--text-muted); border-radius: 10px; cursor: pointer; text-align: center; }
        .driver-tab.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-soft); }

        .order-card {
            background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius-md);
            padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-soft);
        }
        .badge-type { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 6px; width: fit-content; }
        .badge-food { background: #fee2e2; color: var(--primary); }
        .badge-ride { background: #e0f2fe; color: #0284c7; }

        #map { width: 100%; height: 180px; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-top: 6px; }

        /* Desain Kolom Chat Interaktif */
        .chat-container { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .chat-box { max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .chat-msg { font-size: 11px; padding: 6px 10px; border-radius: 8px; max-width: 85%; }
        .chat-msg.driver { background: #e0f2fe; color: #0369a1; align-self: flex-end; }
        .chat-msg.other { background: #e2e8f0; color: var(--text-main); align-self: flex-start; }
        .chat-input-group { display: flex; gap: 6px; margin-top: 4px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1 class="app-title">CIKUR GO - DRIVER</h1>
        <span id="navStatusBadge" style="font-size: 10px; font-weight: 700; color: var(--text-muted);">Belum Aktif</span>
    </div>

    <div class="content-body">
        
        <!-- 1. REGISTRASI & REKENING DRIVER -->
        <div id="registrationSection" class="card-box" style="display: none;">
            <h3 style="font-size: 13px; font-weight: 800;">📝 Registrasi & Rekening Driver</h3>
            <div class="form-group">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" id="regName" class="form-input" placeholder="Nama Sesuai KTP">
            </div>
            <div class="form-group">
                <label class="form-label">Nomor WhatsApp</label>
                <input type="text" id="regPhone" class="form-input" placeholder="08xxxxxxxxxx">
            </div>
            <div class="form-group">
                <label class="form-label">Plat Nomor Kendaraan</label>
                <input type="text" id="regVehicle" class="form-input" placeholder="Contoh: A 1234 XX">
            </div>
            <div class="form-group">
                <label class="form-label">Pilih Bank / E-Wallet Pencairan</label>
                <select id="regBank" class="form-select">
                    <option value="BCA">Bank BCA</option>
                    <option value="BRI">Bank BRI</option>
                    <option value="BNI">Bank BNI</option>
                    <option value="Mandiri">Bank Mandiri</option>
                    <option value="DANA">DANA</option>
                    <option value="OVO">OVO</option>
                    <option value="GoPay">GoPay</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Nomor Rekening / Akun</label>
                <input type="text" id="regAccountNo" class="form-input" placeholder="Nomor Rekening Tujuan">
            </div>
            <button class="btn-primary" onclick="saveDriverRegistration()">Simpan & Masuk Panel</button>
        </div>

        <!-- 2. DASHBOARD UTAMA -->
        <div id="dashboardSection" style="display: flex; flex-direction: column; gap: 16px;">
            
            <div class="driver-status-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h3 id="profileNameDisplay" style="font-size: 13px; font-weight: 800;">-</h3>
                        <p id="profileMetaDisplay" style="font-size: 10px; opacity: 0.8; margin-top: 2px;">-</p>
                    </div>
                    <button onclick="toggleDriverStatus()" id="statusBtn" class="status-toggle-btn offline">OFFLINE</button>
                </div>
                <button onclick="openEditProfile()" style="background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 10px; padding: 6px; border-radius: 6px; cursor: pointer; margin-top: 4px;">⚙️ Ubah Profil & Rekening</button>
            </div>

            <!-- TAB NAVIGASI LAYANAN (FOOD VS RIDE) -->
            <div class="driver-tabs">
                <div class="driver-tab active" id="tabFoodBtn" onclick="switchDriverTab('food')">🍲 Cikur Food (Resto)</div>
                <div class="driver-tab" id="tabRideBtn" onclick="switchDriverTab('ride')">🏍️ Cikur Ride (Reguler)</div>
            </div>

            <!-- PETA REAL-TIME GPS DRIVER -->
            <div class="card-box">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h4 style="font-size: 12px; font-weight: 800;">🛰️ Peta Navigasi Live</h4>
                    <span id="gpsStatus" style="font-size: 10px; color: #10b981; font-weight: 700;">● GPS Aktif</span>
                </div>
                <div id="map"></div>
            </div>

            <!-- CONTAINER LIST ORDERAN -->
            <div id="driverOrderContainer" style="display: flex; flex-direction: column; gap: 12px;"></div>

        </div>

    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let isOnline = false;
let currentTab = 'food';
let map, driverMarker;

function initMap(lat = -6.3245, lon = 106.1524) {
    if(!map) {
        map = L.map('map').setView([lat, lon], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        driverMarker = L.marker([lat, lon]).addTo(map).bindPopup("<b>Posisi Anda (Driver)</b>").openPopup();
    } else {
        map.setView([lat, lon], 15);
        driverMarker.setLatLng([lat, lon]);
    }
}

function trackGPS() {
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition((pos) => {
            let lat = pos.coords.latitude;
            let lon = pos.coords.longitude;
            if(map && driverMarker) {
                driverMarker.setLatLng([lat, lon]);
                map.panTo([lat, lon]);
            }
        }, () => {}, { enableHighAccuracy: true });
    }
}

document.addEventListener("DOMContentLoaded", () => {
    checkRegistration();
    initMap();
    trackGPS();
});

function checkRegistration() {
    let profile = localStorage.getItem('cikur_driver_profile');
    if(!profile) {
        document.getElementById("registrationSection").style.display = "flex";
        document.getElementById("dashboardSection").style.display = "none";
    } else {
        document.getElementById("registrationSection").style.display = "none";
        document.getElementById("dashboardSection").style.display = "flex";
        let p = JSON.parse(profile);
        document.getElementById("profileNameDisplay").innerText = p.name;
        document.getElementById("profileMetaDisplay").innerText = `${p.vehicle} | Rekening: ${p.bank} (${p.accountNo})`;
        document.getElementById("navStatusBadge").innerText = "Siap Bertugas";
    }
}

function saveDriverRegistration() {
    let name = document.getElementById("regName").value;
    let phone = document.getElementById("regPhone").value;
    let vehicle = document.getElementById("regVehicle").value;
    let bank = document.getElementById("regBank").value;
    let accountNo = document.getElementById("regAccountNo").value;

    if(!name || !phone || !vehicle || !accountNo) {
        alert("Lengkapi seluruh kolom data diri dan rekening bank!");
        return;
    }

    localStorage.setItem('cikur_driver_profile', JSON.stringify({ name, phone, vehicle, bank, accountNo }));
    alert("Registrasi Berhasil Disimpan!");
    checkRegistration();
}

function openEditProfile() {
    localStorage.removeItem('cikur_driver_profile');
    checkRegistration();
}

function toggleDriverStatus() {
    isOnline = !isOnline;
    let btn = document.getElementById("statusBtn");
    if(isOnline) {
        btn.innerText = "ONLINE (Siap Menerima Order)";
        btn.className = "status-toggle-btn";
        loadDriverOrders();
    } else {
        btn.innerText = "OFFLINE";
        btn.className = "status-toggle-btn offline";
        loadDriverOrders();
    }
}

function switchDriverTab(tab) {
    currentTab = tab;
    document.getElementById("tabFoodBtn").className = tab === 'food' ? "driver-tab active" : "driver-tab";
    document.getElementById("tabRideBtn").className = tab === 'ride' ? "driver-tab active" : "driver-tab";
    loadDriverOrders();
}

function loadDriverOrders() {
    let container = document.getElementById("driverOrderContainer");
    container.innerHTML = "";

    if(!isOnline) {
        container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-muted); font-size: 11px;">Status Anda <b>OFFLINE</b>. Aktifkan tombol untuk menerima orderan dari <b>food.html</b> atau <b>ride.html</b>.</div>`;
        return;
    }

    if(currentTab === 'food') {
        // Sinkronisasi data dari food.html / resto.html
        let foodOrders = JSON.parse(localStorage.getItem('cikur_driver_orders')) || [];
        if(foodOrders.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-muted); font-size: 11px;">Belum ada pesanan Cikur Food masuk dari customer/resto.</div>`;
            return;
        }

        foodOrders.forEach((ord) => {
            // Perhitungan Biaya Berdasarkan Jarak (Misal: 3 KM x Rp 2.500/km)
            let distance = ord.distance || 2.5; 
            let deliveryFee = distance * 2500;
            let foodTotal = Number(ord.total || 0);
            let grandTotal = foodTotal + deliveryFee;

            let card = document.createElement("div");
            card.className = "order-card";
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="badge-type badge-food">CIKUR FOOD - Resto: ${ord.restoName || 'Mitra Resto'}</span>
                    <span style="font-size: 10px; color: var(--text-muted);">Jarak: <b>${distance} KM</b></span>
                </div>
                <div style="font-size: 11px; font-weight: 700;">📍 Alamat Tujuan Customer: ${ord.customerAddress}</div>
                <div style="font-size: 11px; color: var(--text-muted); background: var(--background); padding: 8px; border-radius: 8px;">
                    🛒 <b>Menu Dipesan:</b> ${ord.menu}<br>
                    📏 <b>Estimasi Ongkir (${distance} km x Rp2.500):</b> Rp ${deliveryFee.toLocaleString('id-ID')}
                </div>
                <div style="font-size: 12px; font-weight: 800; color: var(--primary);">
                    Total Tagihan + Ongkir: Rp ${grandTotal.toLocaleString('id-ID')} (${ord.paymentMethod})
                </div>

                <!-- Chat Interaktif Food (Terhubung ke Customer & Resto) -->
                <div style="font-size: 11px; font-weight: 700; margin-top: 4px;">💬 Chat Koordinasi (Resto & Customer):</div>
                <div class="chat-container">
                    <div class="chat-box" id="chatFoodBox_${ord.id}">
                        <div class="chat-msg other">Resto / Customer: "Halo driver, mohon diproses pesanan ini ya."</div>
                    </div>
                    <div class="chat-input-group">
                        <input type="text" id="inputFoodChat_${ord.id}" class="form-input" style="flex:1;" placeholder="Balas pesan...">
                        <button class="btn-primary" style="padding: 6px 12px; font-size: 10px;" onclick="sendFoodChat('${ord.id}')">Kirim</button>
                    </div>
                </div>

                <div style="display: flex; gap: 8px; margin-top: 4px;">
                    <a href="https://www.google.com/maps/search/?api=1&query=${ord.customerAddress}" target="_blank" class="form-input" style="background:#0284c7; color:#fff; text-align:center; text-decoration:none; font-weight:700; display:flex; align-items:center; justify-content:center;">🗺️ Navigasi Peta</a>
                    <button class="btn-primary" style="flex:1;" onclick="completeFoodOrder('${ord.id}')">Selesaikan Antaran ✓</button>
                </div>
            `;
            container.appendChild(card);
        });

    } else {
        // Sinkronisasi data dari ride.html (Alamat Jemput & Tujuan Reguler)
        let rideOrders = JSON.parse(localStorage.getItem('cikur_driver_ride_orders')) || [
            { id: 'RIDE-01', pickup: 'Terminal Kadubanen', destination: 'Alun-Alun Pandeglang', distance: 4.2, passenger: 'Ahmad Fauzi' }
        ];

        if(rideOrders.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-muted); font-size: 11px;">Belum ada pesanan Cikur Ride masuk.</div>`;
            return;
        }

        rideOrders.forEach((ride) => {
            let rideFee = ride.distance * 3000; // Tarif Ride Rp 3.000 / km

            let card = document.createElement("div");
            card.className = "order-card";
            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="badge-type badge-ride">CIKUR RIDE REGULER</span>
                    <span style="font-size: 10px; color: var(--text-muted);">Jarak: <b>${ride.distance} KM</b></span>
                </div>
                <div style="font-size: 11px; font-weight: 700;">🟢 Titik Jemput: ${ride.pickup}</div>
                <div style="font-size: 11px; font-weight: 700;">🏁 Alamat Tujuan: ${ride.destination}</div>
                <div style="font-size: 11px; color: var(--text-muted);">Penumpang: <b>${ride.passenger}</b></div>
                <div style="font-size: 12px; font-weight: 800; color: #0284c7;">Tarif Perjalanan: Rp ${rideFee.toLocaleString('id-ID')}</div>

                <!-- Chat Interaktif Ride (Terhubung ke Penumpang) -->
                <div style="font-size: 11px; font-weight: 700; margin-top: 4px;">💬 Chat Penumpang Ride:</div>
                <div class="chat-container">
                    <div class="chat-box" id="chatRideBox_${ride.id}">
                        <div class="chat-msg other">Penumpang: "Saya tunggu di pinggir jalan ya pak."</div>
                    </div>
                    <div class="chat-input-group">
                        <input type="text" id="inputRideChat_${ride.id}" class="form-input" style="flex:1;" placeholder="Balas chat penumpang...">
                        <button class="btn-primary" style="padding: 6px 12px; font-size: 10px; background: #0284c7;" onclick="sendRideChat('${ride.id}')">Kirim</button>
                    </div>
                </div>

                <div style="display: flex; gap: 8px; margin-top: 4px;">
                    <a href="https://www.google.com/maps/search/?api=1&query=${ride.destination}" target="_blank" class="form-input" style="background:#0284c7; color:#fff; text-align:center; text-decoration:none; font-weight:700; display:flex; align-items:center; justify-content:center;">🗺️ Peta Tujuan</a>
                    <button class="btn-primary" style="flex:1; background:#0284c7;" onclick="completeRideOrder('${ride.id}')">Selesaikan Ride ✓</button>
                </div>
            `;
            container.appendChild(card);
        });
    }
}

function sendFoodChat(orderId) {
    let input = document.getElementById(`inputFoodChat_${orderId}`);
    let text = input.value.trim();
    if(!text) return;
    let box = document.getElementById(`chatFoodBox_${orderId}`);
    box.innerHTML += `<div class="chat-msg driver">Driver: "${text}"</div>`;
    input.value = "";
    box.scrollTop = box.scrollHeight;
}

function sendRideChat(orderId) {
    let input = document.getElementById(`inputRideChat_${orderId}`);
    let text = input.value.trim();
    if(!text) return;
    let box = document.getElementById(`chatRideBox_${orderId}`);
    box.innerHTML += `<div class="chat-msg driver" style="background:#dbeafe; color:#1e40af;">Driver: "${text}"</div>`;
    input.value = "";
    box.scrollTop = box.scrollHeight;
}

function completeFoodOrder(orderId) {
    if(confirm("Selesaikan pesanan Cikur Food ini?")) {
        let foodOrders = JSON.parse(localStorage.getItem('cikur_driver_orders')) || [];
        let filtered = foodOrders.filter(o => o.id !== orderId);
        localStorage.setItem('cikur_driver_orders', JSON.stringify(filtered));
        loadDriverOrders();
        alert("Antaran makanan berhasil diselesaikan!");
    }
}

function completeRideOrder(orderId) {
    if(confirm("Selesaikan perjalanan Cikur Ride ini?")) {
        alert("Perjalanan reguler selesai!");
        loadDriverOrders();
    }
}
</script>

</body>
</html>
